function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// ---------- doodle primitives (all take a context) ----------
function blob(c,x,y,rx,ry){const n=14,p=[];x+=J(0.8);y+=J(0.8);for(let i=0;i<n;i++){const a=i/n*6.2832,k=1+J(0.09);p.push([x+Math.cos(a)*rx*k,y+Math.sin(a)*ry*k])}
c.beginPath();let s=[(p[n-1][0]+p[0][0])/2,(p[n-1][1]+p[0][1])/2];c.moveTo(s[0],s[1]);
for(let i=0;i<n;i++){const q=p[(i+1)%n];c.quadraticCurveTo(p[i][0],p[i][1],(p[i][0]+q[0])/2,(p[i][1]+q[1])/2)}c.closePath()}
function puffs(c,parts,lw){c.strokeStyle=INK;c.lineWidth=lw||3.2;c.lineJoin='round';
parts.forEach(p=>{blob(c,p[0],p[1],p[2],p[3]);c.stroke()});

for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];c.quadraticCurveTo((a[0]+b[0])/2+J(1.2),(a[1]+b[1])/2+J(1.2),b[0]+J(0.6),b[1]+J(0.6))}c.stroke()}
function edgePts(pts,step){const out=[];for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];const d=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.round(d/step));
for(let k=0;k<n;k++)out.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n])}return out}
function poly(c,pts,fill,lw,noStroke){const e=edgePts(pts,14);c.beginPath();c.moveTo(e[0][0]+J(0.9),e[0][1]+J(0.9));for(let i=1;i<e.length;i++)c.lineTo(e[i][0]+J(0.9),e[i][1]+J(0.9));c.closePath();
if(fill){c.fillStyle=fill;c.fill()}if(!noStroke){c.strokeStyle=INK;c.lineWidth=lw||2.6;c.lineJoin='round';c.stroke()}}
function rect(c,x,y,w,h,fill,lw){poly(c,[[x,y],[x+w,y],[x+w,y+h],[x,y+h]],fill,lw)}
function smoothFill(c,pts,fill,stroke,lw){c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];c.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2)}
c.closePath();if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw||2.4;c.stroke()}}
function glow(c,x,y,r,col){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,6.2832);c.fill()}

function makeSprite(x0,y0,w,h,fn,seed){const k=document.createElement('canvas');k.width=Math.ceil(w*GS);k.height=Math.ceil(h*GS);const c=k.getContext('2d');c.scale(GS,GS);c.translate(-x0,-y0);R=mul(seed||7);fn(c);return{cv:k,x:x0,y:y0,w,h}}

if(JOBS.shepherd.started&&!JOBS.shepherd.done){JOBS.shepherd.prog=Math.min(4,sheep.filter(insidePen).length);if(sheep.filter(insidePen).length>=5&&!gateClosed&&!JOBS.shepherd.toldClose){JOBS.shepherd.toldClose=true;say(npc('shepherd'),'They\'re all in! Now close the gate with E!',5)}}
// plants
tufts.forEach(t=>{const near=Math.hypot(t.x-P.x,t.y-P.y)<45&&P.moving;if(near)t.amp=Math.min(1,t.amp+3*dt);else t.amp*=Math.pow(0.3,dt)});
banner.amp=(Math.hypot(1230-P.x,640-P.y)<170&&P.moving)?Math.min(1,banner.amp+1.5*dt):banner.amp*Math.pow(0.4,dt);
for(let i=bubbles.length-1;i>=0;i--){bubbles[i].t-=dt;if(bubbles[i].t<=0)bubbles.splice(i,1)}
for(let i=floats.length-1;i>=0;i--){floats[i].t-=dt;floats[i].y-=18*dt;if(floats[i].t<=0)floats.splice(i,1)}
for(let i=splashes.length-1;i>=0;i--){splashes[i].t-=dt;splashes[i].y-=20*dt;if(splashes[i].t<=0)splashes.splice(i,1)}
beds.forEach(b=>{if(b.wet)b.t=Math.min(1,b.t+dt*1.5)});
if(wolfNose>0&&wolfNose<26)wolfNose+=dt*14;
if(winT>0)winT+=dt;
cam.x=Math.max(0,Math.min(WW-VW,P.x-VW/2));cam.y=Math.max(0,Math.min(WH-VH,P.y-VH/2-20));}
const banner={amp:0};

// ---------- draw ----------
function drawSp(c,sp,x,y){c.drawImage(sp.cv,x+sp.x-cam.x,y+sp.y-cam.y,sp.w,sp.h)}
function drawGateBanner(c){const x=1230-cam.x,y=620-CH-6-cam.y,w=34,len=64,n=8,a=banner.amp;R=mul(77);
const L=[],Rr=[];for(let i=0;i<=n;i++){const u=i/n,o=a*5*Math.sin(T*9-u*4)*u;L.push([x-w/2+o,y+u*len]);Rr.push([x+w/2+o,y+u*len])}
c.beginPath();c.moveTo(L[0][0],L[0][1]);L.forEach(p=>c.lineTo(p[0],p[1]));c.lineTo(x+a*5*Math.sin(T*9-4),y+len-12);for(let i=n;i>=0;i--)c.lineTo(Rr[i][0],Rr[i][1]);c.closePath();
c.fillStyle='#f2d27a';c.fill();c.strokeStyle=INK;c.lineWidth=2.4;c.lineJoin='round';c.stroke();
dragon(c,x+a*5*Math.sin(T*9-2)*0.45,y+len*0.45,1.5);wline(c,[[x-w/2-4,y],[x+w/2+4,y]],3,'#8a6248')}
function drawTuft(c,t){const x=t.x-cam.x,y=t.y-cam.y,s=0.08*Math.sin(T*1.6+t.ph)+t.amp*0.5*Math.sin(T*9+t.ph);
c.strokeStyle='#88bf74';c.lineWidth=2.2;c.lineCap='round';for(let k=-1;k<=1;k++){c.beginPath();c.moveTo(x+k*3,y);c.quadraticCurveTo(x+k*4+s*t.h*0.4,y-t.h*0.6,x+k*5+Math.sin(s+k*0.25)*t.h,y-Math.cos(s+k*0.25)*t.h);c.stroke()}}
function drawFlower(c,f){const x=f.x-cam.x,y=f.y-cam.y,s=0.12*Math.sin(T*1.4+f.ph);if(x<-20||x>VW+20||y<-20||y>VH+20)return;
c.strokeStyle='#88bf74';c.lineWidth=1.8;c.beginPath();c.moveTo(x,y);const tx=x+Math.sin(s)*12,ty=y-Math.cos(s)*12;c.quadraticCurveTo(x,y-6,tx,ty);c.stroke();
R=mul(Math.floor(f.ph*100));for(let i=0;i<5;i++){const a=i/5*6.28+s;blob(c,tx+Math.cos(a)*3.4,ty+Math.sin(a)*3.4,2.6,2.6);c.fillStyle=f.col;c.fill()}dot(c,tx,ty,1.6,'#f6cf3a')}
function drawBedPlants(c,b){const g=b.t;for(let k=0;k<3;k++){const x=b.x+14+k*22-cam.x,y=b.y+b.d*0.62-cam.y,s=0.1*Math.sin(T*1.5+k+b.x);
if(b.wet){R=mul(b.x+k);const h=6+g*10;c.strokeStyle='#7fb46d';c.lineWidth=2;c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.sin(s)*h,y-h);c.stroke();
puffs(c,[[x+Math.sin(s)*h-4,y-h,4+g*3,3+g*2,'#a9d897'],[x+Math.sin(s)*h+4,y-h,4+g*3,3+g*2,'#a9d897']],2);if(k===1&&g>0.8)dot(c,x+Math.sin(s)*h,y-h-3,2.6,'#f3a66b')}
else{c.strokeStyle='#9cc78a';c.lineWidth=1.8;c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.sin(s)*5,y-5);c.stroke()}}
if(b.wet&&g<1){c.fillStyle='rgba(90,62,43,'+(0.25*(1-g)+0.12)+')'}else if(b.wet){c.fillStyle='rgba(90,62,43,0.12)'}else c.fillStyle='rgba(255,255,255,0)';c.fillRect(b.x+2-cam.x,b.y+2-cam.y,b.w-4,b.d-4)}
function drawPlayer(c){const h=HEROES[P.hero];c.save();c.translate(P.x-cam.x,P.y-cam.y);
const bob=P.moving&&!P.fishing?-Math.abs(Math.sin(T*12))*2:0;c.translate(0,bob);c.scale(1.15*P.face,1.15);R=mul(900+P.hero*10+(P.moving?P.boil:0));person(c,h,0);c.restore();
if(P.carry==='crate')drawSp(c,crateSp,P.x,P.y-50);
if(P.bread>0){drawSp(c,breadSp,P.x+14*P.face,P.y-24);if(P.bread>1){c.fillStyle=INK;c.font='13px "Patrick Hand",cursive';c.textAlign='center';c.fillText('x'+P.bread,P.x+26*P.face-cam.x,P.y-30-cam.y)}}
if(P.fishing){const f=P.fishing,s=f.s,bx=s.wx-cam.x,by=s.wy-cam.y+(f.phase==='bite'?2*Math.sin(T*30):0);
c.strokeStyle='#8a6248';c.lineWidth=2.4;c.beginPath();c.moveTo(P.x+8*P.face-cam.x,P.y-24-cam.y);c.lineTo(P.x+(s.wx-P.x)*0.4-cam.x,P.y-56-cam.y);c.stroke();
c.strokeStyle='rgba(90,62,43,0.7)';c.lineWidth=1;c.beginPath();c.moveTo(P.x+(s.wx-P.x)*0.4-cam.x,P.y-56-cam.y);c.lineTo(bx,by);c.stroke();R=mul(5);puffs(c,[[bx,by,3.4,3.4,'#f29a9a']],1.8);
if(f.phase==='bite'){R=mul(6);puffs(c,[[P.x-cam.x,P.y-74-cam.y,10,10,'#fff4d6']],2.4);c.fillStyle='#d9574f';c.font='22px "Patrick Hand",cursive';c.textAlign='center';c.fillText('!',P.x-cam.x,P.y-66-cam.y)}}}
function wrap(c,text,maxW){const words=text.split(' '),lines=[];let cur='';words.forEach(w=>{const t=cur?cur+' '+w:w;if(c.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t});if(cur)lines.push(cur);return lines}
function drawBubble(c,x,y,text){c.font='16px "Patrick Hand",cursive';const lines=wrap(c,text,210);const w=Math.max(...lines.map(l=>c.measureText(l).width))+22,h=lines.length*18+14;
let bx=Math.max(6,Math.min(VW-w-6,x-w/2)),by=Math.max(6,y-h-14);
c.fillStyle='#fffaf0';c.strokeStyle=INK;c.lineWidth=2.4;c.beginPath();c.roundRect(bx,by,w,h,10);c.fill();c.stroke();
c.beginPath();c.moveTo(Math.max(bx+12,Math.min(bx+w-12,x))-6,by+h-1);c.lineTo(Math.max(bx+12,Math.min(bx+w-12,x)),by+h+10);c.lineTo(Math.max(bx+12,Math.min(bx+w-12,x))+6,by+h-1);c.fillStyle='#fffaf0';c.fill();c.stroke();
c.fillStyle=INK;c.textAlign='left';lines.forEach((l,i)=>c.fillText(l,bx+11,by+22+i*18))}
function marker(c,x,y,txt,col){R=mul(9);puffs(c,[[x,y,9,9,col||'#f6e27a']],2.2);c.fillStyle=INK;c.font='17px "Patrick Hand",cursive';c.textAlign='center';c.fillText(txt,x,y+6)}
function star(c,x,y,r,fill){c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*0.45:r;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}c.closePath();c.fillStyle=fill;c.fill();c.strokeStyle=INK;c.lineWidth=2;c.stroke()}
function inView(x,y,m){return x>cam.x-m&&x<cam.x+VW+m&&y>cam.y-m&&y<cam.y+VH+m}
function draw(){ctx.setTransform(SC,0,0,SC,0,0);ctx.fillStyle=PAPER;ctx.fillRect(0,0,VW,VH);
if(mode==='title'){cam.x=300;cam.y=250+Math.sin(T*0.2)*10}
ctx.drawImage(ground,cam.x*GS,cam.y*GS,VW*GS,VH*GS,0,0,VW,VH);
beds.forEach(b=>{if(inView(b.x,b.y,80))drawBedPlants(ctx,b)});
fishSpots.forEach(s=>{if(JOBS.fisher.started&&!JOBS.fisher.done&&inView(s.wx,s.wy,40)){ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=1.6;for(let k=0;k<2;k++){ctx.beginPath();ctx.ellipse(s.wx-cam.x,s.wy-cam.y,6+k*6,3+k*3,0,0,6.3);ctx.stroke()}}});
splashes.forEach(s=>dot(ctx,s.x-cam.x,s.y-cam.y,2.2,'rgba(120,180,220,'+s.t+')'));
const items=[];
sprites.forEach(s=>{if(inView(s.sp.x+s.sp.w/2,s.sortY,s.sp.w+s.sp.h))items.push({y:s.sortY,d:()=>ctx.drawImage(s.sp.cv,s.sp.x-cam.x,s.sp.y-cam.y,s.sp.w,s.sp.h)})});
items.push({y:PEN.g2+1,d:()=>drawSp(ctx,gateClosed?gateClosedSp:gateOpenSp,0,0)});
tufts.forEach(t=>{if(inView(t.x,t.y,30))items.push({y:t.y,d:()=>drawTuft(ctx,t)})});
flowers.forEach(f=>{if(inView(f.x,f.y,30))items.push({y:f.y,d:()=>drawFlower(ctx,f)})});
items.push({y:620.5,d:()=>drawGateBanner(ctx)});
NPCS.forEach(n=>items.push({y:n.y,d:()=>{const left=P.x<n.x;drawSp(ctx,left?n.spL:n.sp,n.x,n.y);const j=JOBS[n.key];if(mode==='play'&&!j.started)marker(ctx,n.x-cam.x,n.y-62-cam.y+Math.sin(T*3)*2,'!');if(j.done&&!j.hearted){}}}));
if(JOBS.shepherd.started){items.push({y:wolfPos.y,d:()=>drawSp(ctx,wolfSp,wolfPos.x,wolfPos.y)});
items.push({y:pinoPos.y,d:()=>{drawSp(ctx,pinoSp,pinoPos.x,pinoPos.y);ctx.lineCap='round';[[4.2,INK],[2.2,'#e3b47c']].forEach(q=>{ctx.strokeStyle=q[1];ctx.lineWidth=q[0];ctx.beginPath();ctx.moveTo(pinoPos.x+6.4-cam.x,pinoPos.y-35.5-cam.y);ctx.lineTo(pinoPos.x+12+wolfNose-cam.x,pinoPos.y-35.5-cam.y);ctx.stroke()})}})}
sheep.forEach(s=>items.push({y:s.y,d:()=>drawSp(ctx,s.face>0?sheepSp:sheepSpL,s.x,s.y)}));
if(JOBS.merchant.started&&!JOBS.merchant.done)for(let i=0;i<crates;i++)items.push({y:722+i*0.01,d:()=>drawSp(ctx,crateSp,1612+(i%2)*20,724-Math.floor(i/2)*20)});
items.push({y:P.y,d:()=>drawPlayer(ctx)});
items.sort((a,b)=>a.y-b.y).forEach(it=>it.d());
if(mode==='play'){
if(P.bread>0)houses.forEach(h=>{if(!h.bakery&&!h.got&&inView(h.door.x,h.door.y,40)){glow(ctx,h.door.x-cam.x,h.door.y-cam.y-14,26,'rgba(255,220,120,0.6)');drawSp(ctx,breadSp,h.door.x,h.door.y-40)}});
if(JOBS.farmer.started&&!JOBS.farmer.done)beds.forEach(b=>{if(!b.wet&&inView(b.x,b.y,40))marker(ctx,b.x+b.w/2-cam.x,b.y-14-cam.y+Math.sin(T*3+b.x)*2,'~','#bfe1ee')});
if(JOBS.merchant.started&&!JOBS.merchant.done&&P.carry==='crate')glow(ctx,STALL.x+STALL.w/2-cam.x,STALL.y+20-cam.y,60,'rgba(255,220,120,0.55)');
const o=findInteract(P.x,P.y-6,46);if(o&&!P.fishing){const lbl={npc:'Talk',bed:'Water',door:'Give bread',fish:'Fish',crate:'Pick up',stall:'Drop crate',gate:gateClosed?'Open gate':'Close gate'}[o.kind];
ctx.font='15px "Patrick Hand",cursive';const w=ctx.measureText('E  '+lbl).width+18;const x=P.x-cam.x-w/2,y=P.y-cam.y+10;ctx.fillStyle='rgba(255,250,240,0.92)';ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(x,y,w,22,8);ctx.fill();ctx.stroke();ctx.fillStyle=INK;ctx.textAlign='left';ctx.fillText('E  '+lbl,x+9,y+16)}
bubbles.forEach(b=>{const e=b.ent;if(inView(e.x,e.y,10))drawBubble(ctx,e.x-cam.x,e.y-cam.y-56,b.text)});
floats.forEach(f=>{ctx.globalAlpha=Math.min(1,f.t);ctx.fillStyle=f.col;ctx.font='18px "Patrick Hand",cursive';ctx.textAlign='center';ctx.fillText(f.text,f.x-cam.x,f.y-cam.y);ctx.globalAlpha=1});
drawHUD(ctx)}
else drawTitle(ctx)}
function panel(c,x,y,w,h){c.fillStyle='rgba(255,250,240,0.93)';c.strokeStyle=INK;c.lineWidth=2.4;c.beginPath();c.roundRect(x,y,w,h,12);c.fill();c.stroke()}

const h=34+Math.max(1,act.length)*22;panel(c,10,10,300,h);c.fillStyle=INK;c.font='18px "Patrick Hand",cursive';c.textAlign='left';c.fillText('Village jobs',22,32);

act.forEach((k,i)=>{const j=JOBS[k];c.fillText('• '+j.title+'  '+j.prog+'/'+j.goal,22,54+i*22)});
panel(c,VW-150,10,140,44);for(let i=0;i<5;i++)star(c,VW-130+i*25,32,9,i<stars?'#f6cf3a':'#fffaf0');
for(let i=0;i<4;i++){const bx=12+i*104,by=VH-46,on=P.hero===i;c.fillStyle=on?'#fff4d6':'rgba(255,250,240,0.85)';c.strokeStyle=INK;c.lineWidth=on?3:1.8;c.beginPath();c.roundRect(bx,by,98,36,10);c.fill();c.stroke();
c.fillStyle=INK;c.font=(on?'16px':'15px')+' "Patrick Hand",cursive';c.textAlign='center';c.fillText((i+1)+'  '+HEROES[i].name,bx+49,by+23)}
c.font='14px "Patrick Hand",cursive';c.textAlign='right';c.fillStyle='rgba(90,62,43,0.8)';c.fillText('Move: arrows / WASD or tap  •  Do: E or Space  •  Switch: 1-4',VW-12,VH-16);
if(winT>0){const a=Math.min(1,winT);c.globalAlpha=a;panel(c,VW/2-250,VH/2-90,500,150);c.fillStyle=INK;c.textAlign='center';c.font='30px "Patrick Hand",cursive';c.fillText('World 1 complete!',VW/2,VH/2-44);
c.font='18px "Patrick Hand",cursive';c.fillText('Every villager is happy, and the castle banners',VW/2,VH/2-12);c.fillText('wave over a cozy, busy village.',VW/2,VH/2+12);
for(let i=0;i<5;i++)star(c,VW/2-60+i*30,VH/2+40,10,'#f6cf3a');c.globalAlpha=1}}
function drawTitle(c){c.fillStyle='rgba(247,238,219,0.8)';c.fillRect(0,0,VW,VH);c.fillStyle=INK;c.textAlign='center';c.font='46px "Patrick Hand",cursive';c.fillText('Ships & Villagers',VW/2,96);
c.font='24px "Patrick Hand",cursive';c.fillText('World 1: The Castle Village',VW/2,134);c.font='19px "Patrick Hand",cursive';c.fillText('Choose your villager',VW/2,196);
for(let i=0;i<4;i++){const bx=150+i*170,on=sel===i;c.fillStyle=on?'#fff4d6':'rgba(255,250,240,0.9)';c.strokeStyle=INK;c.lineWidth=on?3.4:2;c.beginPath();c.roundRect(bx,220,150,210,14);c.fill();c.stroke();
c.save();c.translate(bx+75,380);c.scale(2.3,2.3);R=mul(900+i*10);person(c,HEROES[i],0);c.restore();c.fillStyle=INK;c.font='20px "Patrick Hand",cursive';c.fillText(HEROES[i].name,bx+75,416)}
c.font='19px "Patrick Hand",cursive';c.fillText('Press Enter or tap here to start',VW/2,490);c.font='15px "Patrick Hand",cursive';c.fillStyle='rgba(90,62,43,0.8)';c.fillText('Arrows or A/D to choose  •  Earth, around 1300 AD',VW/2,520)}
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
(document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]):Promise.resolve()).then(()=>requestAnimationFrame(loop));
window.__game={P,JOBS,sheep,beds,houses,startGame,interact:()=>{actPressed=true},cam};
