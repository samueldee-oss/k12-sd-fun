<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;touch-action:none}

.logo{font-weight:700;font-size:1.7em;letter-spacing:1px;line-height:1;text-shadow:0 3px 0 #000a}

.res{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}

.x{background:#ffffff22;border-radius:10px;padding:2px 10px;cursor:pointer;font-size:.9em}
.sec{margin:12px 0 4px;font-weight:700;font-size:1em;letter-spacing:1px;color:#cbb8ff}

.hero b{display:block;font-size:2.2em;font-weight:400}
.hero.sel{border-color:#ffd36b;background:#ffd36b22}

.hdesc{background:#0005;border-radius:10px;padding:8px 10px;margin:6px 0;font-size:.9em}

.cost{font-size:.85em;opacity:.95}
.no{color:#ff8a8a}
.btn{display:inline-block;background:#ffd36b;color:#2a1a00;font-weight:700;border:none;border-radius:12px;padding:9px 16px;font-family:inherit;font-size:1.05em;cursor:pointer;box-shadow:0 4px 0 #a07a1c}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #a07a1c}
.btn.sm{padding:6px 11px;font-size:.9em;box-shadow:0 3px 0 #a07a1c}
.btn.gray{background:#ffffff26;color:#fff;box-shadow:0 3px 0 #0006}

.ch:hover{border-color:#ffd36b}
.ch.on{border-color:#6fe39a;background:#1d3a2a}
.ch.rx{background:linear-gradient(90deg,#3a1d5a,#1d3a5a);border-color:#b58bff}
.ch.evo{background:linear-gradient(90deg,#5a3a00,#7a2a6a);border-color:#ffd36b;animation:glow 1s infinite alternate}
@keyframes glow{to{box-shadow:0 0 18px #ffd36b88}}
.ch .ic{font-size:2.1em;width:1.6em;text-align:center}
.ch .nm{font-weight:700;font-size:1.05em}
.ch .ds{font-size:.85em;opacity:.85}
.lv{font-size:.7em;font-weight:700;padding:1px 6px;border-radius:6px;background:#ffd36b;color:#2a1a00;margin-left:4px}

#hb{position:absolute;right:8px;display:flex;gap:6px}
.hbtn{background:#0008;border:1px solid #fff3;color:#fff;border-radius:9px;font-size:.9em;padding:5px 8px;font-family:inherit;cursor:pointer}
.stats{font-size:1em;line-height:1.7;margin:8px 0 12px}
.tip{font-size:.8em;opacity:.75;margin-top:8px;line-height:1.4}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.hint{position:absolute;left:10px;right:10px;top:23%;background:#000b;border:2px solid #ffd36b;border-radius:12px;padding:8px 10px;text-align:center;font-weight:600;font-size:.95em}
.hint span{cursor:pointer;margin-left:8px;color:#ffd36b}
.hvhud{position:absolute;left:0;right:0;bottom:0;padding:10px;text-align:center;background:linear-gradient(#0000,#000c 40%)}

 if(e.stun>0){e.stun-=dt;return}
 if(e.mode==='enter'||e.dive)return;
 e.act-=dt*(e.freezeT>0?.4:e.slowT>0?.75:1);
 if(e.act<=0){bossAtk(e,pick(B.atk[e.phase]));e.act=B.rate[e.phase]}
 if(R.wind){R.windT-=dt;if(R.windT<=0){R.wind=-R.wind;R.windT=rand(3,5)}}

 for(const h of R.haz){h.t+=dt;if(h.own&&!h.own.dead){h.ox=h.own.x;h.oy=h.own.y}if(h.t>h.warn&&h.va)h.ang+=h.va*dt;else if(h.va&&h.t<=h.warn)h.ang+=h.va*dt*.3;

  else if(h.k==='beam'){const dx=Math.cos(h.ang),dy=Math.sin(h.ang),px=p.x-h.ox,py=p.y-h.oy,t=clamp(px*dx+py*dy,0,h.len);hit=Math.hypot(px-dx*t,py-dy*t)<h.w/2+p.r*.6}

 if(R.si===6&&R.boss&&R.boss.phase===2&&!R.boss.trans)p.x+=Math.sign(R.boss.x-p.x)*40*dt;
 for(const s of R.eb){if(s.boom!==undefined){s.boom-=dt;if(s.boom<=0){s.dead=true;for(let i=0;i<10;i++){const a=i/10*6.283;R.eb.push({x:s.x,y:s.y,vx:Math.cos(a)*150,vy:Math.sin(a)*150,r:6,col:'#ff9a3c'})}burst(s.x,s.y,'#ff7a1a',14)}}
  if(s.home>0){s.home-=dt;const ta=Math.atan2(p.y-s.y,p.x-s.x),sp=Math.hypot(s.vx,s.vy),ca=Math.atan2(s.vy,s.vx);let da=ta-ca;while(da>Math.PI)da-=6.283;while(da<-Math.PI)da+=6.283;const na=ca+clamp(da,-2.2*dt,2.2*dt);s.vx=Math.cos(na)*sp;s.vy=Math.sin(na)*sp}}}

/* ---------- level ups ---------- */
let curChoices=[];
const isUpBall=b=>{const d=bdef(b.id);return b.lvl<3&&!d.evo&&!d.fused};
function genChoices(){const pool=[],has=id=>R.balls.find(b=>b.id===id),hasP=id=>R.pas.find(b=>b.id===id);
 const ballIds=Object.keys(BALLS).filter(k=>!BALLS[k].evo&&(!BALLS[k].dlc||dlcOn()));
 if(R.balls.length<R.bSlots)for(const id of ballIds)if(!has(id))pool.push({k:'nb',id});
 for(const b of R.balls)if(isUpBall(b))pool.push({k:'ub',id:b.id},{k:'ub',id:b.id});
 const pasIds=Object.keys(PAS).filter(k=>(!PAS[k].dlc||dlcOn())&&!(k==='baby'&&R.q.noBaby));
 if(R.pas.length<R.pSlots)for(const id of pasIds)if(!hasP(id))pool.push({k:'np',id});
 for(const p of R.pas)if(p.lvl<3)pool.push({k:'up',id:p.id});
 shuffle(pool);const out=[],seen=new Set();
 for(const c of pool){const key=c.k+c.id;if(seen.has(key))continue;seen.add(key);out.push(c);if(out.length>=3)break}
 if(!out.length)out.push({k:'heal'},{k:'gold'});
 curChoices=out;}
function applyChoice(c){
 if(c.k==='nb')R.balls.push({id:c.id,lvl:1});
 else if(c.k==='ub')R.balls.find(b=>b.id===c.id).lvl++;
 else if(c.k==='np'){R.pas.push({id:c.id,lvl:1});if(c.id==='heart')R.p.hp+=25}
 else if(c.k==='up'){R.pas.find(b=>b.id===c.id).lvl++;if(c.id==='heart')R.p.hp+=25}
 else if(c.k==='heal')heal(40);else if(c.k==='gold')R.gold+=25;
 recalc();rebuildTokens();R.pend--;nextMenu();}
function nextMenu(){if(R.pend>0){genChoices();if(R.q.auto){applyChoice(pick(curChoices));return}showLevelUp()}
 else if(R.prx>0){if(R.q.auto){autoReactor();return}showReactor()}else{S='play';showHUD()}}

function evoOptions(){const out=[],ok=id=>{const b=R.balls.find(x=>x.id===id);return b&&b.lvl>=3};
 for(const [a,b,r] of EVOS){if(BALLS[r].dlc&&!dlcOn())continue;if(ok(a)&&ok(b))out.push([a,b,r])}return out}
const fuseable=()=>R.balls.filter(b=>{const d=bdef(b.id);return b.lvl>=3&&!d.evo&&!d.fused});
function doFission(){const items=[...R.balls.filter(isUpBall),...R.pas.filter(p=>p.lvl<3)];shuffle(items);
 const n=Math.min(items.length,Math.max(2,1+Math.floor(Math.random()*5)));const up=items.slice(0,n);
 for(const it of up){it.lvl++;if(it.id==='heart')R.p.hp+=25}
 if(!up.length){R.gold+=40;heal(30)}
 recalc();rebuildTokens();
 R.banner={t:2.2,ic:'ui:atom',txt:'FISSION!',sub:up.length?up.map(x=>(PAS[x.id]?PAS[x.id].name:bdef(x.id).name)+' Lv'+x.lvl).join(', '):'+40 gold & heal'};
 R.prx--;nextMenu()}
function doEvolve(a,b,r){R.balls=R.balls.filter(x=>x.id!==a&&x.id!==b);R.balls.push({id:r,lvl:3});recalc();rebuildTokens();sfx('win');
 R.banner={t:2.4,ic:'ball:'+r,txt:BALLS[r].name+'!',sub:'EVOLUTION!'};R.prx--;nextMenu()}
function doFuse(a,b){R.balls=R.balls.filter(x=>x.id!==a&&x.id!==b);const id='F:'+a+'+'+b;R.balls.push({id,lvl:3});recalc();rebuildTokens();sfx('win');
 R.banner={t:2.4,ic:'ball:'+id,txt:'FUSED!',sub:bdef(id).name};R.prx--;nextMenu()}
function autoReactor(){const ev=evoOptions();if(labOn()&&ev.length)doEvolve(...ev[0]);else doFission()}

/* ================= UPDATE ================= */
function nearestThreat(){let best=null,by=-1e9;for(const e of R.ents){if(e.dead||e.off||e.inv||e.y<20)continue;const s=e.boss?e.y+60:e.y;if(s>by){by=s;best=e}}return best}
function update(dt){R.t+=dt;const p=R.p,st=R.stats,q=R.q;
 let mx=0,my=0;if(keys.a||keys.arrowleft)mx--;if(keys.d||keys.arrowright)mx++;if(keys.w||keys.arrowup)my--;if(keys.s||keys.arrowdown)my++;
 if(R.flip)my=-my;
 if(q.auto&&!mx&&!my){const t=nearestThreat();const tx=t?t.x:W/2;if(Math.abs(tx-p.x)>12)mx=Math.sign(tx-p.x)*.8;
  for(const s of R.eb){if(Math.abs(s.x-p.x)<26&&s.y<p.y&&p.y-s.y<130){mx=s.x>p.x?-1:1;break}}}
 if(mx||my){const l=Math.max(1,Math.hypot(mx,my));p.x+=mx/l*st.move*dt;p.y+=my/l*st.move*dt}
 p.x=clamp(p.x,p.r,W-p.r);p.y=clamp(p.y,PY0,PY1);p.inv-=dt;
 if(st.regen)heal(st.regen*dt);
 let ang;if(R.auto){const t=nearestThreat();ang=t?Math.atan2(t.y-p.y,t.x-p.x):-Math.PI/2}
 else{const my2=R.flip?H-mouse.y:mouse.y;ang=Math.atan2(my2-p.y,mouse.x-p.x)}
 if(ang>-.12)ang=ang>Math.PI/2?-Math.PI+.12:-.12;if(ang<-Math.PI+.12)ang=-Math.PI+.12;R.aim=ang;
 R.fireT-=dt;
 if(R.fireT<=0&&R.tokens.length){
  if(q.volley){R.vt=(R.vt||0)+dt;if(R.tokens.every(t=>!t.out)||(R.vt>2.5&&R.tokens.some(t=>!t.out))){R.vt=0;const n=R.tokens.length;R.tokens.forEach((tk,i)=>{if(!tk.out)fireToken(tk,ang+(n>1?(i/(n-1)-.5)*1.1:0))});R.fireT=.35}}
  else for(let i=0;i<R.tokens.length;i++){const idx=(R.tok+i)%R.tokens.length,tk=R.tokens[idx];if(!tk.out){fireToken(tk,ang+rand(-.02,.02));R.tok=idx+1;R.fireT=st.fire;break}}}
 if(!R.boss){R.waveT-=dt;if(R.waveT<=0){if(R.wave<R.waves){spawnWave();R.waveT=Math.max(1.7,3.3-R.wave*.05)}else if(!R.ents.some(e=>!e.dead&&e.y<150)){spawnBoss()}}}
 // balls
 const N=3,sdt=dt/N,life=q.grav?7:14;
 for(const b of R.shots){b.t+=dt;b.cd-=dt;const d=bdef(b.k);
  if(d.homing){b.ht=(b.ht||0)-dt;if(b.ht<=0){b.ht=.15;let best=null,bd=1e9;for(const e of R.ents){if(e.dead||e.off)continue;const dd=(e.x-b.x)**2+(e.y-b.y)**2;if(dd<bd){bd=dd;best=e}}b.tg=best}
   if(b.tg&&!b.tg.dead){const ta=Math.atan2(b.tg.y-b.y,b.tg.x-b.x),ca=Math.atan2(b.vy,b.vx);let da=ta-ca;while(da>Math.PI)da-=6.283;while(da<-Math.PI)da+=6.283;const na=ca+clamp(da,-4*dt,4*dt);b.vx=Math.cos(na)*b.sp;b.vy=Math.sin(na)*b.sp}}
  if(R.boss)ballBossForces(b,dt);
  if(q.grav){b.vy-=420*dt;const s=Math.hypot(b.vx,b.vy);b.vx*=b.sp/s;b.vy*=b.sp/s}
  for(let s=0;s<N&&!b.dead;s++){b.x+=b.vx*sdt;b.y+=b.vy*sdt;
   if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx);b.b++;b.wb++;b.pw=false}else if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx);b.b++;b.wb++;b.pw=false}
   if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy);b.b++;b.wb++;b.pw=false;if(q.farReturn&&!b.noTok){b.dead=true;break}}
   if(R.barrier)ballBarrier(b);
   if(q.shield&&b.vy>0&&(b.x-p.x)**2+(b.y-p.y)**2<(p.r+b.r+10)**2){const a=-Math.PI/2+clamp((b.x-p.x)/(p.r+12),-1,1)*.9;b.vx=Math.cos(a)*b.sp;b.vy=Math.sin(a)*b.sp;b.sh++;b.t=Math.min(b.t,8);ring(p.x,p.y,p.r+8,'#9fe3ff');sfx('tock')}
   const pierce=d.pierce||b.pw;
   for(const e of R.ents){if(e.dead||e.off)continue;const dx=b.x-e.x,dy=b.y-e.y,rr=e.r+b.r;if(dx*dx+dy*dy<rr*rr){
     const last=b.hm[e.id];if(last!==undefined&&R.t-last<.15)continue;b.hm[e.id]=R.t;hitEnemy(b,e);
     if(!pierce){const dd=Math.hypot(dx,dy)||1,nx=dx/dd,ny=dy/dd,dv=b.vx*nx+b.vy*ny;if(dv<0){b.vx-=2*dv*nx;b.vy-=2*dv*ny}b.x=e.x+nx*(rr+.5);b.y=e.y+ny*(rr+.5);b.b++;break}}}
  }
  if(!q.grav){const minvy=b.sp*.18;if(Math.abs(b.vy)<minvy){b.vy=(b.vy<0?-1:1)*minvy;b.vx=Math.sign(b.vx||1)*Math.sqrt(Math.max(0,b.sp*b.sp-minvy*minvy))}}
  if(b.y>H+b.r||b.t>life)b.dead=true;
 }
 for(const b of R.shots)if(b.dead&&!b.noTok&&!b.ret){b.ret=1;const tk=R.tokens.find(t=>t.k===b.k&&t.out);if(tk)tk.out=false}
 R.shots=R.shots.filter(b=>!b.dead);
 // enemies
 for(const e of R.ents){if(e.dead)continue;e.t+=dt;e.flash-=dt;e.slowT-=dt;e.freezeT-=dt;
  if(e.burn){e.burn.t-=dt;dot(e,e.burn.dps*dt,'#ff9a3c');if(e.burn&&e.burn.t<=0)e.burn=null}
  if(e.poison){e.poisonT-=dt;dot(e,e.poison*1.1*st.dmg*dt,'#8ee34a');if(e.poisonT<=0)e.poison=0}
  if(e.bleed){e.bleedT-=dt;if(e.bleedT<=0)e.bleed=0}
  if(e.dead)continue;
  const sf=e.freezeT>0?0:e.slowT>0?.5:1;
  if(e.boss){bossUpdate(e,dt);continue}
  if(e.still||e.orbit)continue;
  let sp=e.spd*sf;
  if(e.type==='charger'){e.act-=dt*sf;if(e.act<=0){e.dash=.45;e.act=rand(3,4.5)}if(e.dash>0){e.dash-=dt;sp*=3}}
  e.y+=sp*dt;
  if(e.type==='flyer')e.x=clamp(e.bx+Math.sin(e.t*1.6)*45,e.r,W-e.r);
  if(e.type==='shooter'&&e.y>30){e.act-=dt*sf;if(e.act<=0){e.act=rand(2.8,3.6);const a=Math.atan2(R.p.y-e.y,R.p.x-e.x);R.eb.push({x:e.x,y:e.y,vx:Math.cos(a)*165,vy:Math.sin(a)*165,r:5})}}
  if(e.type==='healer'&&e.y>20){e.act-=dt*sf;if(e.act<=0){e.act=3;ring(e.x,e.y,100,'#6fe39a');for(const o of R.ents)if(!o.dead&&!o.boss&&o!==e&&(o.x-e.x)**2+(o.y-e.y)**2<1e4)o.hp=Math.min(o.max,o.hp+o.max*.15)}}
  e.off=e.type==='ghost'&&Math.sin(e.t*1.4)>.45;
  if(e.y+e.r>LINE){e.dead=true;hurtPlayer(e.breach||6+R.si*.5);burst(e.x,LINE,'#ff5a6a',12)}
 }
 R.ents=R.ents.filter(e=>!e.dead);
 for(let i=0;i<R.ents.length;i++){const a=R.ents[i];if(a.boss||a.still||a.orbit)continue;for(let j=i+1;j<R.ents.length;j++){const c=R.ents[j];if(c.boss||c.still||c.orbit)continue;const dx=c.x-a.x,dy=c.y-a.y,rr=a.r+c.r,d2=dx*dx+dy*dy;if(d2<rr*rr&&d2>.01){const d=Math.sqrt(d2),o=(rr-d)*.25;a.x-=dx/d*o;c.x+=dx/d*o;a.y-=dy/d*o*.5;c.y+=dy/d*o*.5}}}
 for(const s of R.eb){s.x+=s.vx*dt;s.y+=s.vy*dt;if((s.x-p.x)**2+(s.y-p.y)**2<(s.r+p.r-3)**2){s.dead=true;hurtPlayer(6+R.si+(R.boss?R.boss.phase*2:0))}if(s.y>H+20||s.y<-200||s.x<-20||s.x>W+20)s.dead=true}
 if(R.boss)updateBossWorld(dt);
 R.eb=R.eb.filter(s=>!s.dead);
 for(const z of R.zones){z.t-=dt;for(const e of R.ents)if(!e.dead&&(e.x-z.x)**2+(e.y-z.y)**2<(z.r+e.r)**2)dot(e,z.dps*dt,z.col);
  if(z.zap){z.zt-=dt;if(z.zt<=0){z.zt=.45;const c=R.ents.filter(e=>!e.dead&&(e.x-z.x)**2+(e.y-z.y)**2<(z.r*2)**2);if(c.length){const e=pick(c);line(z.x,z.y,e.x,e.y,'#fff6a0');hurt(e,z.zap,'#fff6a0');sfx('zap')}}}}
 R.zones=R.zones.filter(z=>z.t>0);
 if(st.halo){R.haloT-=dt;if(R.haloT<=0){R.haloT=Math.max(.8,3.4-.7*st.halo);const c=R.ents.filter(e=>!e.dead&&e.y>30);if(c.length){const e=pick(c);R.fx.push({k:'pillar',x:e.x,t:.4,T:.4});aoe(e.x,e.y,45,16*st.halo*st.dmg,'#fff7c2')}}}
 for(const g of R.gems){g.t+=dt;const dx=p.x-g.x,dy=p.y-g.y,d=Math.hypot(dx,dy);
  if(d<st.magnet||g.mag||g.y>LINE){g.mag=1;g.x+=dx/d*560*dt;g.y+=dy/d*560*dt}else if(g.y<PY1)g.y+=110*dt;
  if(d<p.r+10){g.dead=true;
   if(g.kind==='heal'){heal(15);addTxt(p.x,p.y-20,'+15','#6fe39a')}
   else if(g.kind==='reactor'){R.prx++;sfx('rx')}
   else if(g.kind==='bp'){findBP()}
   else{R.xp+=g.v*st.xp;sfx('gem')}}}
 R.gems=R.gems.filter(g=>!g.dead);
 while(R.xp>=R.need){R.xp-=R.need;R.lvl++;R.need=Math.round(3+R.lvl*2.2);R.pend++}
 for(const f of R.fx){f.t-=dt;if(f.k==='p'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.92;f.vy*=.92}}R.fx=R.fx.filter(f=>f.t>0);
 for(const t of R.txt){t.t-=dt;t.y-=40*dt}R.txt=R.txt.filter(t=>t.t>0);
 if(R.banner){R.banner.t-=dt;if(R.banner.t<=0)R.banner=null}
 R.shake=Math.max(0,R.shake-dt);
 if((R.pend>0||R.prx>0)&&S==='play'){S='levelup';sfx(R.pend?'lvl':'rx');nextMenu()}
}

const clouds=[...Array(7)].map(()=>({x:rand(0,W),y:rand(0,H),s:rand(.6,1.4),v:rand(6,16)}));

 ctx.save();if(R.shake>0)ctx.translate(rand(-4,4)*R.shake*4,rand(-4,4)*R.shake*4);
 if(R.flip){ctx.translate(0,H);ctx.scale(1,-1)}
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,st.bg[0]);g.addColorStop(1,st.bg[1]);ctx.fillStyle=g;ctx.fillRect(-10,-10,W+20,H+20);
 if(st.sky){ctx.fillStyle='#ffffff55';for(const c of clouds){c.x+=c.v*.016;if(c.x>W+80)c.x=-80;ctx.beginPath();ctx.ellipse(c.x,c.y,50*c.s,18*c.s,0,0,6.283);ctx.ellipse(c.x+25*c.s,c.y-10*c.s,30*c.s,16*c.s,0,0,6.283);ctx.fill()}}
 else{ctx.fillStyle='#0000002a';for(let y=0;y<H;y+=40){ctx.fillRect(0,y+((y/40)%2)*20,8,18);ctx.fillRect(W-8,y+((y/40+1)%2)*20,8,18)}}
 ctx.fillStyle=st.sky?'#ffffff22':'#00000033';ctx.fillRect(0,LINE,W,H-LINE);
 ctx.strokeStyle='#ff5a6a88';ctx.setLineDash([10,8]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,LINE);ctx.lineTo(W,LINE);ctx.stroke();ctx.setLineDash([]);
 drawBossWorld();
 for(const z of R.zones){ctx.globalAlpha=Math.min(.35,z.t*.3);ctx.fillStyle=z.col;ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,6.283);ctx.fill();ctx.globalAlpha=1}
 for(const gm of R.gems){if(gm.kind==='reactor'||gm.kind==='bp')continue;ctx.fillStyle=gm.kind==='heal'?'#6fe39a':'#5ff0ff';ctx.beginPath();ctx.moveTo(gm.x,gm.y-6);ctx.lineTo(gm.x+5,gm.y);ctx.lineTo(gm.x,gm.y+6);ctx.lineTo(gm.x-5,gm.y);ctx.fill()}
 for(const b of R.shots){const d=bdef(b.k);ctx.strokeStyle=d.col;ctx.globalAlpha=.35;ctx.lineWidth=b.r*1.2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(b.x-b.vx*.03,b.y-b.vy*.03);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.globalAlpha=b.noTok&&!b.small?.75:1;
  ctx.fillStyle=d.col;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.283);ctx.fill();if(d.col2){ctx.fillStyle=d.col2;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI);ctx.fill()}if(d.evo||d.fused){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()}ctx.globalAlpha=1}
 for(const s of R.eb){ctx.fillStyle=s.col||'#ff3d6e';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r*.45,0,6.283);ctx.fill()}
 for(const f of R.fx){const a=f.t/f.T;ctx.globalAlpha=a;
  if(f.k==='p'){ctx.fillStyle=f.col;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.283);ctx.fill()}
  else if(f.k==='ring'){ctx.strokeStyle=f.col;ctx.lineWidth=3;ctx.beginPath();ctx.arc(f.x,f.y,f.r*(1.15-a*.4),0,6.283);ctx.stroke()}
  else if(f.k==='line'){ctx.strokeStyle=f.col;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(f.x1,f.y1);ctx.lineTo((f.x1+f.x2)/2+rand(-8,8),(f.y1+f.y2)/2+rand(-8,8));ctx.lineTo(f.x2,f.y2);ctx.stroke()}
  else if(f.k==='pillar'){ctx.fillStyle='#fff7c2';ctx.fillRect(f.x-14*a,0,28*a,LINE)}
  ctx.globalAlpha=1}
 ctx.strokeStyle='#ffffff55';ctx.setLineDash([4,7]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+Math.cos(R.aim)*90,p.y+Math.sin(R.aim)*90);ctx.stroke();ctx.setLineDash([]);
 ctx.globalAlpha=p.inv>0&&Math.floor(R.t*20)%2?.4:1;ctx.fillStyle=R.q.shield?'#9fe3ff':'#fff';ctx.beginPath();ctx.arc(p.x,p.y,p.r+(R.q.shield?7:3),0,6.283);ctx.fill();ctx.fillStyle='#3a2a5a';ctx.beginPath();ctx.arc(p.x,p.y,p.r+1,0,6.283);ctx.fill();ctx.globalAlpha=1;
 ctx.restore();
 ctx.save();if(R.shake>0)ctx.translate(rand(-4,4)*R.shake*4,rand(-4,4)*R.shake*4);
 ctx.textAlign='center';ctx.textBaseline='middle';
 for(const e of R.ents){const y=SY(e.y)+(e.boss?0:Math.sin(e.t*5)*1.5);ctx.globalAlpha=e.off?.3:1;
  if(e.elite){ctx.lineWidth=5;ctx.strokeStyle=e.elite==='reactor'?`hsl(${(R.t*200)%360},90%,65%)`:'#f5deb3';ctx.beginPath();ctx.arc(e.x,y,e.r+6,0,6.283);ctx.stroke()}

 for(const gm of R.gems)if(gm.kind==='reactor'||gm.kind==='bp')drawIcon(ctx,gm.kind==='reactor'?'ui:reactor':'ui:scroll',gm.x,SY(gm.y),24);
 drawIcon(ctx,'hero:'+R.hk,p.x,SY(p.y)-3,42);
 for(const t of R.txt){ctx.globalAlpha=Math.min(1,t.t*2);ctx.font=(t.big?'bold 18px':'bold 13px')+' Fredoka,sans-serif';ctx.lineWidth=3;ctx.strokeStyle='#000a';const ty=R.flip?H-(t.y+(.7-t.t)*80):t.y;ctx.strokeText(t.s,t.x,ty);ctx.fillStyle=t.col;ctx.fillText(t.s,t.x,ty)}ctx.globalAlpha=1;

const cellAt=(x,y)=>{const c=Math.floor((x-GX)/TS),r=Math.floor((y-GY)/TS);return c>=0&&c<COLS&&r>=0&&r<ROWS?r*COLS+c:-1};
function tileCol(t){return BUILD[t.id].col}
function renderTown(){const sky=dlcOn();
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,sky?'#8fd0ff':'#2d4a2a');g.addColorStop(1,sky?'#4f9a5a':'#1c3320');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 if(sky){ctx.fillStyle='#ffffff40';for(const c of clouds){c.x+=c.v*.01;if(c.x>W+80)c.x=-80;ctx.beginPath();ctx.ellipse(c.x,c.y*.15+20,50*c.s,16*c.s,0,0,6.283);ctx.fill()}}
 ctx.fillStyle='#00000030';ctx.beginPath();ctx.roundRect(GX-8,GY-8,COLS*TS+16,ROWS*TS+16,14);ctx.fill();
 ctx.textAlign='center';ctx.textBaseline='middle';
 for(let i=0;i<COLS*ROWS;i++){const c=i%COLS,r=i/COLS|0,x=GX+c*TS,y=GY+r*TS,t=save.town[i];
  if(!t){ctx.fillStyle=townSel?(Math.sin(performance.now()/200)>0?'#ffffff26':'#ffffff18'):'#ffffff0c';ctx.beginPath();ctx.roundRect(x+3,y+3,TS-6,TS-6,8);ctx.fill();continue}
  const fl=t.fl>0;ctx.fillStyle=fl?'#fff':tileCol(t);ctx.globalAlpha=t.site?.55:1;ctx.beginPath();ctx.roundRect(x+3,y+3,TS-6,TS-6,9);ctx.fill();ctx.globalAlpha=1;
  ctx.strokeStyle='#0005';ctx.lineWidth=2;ctx.stroke();
  drawIcon(ctx,'bld:'+t.id,x+TS/2,y+TS/2-2,44);
  if(t.site){ctx.strokeStyle='#ffd36b';ctx.setLineDash([5,4]);ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(x+4,y+4,TS-8,TS-8,8);ctx.stroke();ctx.setLineDash([]);
   ctx.fillStyle='#000a';ctx.fillRect(x+7,y+TS-12,TS-14,6);ctx.fillStyle='#ffd36b';ctx.fillRect(x+7,y+TS-12,(TS-14)*t.prog/t.need,6);drawIcon(ctx,'ui:hardhat',x+TS-12,y+12,18)}
  else if(BUILD[t.id].max>1){for(let k=0;k<t.lvl;k++){ctx.fillStyle='#ffd36b';ctx.strokeStyle='#1b1328';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x+TS/2+(k-(t.lvl-1)/2)*9,y+TS-8,3.2,0,6.283);ctx.fill();ctx.stroke()}}
  if(t.fl>0)t.fl-=.016}
 if(HV){const L=HV;
  ctx.fillStyle='#0006';ctx.fillRect(0,690,W,110);
  ctx.strokeStyle='#ffffff66';ctx.setLineDash([4,7]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W/2,720);ctx.lineTo(W/2+Math.cos(L.aim)*120,720+Math.sin(L.aim)*120);ctx.stroke();ctx.setLineDash([]);
  if(L.q.length)drawIcon(ctx,L.q[0].ic,W/2,720,40);
  L.q.slice(1,10).forEach((w,i)=>drawIcon(ctx,w.ic,W/2+44+i*24,744,26));
  for(const b of L.balls){ctx.globalAlpha=clamp(b.life-b.t,0,1);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,13,0,6.283);ctx.fill();drawIcon(ctx,b.ic,b.x,b.y-1,30)}ctx.globalAlpha=1}
 for(const f of tFx){f.t-=.016;ctx.globalAlpha=Math.max(0,f.t/.4);ctx.fillStyle=f.col;ctx.beginPath();ctx.arc(f.x+=f.vx*.016,f.y+=f.vy*.016,3,0,6.283);ctx.fill()}tFx=tFx.filter(f=>f.t>0);
 for(const t of tTxt){t.t-=.016;t.y-=.6;ctx.globalAlpha=Math.min(1,t.t*2);ctx.font='bold 14px Fredoka,sans-serif';ctx.lineWidth=3;ctx.strokeStyle='#000a';ctx.strokeText(t.s,t.x,t.y);ctx.fillStyle='#fff';ctx.fillText(t.s,t.x,t.y);if(t.ic)drawIcon(ctx,t.ic,t.x+ctx.measureText(t.s).width/2+10,t.y,18)}tTxt=tTxt.filter(t=>t.t>0);ctx.globalAlpha=1;
}
function workers(){const w=[{ic:'vil:0'},{ic:'vil:1'},{ic:'vil:2'}];
 for(const k in HEROES)if(heroOK(k))w.push({ic:'hero:'+k,name:HEROES[k].name,x2:HEROES[k].q.harvest||1});return w}
function startHarvest(){if(save.harv<1)return;save.harv--;persist();
 HV={q:shuffle(workers()),balls:[],aim:-Math.PI/2,got:{gold:0,wheat:0,wood:0,stone:0},built:[]};S='harvest';showHarvestUI()}
function launchWorker(){if(!HV||!HV.q.length)return;const w=HV.q.shift(),a=HV.aim,sp=470;
 HV.balls.push({x:W/2,y:715,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,ic:w.ic,x2:w.x2||1,t:0,hm:{},life:7});sfx('shoot');showHarvestUI()}
function tileHit(i,b){const t=save.town[i];if(!t)return;const last=b.hm[i];if(last!==undefined&&b.t-last<.12)return;b.hm[i]=b.t;t.fl=.12;
 const x=GX+(i%COLS)*TS+TS/2,y=GY+(i/COLS|0)*TS+TS/2,B=BUILD[t.id];sfx('tock');
 if(t.site){t.prog++;if(t.prog>=t.need){t.site=0;delete t.prog;HV.built.push(t.id);tTxt.push({x,y,s:'Built!',t:1});sfx('lvl');for(let k=0;k<14;k++)tFx.push({x,y,vx:rand(-120,120),vy:rand(-120,120),t:.4,col:'#ffd36b'})}else tTxt.push({x:x-8,y,s:'',ic:'ui:hammer',t:.5});return}
 if(B.kind==='res'){const n=B.y*t.lvl*(B.res==='gold'?2:1)*b.x2;if(B.res==='gold')save.gold+=n;else save.res[B.res]+=n;HV.got[B.res]+=n;tTxt.push({x:x-8,y,s:'+'+n,ic:'res:'+B.res,t:.6})}
 else{save.gold+=1;HV.got.gold+=1;tTxt.push({x:x-8,y,s:'+1',ic:'res:gold',t:.5})}}
function updateHarvest(dt){const L=HV;const N=4,sdt=dt/N;
 for(const b of L.balls){b.t+=dt;
  for(let s=0;s<N;s++){
   b.x+=b.vx*sdt;let i=cellAt(b.x+Math.sign(b.vx)*12,b.y);if(i>=0&&save.town[i]){b.x-=b.vx*sdt;b.vx=-b.vx;tileHit(i,b)}
   if(b.x<12){b.x=12;b.vx=Math.abs(b.vx)}if(b.x>W-12){b.x=W-12;b.vx=-Math.abs(b.vx)}
   b.y+=b.vy*sdt;i=cellAt(b.x,b.y+Math.sign(b.vy)*12);if(i>=0&&save.town[i]){b.y-=b.vy*sdt;b.vy=-b.vy;tileHit(i,b)}
   if(b.y<GY-30){b.y=GY-30;b.vy=Math.abs(b.vy)}if(b.y>680&&b.vy>0&&b.t>.5){b.y=680;b.vy=-Math.abs(b.vy)}}
  if(b.t>b.life)b.dead=true}
 L.balls=L.balls.filter(b=>!b.dead);
 if(!L.q.length&&!L.balls.length&&S==='harvest'){S='hvdone';persist();showHarvestDone()}}

 let s=topBar();

 s+=`<div class="bbar"><div class="bb main" id="bPit"><b>${I('ui:swords','1.3em')}</b>Pit</div><div class="bb" id="bBuild"><b>${I('ui:hammer','1.3em')}</b>Build</div><div class="bb ${save.harv?'':'dis'}" id="bHarv"><b>${I('ui:wheat','1.3em')}</b>Harvest x${save.harv}</div><div class="bb" id="bSet"><b>${I('ui:gear','1.3em')}</b>Menu</div></div>`;

 $('bPit').onclick=()=>showTown(pitSheet());$('bBuild').onclick=()=>showTown(buildSheet());$('bSet').onclick=()=>showTown(setSheet());

 UI.querySelectorAll('[data-bp]').forEach(el=>el.onclick=()=>{townSel=el.dataset.bp;showTown()});

function pitSheet(show){const dl=dlcOn(),hk=show||save.hero,hh=HEROES[hk];
 let s=`<div class="sheet"><h3>Enter the Pit${XB}</h3><div class="heroes">`;
 for(const k in HEROES){const o=HEROES[k];if(o.dlc&&!dl)continue;s+=`<div class="hero ${heroOK(k)?'':'lock'} ${save.hero===k?'sel':''}" data-h="${k}"><b>${I('hero:'+k,'2.6em')}</b>${o.name.replace(/^The /,'')}</div>`}

 for(let i=4;i<8;i++)s+=stageCard(i);
 return s+'</div>'}

function showHUD(){const pos=R&&R.flip?'bottom:96px':'top:96px';h(`<div id="hb" style="${pos}"><button class="hbtn" id="bAuto">${I(R.auto?'ui:target':'ui:mouse','1.2em')} ${R.auto?'Auto':'Aim'}</button><button class="hbtn" id="bSpd">${spd().n}</button><button class="hbtn" id="bPause">${I('ui:pause','1.2em')}</button></div>`);
 $('bPause').onclick=pause;$('bSpd').onclick=()=>{save.speed=((save.speed??2)+1)%SPEEDS.length;persist();showHUD()};$('bAuto').onclick=()=>{R.auto=!R.auto;save.autoAim=R.auto;persist();showHUD()}}
function pause(){if(S!=='play')return;S='pause';h(`<div class="ov">${I('hero:'+R.hk,'4em')}<h2>Paused</h2><div class="stats">${I('stg:'+R.si,'1.2em')} ${R.st.name}<br>${R.hero.name} · Level ${R.lvl} · ${R.kills} defeated<br>Ball slots ${R.balls.length}/${R.bSlots} · Passive slots ${R.pas.length}/${R.pSlots}</div>
 <div style="width:100%;max-width:400px;text-align:left">${speedRow()}</div>
 <div class="row"><button class="btn" id="res">Resume</button><button class="btn gray" id="quit">Give Up</button></div>
 <div class="tip">Move: WASD / arrows (or drag on touch) · Aim: mouse, or auto-aim (F)</div></div>`);
 $('res').onclick=()=>{S='play';showHUD()};$('quit').onclick=()=>endRun(false);bindSpeed(()=>{S='play';pause()})}
function choiceHTML(c,i){let ic,nm,ds,tag='';
 if(c.k==='heal'){ic='ui:meat';nm='Snack';ds='Heal 40 HP'}else if(c.k==='gold'){ic='ui:bag';nm='Gold Pouch';ds='+25 gold'}
 else{const isB=c.k==='nb'||c.k==='ub',d=isB?BALLS[c.id]:PAS[c.id];ic=(isB?'ball:':'pas:')+c.id;nm=d.name+(isB?' Ball':'');ds=d.desc;
  if(c.k==='nb'||c.k==='np')tag='<span class="lv new">NEW</span>';else{const cur=(isB?R.balls:R.pas).find(b=>b.id===c.id).lvl;tag=`<span class="lv">Lv ${cur+1}</span>`;if(isB&&cur+1===3)ds+=' · Lv 3: fires twice!'}
  if(d.dlc)tag+='<span class="tag">SKY</span>'}
 return `<div class="ch" data-i="${i}"><div class="ic">${I(ic,'1.7em')}</div><div><div class="nm">${nm}${tag}</div><div class="ds">${ds}</div></div></div>`}
function showLevelUp(){h(`<div class="ov"><h2>Level up!</h2><div style="opacity:.8">Balls ${R.balls.length}/${R.bSlots} · Passives ${R.pas.length}/${R.pSlots}</div>
 <div class="choices">${curChoices.map(choiceHTML).join('')}</div>
 ${R.rerolls>0?`<button class="btn gray sm" id="rr">${I('ui:dice','1.1em')} Reroll (${R.rerolls})</button>`:''}</div>`);
 UI.querySelectorAll('.ch').forEach(el=>el.onclick=()=>applyChoice(curChoices[+el.dataset.i]));
 if($('rr'))$('rr').onclick=()=>{R.rerolls--;genChoices();showLevelUp()}}
function showReactor(){const lab=labOn(),ev=lab?evoOptions():[],fu=lab?fuseable():[];
 let s=`<div class="ov">${I('ui:reactor','3.4em')}<h2>Reactor!</h2><div style="opacity:.8">Choose what to do with its energy</div><div class="choices">`;
 for(const [a,b,r] of ev){const R2=BALLS[r];s+=`<div class="ch evo" data-ev="${a},${b},${r}"><div class="ic">${I('ball:'+r,'1.8em')}</div><div><div class="nm">EVOLVE: ${R2.name}</div><div class="ds">${I('ball:'+a,'1.1em')} + ${I('ball:'+b,'1.1em')} → ${R2.desc}</div></div></div>`}
 if(fu.length>=2)s+=`<div class="ch rx" id="rxFuse"><div class="ic">${I('ui:link','1.7em')}</div><div><div class="nm">FUSION</div><div class="ds">Merge two Lv 3 balls into one that has BOTH effects (frees a slot)</div></div></div>`;
 s+=`<div class="ch rx" id="rxFis"><div class="ic">${I('ui:atom','1.7em')}</div><div><div class="nm">FISSION</div><div class="ds">Randomly level up to 5 of your balls & passives</div></div></div></div>`;
 if(!lab)s+=`<div class="tip">Build a ${I('bld:reactorlab','1.2em')} Reactor Lab in town to unlock Fusion and Evolution.</div>`;
 else if(!ev.length&&fu.length<2)s+=`<div class="tip">Get balls to Lv 3 to fuse them. Some pairs evolve into something new…</div>`;
 h(s+'</div>');
 $('rxFis').onclick=doFission;if($('rxFuse'))$('rxFuse').onclick=()=>showFusePick([]);
 UI.querySelectorAll('[data-ev]').forEach(el=>el.onclick=()=>doEvolve(...el.dataset.ev.split(',')))}
function showFusePick(sel){const fu=fuseable();
 h(`<div class="ov">${I('ui:link','3em')}<h2>Fusion</h2><div style="opacity:.8">Pick two balls to fuse (${sel.length}/2)</div><div class="choices">${fu.map(b=>`<div class="ch ${sel.includes(b.id)?'on':''}" data-f="${b.id}"><div class="ic">${I('ball:'+b.id,'1.7em')}</div><div><div class="nm">${BALLS[b.id].name}</div><div class="ds">${BALLS[b.id].desc}</div></div></div>`).join('')}</div>
 <button class="btn gray sm" id="fb">← Back</button></div>`);
 UI.querySelectorAll('[data-f]').forEach(el=>el.onclick=()=>{const id=el.dataset.f;const n=sel.includes(id)?sel.filter(x=>x!==id):[...sel,id];if(n.length===2)doFuse(n[0],n[1]);else showFusePick(n)});
 $('fb').onclick=showReactor}
function endRun(win){if(!R||S==='over')return;S='over';const earned=Math.round(R.gold*R.stats.gold);save.gold+=earned;save.harv=Math.min(3,save.harv+1);
 let extra='';if(win){const first=!save.cleared[R.si];save.cleared[R.si]=1;if(first&&R.si===3)extra=`<div class="dlcban" style="display:flex;gap:8px;align-items:center">${I('ui:sky','2.2em')}<div>SKYWARD EXPANSION UNLOCKED!<small>4 sky battlefields, new heroes, balls, evolutions & buildings</small></div></div>`;else if(first&&R.si===7)extra=`<div class="dlcban">${I('ui:crowns','1.6em')} You conquered the Risen Throne!</div>`;else if(first&&R.si<7)extra=`<div class="tip">New battlefield unlocked: ${I('stg:'+(R.si+1),'1.2em')} ${STAGES[R.si+1].name}</div>`}
 persist();
 h(`<div class="ov">${I(win?'ui:trophy':'ui:boom','4em')}<h2>${win?'Victory!':'Defeated'}</h2><div class="stats">${I('stg:'+R.si,'1.2em')} ${R.st.name}<br>Reached level ${R.lvl} · ${R.kills} defeated<br><b style="color:#ffd84d">+${earned} gold</b> · +1 harvest${R.found.length?'<br>Blueprints: '+R.found.map(k=>I('bld:'+k,'1.3em')+' '+BUILD[k].name).join(', '):''}</div>
 <div style="margin-bottom:12px">${R.balls.map(b=>I('ball:'+b.id,'2em')).join(' ')} ${R.pas.map(b=>I('pas:'+b.id,'2em')).join(' ')}</div>${extra}
 <button class="btn" id="tt">Back to Town</button></div>`);$('tt').onclick=()=>{R=null;showTown()}}

/* ================= INPUT ================= */
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(k.startsWith('arrow')||k===' ')e.preventDefault();
 if(k==='p'||k==='escape'){if(S==='play')pause();else if(S==='pause'){S='play';showHUD()}}
 if(k==='f'&&R&&S==='play'){R.auto=!R.auto;save.autoAim=R.auto;persist();showHUD()}
 if(k===' '&&S==='harvest')launchWorker()});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(S==='play')pause()});
function toCanvas(cx,cy){const r=cv.getBoundingClientRect();return{x:(cx-r.left)/r.width*W,y:(cy-r.top)/r.height*H}}
function hvAim(p){if(HV){let a=Math.atan2(p.y-715,p.x-W/2);if(a>-.15)a=a>Math.PI/2?-Math.PI+.15:-.15;HV.aim=a}}
cv.addEventListener('mousemove',e=>{const p=toCanvas(e.clientX,e.clientY);mouse.x=p.x;mouse.y=p.y;if(S==='harvest')hvAim(p)});
cv.addEventListener('mousedown',e=>{const p=toCanvas(e.clientX,e.clientY);townTap(p)});
let touch=null;
cv.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0],q=toCanvas(t.clientX,t.clientY);
 if(S==='harvest'){hvAim(q);return}
 if(S==='town'){townTap(q);return}
 if(!R)return;touch={x:q.x,y:q.y,px:R.p.x,py:R.p.y};if(!R.touched){R.touched=1;R.auto=true;showHUD()}},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();const t=e.changedTouches[0],q=toCanvas(t.clientX,t.clientY);
 if(S==='harvest'){hvAim(q);return}
 if(!R||!touch||S!=='play')return;
 R.p.x=clamp(touch.px+(q.x-touch.x)*1.3,R.p.r,W-R.p.r);R.p.y=clamp(touch.py+(q.y-touch.y)*1.3*(R.flip?-1:1),PY0,PY1)},{passive:false});
cv.addEventListener('touchend',e=>{if(S==='harvest'){e.preventDefault();launchWorker()}touch=null},{passive:false});
function townTap(p){if(S==='harvest'){if(!('ontouchstart' in window)||true){hvAim(p);launchWorker()}return}
 if(S!=='town')return;const i=cellAt(p.x,p.y);if(i<0)return;
 if(townSel){if(!save.town[i])placeAt(i);return}
 if(save.town[i])showTown(tileSheet(i));}

/* ================= LOOP ================= */
let last=performance.now();
const SPEEDS=[{n:'Slowest',m:.5},{n:'Slow',m:.75},{n:'Normal',m:1},{n:'Fast',m:1.5},{n:'Faster',m:2}];
const spd=()=>SPEEDS[save.speed??2]||SPEEDS[2];
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;
 ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
 let left=dt*spd().m;
 while(left>1e-4){const st=Math.min(left,1/60);left-=st;
  if(R&&(S==='play'||S==='dying'))update(st);else if(S==='harvest'&&HV)updateHarvest(st);else break}
 if(R)renderRun();else renderTown();
 requestAnimationFrame(loop)}
showTown();requestAnimationFrame(loop);
</script>
</body>
</html>
