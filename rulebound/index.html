<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rulebound: Biscuit's Word Puzzles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#15131f;--panel:#211d30;--ink:#f3eefc;--dim:#9b93b8;--pink:#ff8fb8;--gold:#ffd34d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Fredoka,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:2px solid #2e2843}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 small{color:var(--dim);font-weight:500;margin-right:6px}
button{font-family:inherit;font-weight:700;border:none;border-radius:12px;padding:8px 12px;font-size:14px;cursor:pointer;background:#342d4d;color:var(--ink);box-shadow:0 3px 0 #1a1627}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #1a1627}
button.big{background:var(--pink);color:#2a1020;font-size:18px;padding:12px 22px;box-shadow:0 4px 0 #b4527a}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
canvas{display:block}
#rules{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:6px 10px;min-height:34px}
.chip{font-size:12px;font-weight:700;background:#2a2540;border-radius:8px;padding:4px 8px;letter-spacing:.5px}
#pad{display:none;justify-content:center;gap:6px;padding:4px 0 12px}
#pad .col{display:flex;flex-direction:column;gap:6px}
#pad button{width:58px;height:50px;font-size:22px;padding:0}
body.touch #pad{display:flex}
.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(15,12,24,.72);backdrop-filter:blur(3px);z-index:5}
.overlay.show{display:flex}
#menu .card{max-height:96%;overflow:auto}
.card{background:var(--panel);border:2px solid #3a3256;border-radius:22px;padding:24px;text-align:center;max-width:min(560px,92vw);box-shadow:0 12px 40px rgba(0,0,0,.5)}
.card h2{margin:0 0 6px;font-size:30px}
.card p{color:#cfc7e6;margin:8px 0 16px;line-height:1.4}
#levels{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0 14px}
#worlds{display:flex;gap:8px;justify-content:center;margin-top:12px}
#worlds button{font-size:14px;padding:7px 12px;border:3px solid transparent}
#worlds button.sel{border-color:var(--gold);background:#3f3560}
#worlds button:disabled{opacity:.4}
.wname{color:var(--dim);font-size:13px;margin-top:6px}
#levels button{aspect-ratio:1.4;font-size:17px;padding:0;position:relative}
#levels button.done{background:#3d5c48}
#levels button.done::after{content:'★';position:absolute;top:2px;right:5px;font-size:12px;color:var(--gold)}
#levels button:disabled{opacity:.35;cursor:default}
#toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#3a2236;color:#ffd0e2;padding:8px 14px;border-radius:12px;font-weight:700;display:none;z-index:4;text-align:center;max-width:90%}
#hintBox{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:#2b2545;border:2px solid #4a4070;padding:10px 14px;border-radius:14px;max-width:min(520px,92%);display:none;z-index:4;font-size:15px;line-height:1.35}
.logo{font-size:44px;letter-spacing:2px;margin:0}
.logo span{display:inline-block;padding:2px 8px;border-radius:8px;margin:2px}
.pickLbl{font-weight:700;color:var(--dim);font-size:14px;margin-top:4px}
#heroes{display:flex;gap:12px;justify-content:center;margin:8px 0 4px}
#heroes{flex-wrap:wrap}
#heroes button{display:flex;flex-direction:column;align-items:center;padding:6px 8px;border:3px solid transparent;width:112px}
#heroes button.sel{border-color:var(--gold);background:#3f3560}
#heroes b{font-size:17px} #heroes small{color:var(--dim);font-weight:500;font-size:12px}
.keys{color:var(--dim);font-size:13px}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title"><small id="lvnum"></small><span id="lvname">Rulebound</span></h1>
    <button id="bHint" title="Hint">💡</button>
    <button id="bWait" title="Wait a turn (Space)" style="display:none">⌛ Wait</button>
    <button id="bUndo" title="Undo (Z)">↶ Undo</button>
    <button id="bReset" title="Restart (R)">⟲</button>
    <button id="bSound" title="Sound">🔊</button>
    <button id="bMenu" title="Levels (Esc)">☰</button>
  </header>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="toast"></div>
    <div id="hintBox"></div>
    <div class="overlay show" id="menu"><div class="card">
      <h2 class="logo"><span style="border:3px solid #ff8fb8;color:#ff8fb8">RULE</span> <span style="color:#fff">IS</span> <span style="background:#c49a6c;color:#2a1a08">PUSH</span></h2>
      <p>Rules are blocks. Push the words to change the world!<br><b>RULEBOUND</b>: ninety puzzles, three worlds, four heroes.</p>
      <div class="pickLbl">Choose your hero:</div>
      <div id="heroes"><button data-h="biscuit"><canvas width="72" height="72"></canvas><b>Biscuit</b><small>golden retriever</small></button><button data-h="doggo"><canvas width="72" height="72"></canvas><b>Doggo</b><small>black &amp; white beagle</small></button><button data-h="hen"><canvas width="72" height="72"></canvas><b>Lady Clucksalot</b><small>Australorp hen</small></button><button data-h="cat"><canvas width="72" height="72"></canvas><b>Noodle</b><small id="catLbl">cat · random coat</small></button></div>
      <div id="worlds"></div><button id="bSandbox" style="margin-top:8px;background:#3d5c48">🧪 Sandbox: play with every block</button><div class="wname" id="wname"></div>
      <div id="levels"></div>
      <div class="keys">Arrows / WASD move · tap a square to walk there · Space wait · Z undo · R restart</div>
    </div></div>
    <div class="overlay" id="win"><div class="card">
      <h2>✨ Puzzle solved! ✨</h2>
      <p id="winText"></p>
      <button class="big" id="bNext">Next puzzle ▶</button>
    </div></div>
  </div>
  <div id="rules"></div>
  <div id="pad">
    <button data-d="3">◀</button>
    <div class="col"><button data-d="0">▲</button><button data-d="2">▼</button></div>
    <button data-d="1">▶</button>
    <button data-d="-1" title="Wait" style="font-size:15px">wait</button>
  </div>
</div>

function loadLevel(lv){
  const rows=lv.map, H=rows.length, W=Math.max(...rows.map(r=>r.length));
  const objs=[]; let id=1;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const ch=rows[y][x]||'.'; if(ch==='.') continue;
    if(COMBO_CH[ch]) COMBO_CH[ch].forEach(t=>objs.push({id:id++,type:t,x,y,dir:1}));
    else if(OBJ_CH[ch]) objs.push({id:id++,type:OBJ_CH[ch],x,y,dir:1});
    else {
      let word=NOUN_CH[ch]||PROP_CH[ch]||(ch==='='?'IS':ch==='&'?'AND':null);
      if(word) objs.push({id:id++,type:'TEXT',word,x,y,dir:1});
    }
  }
  if(lv.dirs) for(const [x,y,d] of lv.dirs) for(const o of objs) if(o.x===x&&o.y===y&&o.type!=='TEXT') o.dir=d;
  const s={W,H,objs,nextId:id};
  applyTransforms(s,computeRules(s));
  return s;
}

function computeRules(s){
  const grid=new Map();
  for(const o of s.objs) if(o.type==='TEXT'){ const k=o.y*s.W+o.x; if(!grid.has(k)) grid.set(k,[]); grid.get(k).push(o); }
  const find=(x,y,pred)=>{ if(x<0||y<0||x>=s.W||y>=s.H) return null; const a=grid.get(y*s.W+x); return a?(a.find(pred)||null):null; };
  const isNoun=o=>wkind(o.word)==='noun', isTgt=o=>{const k=wkind(o.word); return k==='noun'||k==='prop';};
  const props=new Map(), trans=new Map(), active=new Set(), sentences=new Set();
  for(const t of s.objs){
    if(t.type!=='TEXT'||!isNoun(t)) continue;
    for(const [dx,dy] of [[1,0],[0,1]]){
      let cx=t.x+dx, cy=t.y+dy; const subj=[t.word], ids=[t.id];
      while(true){ const a=find(cx,cy,o=>o.word==='AND'); const n=a&&find(cx+dx,cy+dy,isNoun);
        if(a&&n){ subj.push(n.word); ids.push(a.id,n.id); cx+=2*dx; cy+=2*dy; } else break; }
      const is=find(cx,cy,o=>o.word==='IS'); if(!is) continue;
      ids.push(is.id); cx+=dx; cy+=dy;
      const tg=find(cx,cy,isTgt); if(!tg) continue;
      const tgts=[tg.word]; ids.push(tg.id); cx+=dx; cy+=dy;
      while(true){ const a=find(cx,cy,o=>o.word==='AND'); const n=a&&find(cx+dx,cy+dy,isTgt);
        if(a&&n){ tgts.push(n.word); ids.push(a.id,n.id); cx+=2*dx; cy+=2*dy; } else break; }
      for(const sb of subj) for(const g of tgts){
        sentences.add(sb+' IS '+g);
        if(wkind(g)==='prop'){ if(!props.has(sb)) props.set(sb,new Set()); props.get(sb).add(g); }
        else { if(!trans.has(sb)) trans.set(sb,[]); if(!trans.get(sb).includes(g)) trans.get(sb).push(g); }
      }
      ids.forEach(i=>active.add(i));
    }
  }
  return {props,trans,active,sentences:[...sentences]};
}
function has(rules,o,p){ if(o.type==='TEXT') return p==='PUSH'; const s=rules.props.get(o.type); return !!s&&s.has(p); }

function applyTransforms(s,rules){
  let changed=false; const out=[];
  for(const o of s.objs){
    if(o.type!=='TEXT'){ const t=rules.trans.get(o.type);
      if(t&&!t.includes(o.type)){ changed=true; t.forEach((nt,i)=>out.push({...o,type:nt,id:i===0?o.id:s.nextId++,morph:true})); continue; } }
    out.push(o);
  }
  s.objs=out; return changed;
}

function cloneState(s){ return {W:s.W,H:s.H,nextId:s.nextId,objs:s.objs.map(o=>{const c={...o}; delete c.morph; return c;})}; }

const MAX_TEXT_PUSH=2;
function step(state,dir){
  const s=cloneState(state); let rules=computeRules(s);
  const res={state:s,moved:false,pushed:false,won:false,lost:false,destroyed:[]};
  if(!s.objs.some(o=>has(rules,o,'YOU'))){ res.lost=true; return res; }
  const objsAt=(x,y)=>s.objs.filter(o=>o.x===x&&o.y===y);
  let moved=new Set(); const everMoved=new Set();
  function solid(a){ return (has(rules,a,'STOP')||has(rules,a,'PULL'))&&!has(rules,a,'PUSH'); }
  function tryMove(o,d,txt,fromYou){ txt=txt||0;
    const dx=DX[d], dy=DY[d], nx=o.x+dx, ny=o.y+dy;
    if(nx<0||ny<0||nx>=s.W||ny>=s.H) return false;
    const here=objsAt(nx,ny);
    for(const a of here){ if(a.id!==o.id&&solid(a)){ const unlock=(has(rules,o,'OPEN')&&has(rules,a,'SHUT'))||(has(rules,o,'SHUT')&&has(rules,a,'OPEN')); if(!unlock) return false; } }
    for(const a of here){ if(a.id!==o.id&&has(rules,a,'PUSH')){ const nt=txt+(a.type==='TEXT'?1:0); if(fromYou&&nt>MAX_TEXT_PUSH) return false; if(!tryMove(a,d,nt,fromYou)) return false; if(!has(rules,a,'YOU')) res.pushed=true; } }
    const ox=o.x, oy=o.y; o.x=nx; o.y=ny; if(o.type!=='TEXT') o.dir=d; moved.add(o.id); everMoved.add(o.id);
    for(const p of objsAt(ox-dx,oy-dy)){ if(p.id!==o.id&&has(rules,p,'PULL')&&!moved.has(p.id)) tryMove(p,d); }
    return true;
  }
  if(dir>=0){
    const dx=DX[dir], dy=DY[dir];
    const movers=s.objs.filter(o=>has(rules,o,'YOU'));
    movers.sort((a,b)=>(b.x*dx+b.y*dy)-(a.x*dx+a.y*dy));
    for(const m of movers){ m.dir=dir; if(!moved.has(m.id)) tryMove(m,dir,0,true); }
  }
  const dead=new Set(); res.destroyed=[];
  function interact(){
    const R=computeRules(s); const H=(o,p)=>has(R,o,p); const cells=new Map();
    for(const o of s.objs){ if(dead.has(o.id)) continue; const k=o.y*s.W+o.x; if(!cells.has(k)) cells.set(k,[]); cells.get(k).push(o); }
    for(let L of cells.values()){
      if(L.length>1) L.forEach(o=>{ if(H(o,'WEAK')) dead.add(o.id); });
      L=L.filter(o=>!dead.has(o.id));
      if(L.length>1&&L.some(o=>H(o,'SINK'))) L.forEach(o=>dead.add(o.id));
      L=L.filter(o=>!dead.has(o.id));
      if(L.some(o=>H(o,'DEFEAT'))) L.forEach(o=>{ if(H(o,'YOU')) dead.add(o.id); });
      L=L.filter(o=>!dead.has(o.id));
      if(L.some(o=>H(o,'HOT'))) L.forEach(o=>{ if(H(o,'MELT')) dead.add(o.id); });
      L=L.filter(o=>!dead.has(o.id));
      const op=L.filter(o=>H(o,'OPEN')), sh=L.filter(o=>H(o,'SHUT'));
      if(op.length&&sh.length){ op.forEach(o=>dead.add(o.id)); sh.forEach(o=>dead.add(o.id)); }
    }
    res.destroyed.push(...s.objs.filter(o=>dead.has(o.id)));
    s.objs=s.objs.filter(o=>!dead.has(o.id));
  }
  if(s.objs.some(o=>has(rules,o,'MOVE'))||s.objs.some(o=>has(rules,o,'TELE'))) interact();
  // MOVE phase
  rules=computeRules(s); moved=new Set();
  const mv=s.objs.filter(o=>o.type!=='TEXT'&&has(rules,o,'MOVE')).sort((a,b)=>a.id-b.id);
  for(const o of mv){ if(moved.has(o.id)) continue; const d=o.dir===undefined?1:o.dir; if(!tryMove(o,d)){ const r=(d+2)%4; o.dir=r; tryMove(o,r); } }
  // TELE phase
  rules=computeRules(s);
  const tele=s.objs.filter(o=>o.type!=='TEXT'&&has(rules,o,'TELE'));
  if(tele.length){ const done=new Set();
    for(const o of s.objs){ if(!everMoved.has(o.id)||done.has(o.id)) continue;
      const T=tele.find(t=>t.id!==o.id&&t.x===o.x&&t.y===o.y&&!(o.type===t.type)); if(!T) continue;
      const other=tele.filter(t=>t.type===T.type&&t.id!==T.id&&t.id!==o.id).sort((a,b)=>a.id-b.id)[0]; if(!other) continue;
      o.x=other.x; o.y=other.y; done.add(o.id); res.teleported=true; } }
  res.moved=everMoved.size>0;
  // resolve
  rules=computeRules(s);
  if(applyTransforms(s,rules)) res.transformed=true;
  interact();
  rules=computeRules(s);
  const cells2=new Map();
  for(const o of s.objs){ const k=o.y*s.W+o.x; if(!cells2.has(k)) cells2.set(k,[]); cells2.get(k).push(o); }
  for(const L of cells2.values()) if(L.some(o=>has(rules,o,'YOU'))&&L.some(o=>has(rules,o,'WIN'))) res.won=true;
  res.lost=!res.won&&!s.objs.some(o=>has(rules,o,'YOU'));
  return res;
}

  if(C.stripe){ ctx.strokeStyle=C.stripe; ctx.lineWidth=s*.04; for(const k of [-.12,0,.12]){ ctx.beginPath(); ctx.moveTo(cx+k*s+side*s*.05,cy); ctx.lineTo(cx+k*s+side*s*.1,cy+s*.12); ctx.stroke(); } }
  if(C.patch1){ ctx.fillStyle=C.patch1; ctx.beginPath(); ctx.ellipse(cx+side*s*.13,cy+s*.08,s*.12,s*.09,0,0,7); ctx.fill(); ctx.fillStyle=C.patch2; ctx.beginPath(); ctx.ellipse(cx-side*s*.14,cy+s*.24,s*.09,s*.07,0,0,7); ctx.fill(); }
  ctx.restore();
  ctx.fillStyle=C.belly; ctx.beginPath(); ctx.ellipse(cx+fx*.5,cy+s*.24,s*.12,s*.11,0,0,7); ctx.fill();
  ctx.fillStyle=C.points||C.belly; for(const px of [-.11,.11]){ ctx.beginPath(); ctx.ellipse(cx+px*s,y+s*.85,s*.07,s*.045,0,0,7); ctx.fill(); }
  const hx=cx+fx*.6, hy=cy-s*.08+b;
  for(const sd of [-1,1]){ ctx.fillStyle=C.ear; ctx.beginPath(); ctx.moveTo(hx+sd*s*.2,hy-s*.06); ctx.lineTo(hx+sd*s*.18,hy-s*.3); ctx.lineTo(hx+sd*s*.04,hy-s*.17); ctx.fill();
    ctx.fillStyle='#f6a7b8'; ctx.beginPath(); ctx.moveTo(hx+sd*s*.17,hy-s*.1); ctx.lineTo(hx+sd*s*.165,hy-s*.24); ctx.lineTo(hx+sd*s*.08,hy-s*.16); ctx.fill(); }
  ctx.fillStyle=C.base; ctx.beginPath(); ctx.ellipse(hx,hy,s*.23,s*.2,0,0,7); ctx.fill();
  if(C.patch2){ ctx.save(); ctx.beginPath(); ctx.ellipse(hx,hy,s*.23,s*.2,0,0,7); ctx.clip(); ctx.fillStyle=C.patch2; ctx.beginPath(); ctx.ellipse(hx-s*.15,hy-s*.1,s*.12,s*.11,0,0,7); ctx.fill(); ctx.fillStyle=C.patch1; ctx.beginPath(); ctx.ellipse(hx+s*.16,hy-s*.12,s*.1,s*.09,0,0,7); ctx.fill(); ctx.restore(); }
  if(C.stripe){ ctx.strokeStyle=C.stripe; ctx.lineWidth=s*.03; for(const k of [-.05,0,.05]){ ctx.beginPath(); ctx.moveTo(hx+k*s,hy-s*.19); ctx.lineTo(hx+k*s*1.2,hy-s*.11); ctx.stroke(); } }
  if(C.points){ ctx.fillStyle=C.points; ctx.beginPath(); ctx.ellipse(hx+fx,hy+s*.06+fyy,s*.11,s*.08,0,0,7); ctx.fill(); }
  else { ctx.fillStyle=C.muzzle||C.belly; ctx.beginPath(); ctx.ellipse(hx+fx,hy+s*.07+fyy,s*.1,s*.07,0,0,7); ctx.fill(); }
  for(const ex of [-.09,.09]){ ctx.fillStyle='#7fd06a'; ctx.beginPath(); ctx.ellipse(hx+ex*s+fx,hy-s*.03+fyy,s*.045,s*.05,0,0,7); ctx.fill();
    ctx.fillStyle='#1a1424'; ctx.beginPath(); ctx.ellipse(hx+ex*s+fx,hy-s*.03+fyy,s*.015,s*.04,0,0,7); ctx.fill(); }
  ctx.fillStyle='#f27f9b'; ctx.beginPath(); ctx.moveTo(hx+fx-s*.03,hy+s*.04+fyy); ctx.lineTo(hx+fx+s*.03,hy+s*.04+fyy); ctx.lineTo(hx+fx,hy+s*.075+fyy); ctx.fill();
  ctx.strokeStyle=C.base==='#26232a'?'rgba(255,255,255,.7)':'rgba(40,30,40,.55)'; ctx.lineWidth=Math.max(1,s*.012);
  for(const sd of [-1,1]) for(const k of [-.02,.03]){ ctx.beginPath(); ctx.moveTo(hx+fx+sd*s*.08,hy+s*(.07+k)+fyy); ctx.lineTo(hx+fx+sd*s*.24,hy+s*(.05+k*2)+fyy); ctx.stroke(); }
}

const off=document.createElement('canvas'), octx=off.getContext('2d'), sil=document.createElement('canvas'), sctx=sil.getContext('2d');
function mkNoise(n,fn){ const c=document.createElement('canvas'); c.width=c.height=n; const g=c.getContext('2d'); const d=g.createImageData(n,n);
  for(let i=0;i<d.data.length;i+=4){ const [v,a]=fn(); d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=a; } g.putImageData(d,0,0); return c; }
const HATCH=(()=>{ const n=48,c=document.createElement('canvas'); c.width=c.height=n; const g=c.getContext('2d'); g.strokeStyle='#000'; g.lineCap='round';
  for(let d=-n;d<n*2;d+=7){ g.lineWidth=3+Math.random()*2; g.beginPath(); g.moveTo(d+Math.random()*2,n); g.lineTo(d+n+Math.random()*2,0); g.stroke(); } return c; })();
const DOTS=(()=>{ const n=10,c=document.createElement('canvas'); c.width=c.height=n; const g=c.getContext('2d'); g.fillStyle='#000'; g.beginPath(); g.arc(5,5,2.2,0,7); g.fill(); return c; })();
const tmp=document.createElement('canvas'), tctx=tmp.getContext('2d');
function masked(pat,alpha){ tmp.width=off.width; tmp.height=off.height; tctx.drawImage(off,0,0); tctx.globalCompositeOperation='destination-in'; tctx.globalAlpha=alpha||1; tctx.fillStyle=tctx.createPattern(pat,'repeat'); tctx.fillRect(0,0,tmp.width,tmp.height); tctx.globalCompositeOperation='source-over'; tctx.globalAlpha=1; return tmp; }
const GRAIN=mkNoise(180,()=>[150+Math.random()*105,255]), SPECK=mkNoise(160,()=>[0,Math.random()<.28?255:0]);
function silo(col){ sctx.setTransform(1,0,0,1,0,0); sctx.globalCompositeOperation='source-over'; sctx.clearRect(0,0,sil.width,sil.height); sctx.drawImage(off,0,0); sctx.globalCompositeOperation='source-in'; sctx.fillStyle=col; sctx.fillRect(0,0,sil.width,sil.height); sctx.globalCompositeOperation='source-over'; return sil; }
function outline(col,r,jit){ const S=silo(col); for(let i=0;i<8;i++){ const a=i/8*6.283; const j=jit?(rnd(i+jit)-.5)*r*.8:0; ctx.drawImage(S,Math.cos(a)*r+j,Math.sin(a)*r+j); } }
function boardBG(W,H,t){
  const bx=ox-6,by=oy-6,bw=ts*state.W+12,bh=ts*state.H+12;
  const TH=WORLDS[worldOf(cur)];
  ctx.fillStyle=TH.board; ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle=TH.lines; ctx.lineWidth=1; for(let j=1;j<state.H*2;j++){ ctx.beginPath(); ctx.moveTo(bx,oy+j*ts/2); ctx.lineTo(bx+bw,oy+j*ts/2); ctx.stroke(); }
  ctx.strokeStyle=TH.margin; ctx.beginPath(); ctx.moveTo(ox+ts*.5,by); ctx.lineTo(ox+ts*.5,by+bh); ctx.stroke();
  if(worldOf(cur)===2){ for(let i=0;i<22;i++){ const sx=bx+((rnd(i)*bw+Math.sin(t/900+i)*12+bw)%bw), sy=by+bh-((rnd(i+7)*bh+t*.02*(.5+rnd(i+9)))%bh), r=1+rnd(i+11)*2;
      ctx.fillStyle=`rgba(255,${150+rnd(i+3)*80|0},80,${.25+.25*Math.sin(t/300+i)})`; ctx.beginPath(); ctx.arc(sx,sy,r,0,7); ctx.fill(); } }
  if(worldOf(cur)===1){ ctx.strokeStyle='rgba(220,245,255,.35)'; ctx.lineWidth=1.2; for(let i=0;i<26;i++){ const sx=bx+((rnd(i)*bw+t*.012*(.5+rnd(i+3)))%bw), sy=by+((rnd(i+7)*bh+t*.025*(.6+rnd(i+9)))%bh), r=2+rnd(i+11)*3;
      for(let a=0;a<3;a++){ const an=a*Math.PI/3+t/2000; ctx.beginPath(); ctx.moveTo(sx-Math.cos(an)*r,sy-Math.sin(an)*r); ctx.lineTo(sx+Math.cos(an)*r,sy+Math.sin(an)*r); ctx.stroke(); } } }
  ctx.strokeStyle='rgba(235,228,250,.8)'; ctx.lineWidth=2; for(const [y0,s0] of [[by,0],[by+bh,7]]){ ctx.beginPath(); for(let i=0;i<=40;i++){ const px=bx+bw*i/40, py=y0+(rnd(i+s0)-.5)*3; i?ctx.lineTo(px,py):ctx.moveTo(px,py);} ctx.stroke(); }
}
function frame(t){
  requestAnimationFrame(frame);
  const dpr=devicePixelRatio||1, W=cv.width/dpr, H=cv.height/dpr;
  ctx.clearRect(0,0,W,H);
  if(state){
    boardBG(W,H,t);
    if(off.width!==cv.width||off.height!==cv.height){ off.width=sil.width=cv.width; off.height=sil.height=cv.height; }
    octx.setTransform(1,0,0,1,0,0); octx.clearRect(0,0,off.width,off.height); octx.setTransform(dpr,0,0,dpr,0,0);
    const main=ctx; ctx=octx;
    const list=[...state.objs].sort((a,b)=>{ const la=a.type==='TEXT'?3:LAYER[a.type]??2, lb=b.type==='TEXT'?3:LAYER[b.type]??2;
      const ya=has(rules,a,'YOU')?10:0, yb=has(rules,b,'YOU')?10:0; return la+ya-(lb+yb); });
    for(const o of list){
      let r=rpos.get(o.id); if(!r){ r={x:o.x,y:o.y}; rpos.set(o.id,r); }
      r.x+=(o.x-r.x)*.35; r.y+=(o.y-r.y)*.35; if(Math.abs(o.x-r.x)<.01) r.x=o.x; if(Math.abs(o.y-r.y)<.01) r.y=o.y;
      const bt=born.get(o.id); let sc=1; if(bt!==undefined){ const k=(t-bt)/300; if(k>=1) born.delete(o.id); else sc=.3+.7*(1-Math.pow(1-k,3))+Math.sin(k*Math.PI)*.15; }
      ctx.save(); const px=ox+r.x*ts, py=oy+r.y*ts;
      if(sc!==1){ ctx.translate(px+ts/2,py+ts/2); ctx.scale(sc,sc); ctx.translate(-px-ts/2,-py-ts/2); }
      drawObj(o,px,py,ts,t); ctx.restore();
    }
    ctx=main;
    ctx.save(); ctx.setTransform(1,0,0,1,0,0);
    const boil=Math.floor(t/150)%4;
    outline('rgba(235,228,250,.9)',Math.max(1.5,ts*.035*dpr),boil*5+3); ctx.drawImage(silo(WORLDS[worldOf(cur)].board),0,0);
    ctx.filter='saturate(1.25) brightness(1.1)'; ctx.drawImage(masked(HATCH,1),(rnd(boil)-.5)*2*dpr,(rnd(boil+5)-.5)*2*dpr); ctx.filter='none';
    ctx.globalAlpha=.5; ctx.drawImage(off,0,0); ctx.globalAlpha=1;
    ctx.restore();
  }
  if(tapMark&&state){ const k=(t-tapMark.t)/450; if(k>=1) tapMark=null; else { ctx.save(); ctx.globalAlpha=1-k; ctx.strokeStyle=tapMark.ok?'#7dffa8':'#ff6b6b'; ctx.lineWidth=3;
    const px=ox+tapMark.x*ts, py=oy+tapMark.y*ts, g=ts*.08+k*ts*.06; rr(px+g,py+g,ts-2*g,ts-2*g,ts*.18); ctx.stroke();
    if(!tapMark.ok){ ctx.beginPath(); ctx.moveTo(px+ts*.3,py+ts*.3); ctx.lineTo(px+ts*.7,py+ts*.7); ctx.moveTo(px+ts*.7,py+ts*.3); ctx.lineTo(px+ts*.3,py+ts*.7); ctx.stroke(); }
    ctx.restore(); } }
  parts=parts.filter(p=>p.life>0);
  for(const p of parts){ p.life--; p.x+=p.vx; p.y+=p.vy;
    if(p.conf){ p.vy+=.02; p.rot+=.1; ctx.save(); ctx.translate(p.x/(devicePixelRatio||1)*(devicePixelRatio||1)/(devicePixelRatio||1)*(devicePixelRatio||1),p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); }
    else { p.vx*=.92; p.vy*=.92; ctx.globalAlpha=p.life/40; ctx.fillStyle=p.c; ctx.fillRect(ox+(p.gx+.5)*ts+p.x*ts*.1-p.s/2, oy+(p.gy+.5)*ts+p.y*ts*.1-p.s/2, p.s,p.s); ctx.globalAlpha=1; }
  }
}
function setHero(k,reroll){ heroKey=k; HERO=HEROES[k];
  if(k==='cat'){ if(reroll){ let n; do{ n=Math.floor(Math.random()*CAT_COATS.length); }while(n===catCoat%CAT_COATS.length); catCoat=n; }
    HERO.col=CAT_COATS[catCoat%CAT_COATS.length].base==='#26232a'?'#d8d4e4':CAT_COATS[catCoat%CAT_COATS.length].base; }
  document.getElementById('catLbl').textContent='cat · '+CAT_COATS[catCoat%CAT_COATS.length].name+' 🎲';
  COL.PUP=HERO.col; save();
  document.querySelectorAll('#heroes button').forEach(b=>b.classList.toggle('sel',b.dataset.h===k));
  if(state){ document.getElementById('rules').innerHTML=''; updateRules(); } }
document.querySelectorAll('#heroes button').forEach(b=>b.onclick=()=>{ setHero(b.dataset.h,b.dataset.h==='cat'); beep(660,.08,'square',.04,200); });
function drawPreviews(t){ const main=ctx; const saved=heroKey;
  document.querySelectorAll('#heroes button').forEach(b=>{ const c=b.querySelector('canvas'); ctx=c.getContext('2d'); ctx.clearRect(0,0,72,72);
    heroKey=b.dataset.h; drawObj({type:'PUP',dir:b.dataset.h==='hen'?1:2,id:b.dataset.h.length},4,4,64,t); });
  heroKey=saved; ctx=main; }
(function prev(t){ if(document.getElementById('menu').classList.contains('show')) drawPreviews(t||0); requestAnimationFrame(prev); })();
setHero(heroKey);
resize(); openMenu(); requestAnimationFrame(frame);
</script>
