<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2b1d14;font-family:'Fredoka',system-ui,sans-serif;color:#3a2614;user-select:none;-webkit-user-select:none}
canvas#c{display:block;touch-action:none}
#fsBtn{position:fixed;top:10px;right:64px;width:46px;height:46px;border-radius:14px;border:3px solid #5a3a22;background:#fff8ec;font-size:22px;z-index:5;box-shadow:0 3px 0 #5a3a22;cursor:pointer;font-weight:700}
#fsBtn.hud{top:auto;bottom:10px;right:10px;opacity:.8}
#pauseBtn{position:fixed;top:10px;right:10px;width:46px;height:46px;border-radius:14px;border:3px solid #5a3a22;background:#fff8ec;font-size:20px;z-index:5;box-shadow:0 3px 0 #5a3a22;cursor:pointer}
#toast{position:fixed;left:50%;top:96px;transform:translateX(-50%);z-index:30;pointer-events:none;background:#fff8ec;border:3px solid #b8860b;border-radius:14px;padding:8px 14px;font-weight:600;font-size:15px;box-shadow:0 4px 0 #b8860b;max-width:90vw;text-align:center;transition:opacity .3s;opacity:0}
#toast.on{opacity:1}
.overlay{position:fixed;inset:0;background:rgba(30,18,8,.6);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;z-index:10;padding:14px 10px 40px}
.hidden{display:none!important}
.panel{background:#fff8ec;border:4px solid #5a3a22;border-radius:22px;box-shadow:0 8px 0 #5a3a22;width:100%;max-width:620px;padding:16px;margin:auto}
h1{margin:0;font-size:38px;text-align:center;color:#3d6b22;text-shadow:0 3px 0 #c9e27a}
h2{margin:0;font-size:22px}
h3{margin:14px 0 8px;font-size:16px;color:#6b4a2c}
p{margin:6px 0}
.sub{text-align:center;color:#6b4a2c}
.center{text-align:center}
.btn{font:inherit;font-weight:600;font-size:17px;padding:10px 16px;border-radius:14px;border:3px solid #3d5a1a;background:#8fd14f;color:#1f3309;box-shadow:0 4px 0 #3d5a1a;cursor:pointer}

.btn.alt{background:#ffe08a;border-color:#7a5a12;box-shadow:0 4px 0 #7a5a12;color:#4a3405}
.btn.red{background:#ff8a7a;border-color:#7a2a1a;box-shadow:0 4px 0 #7a2a1a;color:#3a0d05}
.btn.off{background:#eee;border-color:#999;box-shadow:0 4px 0 #999;color:#555}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.big{width:100%;font-size:20px;padding:14px;margin-top:14px}
.btn.sm{font-size:14px;padding:6px 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border:3px solid var(--tc);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:0 3px 0 var(--tc);min-width:0}
.card.pick{cursor:pointer}
.card.pick:active{transform:translateY(2px)}
.card.locked{filter:grayscale(1);opacity:.6;cursor:default}
.ct{display:flex;gap:8px;align-items:center}
.ic{font-size:30px;line-height:1;flex:none}
.ct b{display:block;font-size:15px;line-height:1.15}
.ct small{color:var(--tc);font-weight:700;font-size:12px;filter:brightness(.75)}
.cd{font-size:13px;line-height:1.35;color:#5a4330;flex:1}
.cb{display:flex;gap:6px}
.cb .btn{flex:1;font-size:15px;padding:7px 8px}
.lk{flex:0 0 44px!important;background:#eee!important;border-color:#888!important;box-shadow:0 4px 0 #888!important}
.lk.on{background:#ffd34d!important;border-color:#7a5a12!important;box-shadow:0 4px 0 #7a5a12!important}
.sold{display:flex;align-items:center;justify-content:center;color:#aa9;font-weight:600;min-height:120px;border-style:dashed}
.pos{color:#2f8a1a;font-weight:600}.neg{color:#c0392b;font-weight:600}
.coins{font-size:22px;font-weight:700;background:#ffe08a;border:3px solid #7a5a12;border-radius:12px;padding:2px 10px}
.inv{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.ws{aspect-ratio:1;border-radius:12px;border:3px solid var(--tc,#ccc);background:#fff;font-size:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;cursor:pointer;padding:0;font-family:inherit}
.ws small{position:absolute;bottom:1px;right:4px;font-size:11px;font-weight:700;color:#5a4330}
.ws.empty{border-style:dashed;background:transparent;cursor:default}
.ws.sel{outline:3px solid #3d6b22;outline-offset:2px}
.wact{margin-top:8px;background:#f3ead9;border-radius:12px;padding:8px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#fff;border:2px solid var(--tc);border-radius:10px;padding:2px 7px;font-size:20px;position:relative}
.chip small{font-size:11px;font-weight:700}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:14px;background:#f3ead9;border-radius:12px;padding:10px}
.stats div{display:flex;justify-content:space-between}
.tip{font-size:13px;color:#7a5a3a;text-align:center}
#avoPrev{display:block;margin:4px auto 0}
.note{background:#e9f5d8;border-radius:10px;padding:6px 10px;font-size:14px}
.chcard{flex-direction:row;align-items:center;gap:8px;padding:8px}
.chcard canvas{flex:none;width:54px;height:60px}
.chcard b{font-size:15px}
.chcard .cd{font-size:12px}
.foods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fbtn{background:#fff;border:3px solid #ccc;border-radius:14px;padding:3px 1px;cursor:pointer;font:inherit;font-weight:600;font-size:16px;color:#5a4330;min-width:0;overflow:hidden}
.fbtn canvas{display:block;margin:0 auto;width:100%;max-width:90px;height:auto}
.fbtn.on{border-color:#3d6b22;background:#eef8df;box-shadow:0 3px 0 #3d6b22}
.dz{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}

.badge{font-size:11px;font-weight:700;color:#b8860b}

/* ---------- stats helpers ---------- */
function dmgPct(){let d=G.stats.dmg;const c=G.ch;if(c.speedDmg)d+=Math.max(0,G.stats.speed)*0.5;if(c.saver)d+=Math.floor(G.coins/20);if(c.maso)d+=G.maso;if(c.creature)d+=G.stats.curse;if(c.romantic)d-=G.stats.curse*0.5;if(c.druid)d+=G.druidBonus||0;if(c.curious)d-=5*(G.items.length-new Set(G.items).size);return d;}
function statE(k){let v=G.stats[k];if(k==='melee'&&G.ch.knight)v+=Math.max(0,G.stats.armor);return v;}
function wMul(w){const d=WEAPONS[w.id],c=G.ch;let m=1;if(c.slots===12)m*=Math.max(0.2,1-0.05*G.weapons.length);if(d.type==='melee'&&c.meleeMul)m*=c.meleeMul;if(d.type==='ranged'&&c.rangedMul)m*=c.rangedMul;if(c.nonElemMul&&!d.elem)m*=c.nonElemMul;if(c.weaponMul)m*=c.weaponMul;return m;}
function cdOf(w){return Math.max(0.08,WEAPONS[w.id].cd[w.tier]/Math.max(0.3,1+(G.ch.noAtkSpd?0:G.stats.atkSpd)/100));}
function rangeOf(w){const d=WEAPONS[w.id];return Math.max(50,d.range+(d.type==='melee'?G.stats.range*0.5:G.stats.range));}
function dmgOf(w){const d=WEAPONS[w.id];let b=d.dmg[w.tier];for(const k in d.scale)b+=statE(k)*d.scale[k];return Math.max(1,b*(1+dmgPct()/100)*wMul(w));}
function critOf(w){return WEAPONS[w.id].crit+G.stats.crit/100;}
const petDmg=(b,k,wk)=>Math.max(1,(b+G.stats.petPow*k+G.wave*wk)*(1+dmgPct()/100));
const engDmg=(b,k,wk)=>Math.max(1,b+G.stats.eng*k+G.wave*wk);
function nearest(x,y,R,ex){let best=null,bd=Infinity;for(const e of G.enemies){if(e.dead||e.friend||(ex&&ex.has(e)))continue;let dd=Math.sqrt(d2(x,y,e.x,e.y))-e.r;if(dd>=R)continue;if(e.d.tree)dd+=120;if(dd<bd){bd=dd;best=e}}return best;}

  if(G.enemies.length+G.marks.length<CAP()){

   if(G.horde)n=Math.round(n*(G.danger>=3?2.2:w<10?1.4:1.8));if(G.ch.jack)n=Math.max(1,Math.round(n*0.5));if(G.ch.loud)n=Math.round(n*G.ch.loud);if(w>20)n=Math.min(n,24);
   spawnGroup(type,n,75);
  }
 }
 G.swarmT-=dt;if(w>=4&&G.swarmT<=0&&G.waveTime<G.waveDur-3){G.swarmT=rnd(9,13)*(G.horde?0.6:1);
  if(G.enemies.length+G.marks.length<CAP()){const fast=G.waveTypes.filter(k=>!EN[k].heavy&&!EN[k].split&&EN[k].ai!=='shoot'&&!isFriendType(k));const type=pick(fast.length?fast:['tinyant','froglet']);
   let n=Math.min(28,Math.round(2+w*(w<10?0.9:1.2))+(G.horde?5:0));if(G.ch.jack)n=Math.round(n*0.5);
   if(w<8||Math.random()<0.5){spawnGroup(type,n,110);}else{const R=430;for(let i=0;i<n;i++){const a=i/n*TAU;G.marks.push({x:clamp(G.p.x+Math.cos(a)*R,40,ARENA-40),y:clamp(G.p.y+Math.sin(a)*R,40,ARENA-40),t:1.1,type});}}
   if(!G.banner)G.banner={t:1.2,txt:'🌊 Swarm!',sub:''};}}
 G.treeT-=dt;if(G.treeT<=0){G.treeT=rnd(14,20);const alive=G.enemies.filter(e=>e.d.tree).length;if(alive<1+G.stats.trees)plantTree();}
 for(let i=G.marks.length-1;i>=0;i--){const m=G.marks[i];m.t-=dt;if(m.t<=0){spawnEnemy(m.type,m.x,m.y,m.elite);G.marks.splice(i,1);}}
}
function spawnEnemy(type,x,y,elite){
 if(!elite&&isFriendType(type)&&G.waveTypes){const host=G.waveTypes.filter(k=>!isFriendType(k)&&!EN[k].boss);const light=host.filter(k=>!EN[k].heavy);const hk=pick(light.length?light:host.length?host:['ant']);

 const d=EN[type],w=G.wave,dz=DZ[G.danger];
 let hp=d.hp(w)*(d.tree?1:dz.hp*(1+Math.max(0,w-5)*0.05))*(G.ch.jack&&!d.tree?1.5:1)*(w>20&&!d.tree?1+(w-20)*0.12:1);
 const e={type,d,x,y,r:d.r,hp,spd:rnd(d.spd[0],d.spd[1])*(G.ch.oldSlow||1)*(d.boss||d.tree?1:1+Math.min(0.25,Math.max(0,w-8)*0.02)),dmg:Math.round(d.dmg(w)*dz.dmg*(1+Math.max(0,w-5)*0.04)),kx:0,ky:0,flash:0,burn:0,burnD:0,burnTick:0,slowT:0,slowM:1,pc:{},t:rnd(1.5,3),t2:2.5,t3:5,t4:1,st:'walk',vx:0,vy:0,wob:Math.random()*6,spawnIn:0.25,dead:false,elite:!!elite,drop:d.drop};
 if(elite){e.r*=1.5;e.hp=Math.max(250,e.hp*10);e.dmg=Math.round(e.dmg*1.4)+1;e.drop=15;e.spd*=1.1;G.shake=8;addText(x,y-50,'⭐ ELITE','#ffd23f',1.4);}
 e.friend=isFriendType(type)&&!elite;if(G.ch.enemyHp&&!d.tree)e.hp*=G.ch.enemyHp;if(!e.friend&&!d.tree&&!d.boss&&G.stats.curse>0&&Math.random()<Math.min(0.6,G.stats.curse/100)){e.cursed=true;e.hp*=1.8;e.dmg=Math.round(e.dmg*1.3)+1;e.drop*=2;}e.maxHp=e.hp;G.enemies.push(e);if(d.boss&&(!G.boss||type==='frogboss')){G.boss=e;G.shake=10;}return e;}

function ring(e,n,spd,off){for(let i=0;i<n;i++)fireE(e.x,e.y,i/n*TAU+(off||0),spd,Math.max(1,Math.round(e.dmg*0.6)),e.d.bcol);}

/* ---------- combat ---------- */
function applyHit(e,dmg,crit,dx,dy,knock){
 if(e.dead||e.friend)return;if(G.ch.jack&&(e.d.boss||e.elite))dmg*=2;if(G.ch.sailor&&e.cursed)dmg*=2;
 if(G.ch.ogre&&!e.d.boss&&!e.d.tree&&dmg>=e.maxHp*0.3&&(G.ogreD||0)<2){G.ogreD=(G.ogreD||0)+1;e.hp=0;explode(e.x,e.y,75,dmg*0.5,false,'200,60,60');G.ogreD--;}
 if(fxc('sausage')&&!e.d.tree&&Math.random()<0.2*fxc('sausage')){e.burn=3*(G.ch.burnX||1);e.burnD=Math.max(e.burnD,(3+G.stats.elem)*(1+dmgPct()/100));}
 const k=(e.d.heavy||e.elite?0.25:1)*knock*8;if(!e.d.tree){e.kx+=dx*k;e.ky+=dy*k;}
 dmgEnemy(e,dmg,crit);
 if(!G.ch.druid&&G.stats.lifesteal>0&&G.lsT<=0&&Math.random()*100<G.stats.lifesteal){G.lsT=0.12;heal(1);}
 if(G.ch.romantic&&!e.dead&&!e.d.boss&&!e.d.tree&&e.hp<e.maxHp*0.35&&Math.random()<0.25){e.friend=true;e.charmT=8;e.fr=null;addText(e.x,e.y-e.r-14,'💘','#ff6fb5',1.3);}
 sfx('hit');
}
function dmgEnemy(e,amt,crit,col){if(e.dead||e.friend)return;if(e.d.tree&&fxc('apron'))amt=e.hp;e.hp-=amt;e.flash=0.08;addText(e.x+rnd(-8,8),e.y-e.r-4,Math.round(amt),col||(crit?'#ffd23f':'#ffffff'),crit?1.35:1);if(e.hp<=0)killEnemy(e);}
function killEnemy(e){
 e.dead=true;
 if(e.d.tree){G.tr.trees++;burst(e.x,e.y,'#4caf50',12,220);sfx('kill');const nf=ri(1,2);for(let i=0;i<nf;i++)dropFruit(e.x,e.y);
  if(Math.random()<Math.min(0.6,0.2*(1+G.stats.luck/100)))G.drops.push({x:e.x,y:e.y,vx:rnd(-60,60),vy:rnd(-60,60),kind:'crate',v:1,t:0});
  for(let i=0;i<fxc('factory');i++){addStruct('turret',e.x+rnd(-20,20),e.y+rnd(-20,20));addText(e.x,e.y-30,'🏭 Turret!','#9be7ff',1.1);}return;}
 G.kills++;G.tr.waveKills++;burst(e.x,e.y,e.d.col,e.d.boss?40:9,e.d.boss?400:220);sfx('kill');
 let drops=e.drop;if(G.ch.hiker)drops=Math.floor(drops*0.7+Math.random());if(e.cursed&&Math.random()<0.04)G.drops.push({x:e.x,y:e.y,vx:rnd(-60,60),vy:rnd(-60,60),kind:'crate',v:1,t:0});if(G.ch.doubleCoin&&Math.random()<Math.min(0.5,G.stats.luck/200))drops*=2;
 for(let i=0;i<drops;i++)dropCoin(e.x,e.y,e.d.boss||e.elite?260:90);
 if(!e.d.boss&&Math.random()<0.02*(1+G.stats.luck/100)*(G.ch.chunky?2:1)*(G.ch.druid?3:1))dropFruit(e.x,e.y);
 if(e.elite||(Math.random()<0.0015*(1+G.stats.luck/100)))G.drops.push({x:e.x,y:e.y,vx:rnd(-60,60),vy:rnd(-60,60),kind:'crate',v:1,t:0});
 if(e.d.split)for(let i=0;i<3;i++){const s=spawnEnemy(e.d.split,e.x+rnd(-12,12),e.y+rnd(-12,12));s.spawnIn=0;const a=i/3*TAU;s.kx=Math.cos(a)*300;s.ky=Math.sin(a)*300;}
 if(e.d.boss){if(G.boss===e)G.boss=G.enemies.find(o=>!o.dead&&o.d.boss&&o!==e)||null;G.shake=16;if(e.type==='mantis')grant('burger');
  if(e.type==='frogboss'&&G.wave===20){G.winT=1.6;for(const o of G.enemies)if(!o.dead){o.dead=true;burst(o.x,o.y,o.d.col,6);}G.ebul=[];G.marks=[];G.boss=null;}}
}
function dropFruit(x,y){G.drops.push({x,y,vx:rnd(-80,80),vy:rnd(-80,80),kind:'fruit',v:3*(G.ch.chunky?2:1)*(G.ch.druid?2:1),t:0,poison:G.ch.druid&&Math.random()<0.15});}
function dropCoin(x,y,sp){if(G.drops.length>260){G.bank++;return;}const a=Math.random()*TAU,s=rnd(20,sp);G.drops.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,kind:'coin',v:1,t:0});}
function explode(x,y,R,dmg,crit,col){G.rings.push({x,y,r:6,R,t:0.3,col:col||'255,170,60'});burst(x,y,'#ffb347',12,260);sfx('boom');for(const e of G.enemies){if(e.dead)continue;if(d2(x,y,e.x,e.y)<(R+e.r)**2){const L=Math.hypot(e.x-x,e.y-y)||1;applyHit(e,dmg,crit,(e.x-x)/L,(e.y-y)/L,20);}}}
const bullR=()=>90+G.stats.range*0.4;
const bullDmg=()=>Math.max(1,(8+maxHp()*0.35+G.stats.armor*1.5+G.stats.melee*0.5)*(1+dmgPct()/100));
function bullBlast(){const s=G.stats,p=G.p;const crit=Math.random()<s.crit/100;const dmg=bullDmg()*(crit?2:1);
 G.rings.push({x:p.x,y:p.y,r:10,R:bullR(),t:0.35,col:'255,90,40'});burst(p.x,p.y,'#ff7a3d',16,320);sfx('boom');G.shake=Math.min(12,G.shake+3);
 for(const e of G.enemies){if(e.dead)continue;if(d2(p.x,p.y,e.x,e.y)<(bullR()+e.r)**2){const L=Math.hypot(e.x-p.x,e.y-p.y)||1;applyHit(e,dmg,crit,(e.x-p.x)/L,(e.y-p.y)/L,35);}}}

function updWeapons(dt){
 const p=G.p,n=G.weapons.length;
 G.weapons.forEach((w,i)=>{
  const d=WEAPONS[w.id];
  let a,rad;if(n<=6){a=i/n*TAU+0.45+(n===1?-0.45:0);rad=36;}else if(i<6){a=i/6*TAU+0.45;rad=34;}else{a=(i-6)/(n-6)*TAU+0.95;rad=58;}
  w.bx=p.x+Math.cos(a)*rad;w.by=p.y+Math.sin(a)*rad*0.85+6;
  const R=rangeOf(w);
  if(d.type==='melee'){
   if(w.att>0){
    w.att-=dt;const ph=clamp(1-w.att/w.attDur,0,1);const ext=ph<0.45?ph/0.45:1-(ph-0.45)/0.55;
    w.x=w.bx+w.dx*w.reach*ext;w.y=w.by+w.dy*w.reach*ext;
    if(ph<0.75)for(const e of G.enemies){if(e.dead||e.friend||w.hit.has(e))continue;const r2=(e.r+d.tip)**2;if(d2(w.x,w.y,e.x,e.y)<r2){w.hit.add(e);const c=Math.random()<critOf(w);applyHit(e,dmgOf(w)*(c?(d.critMul||2):1),c,w.dx,w.dy,d.knock);}}
    if(w.att<=0)w.att=0;
   }else{
    w.x+=(w.bx-w.x)*Math.min(1,dt*20);w.y+=(w.by-w.y)*Math.min(1,dt*20);w.cd-=dt;
    const t=nearest(w.bx,w.by,R);
    if(t){w.face=t.x<w.bx?-1:1;if(w.cd<=0){const dx=t.x-w.bx,dy=t.y-w.by,L=Math.hypot(dx,dy)||1;w.dx=dx/L;w.dy=dy/L;w.reach=Math.min(R,L+8);const cd=cdOf(w);w.attDur=Math.min(0.3,cd*0.75);w.att=w.attDur;w.hit=new Set();w.cd=cd;sfx('shoot');}}
   }
  }else{
   w.x=w.bx;w.y=w.by;w.cd-=dt;w.recoil=Math.max(0,w.recoil-dt*6);
   const t=nearest(w.bx,w.by,R);
   if(t){w.ang=Math.atan2(t.y-w.by,t.x-w.bx);w.face=Math.cos(w.ang)<0?-1:1;if(w.cd<=0){fire(w,t);w.cd=cdOf(w);w.recoil=1;}}
  }
 });
}
function fire(w,t){
 const d=WEAPONS[w.id],cnt=d.count?d.count[w.tier]:1,dmg=dmgOf(w),R=rangeOf(w);
 if(d.lob){const crit=Math.random()<critOf(w);const L=Math.hypot(t.x-w.bx,t.y-w.by);
  G.bullets.push({lob:true,sx:w.bx,sy:w.by,x:w.bx,y:w.by,tx:t.x+rnd(-10,10),ty:t.y+rnd(-10,10),lt:0,ld:Math.max(0.35,L/430),dmg:crit?dmg*2:dmg,crit,explode:d.explode?d.explode[w.tier]:0,cloud:d.cloud?d.cloud[w.tier]:0,col:d.color,r:d.r,wid:w.id});sfx('shoot');return;}
 for(let k=0;k<cnt;k++){
  let a=w.ang;if(cnt>1)a+=(k/(cnt-1)-0.5)*d.spread;else if(d.spread)a+=rnd(-d.spread,d.spread)/2;
  const crit=Math.random()<critOf(w),sp=d.speed*rnd(0.95,1.05);
  G.bullets.push({x:w.bx+Math.cos(a)*14,y:w.by+Math.sin(a)*14,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:(R+30)/sp,dmg:crit?dmg*2:dmg,crit,pierce:d.pierce?d.pierce[w.tier]:0,r:d.r,col:d.color,hit:new Set(),
   burn:d.burn?Math.max(1,(d.burn[w.tier]+G.stats.elem*0.5)*(1+dmgPct()/100)):0,explode:d.explode?d.explode[w.tier]:0,slow:d.slow?d.slow[w.tier]:0,bounce:d.bounce?d.bounce[w.tier]:0,boomer:!!d.boomer,ret:false,spin:0,wid:w.id});
 }
 sfx('shoot');
}
function simpleBullet(x,y,a,sp,dmg,col,r,R,wid){G.bullets.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:R/sp,dmg,crit:false,pierce:0,r,col,hit:new Set(),burn:0,explode:0,slow:0,bounce:0,boomer:false,wid:wid||'pet'});}
function updBullets(dt){
 const p=G.p;
 for(let i=G.bullets.length-1;i>=0;i--){const b=G.bullets[i];
  if(b.lob){b.lt+=dt;const f=Math.min(1,b.lt/b.ld);b.x=b.sx+(b.tx-b.sx)*f;b.y=b.sy+(b.ty-b.sy)*f;b.h=Math.sin(Math.PI*f)*70;
   if(f>=1){if(b.explode)explode(b.tx,b.ty,b.explode,b.dmg,b.crit);if(b.cloud){G.clouds.push({x:b.tx,y:b.ty,R:b.cloud,t:3,tick:0,dmg:b.dmg});burst(b.tx,b.ty,'#b98cff',10,150);}G.bullets.splice(i,1);}continue;}
  if(b.boomer){b.spin+=dt*18;if(b.ret){const dx=p.x-b.x,dy=p.y-b.y,L=Math.hypot(dx,dy)||1,sp=Math.max(520,Math.hypot(b.vx,b.vy));b.vx=dx/L*sp;b.vy=dy/L*sp;if(L<26){G.bullets.splice(i,1);continue;}}}
  b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;let gone=false;
  const out=b.x<-20||b.y<-20||b.x>ARENA+20||b.y>ARENA+20;
  if(b.life<=0||out){if(b.boomer&&!b.ret){b.ret=true;b.hit=new Set();b.life=3;}else gone=true;}
  if(!gone)for(const e of G.enemies){if(e.dead||e.friend||b.hit.has(e))continue;if(d2(b.x,b.y,e.x,e.y)<(e.r+b.r)**2){
   if(b.explode){explode(b.x,b.y,b.explode,b.dmg,b.crit);gone=true;break;}
   b.hit.add(e);const L=Math.hypot(b.vx,b.vy)||1;applyHit(e,b.dmg,b.crit,b.vx/L,b.vy/L,6);
   if(b.burn&&!e.dead){e.burn=3*(G.ch.burnX||1);e.burnD=Math.max(e.burnD,b.burn);}
   if(b.slow&&!e.dead){e.slowT=1.6;e.slowM=1-b.slow;}
   if(b.bounce>0){const nx=nearest(b.x,b.y,260,b.hit);if(nx){const sp=Math.hypot(b.vx,b.vy),a=Math.atan2(nx.y-b.y,nx.x-b.x);b.vx=Math.cos(a)*sp;b.vy=Math.sin(a)*sp;b.bounce--;b.life=0.8;b.dmg*=0.85;}else gone=true;break;}
   if(--b.pierce<0){gone=true;break;}}}
  if(gone)G.bullets.splice(i,1);}
}
function updClouds(dt){for(let i=G.clouds.length-1;i>=0;i--){const c=G.clouds[i];c.t-=dt;c.tick-=dt;if(c.tick<=0){c.tick=0.45;for(const e of G.enemies){if(!e.dead&&d2(c.x,c.y,e.x,e.y)<(c.R+e.r)**2)dmgEnemy(e,c.dmg*0.5,false,'#c7a3ff');}}if(c.t<=0)G.clouds.splice(i,1);}}

/* ---------- structures & item effects ---------- */
function updStructs(dt){
 const p=G.p;
 const mines=fxc('mines');if(mines){G.mineT-=dt;if(G.mineT<=0){G.mineT=7/mines;if(G.structs.filter(s=>s.kind==='mine').length<12+mines*3)addStruct('mine',rnd(60,ARENA-60),rnd(60,ARENA-60));}}
 const goog=fxc('googly');if(goog){G.googT-=dt;if(G.googT<=0){G.googT=2;const dmg=(4+G.stats.ranged*0.5+G.stats.elem*0.5)*(1+dmgPct()/100);for(let g=0;g<goog;g++){const off=Math.random()*TAU;for(let k=0;k<6;k++)simpleBullet(p.x,p.y-30,off+k/6*TAU,520,dmg,'#9be7ff',5,320,'tear');}}}
 for(let i=G.structs.length-1;i>=0;i--){const s=G.structs[i];s.cd-=dt;s.t+=dt;
  if(s.kind==='turret'){if(s.cd<=0){const e=nearest(s.x,s.y,400);if(e){s.cd=0.9;s.ang=Math.atan2(e.y-s.y,e.x-s.x);simpleBullet(s.x+Math.cos(s.ang)*16,s.y-6+Math.sin(s.ang)*16,s.ang,620,engDmg(4,1.5,0.4),'#7ed957',5,420,'pea');}else s.cd=0.15;}}
  else if(s.kind==='garden'){if(s.cd<=0){s.cd=8;dropFruit(s.x+rnd(-30,30),s.y+rnd(-30,30));}}
  else if(s.kind==='mine'){if(s.t>0.6){for(const e of G.enemies){if(!e.dead&&!e.d.tree&&!e.friend&&d2(s.x,s.y,e.x,e.y)<(e.r+14)**2){explode(s.x,s.y,75,engDmg(10,3,0.8),false,'200,40,90');G.structs.splice(i,1);break;}}}}
 }
}

/* ---------- pets ---------- */
function moveTo(q,x,y,sp,dt){const dx=x-q.x,dy=y-q.y,L=Math.hypot(dx,dy);if(L<1)return L;const s=Math.min(L,sp*dt);q.x+=dx/L*s;q.y+=dy/L*s;if(Math.abs(dx)>2)q.face=dx<0?-1:1;return L;}
function dasher(q,dt,hx,hy,o){
 if(q.st==='home'){moveTo(q,hx,hy,Math.max(140,Math.hypot(hx-q.x,hy-q.y)*4),dt);if(q.cd<=0){const e=nearest(o.fromP?G.p.x:q.x,o.fromP?G.p.y:q.y,o.range);if(e){q.st='dash';q.target=e;q.t=0;}else q.cd=0.2;}}
 else if(q.st==='dash'){const e=q.target;if(!e||e.dead){q.st='back';return;}const L=moveTo(q,e.x,e.y,o.speed,dt);
  if(L<e.r+14||q.t>0.9){if(L<e.r+22){const ux=(e.x-q.x)/(L||1),uy=(e.y-q.y)/(L||1);o.hit(e,ux,uy);}q.st='back';}}
 else{const L=moveTo(q,hx,hy,o.speed*0.75,dt);if(L<12){q.st='home';q.cd=o.cd;}}
}
function enemyTouch(q,x,y,rad,cd,fn){for(const e of G.enemies){if(e.dead||e.friend)continue;if(d2(x,y,e.x,e.y)<(e.r+rad)**2&&(e.pc[q.uid]||0)<=G.clock){e.pc[q.uid]=G.clock+cd;fn(e);}}}
function updPets(dt){
 const p=G.p,n=G.pets.length;
 G.pets.forEach((q,i)=>{
  q.cd-=dt;q.t+=dt;q.tongue=Math.max(0,q.tongue-dt);q.stomp=Math.max(0,q.stomp-dt);
  const ha=i/Math.max(1,n)*TAU+2.2+G.clock*0.15;const hx=p.x+Math.cos(ha)*72,hy=p.y+Math.sin(ha)*58;
  const follow=()=>moveTo(q,hx,hy,Math.max(140,Math.hypot(hx-q.x,hy-q.y)*4),dt);
  switch(q.id){
   case'catling':{follow();if(q.cd<=0){const e=nearest(q.x,q.y,340);if(e){q.cd=0.2;q.ang=Math.atan2(e.y-q.y,e.x-q.x);q.face=Math.cos(q.ang)<0?-1:1;simpleBullet(q.x,q.y,q.ang+rnd(-0.08,0.08),720,petDmg(2,0.4,0.25),'#ff9f1c',3.5,360);sfx('shoot');}else q.cd=0.1;}break;}
   case'bonk':dasher(q,dt,hx,hy,{range:330,fromP:true,speed:720,cd:1.4,hit:(e,ux,uy)=>{applyHit(e,petDmg(8,2,0.8),false,ux,uy,60);burst(e.x,e.y,'#fff',6,160);addText(q.x,q.y-24,'BONK!','#ffe14d',1.1);sfx('bark');}});break;
   case'bee':{const bx=hx+Math.sin(q.t*6)*22,by=hy+Math.cos(q.t*5)*16;dasher(q,dt,bx,by,{range:280,speed:620,cd:0.7,hit:(e,ux,uy)=>{applyHit(e,petDmg(2,0.5,0.3),false,ux,uy,4);if(!e.dead){e.burn=3;e.burnD=Math.max(e.burnD,petDmg(1,0.3,0.2));}}});break;}
   case'cater':{const e=nearest(p.x,p.y,420);if(e)moveTo(q,e.x,e.y,135,dt);else moveTo(q,hx,hy,170,dt);
    const tr=q.trail;if(!tr.length||d2(tr[0][0],tr[0][1],q.x,q.y)>16){tr.unshift([q.x,q.y]);}const segN=Math.min(12,4+Math.floor(G.stats.petPow/3));if(tr.length>segN*4+2)tr.length=segN*4+2;
    const dmg=petDmg(3,0.8,0.35);const hitF=e=>applyHit(e,dmg,false,0,0,0);
    enemyTouch(q,q.x,q.y,12,0.5,hitF);for(let k=1;k<=segN;k++){const s=tr[Math.min(tr.length-1,k*4)];if(s)enemyTouch(q,s[0],s[1],10,0.5,hitF);}break;}
   case'ratzilla':{const e=nearest(p.x,p.y,380);if(e){const L=moveTo(q,e.x,e.y,135,dt);if(q.cd<=0&&L<e.r+70){q.cd=2;q.stomp=0.3;const R=100,dmg=petDmg(12,2.5,1);G.rings.push({x:q.x,y:q.y,r:10,R,t:0.35,col:'150,110,80'});G.shake=Math.min(12,G.shake+3);sfx('boom');addText(q.x,q.y-20,'STOMP!','#ffd23f',1);
     for(const o of G.enemies){if(!o.dead&&d2(q.x,q.y,o.x,o.y)<(R+o.r)**2){const LL=Math.hypot(o.x-q.x,o.y-q.y)||1;applyHit(o,dmg,false,(o.x-q.x)/LL,(o.y-q.y)/LL,35);}}}}else follow();break;}
   case'owl':{let bt=null,bd=Infinity;for(const d of G.drops){if(d.kind!=='coin')continue;const dd=d2(d.x,d.y,q.x,q.y);if(dd<bd&&d2(d.x,d.y,p.x,p.y)<620*620){bd=dd;bt=d}}
    if(bt)moveTo(q,bt.x,bt.y,430,dt);else follow();
    for(let k=G.drops.length-1;k>=0;k--){const d=G.drops[k];if(d.kind==='coin'&&d.t>0.2&&d2(d.x,d.y,q.x,q.y)<22*22){collectDrop(d);G.drops.splice(k,1);}}break;}
   case'hog':{q.ang+=dt*2.6;q.x=p.x+Math.cos(q.ang)*64;q.y=p.y+Math.sin(q.ang)*56;q.face=Math.sin(q.ang)>0?-1:1;
    enemyTouch(q,q.x,q.y,14,0.45,e=>{const L=Math.hypot(e.x-p.x,e.y-p.y)||1;applyHit(e,petDmg(6,1.2,0.5),false,(e.x-p.x)/L,(e.y-p.y)/L,25);});break;}
   case'frog':{follow();if(q.cd<=0){let bt=null;for(const e of G.enemies){if(e.dead||e.d.tree||e.friend||d2(q.x,q.y,e.x,e.y)>400*400)continue;if(!bt||e.hp>bt.hp)bt=e;}
    if(bt){q.cd=2.4;q.tongue=0.25;q.tx=bt.x;q.ty=bt.y;q.face=bt.x<q.x?-1:1;const L=Math.hypot(bt.x-q.x,bt.y-q.y)||1;applyHit(bt,petDmg(25,4,2),false,(bt.x-q.x)/L,(bt.y-q.y)/L,10);}else q.cd=0.3;}break;}
  }
  q.x=clamp(q.x,10,ARENA-10);q.y=clamp(q.y,10,ARENA-10);
 });
}

function hurtPlayer(amt){
 const p=G.p,s=G.stats;if(p.inv>0||G.state!=='play')return;
 if(Math.random()*100<Math.min(G.ch.dodgeCap||60,s.dodge)){addText(p.x,p.y-34,'Dodge!','#8fe3ff',1.1);p.inv=0.25;sfx('dodge');G.tr.dodges++;return;}
 if(G.ch.id==='bull'&&G.bullCD<=0){G.bullCD=0.25;bullBlast();}
 if(G.ch.maso)G.maso+=3;
 if(fxc('kraken')&&Math.random()<0.3){krakenBoom(90,10+maxHp()*0.3);}
 const a=s.armor,mult=a>=0?1/(1+a/15):1+(-a)/15;const dmg=Math.max(1,Math.round(amt*mult));
 p.hp-=dmg;G.tr.hurt+=dmg;p.inv=0.45;p.hitT=0.25;G.shake=Math.min(12,G.shake+5);addText(p.x,p.y-34,'-'+dmg,'#ff4d5e',1.25);sfx('hurt');
 if(p.hp>0&&fxc('bell')&&!G.bellUsed&&p.hp<maxHp()*0.4){G.bellUsed=true;krakenBoom(170,25+maxHp()*0.6);heal(5);addText(p.x,p.y-60,'🔔 DONG!','#ffd23f',1.4);}
 if(p.hp<=0){p.hp=0;gameOver();}
}
function krakenBoom(R,dmg){const p=G.p;dmg*=(1+dmgPct()/100);G.rings.push({x:p.x,y:p.y,r:10,R,t:0.35,col:'130,80,200'});burst(p.x,p.y,'#9b6bff',14,300);sfx('boom');for(const e of G.enemies){if(!e.dead&&!e.friend&&d2(p.x,p.y,e.x,e.y)<(R+e.r)**2){const L=Math.hypot(e.x-p.x,e.y-p.y)||1;applyHit(e,dmg,false,(e.x-p.x)/L,(e.y-p.y)/L,30);}}}
function updEnemies(dt){
 const p=G.p;
 for(const e of G.enemies){
  if(e.dead)continue;
  e.flash=Math.max(0,e.flash-dt);e.spawnIn=Math.max(0,e.spawnIn-dt);
  if(e.d.tree){e.wob+=dt*2;continue;}
  if(e.charmT>0){e.wob+=dt*8;e.charmT-=dt;if(e.charmT<=0){e.friend=false;e.charmT=0;}else{let tg=null,bd=1e9;for(const o of G.enemies){if(o===e||o.dead||o.friend||o.d.tree)continue;const dd=d2(e.x,e.y,o.x,o.y);if(dd<bd){bd=dd;tg=o;}}
   if(tg){const dx=tg.x-e.x,dy=tg.y-e.y,L=Math.hypot(dx,dy)||1;e.x+=dx/L*e.spd*1.3*dt;e.y+=dy/L*e.spd*1.3*dt;if(L<e.r+tg.r+4&&(e.cht||0)<=G.clock){e.cht=G.clock+0.5;const f=e.friend;e.friend=false;tg.friend=false;dmgEnemy(tg,Math.max(3,e.dmg*3),false,'#ff6fb5');e.friend=f;}}e.x=clamp(e.x,e.r,ARENA-e.r);e.y=clamp(e.y,e.r,ARENA-e.r);continue;}}
  if(e.friend){e.wob+=dt*8;e.fa=(e.fa??Math.random()*TAU)+dt*0.35;const fr=e.fr||(e.fr=rnd(60,130));const tx=p.x+Math.cos(e.fa)*fr,ty=p.y+Math.sin(e.fa)*fr*0.8,dx=tx-e.x,dy=ty-e.y,L=Math.hypot(dx,dy);
   if(L>4){const sp=Math.min(L*3,e.spd*1.5+(L>300?250:0));e.x+=dx/L*sp*dt;e.y+=dy/L*sp*dt;}e.x=clamp(e.x,e.r,ARENA-e.r);e.y=clamp(e.y,e.r,ARENA-e.r);continue;}
  e.wob+=dt*8;e.slowT-=dt;const sm=e.slowT>0?e.slowM:1;
  const dx=p.x-e.x,dy=p.y-e.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;let mx=0,my=0;
  const ai=e.d.ai;
  if(ai==='chase'){mx=ux*e.spd;my=uy*e.spd;}
  else if(ai==='hop'){e.hopT=(e.hopT||Math.random())+dt;const ph=e.hopT%0.95;if(ph<0.38){mx=ux*e.spd*2.6;my=uy*e.spd*2.6;}}
  else if(ai==='shoot'){if(L>320){mx=ux*e.spd;my=uy*e.spd}else if(L<230){mx=-ux*e.spd;my=-uy*e.spd}else{mx=-uy*e.spd*0.5;my=ux*e.spd*0.5}
   e.t-=dt;if(e.t<=0&&L<520){e.t=rnd(2.2,3);const a=Math.atan2(dy,dx);if(e.elite){for(const o of[-0.3,-0.15,0,0.15,0.3])fireE(e.x,e.y,a+o,240,e.dmg,e.d.bcol);}else fireE(e.x,e.y,a,230,e.dmg,e.d.bcol);}}
  else{
   const dashSp=(ai==='charge'?560:ai==='boss1'?650:600)*(G.ch.oldSlow||1);
   if(e.st==='walk'){mx=ux*e.spd;my=uy*e.spd;e.t-=dt;if(e.t<=0&&L<520){e.st='wind';e.t=ai==='charge'?0.6:0.75;}}
   else if(e.st==='wind'){e.t-=dt;if(e.t<=0){e.st='dash';e.t=ai==='charge'?0.5:0.65;e.vx=ux*dashSp;e.vy=uy*dashSp;}}
   else{mx=e.vx;my=e.vy;e.t-=dt;if(e.t<=0){e.st='walk';e.t=ai==='charge'?rnd(2,3.2):ai==='boss1'?rnd(3,4):rnd(4.5,6);}}
   if(ai==='boss1'){e.t2-=dt;if(e.t2<=0){e.t2=2.6;ring(e,10,200,Math.random());}if(e.d.summon){e.t3-=dt;if(e.t3<=0){e.t3=7;for(let i=0;i<3;i++){const a=i/3*TAU+Math.random();G.marks.push({x:clamp(e.x+Math.cos(a)*100,40,ARENA-40),y:clamp(e.y+Math.sin(a)*100,40,ARENA-40),t:0.8,type:e.d.summon});}}}}
   if(ai==='boss2'){
    e.t2-=dt;if(e.t2<=0){e.t2=2.4;ring(e,16,190,Math.random());}
    e.t3-=dt;if(e.t3<=0){e.t3=6;for(let i=0;i<5;i++){const a=i/5*TAU;G.marks.push({x:clamp(e.x+Math.cos(a)*110,40,ARENA-40),y:clamp(e.y+Math.sin(a)*110,40,ARENA-40),t:0.8,type:e.d.summon||'froglet'});}}
    if(e.hp<e.maxHp*0.5){e.t4-=dt;if(e.t4<=0){e.t4=0.9;const a=Math.atan2(dy,dx);for(const o of[-0.25,0,0.25])fireE(e.x,e.y,a+o,260,Math.max(1,Math.round(e.dmg*0.6)),e.d.bcol);}}
   }
  }
  e.x+=(mx*sm+e.kx)*dt;e.y+=(my*sm+e.ky)*dt;const kd=Math.exp(-dt*8);e.kx*=kd;e.ky*=kd;
  e.x=clamp(e.x,e.r*0.6,ARENA-e.r*0.6);e.y=clamp(e.y,e.r*0.6,ARENA-e.r*0.6);
  if(e.burn>0){e.burn-=dt;e.burnTick-=dt;if(e.burnTick<=0){e.burnTick=0.5;dmgEnemy(e,e.burnD,false,'#ff8a3d');if(Math.random()<0.6)burst(e.x,e.y-e.r*0.5,'#ff7a1f',2,60);}if(e.burn<=0)e.burnD=0;}
  if(!e.dead&&e.spawnIn<=0&&d2(e.x,e.y,p.x,p.y)<(e.r+p.r-5)**2)hurtPlayer(e.dmg);
 }
 const E=G.enemies;
 for(let i=0;i<E.length;i++){const a=E[i];if(a.dead)continue;for(let j=i+1;j<E.length;j++){const b=E[j];if(b.dead)continue;const rr2=a.r+b.r,dx=b.x-a.x,dy=b.y-a.y;if(Math.abs(dx)>rr2||Math.abs(dy)>rr2)continue;const dd=dx*dx+dy*dy;if(dd<rr2*rr2&&dd>0.01){const L=Math.sqrt(dd),o=(rr2-L)*0.5,nx=dx/L,ny=dy/L;
  let wa=a.d.boss?0.1:b.d.boss?1.9:1;if(a.d.tree)wa=0;else if(b.d.tree)wa=2;if(a.d.tree&&b.d.tree)continue;const wb=2-wa;a.x-=nx*o*wa*0.5;a.y-=ny*o*wa*0.5;b.x+=nx*o*wb*0.5;b.y+=ny*o*wb*0.5;}}}
 G.enemies=E.filter(e=>!e.dead);
}
function updEbul(dt){const p=G.p;for(let i=G.ebul.length-1;i>=0;i--){const b=G.ebul[i];if(!b)continue;b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.life<=0||b.x<-30||b.y<-30||b.x>ARENA+30||b.y>ARENA+30){G.ebul.splice(i,1);continue;}if(d2(b.x,b.y,p.x,p.y)<(b.r+p.r-4)**2){hurtPlayer(b.dmg);const j=G.ebul.indexOf(b);if(j>=0)G.ebul.splice(j,1);}}}
function collectDrop(d){if(d.kind==='coin'){const v=d.v*(G.ch.bucc?2:1);G.coins+=v;addXp(v);sfx('coin');if(G.ch.bucc&&G.weapons.length&&(G.buccT||0)<=G.clock){G.buccT=G.clock+0.12;pick(G.weapons).cd=0;}}
 else if(d.kind==='fruit'&&d.poison){G.tr.fruit++;hurtPlayer(2);addText(G.p.x,G.p.y-48,'🤢 Poison!','#a6e36a',1);}else if(d.kind==='crate'){G.crates++;G.tr.crates++;sfx('crate');addText(G.p.x,G.p.y-44,'📦 Crate!','#ffd23f',1.2);const bg=fxc('bag');if(bg){G.coins+=8*bg;addText(G.p.x,G.p.y-62,'+🪙'+8*bg,'#ffd23f',1);}}else{heal(d.v);G.tr.fruit++;sfx('fruit');if(G.ch.druid){G.druidBonus=(G.druidBonus||0)+1;}}}
function updDrops(dt,all){
 const p=G.p,pr=80*(1+G.stats.pickup/100);
 for(let i=G.drops.length-1;i>=0;i--){const d=G.drops[i];d.t+=dt;const dd=Math.sqrt(d2(d.x,d.y,p.x,p.y));
  if((all||dd<pr)&&d.t>0.25){const sp=all?900:520;d.vx=(p.x-d.x)/dd*sp;d.vy=(p.y-d.y)/dd*sp;}else{const k=Math.exp(-dt*5);d.vx*=k;d.vy*=k;}
  d.x+=d.vx*dt;d.y+=d.vy*dt;d.x=clamp(d.x,8,ARENA-8);d.y=clamp(d.y,8,ARENA-8);
  if(dd<p.r+10&&d.t>0.15){collectDrop(d);G.drops.splice(i,1);}}
}
function updFx(dt){
 for(let i=G.parts.length-1;i>=0;i--){const q=G.parts[i];q.t-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=0.92;q.vy*=0.92;if(q.t<=0)G.parts.splice(i,1);}
 for(let i=G.texts.length-1;i>=0;i--){const q=G.texts[i];q.t-=dt;q.y-=40*dt;if(q.t<=0)G.texts.splice(i,1);}
 for(let i=G.rings.length-1;i>=0;i--){const q=G.rings[i];q.t-=dt;q.r+=(q.R-q.r)*Math.min(1,dt*18);if(q.t<=0)G.rings.splice(i,1);}
 if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null;}
 G.shake*=Math.exp(-dt*10);
}
function update(dt){
 const p=G.p;G.waveTime+=dt*1.3;G.clock+=dt;G.lsT-=dt;G.bullCD-=dt;
 if(G.wave!==20&&G.waveTime>=G.waveDur&&!bossAlive()){beginClear();return;}
 const[ix,iy]=inputVec();const sp=260*Math.max(0.3,1+G.stats.speed/100);
 p.x=clamp(p.x+ix*sp*dt,p.r,ARENA-p.r);p.y=clamp(p.y+iy*sp*dt,p.r,ARENA-p.r);
 p.moving=Math.abs(ix)+Math.abs(iy)>0.05;if(Math.abs(ix)>0.1)p.face=ix>0?1:-1;p.bob+=dt*(p.moving?13:3);
 p.inv-=dt;p.hitT-=dt;
 if(G.ch.hiker&&p.moving){G.walk=(G.walk||0)+sp*dt*Math.hypot(ix,iy);G.walkHp=(G.walkHp||0)+sp*dt*Math.hypot(ix,iy);while(G.walk>=350){G.walk-=350;G.coins++;addXp(1);}while(G.walkHp>=4500){G.walkHp-=4500;G.stats.maxHp+=1;addText(p.x,p.y-50,'🥾 +1 Max HP','#9cff5a',1);}}
 if(fxc('lantern')){G.lanT=(G.lanT??4)-dt;if(G.lanT<=0){G.lanT=4;G.rings.push({x:p.x,y:p.y,r:10,R:150,t:0.3,col:'255,200,90'});for(const e of G.enemies){if(e.dead||e.friend||e.d.tree)continue;const dx=e.x-p.x,dy=e.y-p.y,L=Math.hypot(dx,dy)||1;if(L<150+e.r){const k=(e.d.heavy?0.3:1)*600;e.kx+=dx/L*k;e.ky+=dy/L*k;}}}}
 if(!G.ch.druid&&G.stats.regen>0){G.regenAcc+=dt*G.stats.regen*0.11*(G.ch.golem&&!p.moving?2:1);while(G.regenAcc>=1){G.regenAcc-=1;if(p.hp<maxHp())p.hp++;}}
 if(G.ch.sick){G.sickT=(G.sickT??1.5)-dt;if(G.sickT<=0){G.sickT=1.5;if(p.hp>1){p.hp--;addText(p.x,p.y-30,'-1','#b0e57c',0.9);}}}
 if(G.ch.id==='bull'){G.bullT-=dt;if(G.bullT<=0){const t=nearest(p.x,p.y,bullR()-10);if(t&&!t.d.tree||t&&t.d.tree&&Math.hypot(t.x-p.x,t.y-p.y)<bullR()){bullBlast();G.bullT=2.2/Math.max(0.3,1+G.stats.atkSpd/100);}else G.bullT=0.15;}}
 if(!G.winT)updSpawns(dt);
 updWeapons(dt);updPets(dt);updStructs(dt);updBullets(dt);updClouds(dt);updEnemies(dt);updEbul(dt);updDrops(dt,!!G.winT);updFx(dt);
 G.achT-=dt;if(G.achT<=0){G.achT=1;checkAch();}
 if(G.winT){G.winT-=dt;if(G.winT<=0){recordWin();if(G.endless){toast('♾️ Endless mode: keep going!');beginClear();}else win();}}
}
function bossAlive(){return G.enemies.some(e=>e.d.boss&&!e.dead)||G.marks.some(m=>EN[m.type].boss);}
function beginClear(){
 G.state='clear';G.clearT=1.3;
 const alive=G.enemies.filter(e=>!e.dead&&!e.d.tree&&!e.friend).length;G.lastPeace=0;
 if(G.ch.pacifist&&alive>0){G.coins+=alive;addXp(alive);G.lastPeace=alive;}
 if(G.wave>=3&&G.tr.waveKills<=3)grant('peace');
 for(const e of G.enemies)burst(e.x,e.y,e.d.col,5);G.enemies=[];G.ebul=[];G.marks=[];G.bullets=[];G.clouds=[];G.boss=null;
 G.banner={t:1.3,txt:'Wave complete!',sub:G.lastPeace?`☮️ +🪙${G.lastPeace} for peace`:''};G.lastGot=0;}
function updClear(dt){G.clearT-=dt;G.clock+=dt;const c0=G.coins;updDrops(dt,true);G.lastGot+=Math.max(0,G.coins-c0);updFx(dt);G.p.bob+=dt*3;
 for(const q of G.pets){if(q.id==='hog'){q.ang+=dt*2.6;q.x=G.p.x+Math.cos(q.ang)*64;q.y=G.p.y+Math.sin(q.ang)*56;}else moveTo(q,G.p.x+rnd(-1,1),G.p.y+40,200,dt);}
 if(G.clearT<=0)endWave();}
function endWave(){
 let got=G.bank;G.bank=0;for(const d of G.drops){if(d.kind==='coin')got+=d.v;else if(d.kind==='crate'){G.crates++;G.tr.crates++;}}G.drops=[];
 const harv=Math.max(0,Math.round(G.stats.harvest));G.coins+=got+harv;addXp(got+harv);
 if(G.ch.captain){const free=Math.max(0,slotsMax()-G.weapons.length);if(free)addXp(free*(4+G.wave*2));}
 if(G.ch.curious){G.crates++;G.tr.crates++;}
 if(G.ch.harvGrow&&G.stats.harvest>0)G.stats.harvest*=1+G.ch.harvGrow;
 G.lastGot+=got;G.lastHarv=harv;saveBest(G.wave);SAVE.kills+=G.tr.waveKills;G.tr.waveKills=0;persist();checkAch();

}

/* ---------- shop / level logic ---------- */
function rollTier(){const w=G.wave,L=Math.max(0.2,1+G.stats.luck/100),r=Math.random();
 const p3=clamp((w-8)*0.012,0,0.1)*L,p2=clamp((w-3)*0.035,0,0.3)*L,p1=clamp(w*0.06,0,0.55)*L;
 if(r<p3)return 3;if(r<p3+p2)return 2;if(r<p3+p2+p1)return 1;return 0;}
const PSCALE=()=>(1+(G.wave-1)*0.1)*Math.max(0.6,1-0.08*fxc('coupon'))*(G.ch.priceMul||1);
const priceW=(id,t)=>Math.max(1,Math.round(WEAPONS[id].price*[1,1.9,3.4,6][t]*PSCALE()*(G.ch.weaponDisc||1)));
const priceI=it=>Math.round(it.p*PSCALE()*(G.ch.itemMul||1));
const priceP=id=>Math.round(PETS[id].p*PSCALE()*(G.ch.petDisc||1));
function itemOfTier(t){let tt=t,pool=ITEMS.filter(i=>i.t===tt);while(!pool.length&&tt>0){tt--;pool=ITEMS.filter(i=>i.t===tt);}return pick(pool);}
function genOffer(){const t=rollTier(),r=Math.random(),sl=slotsMax();
 const pPet=G.pets.length<petMax()?(G.ch.id==='tamer'?0.3:sl===0?0.12:0.06):0;
 const pW=sl===0?0:(G.weapons.length<sl?0.4:0.28);
 if(r<pPet){let tt=t,pool=Object.keys(PETS).filter(k=>PETS[k].t===tt);while(!pool.length&&tt>0){tt--;pool=Object.keys(PETS).filter(k=>PETS[k].t===tt);}const id=pick(pool);return{kind:'p',id,tier:PETS[id].t,price:priceP(id),locked:false};}
 if(r<pPet+pW){const id=pick(Object.keys(WEAPONS).filter(k=>!(G.ch.noRanged&&WEAPONS[k].type==='ranged')));return{kind:'w',id,tier:t,price:priceW(id,t),locked:false};}
 const it=itemOfTier(t);return{kind:'i',id:it.id,tier:it.t,price:priceI(it),locked:false};}
function genShop(){const old=G.shop.offers||[];G.shop.offers=[0,1,2,3].map(i=>(old[i]&&old[i].locked)?old[i]:genOffer());}
function genCrateItem(){let t=rollTier();if(Math.random()<0.3)t=Math.min(3,t+1);return itemOfTier(t).id;}
const rerollCost=()=>Math.max(1,Math.floor(G.wave*0.6))+G.shop.rerolls*Math.max(1,Math.floor(G.wave*0.4));
const lvRerollCost=()=>2+G.wave+G.lvRerolls*2;
function canHoldW(id,t){const sl=slotsMax();if(sl===0)return false;if(G.ch.noRanged&&WEAPONS[id].type==='ranged')return false;return G.weapons.length<sl||(t<3&&G.weapons.some(w=>w.id===id&&w.tier===t));}
function applyMods(m,s){for(const k in m)G.stats[k]+=m[k]*(s||1);}
function genLvOpts(){let keys=Object.keys(LVSTATS);if(slotsMax()===0)keys=keys.filter(k=>k!=='ranged'&&k!=='elem');const o=[];const used=new Set();while(o.length<4){const k=pick(keys);if(used.has(k))continue;used.add(k);const t=Math.min(3,rollTier()+(G.ch.captain?1:0));o.push({k,t,v:LVSTATS[k][t]});}G.lvOpts=o;}

function wDesc(id,t){const d=WEAPONS[id];let s=`${d.dmg[t]} dmg · ${d.cd[t]}s · ${d.range} range`;if(d.count)s+=` · ${d.count[t]} shots`;if(d.burn)s+=` · burn ${d.burn[t]}`;if(d.slow)s+=` · slow ${Math.round(d.slow[t]*100)}%`;if(d.bounce)s+=` · ${d.bounce[t]} bounces`;if(d.explode)s+=` · blast`;if(d.cloud)s+=` · cloud`;if(d.pierce&&d.pierce[t]&&!d.boomer)s+=` · pierce ${d.pierce[t]}`;return `${s}<br><i>${d.desc}</i> <small>(${scaleTxt(d)})</small>`;}

S.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;initAudio();const a=el.dataset.act,i=+el.dataset.i;

 if(a==='food'){menuFood=el.dataset.id;renderMenu();return;}
 if(a==='danger'){if(i<=SAVE.maxD){menuDanger=i;renderMenu();}return;}
 if(a==='endless'){menuEndless=!menuEndless;renderMenu();return;}

 if(a==='start'){newGame(menuCh,el.dataset.id);return;}

 if(a==='menu'){G=null;renderMenu();return;}
 if(a==='resume'){resume();return;}
 if(a==='mute'){muted=!muted;renderPause();return;}
 if(a==='quit'){G=null;renderMenu();return;}
 if(a==='ctake'){applyItem(G.crateItem);G.crates--;sfx('buy');nextBetween();return;}
 if(a==='crec'){G.coins+=Math.max(1,Math.round(priceI(ITEM[G.crateItem])*0.5));G.crates--;sfx('coin');nextBetween();return;}
 if(a==='lvpick'){const o=G.lvOpts[i];G.stats[o.k]+=o.v;G.pendingLv--;sfx('buy');nextBetween();return;}
 if(a==='lvreroll'){const c=lvRerollCost();if(G.coins>=c){G.coins-=c;G.lvRerolls++;genLvOpts();renderLevel();}return;}
 if(a==='steal'){const x=G.shop.offers[i];if(!x)return;G.coins+=x.price;G.stolen=(G.stolen||0)+1;}
 if(a==='buy'||a==='steal'){const x=G.shop.offers[i];if(!x||G.coins<x.price)return;
  if(x.kind==='w'){if(!canHoldW(x.id,x.tier))return;if(G.weapons.length<slotsMax())G.weapons.push(mkW(x.id,x.tier));else{G.weapons.find(w=>w.id===x.id&&w.tier===x.tier).tier++;}}
  else if(x.kind==='p'){if(G.pets.length>=petMax())return;addPet(x.id);sfx('meow');}
  else if(x.id==='mirror'){G.mirror=(G.mirror||0)+1;toast('🪞 Your next item will be copied!');}
  else{applyItem(x.id);if(G.mirror>0&&x.id!=='mirror'){G.mirror--;applyItem(x.id);toast('🪞 Copied!');}}
  G.coins-=x.price;G.shop.offers[i]=null;sfx('buy');checkAch();renderShop();return;}
 if(a==='lock'){const x=G.shop.offers[i];if(x){x.locked=!x.locked;renderShop();}return;}
 if(a==='reroll'){const c=rerollCost();if(G.coins<c)return;G.coins-=c;G.shop.rerolls++;genShop();sfx('coin');renderShop();return;}
 if(a==='stats'){G.showStats=!G.showStats;renderShop();return;}
 if(a==='wsel'){G.sel=G.sel===i?-1:i;G.psel=-1;renderShop();return;}
 if(a==='psel'){G.psel=G.psel===i?-1:i;G.sel=-1;renderShop();return;}
 if(a==='psell'){const q=G.pets[G.psel];if(!q)return;G.coins+=Math.round(priceP(q.id)*0.35);if(q.id==='owl')applyMods({harvest:-5});G.pets.splice(G.psel,1);G.psel=-1;sfx('coin');renderShop();return;}
 if((a==='combine'||a==='sell')&&fxc('knot')){toast("🪢 Knot: weapons can't be combined or sold");return;}
 if(a==='combine'){const w=G.weapons[G.sel];const j=G.weapons.findIndex((x,k)=>k!==G.sel&&x.id===w.id&&x.tier===w.tier);if(j>=0&&w.tier<3){w.tier++;G.weapons.splice(j,1);G.sel=G.weapons.indexOf(w);sfx('level');checkAch();renderShop();}return;}
 if(a==='sell'){if(G.weapons.length<=1)return;const w=G.weapons[G.sel];G.coins+=Math.max(1,Math.round(priceW(w.id,w.tier)*0.35));G.weapons.splice(G.sel,1);G.sel=-1;sfx('coin');renderShop();return;}
 if(a==='go'){startWave(G.wave+1);return;}
});

   const rx=d.type==='ranged'?-Math.cos(w.ang)*w.recoil*6:0,ry=d.type==='ranged'?-Math.sin(w.ang)*w.recoil*6:0;
   ctx.save();ctx.translate(w.x+rx,w.y+ry);ctx.scale(w.face,1);
   if(w.tier){ctx.fillStyle=TIERC[w.tier];ctx.globalAlpha=0.35;ctx.beginPath();ctx.arc(0,0,15,0,TAU);ctx.fill();ctx.globalAlpha=1;}
   drawEmo(ctx,d.icon,0,0,d.type==='melee'?26:22,64);ctx.restore();}
 }
 for(const b of G.bullets){
  if(b.lob){ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(b.x,b.y,b.r,b.r*0.4,0,0,TAU);ctx.fill();drawEmo(ctx,WEAPONS[b.wid].icon,b.x,b.y-b.h,16,48);continue;}
  if(b.boomer){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.spin);drawEmo(ctx,'🥨',0,0,22,48);ctx.restore();continue;}
  if(b.wid==='chili'){ctx.fillStyle='rgba(255,140,30,.35)';ctx.beginPath();ctx.arc(b.x,b.y,b.r*1.8,0,TAU);ctx.fill();}
  if(b.wid==='icecream'){ctx.fillStyle='rgba(180,230,255,.4)';ctx.beginPath();ctx.arc(b.x,b.y,b.r*1.7,0,TAU);ctx.fill();}
  ctx.fillStyle=b.col;ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1.5;
  if(b.wid==='salt'){ctx.fillRect(b.x-b.r,b.y-b.r,b.r*2,b.r*2);}else{ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fill();ctx.stroke();}
 }
 for(const b of G.ebul){ctx.fillStyle='#141414';ctx.beginPath();ctx.arc(b.x,b.y,b.r+2,0,TAU);ctx.fill();ctx.fillStyle=b.col;ctx.beginPath();ctx.arc(b.x,b.y,b.r-0.5,0,TAU);ctx.fill();}
 for(const r of G.rings){ctx.globalAlpha=Math.max(0,r.t/0.3);ctx.fillStyle=`rgba(${r.col},.35)`;ctx.strokeStyle=`rgb(${r.col})`;ctx.lineWidth=4;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,TAU);ctx.fill();ctx.stroke();}
 ctx.globalAlpha=1;
 for(const q of G.parts){ctx.globalAlpha=Math.min(1,q.t*3);ctx.fillStyle=q.col;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,TAU);ctx.fill();}
 ctx.globalAlpha=1;ctx.textAlign='center';ctx.textBaseline='middle';
 for(const q of G.texts){ctx.globalAlpha=Math.min(1,q.t*3);ctx.font=`700 ${Math.round(16*q.sc)}px Fredoka,sans-serif`;ctx.lineWidth=4;ctx.strokeStyle='rgba(40,20,5,.85)';ctx.strokeText(q.txt,q.x,q.y);ctx.fillStyle=q.col;ctx.fillText(q.txt,q.x,q.y);}
 ctx.globalAlpha=1;
 drawHud(t);
 drawPrev(t);
}
function bar(x,y,w,h,f,bg,fg,txt){ctx.fillStyle='#3a2614';rr(ctx,x-3,y-3,w+6,h+6,(h+6)/2);ctx.fill();ctx.fillStyle=bg;rr(ctx,x,y,w,h,h/2);ctx.fill();if(f>0){ctx.fillStyle=fg;rr(ctx,x,y,Math.max(h,w*clamp(f,0,1)),h,h/2);ctx.fill();}if(txt){ctx.fillStyle='#fff';ctx.font=`700 ${Math.round(h*0.72)}px Fredoka,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.5)';ctx.strokeText(txt,x+w/2,y+h/2+1);ctx.fillText(txt,x+w/2,y+h/2+1);}}
function drawHud(t){
 ctx.setTransform(DPR,0,0,DPR,0,0);const p=G.p;
 const bw=Math.min(230,VW*0.42);
 bar(14,14,bw,22,p.hp/maxHp(),'#5a1d1d','#ff4d5e',`${Math.max(0,Math.ceil(p.hp))} / ${maxHp()}`);
 bar(14,44,bw,13,G.xp/xpNeed(),'#203a14','#7cd94a','LV '+G.level);
 ctx.font='700 20px Fredoka,sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';ctx.lineWidth=4;ctx.strokeStyle='rgba(30,15,5,.8)';
 const ct='🪙 '+G.coins+(G.crates?'  📦'+G.crates:'');ctx.strokeText(ct,14,78);ctx.fillStyle='#ffd23f';ctx.fillText(ct,14,78);
 ctx.textAlign='right';const rx=VW-66;
 ctx.font='700 15px Fredoka,sans-serif';const wt=`WAVE ${G.wave}${G.danger!==1?' · D'+G.danger:''}`;ctx.strokeText(wt,rx,22);ctx.fillStyle='#fff';ctx.fillText(wt,rx,22);
 const left=(G.wave===20||(G.waveTime>=G.waveDur&&bossAlive()))?'BOSS':String(Math.max(0,Math.ceil(G.waveDur-G.waveTime)));
 ctx.font='700 30px Fredoka,sans-serif';ctx.strokeText(left,rx,50);ctx.fillStyle=(G.wave!==20&&G.waveDur-G.waveTime<5)?'#ff6b6b':'#fff';ctx.fillText(left,rx,50);
 if(G.boss&&!G.boss.dead){const w=Math.min(420,VW-40);bar((VW-w)/2,VH-44,w,18,G.boss.hp/G.boss.maxHp,'#3a1020','#d63384',G.boss.d.name);}
 if(G.banner){const b=G.banner;const a=Math.min(1,b.t*2);ctx.globalAlpha=a;ctx.textAlign='center';ctx.font=`700 ${Math.round(Math.min(46,VW/9))}px Fredoka,sans-serif`;ctx.lineWidth=7;ctx.strokeStyle='#3a2614';ctx.strokeText(b.txt,VW/2,VH*0.3);ctx.fillStyle='#c9f27a';ctx.fillText(b.txt,VW/2,VH*0.3);
  if(b.sub){ctx.font=`700 ${Math.min(20,Math.round(VW/(b.sub.length*0.62)))}px Fredoka,sans-serif`;ctx.lineWidth=5;ctx.strokeText(b.sub,VW/2,VH*0.3+42);ctx.fillStyle='#ffd1d1';ctx.fillText(b.sub,VW/2,VH*0.3+42);}ctx.globalAlpha=1;}
 if(joy&&G.state==='play'){ctx.globalAlpha=0.35;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(joy.bx,joy.by,60,0,TAU);ctx.fill();ctx.globalAlpha=0.6;ctx.beginPath();ctx.arc(joy.x,joy.y,26,0,TAU);ctx.fill();ctx.globalAlpha=1;}
}
function drawPrev(t){const c=document.getElementById('avoPrev');if(!c)return;const x=c.getContext('2d');x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,c.width,c.height);const dead=G&&G.state==='dead';drawHero(x,80,82,36,{face:1,bob:t*4,t,hurt:dead,moving:!dead,ch:G?G.ch:CHAR[menuCh],food:G?G.food:menuFood,items:G?G.items:[]});}

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){let dt=Math.min(0.05,(now-last)/1000);last=now;
 try{if(G){if(G.state==='play')update(dt);else if(G.state==='clear')updClear(dt);else if(G.state==='dead')updFx(dt);}draw(now/1000);}catch(err){console.error(err);}
 requestAnimationFrame(loop);}
renderMenu();requestAnimationFrame(loop);
</script>
</body>
</html>
