<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whisker Dash</title><style>[hidden]{display:none!important}</style></head><body>
<title>Whisker Dash</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: one-screen arcade cabinet; HUD row, pixel canvas with overlay screens, touch pad underneath */
:root{
  --night:#1b1530; --roof:#3a2a4d; --glow:#ff9e3d; --fish:#6fd3ff; --coral:#ff6fa3; --ok:#7ee07e; --ink:#fff4e0; --muted:#b9a9d6;
  --display:"Press Start 2P", "Courier New", monospace;
  --body:"VT323", "Courier New", monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:20px;margin:0;
  display:flex;flex-direction:column;align-items:center;gap:10px;padding-block:12px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));box-sizing:border-box;transition:background .8s}
h1{font-family:var(--display);font-size:clamp(16px,4vw,26px);margin:4px 0 0;color:var(--glow);text-shadow:3px 3px 0 #7a2f00;text-wrap:balance;text-align:center}
.hud{width:min(720px,100%);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px 16px;font-size:20px;font-variant-numeric:tabular-nums}
.hud b{color:var(--glow);font-weight:400}
.hud .right{display:flex;align-items:center;gap:12px}
#pauseBtn,#fullBtn{font-size:9px;padding:6px 8px;border-bottom-width:2px}
#fullBtn{background:var(--roof);color:var(--ink);border-color:#160f24}
body.full{gap:6px;padding-block:4px;min-height:100dvh;justify-content:center}
body.full h1,body.full .tip,body.full .powers{display:none}
body.full .stage{width:min(100%,calc((100dvh - 48px)*5/3))}
body.full .hud{width:100%;font-size:16px;flex-wrap:nowrap;white-space:nowrap;overflow:hidden;gap:10px}
body.full .hud>span:first-child{overflow:hidden;text-overflow:ellipsis;min-width:0}
body.full.touch .pad{position:fixed;left:0;right:0;bottom:max(8px,env(safe-area-inset-bottom,0px));width:auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none;z-index:5}
body.full.touch .pad button{pointer-events:auto;opacity:.78}
#mute{font-size:9px;padding:6px 8px;border-bottom-width:2px;background:var(--roof);color:var(--ink);border-color:#160f24}
.powers{width:min(720px,100%);display:flex;flex-wrap:wrap;gap:6px;min-height:26px}
.chip{font-size:17px;background:var(--roof);border-radius:3px;padding:1px 8px;color:var(--ink)}
.chip.none{background:transparent;color:var(--muted);padding-left:0}
.stage{position:relative;width:min(720px,100%);aspect-ratio:5/3;max-width:100%}
canvas{width:100%;height:100%;display:block;image-rendering:auto;border:4px solid var(--roof);border-radius:4px;background:#241b3d;box-sizing:border-box}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:10px;text-align:center;background:#1b1530f0;padding:12px;border-radius:4px;overflow:auto}
.overlay h2{font-family:var(--display);font-size:clamp(13px,3.6vw,24px);margin:0;color:var(--fish);line-height:1.4;text-wrap:balance}
.overlay p{margin:0;max-width:46ch;color:var(--muted);line-height:1.15}
.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;font-variant-numeric:tabular-nums}
.stats span b{color:var(--glow);font-weight:400}
.section-label{font-family:var(--display);font-size:9px;color:var(--muted);letter-spacing:.08em;margin-top:2px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;max-width:600px}
.card{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--roof);color:var(--ink);border:0;border-bottom:4px solid #160f24;border-radius:4px;padding:10px 8px;cursor:pointer;font-family:var(--body);font-size:17px;line-height:1.05;min-width:0}
.card:hover:not(:disabled){background:#4d3866}
.card:disabled{opacity:.35;cursor:default}
.card.chosen{opacity:1;outline:3px solid var(--ok)}
.card .ic{font-size:26px;line-height:1}
.card .nm{font-family:var(--display);font-size:9px;color:var(--glow);line-height:1.4}
.card .tag{font-size:14px;color:var(--fish);letter-spacing:.05em}
.skins{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.skin{display:flex;align-items:center;gap:5px;font-family:var(--body);font-size:15px;background:var(--roof);color:var(--ink);border:0;border-bottom:3px solid #160f24;padding:2px 7px;border-radius:3px;cursor:pointer}
.skin i{width:14px;height:14px;border-radius:2px;display:inline-block;border:1px solid #0006}
.skin.on{outline:3px solid var(--ok)}
.levels{display:flex;flex-direction:column;gap:6px;width:100%;max-width:560px}
.wrow{display:grid;grid-template-columns:120px repeat(6,minmax(0,1fr));gap:6px;align-items:center}
.wrow span{font-size:16px;color:var(--muted);text-align:left}
.lv{font-family:var(--display);font-size:11px;padding:7px 2px 5px;border-bottom-width:3px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.lv small{font-family:var(--body);font-size:14px;letter-spacing:0}
.lv:disabled{background:#2a2238;color:#5d527a;border-color:#160f24;cursor:not-allowed}
@media (max-width:480px){.cards{grid-template-columns:1fr}.card{flex-direction:row;text-align:left;padding:6px 10px}.wrow{grid-template-columns:repeat(6,minmax(0,1fr))}.wrow span{grid-column:1/-1}}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
button{font-family:var(--display);font-size:12px;background:var(--glow);color:#2b1300;border:0;border-bottom:4px solid #a85a00;border-radius:3px;padding:11px 16px;cursor:pointer;touch-action:manipulation}
button.alt{background:var(--roof);color:var(--ink);border-bottom-color:#160f24}
button:focus-visible{outline:3px solid var(--fish);outline-offset:3px}
.pad{width:min(720px,100%);display:flex;justify-content:space-between;gap:12px;user-select:none;-webkit-user-select:none}
.pgroup{display:flex;gap:10px;align-items:center}
.pad.duo .pgroup{gap:6px}.pad.duo button{padding:14px 12px;font-size:15px}
.plabel{font-family:var(--display);font-size:10px}
.mine{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:600px}
.mchip{font-family:var(--body);font-size:16px;background:var(--roof);color:var(--ink);border-bottom:3px solid #160f24;padding:3px 9px}
.mchip b{color:var(--coral);font-weight:400;margin-left:4px}
.none{font-size:16px;color:var(--muted)}
.full{color:var(--coral);font-size:15px}
.skins{flex-direction:column;align-items:center}
.skinrow{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px}
.pad button{font-size:18px;padding:16px 20px;background:var(--roof);color:var(--ink);border-bottom-color:#160f24}
.pad button.jump{background:var(--glow);color:#2b1300;border-bottom-color:#a85a00}
.pad button.dash{background:var(--fish);color:#06223a;border-bottom-color:#2a7ea8;font-size:12px}
.tip{font-size:17px;color:var(--muted);text-align:center;max-width:720px}
.pad button{touch-action:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.pad button.held{filter:brightness(1.35);transform:translateY(2px)}
.stage,canvas{touch-action:manipulation}
@media (hover:hover) and (pointer:fine){body:not(.touch) .pad{display:none}}
@media (min-width:700px){body.touch .pad button{padding:22px 30px;font-size:22px}body.touch .pad.duo button{padding:18px 18px;font-size:18px}}
</style>

      if(k==='st'){for(let r=10-h;r<=9;r++)c[r]='#';if(sp&&i===Math.floor(n/2))c[9-h]='^'}

      if(k==='cs'){c[6]='v';if(i===Math.floor(n/2))c[9]='^'}
      cols.push(c)}}

  const segs=[['f',6]],n=7+li*2+Math.floor((Math.min(w,30)-5)/3)+(st==='finale'?2:0),M=STYLE_W[st]||{};
  const Wt=[['s',3],['p',3],['st',2],['combo',(d>.3||st==='spikes')?2:0],['pl',ph.crumble?3:1.5],['pp',ph.crumble?3:1.5],['cs',(d>.25||st==='cave')?1.2:0],['bp',ph.tramp?3:1],['sp',(d>.4||st==='gaps')?1.5:0],['stairs',1],['dr',ph.drip?2.5:0],['k',ph.cannon?2.5:0],['gy',ph.geyser?2.5:0],['gt',ph.gator?2.5:0],['vn',ph.vines?3:1]].map(([k,v])=>[k,v*(M[k]||1)]);

function vertGrid(li,seed=2500){const r=rng(seed+li*77),ri=(a,b)=>a+Math.floor(r()*(b-a+1)),W=20,n=12+li*3,L=[];let ps=3,pe=6,dir=1;
  for(let i=0;i<n;i++){let up=i===0?3:(r()<.35+li*.08?3:2);const w=ri(3,5)+(i===n-1?1:0);let s0;
    const place=()=>{if(i===0)return ri(3,7);const gap=up===3?ri(0,1):ri(1,2);let v=dir>0?pe+1+gap:ps-1-gap-w+1;if(v<1||v+w>W-1){dir=-dir;v=dir>0?pe+1+gap:ps-1-gap-w+1}return Math.max(1,Math.min(W-1-w,v))};
    s0=place();const two=L[i-2];if(two&&L[i-1].up+up<5&&s0<=two.e&&s0+w-1>=two.s){up=5-L[i-1].up}
    L.push({s:s0,e:s0+w-1,up});ps=s0;pe=s0+w-1}
  const H=L.reduce((a,q)=>a+q.up,0)+8,g=Array.from({length:H},()=>Array(W).fill('.'));for(let y=0;y<H;y++){g[y][0]=g[y][W-1]='#'}for(let c=0;c<W;c++){g[H-1][c]=g[H-2][c]='#'}
  let row=H-2;L.forEach((q,i)=>{row-=q.up;for(let c=q.s;c<=q.e;c++)g[row][c]='#';if(i>0&&i%4===0)g[row-1][q.s+1]='C';else if(q.e-q.s>=4&&r()<.3+li*.08)g[row-1][q.s+2]='^';q.row=row});

 c_marsh:["* Hi. I'm Marshmallow.", "* I fell asleep on the snack table.", "* Three people tried to roast me."],
 c_fringe:["* Is this the party?", "* I can't see. I've been dancing with a coat rack.", "* It's a really good dancer."],
 c_dj:["* DJ Feathers in the house!", "* Tonight's hits: 'Bawk to the Future' and 'Cluck It Out.'", "* The crowd goes WILD."],

 pumpkin:["* Is it Halloween yet?", "* No? Then why do I glow?", "* I'm just always ready for Halloween."],
 lava:["* Careful, I'm a little toasty.", "* Last week I sat on a marshmallow.", "* Now it's a s'more."],
 ocean:["* I can hear waves in my ears.", "* Oh wait. That's the air conditioner."],

 lavendersheep:["* Baaa. I smell like lavender.", "* It makes everyone around me sleepy.", "* Yaaawn."],

 purplefrog:["* Ribbit. I'm a rare purple frog.", "* You're lucky to see me. Make a wish."],
 bluepenguin:["* I'm the smallest penguin in the world.", "* But I have the biggest heart. And the loudest squeak."],
 tuftedpuffin:["* Do you like my golden head feathers?", "* I grew them myself."],
 orange:["* Mrrp. Welcome to the Hotel Whisker.","* I've napped on every couch in this lobby.","* The blue one is the best. Don't tell the others."],
 grey:["* Did you know rain smells better on Tuesdays?","* I don't have proof.","* I just feel it in my whiskers."],
 black:["* People say black cats are unlucky.","* I found a whole sandwich this morning.","* So. Who's unlucky now?"],
 tux:["* Good evening.","* I dressed up for no reason at all.","* It's important to look fancy at all times."],
 calico:["* I'm three colors. Most cats only get one or two.","* Just saying. Not bragging. A little bragging."],
 ghost:["* Boo.","* ...Sorry. Habit.","* I'm actually really nice. I bake cookies."],
 gold:["* I'm not trying to be shiny.","* It just keeps happening.","* Sunglasses help."],

 goldenfrog:["* Ribbit. In gold."],

 tabby:["* I have an M on my forehead.","* It stands for Marvelous."],

 rooster:["* COCKA-DOODLE-DOOOO!", "* ...Sorry. Morning reflex.", "* It's three in the afternoon.", "* I also crow at toasters. Long story."],
 polish:["* I can't see anything because of my hair.", "* I just said hi to a lamp for ten minutes.", "* It was a great talk, honestly."],
 silkie:["* I'm basically a cloud with feet.", "* A kid tried to put me in a hot chocolate.", "* As a marshmallow."],
 capybara:["* ...","* I'm just chilling.","* Everyone likes me. I don't know why. I just sit here."],
 capyorange:["* There's an orange on my head.","* I don't know how it got there.","* I'm not taking it off."],
 puffin:["* I'm a puffin. Some people call me a sea parrot.", "* I'm VERY good at holding fish in my beak."],
 frog:["* Ribbit.","* That means hello.","* It also means goodbye. And 'please pass the flies'."],
 treefrog:["* My eyes are red because I stayed up all night.","* Watching the moon. It was worth it."],
 dartfrog:["* I'm very colorful.","* Please don't lick me. Seriously. Don't."],
 platypus:["* I'm a mammal that lays eggs.","* I also have a duck bill and webbed feet.","* Oh, and this is Pip. Pip lives on my head now.","* Pip says ribbit."],
 explorerplaty:["* I've explored every swamp on the map.","* This one's my favorite. It has snacks."],
 babycapy:["* Mom says I can be a big capybara someday.","* For now I'm a medium-small capybara."],
 penguin:["* Waddle waddle.","* I'm not saying a word.","* That's just how I walk."],
 emperor:["* I am the emperor of all penguins.","* My only rule is: more fish for everyone."],
 babypenguin:["* I'm SO fluffy.","* You can pet me. No, wait, I'm shy.","* ...Okay. One pet."],
 rockhopper:["* My eyebrows are very fancy.","* I brush them every single morning."],
 librarian:["* Oh. It's you. The noisy one.","* Don't worry. I'm off duty today.","* ...Still. Inside voices, please.","* I'm reading a mystery book. The butler didn't do it.","* The cat did. It's always the cat."],
 castlequiet0:["* Och, hello there!","* I'm off duty, so I can finally sit down.","* Ye snuck through my WHOLE castle and I never heard a single peep!","* Are ye some kind of ninja cat?!"],
 castlequiet1:["* Och, hello there!","* I'm off duty, so I can finally sit down.","* Ye only woke me up ONCE in my castle.","* That's very sneaky. I'm impressed. A wee bit annoyed. But impressed."],

 palaceguard:["* ...","* (The guard is standing perfectly still.)","* ...","* Okay, fine. Hi. We're not supposed to move.","* But it's a party. I'll allow ONE wiggle."],

const ASK={"deer": ["* Want to see me leap?", ["Leap!", ["* (The Deer bounds over a couch.)","* Graceful, right?"]], ["Stay calm", ["* Okay. Calm. Very calm. (ear twitch)"]]], "reindeer": ["* Can you guess my favorite holiday?", ["Winter one?", ["* Yes! All the sleigh rides. My hooves hurt."]], ["Halloween", ["* Ooh, I could dress up as a regular deer!"]]], "fawn": ["* Do you like my spots?", ["Love them", ["* Yay! I'll keep them forever. FOREVER."]], ["Count them", ["* One, two, three... I lost count. That's a lot of spots."]]], "icesheep": ["* Want to feel how thick my wool is?", ["Sure!", ["* (Your paw disappears into the fluff.)","* Told you. Extra thick."]], ["Too warm", ["* True. I'm sweating a little. In Iceland I'd be perfect."]]],"p_penguin": ["* Want to race to the other side?", ["Race!", ["* (Splash zooms across the pool.)", "* I win! I always win. I'm a penguin."]], ["No thanks", ["* Okay! I'll race myself. And win again."]]],"p_capy": ["* Want to float with us?", ["Let's float", ["* (Floaty sits perfectly still.)", "* ...This is the best day of my life."]], ["I'll swim", ["* Swimming is just floating with extra steps."]]],"p_frog": ["* Does pool water count as swamp water?", ["Sure!", ["* Ribbit! Then I'm home!"]], ["Not really", ["* Ugh. I KNEW it. My skin feels squeaky."]]],"h_corgi": ["* Bet you can't bounce higher than me!", ["Watch me!", ["* (Boing bounces extra hard.)", "* ...Okay. Tie. We're both champions."]], ["You win", ["* YES! Champion of the bounce house! BOING!"]]],"h_lamb": ["* Want to see me do a flip?", ["Do a flip!", ["* (Sprinkle does a wobbly flip.)", "* Ta-da! I'm a little dizzy. Baaa."]], ["Be careful!", ["* I'm a cloud! Clouds can't get hurt! (bonk) ...Ow."]]],"h_chick": ["* Will I reach the moon?", ["Definitely!", ["* PEEP! Moon, here I come! (boing)"]], ["Probably not", ["* Then I'll reach the ceiling. Close enough!"]]],"b_popcorn": ["* Want a bag? Free for hotel guests!", ["Yes please!", ["* Here you go! Careful, it's still popping!"]], ["No thanks", ["* More for me! (munch munch)"]]],"b_games": ["* Wanna play? You get three rings!", ["Let's play!", ["* Here are your rings! Press jump when a ring is right over a bottle!"]], ["Maybe later", ["* The bottles will be waiting! They're very patient bottles."]]],"b_candy": ["* Want some cotton candy?", ["Yes please!", ["* One big fluffy sugar cloud, coming up!", "* (Warning: may cause ZOOMIES.)"]], ["Too sugary", ["* Fair. I'm sweet enough already. Baaa."]]],"c_henrietta": ["* Are you on the guest list?", ["Yes!", ["* (checks clipboard) ...You're not. But you're cute. Come in."]], ["No...", ["* Then you're a party crasher. My favorite kind!"]]],"c_nugget": ["* Do you think Nugget is a cool name?", ["Super cool", ["* Peep! Okay, I'll keep it. NUGGET POWER!"]], ["Kinda scary", ["* RIGHT?! From now on, call me... Sir Peeps."]]],"c_clucks": ["* Shall I perform my royal crow?", ["Please do", ["* COCKA-DOODLE-ROYAL-DOOOOO!", "* (Somewhere, a window breaks.)"]], ["Not indoors", ["* Very well. I shall crow in my HEAD. (He is shaking.)"]]],"c_marsh": ["* Do I look toasty?", ["Golden brown", ["* Oh no. Oh NO. I'm going to sit away from the candles."]], ["Perfectly fluffy", ["* Phew. Fluffy is my best flavor."]]],"c_fringe": ["* Want to dance with me instead?", ["Let's dance!", ["* (Fringe dances. Into the wall. Then into you.)", "* Best dance EVER."]], ["Dance with the coat rack", ["* Good idea. It has great rhythm."]]],"c_dj": ["* Request a song?", ["Chicken Dance", ["* A CLASSIC. Everybody flap your wings! Bawk bawk bawk bawk!"]], ["Something calm", ["* One cozy egg-coustic set, coming up. (soft clucking)"]]],"c_bluebelle": ["* Want a blue deviled egg?", ["I'll try one", ["* (nom) ...It tastes like a normal egg. But it LOOKS amazing."]], ["They look weird", ["* Weird is just another word for FANCY. Hmph."]]],"c_popcorn": ["* Want to race around the party?", ["Ready, set, GO!", ["* (Popcorn runs in a tiny circle 40 times.)", "* I WIN! ...What were we doing?"]], ["Calm down", ["* I AM CALM. THIS IS MY CALM VOICE. PEEP."]]],"orange": ["* Want to know the comfiest couch in the lobby?", ["Yes!", ["* It's the blue one. Shh. Now it's our secret."]], ["No thanks", ["* More couch for me, then. Mrrp."]]], "grey": ["* Do YOU think rain smells better on Tuesdays?", ["Definitely", ["* I KNEW it. We're a team now."]], ["Nope", ["* Hmm. Come back on a Tuesday and sniff."]]], "black": ["* Do you believe in luck?", ["Yes", ["* Me too. I'm the luckiest cat I know."]], ["No", ["* Then how do you explain my sandwich?"]]], "tux": ["* How do I look today?", ["So fancy!", ["* Thank you. I ironed my fur."]], ["A bit messy", ["* WHAT. Where?! ...Oh, you're teasing."]]], "calico": ["* Which of my colors is the best one?", ["The orange", ["* Bold choice. The orange agrees."]], ["All of them", ["* Correct answer. You get a gold star."]]], "ghost": ["* Want one of my ghost cookies?", ["Yes please", ["* Here! It's invisible. Tastes like vanilla."]], ["Too spooky", ["* That's fair. Boo. Sorry."]]], "gold": ["* Is my shine too bright?", ["A little", ["* I'll put on my shades. Better?"]], ["It's perfect", ["* Aw. Now I'm glowing even more."]]], "galaxy": ["* What's your favorite planet?", ["Saturn", ["* Hula hoop buddies! High five."]], ["Earth", ["* Good pick. It has snacks."]]], "snow": ["* Is it cold where you're going next?", ["Freezing!", ["* Lucky! If you go to Antarctica, bring me back a snowball.","* Please. I'm MELTING here."]], ["No, warm", ["* Oof. Stay in the shade, friend."]]], "toxic": ["* Want me to light the way to the snack machine?", ["Yes!", ["* Follow the green glow. Don't step on the cat at the end."]], ["I'm good", ["* Okay. It's right there anyway. I'm glowing at it."]]], "tortie": ["* Do you like quilts?", ["I love them", ["* Then you love me. That's science."]], ["Not really", ["* I'll pretend I didn't hear that."]]], "snowball": ["* Want to play hide-and-seek?", ["Sure!", ["* Yay! Close your eyes and count to ten!", "* No peeking!"]], ["Maybe later", ["* Okay. I'll be over there. Being invisible."]]], "bengal": ["* Is the vacuum on right now?", ["Nope", ["* Phew. I can be brave again."]], ["VROOOM!", ["* AAAH! ...Oh. That was you. Not funny."]]], "lilac": ["* Quick. What color am I?", ["Purple!", ["* THANK you. Finally someone gets it."]], ["Grey?", ["* PURPLE. Lilac purple. Write it down."]]], "mint": ["* Do I smell like toothpaste to you?", ["Yep", ["* Great. At least my teeth are clean."]], ["Like gum", ["* Ooh. I'll take it. Gum is fancier."]]], "robot": ["* ARE YOU ALSO A NORMAL CAT?", ["Yes. Meow.", ["* EXCELLENT. WE ARE BOTH VERY NORMAL."]], ["You're a robot", ["* ERROR. ERROR. I MEAN... MEOW?"]]], "zombie": ["* Got any tuna on you?", ["Here you go", ["* Mmmm... TUNAAA... Thank you, friend."]], ["Sorry, no", ["* Brainnns... I mean, that's okay."]]], "strawberry": ["* Promise you won't put me in a smoothie?", ["I promise", ["* Phew. You're my favorite."]], ["Hmm...", ["* (Strawberry slowly backs away.)"]]], "siamese": ["* Want to hear my opinions?", ["All of them", ["* First: naps are too short. Second: dinner is too late.", "* ...I have 47 more. Come back tomorrow."]], ["Just one", ["* Fine. Breakfast should be at 4 AM. You're welcome."]]], "tabby": ["* What do you think the M on my forehead means?", ["Marvelous", ["* Exactly. You get it."]], ["Mustache?", ["* It's on my FOREHEAD. ...Okay, that's funny."]]], "russianblue": ["* Am I grey or blue?", ["Blue", ["* Thank you. My name makes sense now."]], ["Grey", ["* That's what I said! Nobody listens."]]], "sphynx": ["* Can I borrow your blanket?", ["Here, take it", ["* Ahhh. Toasty. You're the best."]], ["I need it", ["* I understand. I'll shiver politely."]]], "mainecoon": ["* Do I look like a dog to you?", ["A little", ["* SHH. Don't let them hear. They'll make me play fetch."]], ["No, a lion", ["* Rawr. I mean... yes. A majestic lion."]]], "cottoncandy": ["* Do I smell like the fair?", ["Yes, yum!", ["* Please don't lick me. Again."]], ["Like soap", ["* I took a bath! Rude. But fair."]]], "chicken": ["* What does that cloud look like to you?", ["A sandwich", ["* SEE?! Bawk! Now we're BOTH hungry."]], ["A dragon", ["* Ooh. A dragon eating a sandwich. Bawk. Still hungry."]]], "hen": ["* What flavor do you think my next egg will be?", ["Grape", ["* Ooh, fancy. I'll try my best. (strains)", "* ...Nope. Just a regular egg. Boring."]], ["Pizza", ["* PIZZA EGG?! That's the dream. I'm going to lie down and think about it."]]], "chick": ["* Want to see my scary face?", ["Show me!", ["* (The chick puffs up to slightly bigger.)", "* RAAAWR! ...Peep. Were you scared?"]], ["I'm scared!", ["* Peep peep! I didn't even do it yet! I'm SO powerful!"]]], "dog": ["* Can you keep a secret?", ["I promise", ["* Okay. Come close.", "* I buried a sock in the plant pot!!!", "* Don't tell the front desk. It's a secret sock."]], ["No way", ["* Then I'm not telling you about the sock.", "* ...Oops."]]], "dalmatian": ["* Want to count my spots?", ["Okay!", ["* ...57, 58, 59, 60! Wait. Was that a crumb again?"]], ["Too many", ["* That's fair. I lose count too."]]], "blacklab": ["* Do you have a tennis ball?", ["Here, fetch!", ["* !!!!!!", "* THROW IT! THROW IT! THROW IT!"]], ["No ball", ["* That's okay. I'll imagine one. Boing."]]], "sheep": ["* Want a sweater knitted from my wool?", ["Yes please", ["* (click clack click clack)", "* Here you go! It's a little itchy. Sorry.", "* (You got the KNITTED SWEATER! Wear it from the pause menu ❚❚.)"]], ["It's itchy", ["* I know. I'm itchy too."]]], "blacksheep": ["* Do you like rock music?", ["It rocks!", ["* BAAA! Air guitar time!"]], ["I like quiet", ["* Okay. I'll rock out softly."]]], "pinksheep": ["* Do you believe my strawberry story?", ["Totally", ["* Finally! Someone smart."]], ["Not really", ["* Then why am I pink? Checkmate."]]], "puffin": ["* Want to see me hold ten fish?", ["Show me!", ["* Okay, hold on... (gulp)... Oh no. I ate them again."]], ["I believe you", ["* Thank you. Nobody ever believes me."]]], "tuftedpuffin": ["* Should I grow my head feathers even longer?", ["Yes!", ["* Longer and FANCIER. I love it."]], ["They're perfect", ["* Aww. I'll keep them just like this."]]], "penguin": ["* Want to waddle together?", ["Let's waddle", ["* Waddle. Waddle. Waddle. Perfect form."]], ["I'll run", ["* Running is just waddling in a hurry."]]], "emperor": ["* As emperor, I grant you one wish. What is it?", ["More fish", ["* Excellent choice. It is the only rule."]], ["A nap", ["* Granted. Royal naps for everyone."]]], "babypenguin": ["* Can I have just one pet?", ["Of course", ["* (pat pat) ...That was nice. Okay. Two pets."]], ["Are you shy?", ["* A little. But you seem nice."]]], "rockhopper": ["* Do you like my eyebrows?", ["So fancy", ["* Thank you! I comb them with a fish bone."]], ["Very spiky", ["* That's the point. It's called STYLE."]]], "gentoo": ["* Want to race me?", ["In the water", ["* I'll win. But you'll have fun!"]], ["On land", ["* Hmm. You might win that one."]]], "husky": ["* Can I howl? Just once?", ["Go for it", ["* AWOOOOOOOOO!", "* ...Thank you. I feel amazing."]], ["Inside voice", ["* (tiny) awoo."]]], "corgi": ["* Want to see my zoomies?", ["Yes!", ["* (The Corgi runs three laps around the lobby.)", "* TA-DA!"]], ["Maybe later", ["* I'll save them up. They'll be EXTRA zoomy."]]], "poodle": ["* Do you like my pink fur?", ["It's lovely", ["* Thank you, darling. I picked it myself."]], ["Try blue", ["* Ooh. Blue next time. Great idea."]]], "goldenfleece": ["* You're not going to try to sell me, right?", ["Never", ["* Phew. You can pet the gold wool. For free."]], ["How much?", ["* NOT FOR SALE. Baaa."]]], "goldenfrog": ["* Ribbit?", ["Ribbit!", ["* Ribbit ribbit! (You two are friends now.)"]], ["What?", ["* It means 'nice shoes.' In gold."]]], "ameraucana": ["* Guess what color egg I'll lay tomorrow.", ["Blue", ["* Correct. It's always blue. I'm very consistent."]], ["Plaid", ["* PLAID?! I'll try. (Amer     buttons:[{label:'Resume',fn:resumeGame},{label:'Restart level',fn:()=>{hideScreen();loadLevel(lvl);state='play'},alt:true},...(selectUnlocked()?[{label:'Level select',fn:showSelect,alt:true}]:[]),{label:'Main menu',fn:showTitle,alt:true}]})}
function resumeGame(){if(state!=='pause')return;hideScreen();state=prevState;if(ac)mNext=ac.currentTime+.05}
$('pauseBtn').onclick=()=>{state==='pause'?resumeGame():pauseGame()};
addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='p'||e.key==='P'){e.preventDefault();state==='pause'?resumeGame():pauseGame()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame()});
// rebuild a lost run from older saves: pick up after the furthest level ever beaten
if(!save.run&&!save.migrated&&save.beaten.length){const top=Math.max(...save.beaten);
  save.run={lvl:Math.min(top+1,LEVELS.length-1),next:top+1,powers:save.powers||[],skinSet:save.skins||[],skins:[SKINS[save.skin]?save.skin:'orange','grey'],deaths:0,fish:save.beaten.length,runTime:0,runBeaten:save.beaten.slice(),playMode:'solo',score:[0,0],friends:false}}
save.migrated=1;try{localStorage.setItem('whiskerdash',JSON.stringify(save))}catch(e){}
window.claude?.hot?.snapshot?.(()=>({run:runOn&&mode==='story'&&state!=='title'?runData():null}));
function boot(d){renderPowers();if(d&&d.run)resumeRun(d.run);else showTitle();requestAnimationFrame(loop)}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>

</body></html>
