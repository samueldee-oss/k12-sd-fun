<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Wanderleaf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--ink:#3a2e2a;--paper:#fffaf0}
html,body{margin:0;height:100%;background:#3b302a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body,button,input{font-family:'Patrick Hand','Comic Sans MS','Chalkboard SE','Marker Felt',cursive;color:var(--ink)}
#wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;border-radius:6px}
canvas{width:100%;height:100%;display:block;touch-action:none}
#hud,#ov{position:absolute;inset:0;pointer-events:none}
#hud>*,#ov>*{pointer-events:auto}
#ov{display:none;align-items:center;justify-content:center;background:rgba(58,46,42,.38);pointer-events:auto}
#ov.clear{background:transparent;align-items:flex-end;padding-bottom:1.2em;box-sizing:border-box}
.btn{font:inherit;font-size:1.05em;background:var(--paper);border:.16em solid var(--ink);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;padding:.18em .75em;cursor:pointer;color:var(--ink);box-shadow:.12em .18em 0 rgba(58,46,42,.35);transition:transform .08s;white-space:nowrap;line-height:1.3}
.btn:hover{transform:rotate(-1.5deg) scale(1.05)}
.btn:active{transform:scale(.95)}
.btn.big{font-size:1.4em;padding:.25em 1.1em}
.btn.go{background:#ffe28a}
.btn.sel{background:#bfe6a6}
.btn.dis{opacity:.5;cursor:default}
.btn.warn{background:#ffc9c0}
.panel{background:var(--paper);border:.2em solid var(--ink);border-radius:2% 6% 3% 5%/6% 3% 6% 3%;padding:1em 1.3em;box-shadow:.3em .4em 0 rgba(58,46,42,.35);max-width:88%;max-height:86%;overflow:auto;box-sizing:border-box}
.panel h2{margin:0 0 .3em;font-size:2em;font-weight:normal;text-align:center}
.panel h3{margin:.4em 0 .2em;font-size:1.3em;font-weight:normal}
.row{display:flex;gap:.5em;align-items:center;justify-content:center;flex-wrap:wrap}
.topbar{position:absolute;top:.45em;left:.5em;right:.5em;display:flex;gap:.4em;align-items:center;flex-wrap:wrap;pointer-events:none!important}
.topbar>*{pointer-events:auto}
.pill{background:var(--paper);border:.16em solid var(--ink);border-radius:1em;padding:.1em .7em;font-size:1.1em}
.spacer{flex:1;pointer-events:none!important}
.slots{display:flex;gap:.8em;justify-content:center;flex-wrap:wrap}
.slot{background:#fff;border:.16em solid var(--ink);border-radius:8% 3% 7% 4%/4% 8% 3% 7%;padding:.6em .8em;width:13em;text-align:center;box-shadow:.15em .2em 0 rgba(58,46,42,.3)}
.slot .nm{font-size:1.35em;margin-bottom:.15em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .st{font-size:.95em;opacity:.8;margin-bottom:.4em}
.slot input{font:inherit;font-size:1.1em;width:9em;border:.12em solid var(--ink);border-radius:.4em;padding:.1em .3em;text-align:center;background:#fffdf6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.4em,1fr));gap:.6em;margin:.4em 0}
.card{background:#fff;border:.14em solid var(--ink);border-radius:6% 3% 7% 4%/4% 7% 3% 6%;padding:.35em;text-align:center;font-size:.95em;display:flex;flex-direction:column;align-items:center;gap:.2em}
.card canvas{width:6.4em;height:5.1em}
.card.locked{background:#eee7da}
.card .nm{line-height:1.1}
.card .sub{font-size:.85em;opacity:.75;line-height:1.1}
.tabs{display:flex;gap:.4em;justify-content:center;margin-bottom:.4em;flex-wrap:wrap}
.dlg{position:absolute;left:5%;right:5%;bottom:5%;display:flex;gap:1em;align-items:center;background:var(--paper);border:.2em solid var(--ink);border-radius:3% 1% 4% 2%/10% 4% 12% 5%;padding:.7em 1em;box-shadow:.3em .4em 0 rgba(58,46,42,.35);cursor:pointer}
.dlg canvas{width:6em;height:6em;flex:none}
.dlg .tx{font-size:1.45em;line-height:1.25;flex:1}
.dlg .nx{font-size:1.1em;opacity:.7;align-self:flex-end}
.res{font-size:1.25em;text-align:center;line-height:1.5}
.stars{font-size:3em;letter-spacing:.1em;text-align:center;line-height:1.1}
.stars .on{color:#f2b705;text-shadow:0 0 .1em #fff}
.stars .off{color:#cfc4b2}
.tc{position:absolute;width:4.3em;height:4.3em;border-radius:50%;background:rgba(255,250,240,.55);border:.18em solid rgba(58,46,42,.8);display:flex;align-items:center;justify-content:center;font-size:1.3em;touch-action:none}
.tc.on{background:rgba(255,226,138,.85)}
.tc.sm{width:3em;height:3em;font-size:1.1em}
.help{font-size:1em;opacity:.85;text-align:center;margin-top:.4em}
.title-ov{flex-direction:column}
</style>

<script>
'use strict';
/* ============ CORE SETUP ============ */
const W=960,H=540,T=40,INK='#3a2e2a',FONT="'Patrick Hand','Comic Sans MS','Chalkboard SE',cursive";
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
const wrap=document.getElementById('wrap'),hud=document.getElementById('hud'),ov=document.getElementById('ov');
let S=1,DPR=1;
function resize(){S=Math.min(innerWidth/W,innerHeight/H);DPR=Math.min(2,window.devicePixelRatio||1);
 wrap.style.width=W*S+'px';wrap.style.height=H*S+'px';wrap.style.fontSize=Math.max(9,16*S)+'px';
 cv.width=Math.round(W*S*DPR);cv.height=Math.round(H*S*DPR);}
addEventListener('resize',resize);resize();
let BOIL=0;
function hash(a,b,c,d){let h=Math.imul(a|0,374761393)^Math.imul(b|0,668265263)^Math.imul(c|0,1442695041)^Math.imul((d|0)+7,1274126177);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
const rnd=(a,b)=>a+Math.random()*(b-a);
/* ============ HAND-DRAWN PRIMITIVES ============ */
function jit(x,y,k){return (hash(Math.round(x*3),Math.round(y*3),BOIL,k)-.5);}
function wl(x1,y1,x2,y2,amp){amp=amp??1.4;const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1,n=Math.max(1,Math.round(len/15));const nx=-dy/len,ny=dx/len;
 ctx.moveTo(x1+jit(x1,y1,1)*amp*1.4,y1+jit(x1,y1,2)*amp*1.4);
 for(let i=1;i<n;i++){const t=i/n,o=(hash(Math.round(x1+dx*t),Math.round(y1+dy*t),BOIL,3)-.5)*2*amp;ctx.lineTo(x1+dx*t+nx*o,y1+dy*t+ny*o);}
 ctx.lineTo(x2+jit(x2,y2,1)*amp*1.4,y2+jit(x2,y2,2)*amp*1.4);}
function wrect(x,y,w,h,sd,amp){amp=amp??1.3;const pts=[[x,y],[x+w,y],[x+w,y+h],[x,y+h]];ctx.beginPath();
 for(let k=0;k<4;k++){const [ax,ay]=pts[k],[bx,by]=pts[(k+1)%4];const n=Math.max(1,Math.round(Math.hypot(bx-ax,by-ay)/18));
  for(let i=0;i<n;i++){const t=i/n;const px=ax+(bx-ax)*t+(hash(sd,k*50+i,BOIL)-.5)*2*amp,py=ay+(by-ay)*t+(hash(sd,k*50+i+25,BOIL)-.5)*2*amp;(k||i)?ctx.lineTo(px,py):ctx.moveTo(px,py);}}
 ctx.closePath();}
function wcirc(x,y,r,sd,amp){amp=amp??(r*.05+.6);const n=Math.max(8,Math.round(r/2.2));ctx.beginPath();
 for(let i=0;i<=n;i++){const a=i/n*Math.PI*2,rr=r+(hash(sd,i%n,BOIL)-.5)*2*amp;const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();}
function wcloud(x,y,rx,ry,n,sd,puff){puff=puff??.22;ctx.beginPath();
 for(let i=0;i<=n;i++){const a=i/n*Math.PI*2;const j=1+(hash(sd,i%n,BOIL)-.5)*.1;const px=x+Math.cos(a)*rx*j,py=y+Math.sin(a)*ry*j;
  if(i===0)ctx.moveTo(px,py);else{const am=(i-.5)/n*Math.PI*2,k=1+puff;ctx.quadraticCurveTo(x+Math.cos(am)*rx*k,y+Math.sin(am)*ry*k,px,py);}}ctx.closePath();}
function fs(f,lw){ctx.fillStyle=f;ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=lw||2.2;ctx.stroke();}
function star5(x,y,r,rot){ctx.beginPath();for(let i=0;i<10;i++){const a=rot+i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}ctx.closePath();}
function txt(s,x,y,size,col,align,outline){ctx.font=size+'px '+FONT;ctx.textAlign=align||'center';ctx.textBaseline='middle';if(outline){ctx.lineWidth=outline;ctx.strokeStyle=typeof outline==='number'?'#fffaf0':outline;ctx.lineJoin='round';ctx.strokeText(s,x,y);}ctx.fillStyle=col||INK;ctx.fillText(s,x,y);}
function wrapText(s,maxW,size){ctx.font=size+'px '+FONT;const words=s.split(' ');const lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}if(cur)lines.push(cur);return lines;}
function bubble(s,cx,by,maxW,minX,maxX){const size=19;const lines=wrapText(s,maxW||250,size);let w=0;for(const l of lines)w=Math.max(w,ctx.measureText(l).width);w+=26;const hh=lines.length*22+16;
 let x=cx-w/2;if(minX!=null)x=Math.max(minX+6,Math.min(maxX-w-6,x));const y=by-hh-12;
 wrect(x,y,w,hh,77);ctx.fillStyle='#fffaf0';ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=2.2;ctx.stroke();
 ctx.beginPath();const tx=Math.max(x+14,Math.min(x+w-14,cx));ctx.moveTo(tx-8,y+hh-1);ctx.lineTo(tx,y+hh+11);ctx.lineTo(tx+8,y+hh-1);ctx.fillStyle='#fffaf0';ctx.fill();ctx.beginPath();ctx.moveTo(tx-8,y+hh);ctx.lineTo(tx,y+hh+11);ctx.lineTo(tx+8,y+hh);ctx.stroke();
 lines.forEach((l,i)=>txt(l,x+w/2,y+19+i*22,size));}
/* paper texture */
const paper=document.createElement('canvas');paper.width=paper.height=256;
(function(){const p=paper.getContext('2d');const id=p.createImageData(256,256);for(let i=0;i<id.data.length;i+=4){const v=238+Math.random()*17;id.data[i]=v;id.data[i+1]=v-3;id.data[i+2]=v-10;id.data[i+3]=255;}p.putImageData(id,0,0);
 p.strokeStyle='rgba(107,90,72,.12)';for(let i=0;i<160;i++){p.beginPath();const x=Math.random()*256,y=Math.random()*256,a=Math.random()*6.28,l=4+Math.random()*14;p.moveTo(x,y);p.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);p.lineWidth=.5+Math.random();p.stroke();}})();
let paperPat=null;
function paperOverlay(){if(!paperPat)paperPat=ctx.createPattern(paper,'repeat');ctx.save();ctx.globalCompositeOperation='multiply';ctx.globalAlpha=.6;ctx.fillStyle=paperPat;ctx.fillRect(0,0,W,H);ctx.restore();
 ctx.save();const g=ctx.createRadialGradient(W/2,H/2,H*.4,W/2,H/2,H*.95);g.addColorStop(0,'rgba(80,60,40,0)');g.addColorStop(1,'rgba(80,60,40,.22)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.restore();}
function withCtx(c2,fn){const old=ctx;ctx=c2;try{fn();}finally{ctx=old;}}
function miniCanvas(w,h,fn){const c=document.createElement('canvas');c.width=w*2;c.height=h*2;const c2=c.getContext('2d');c2.scale(2,2);withCtx(c2,fn);return c;}

/* ============ DATA ============ */
const SKINS=[

 {id:'cocoa',name:'Cocoa',body:'#9e6e4b',shade:'#7c5236',face:'#3a2e33',price:25},

const HATS=[{id:'none',name:'No Hat',free:1},{id:'leaf',name:'Leaf Cap',price:10},{id:'flower',name:'Flower Crown',price:15},{id:'bow',name:'Big Bow',price:15},{id:'sailor',name:'Sailor Hat',price:20},{id:'party',name:'Party Hat',price:20},{id:'beanie',name:'Cozy Beanie',price:25},{id:'helmet',name:'Space Helmet',price:35},{id:'crown',name:'Royal Crown',price:60}];
const DECOR=[{id:'rug',name:'Round Rug',price:10},{id:'plant',name:'Potted Plant',price:15},{id:'lamp',name:'Mushroom Lamp',price:15},{id:'painting',name:'Painting',price:20},{id:'fishbowl',name:'Fishbowl',price:20},{id:'shelf',name:'Bookshelf',price:25},{id:'lights',name:'Fairy Lights',price:30},{id:'telescope',name:'Telescope',price:35}];

const WORLDS={
 forest:{g:1800,jv:680,maxFall:720,sky:'#e8f2d8',sky2:'#cfe6bb',sky3:'#b6d79d',fill:'#c39a6b',fill2:'#a97f55',top:'#8cc56a',tuft:'#5f9a45',plat:'#b88350',haz:'#6f8f3a',vine:'#4f8f3a',gem:'#5fd0c8',music:'forest'},
 reef:{g:1100,jv:580,maxFall:380,sky:'#d4ecf1',sky2:'#b6dbe6',sky3:'#9dcbdb',fill:'#ecd3a4',fill2:'#d8b583',top:'#f29aa6',tuft:'#e07185',plat:'#e2b98e',haz:'#7d4fa0',vine:'#6f9a3c',gem:'#ff9ec7',music:'reef'},
 space:{g:800,jv:540,maxFall:600,sky:'#262a4f',sky2:'#353a6b',sky3:'#454b82',fill:'#a39cc2',fill2:'#857ea8',top:'#cfc8ec',tuft:'#9890bd',plat:'#9a93bb',haz:'#7fd6e8',vine:'#9de0ff',gem:'#ffe27a',music:'space',dark:1},
 sky:{g:1800,jv:680,maxFall:720,sky:'#f7e1e6',sky2:'#ead3ef',sky3:'#dcc3ea',fill:'#b49ad0',fill2:'#9a80b8',top:'#f5d67e',tuft:'#d9b350',plat:'#c9a6dc',haz:'#d87fa8',vine:'#88c070',gem:'#7fe3ff',music:'final'}};

/* ============ LEVELS ============ */
function mk(w,h){h=h||15;const g=[];for(let r=0;r<h;r++)g.push(new Array(w).fill('.'));
 const set=(c,r,ch)=>{if(c>=0&&c<w&&r>=0&&r<h)g[r][c]=ch;};
 const L={w,h,g,
  G(c0,c1,top){top=top??13;for(let c=c0;c<=c1;c++)for(let r=top;r<h;r++)set(c,r,'#');return L;},
  P(r,c0,c1,ch){for(let c=c0;c<=c1;c++)set(c,r,ch||'=');return L;},
  O(r,c0,c1,st){for(let c=c0;c<=c1;c+=(st||1))set(c,r,'o');return L;},
  S(c,r,ch){set(c,r,ch);return L;},
  V(c,r0,r1,ch){for(let r=r0;r<=r1;r++)set(c,r,ch||'L');return L;},
  R(c0,r0,c1,r1,ch){for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)set(c,r,ch);return L;}};
 return L;}

 {id:'1-3',name:'Windy Treetops',world:'forest',w:86,

 {id:'2-1',name:'Coral Cove',world:'reef',w:80,

 g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g);g.connect(dest);o.start(t0);o.stop(t0+dur+.05);}

/* ============ PHYSICS ============ */
function moveX(p,dx){if(!dx)return;p.x+=dx;const r0=Math.floor(p.y/T),r1=Math.floor((p.y+p.h-.01)/T);
 if(dx>0){const c=Math.floor((p.x+p.w)/T);for(let r=r0;r<=r1;r++)if(SOLID(tileAt(c,r))){p.x=c*T-p.w-.01;p.vx=0;break;}}
 else{const c=Math.floor(p.x/T);for(let r=r0;r<=r1;r++)if(SOLID(tileAt(c,r))){p.x=(c+1)*T+.01;p.vx=0;break;}}}
function moveY(p,dy,prevFeet){p.y+=dy;const c0=Math.floor(p.x/T),c1=Math.floor((p.x+p.w-.01)/T);
 if(dy>0){const r=Math.floor((p.y+p.h)/T);for(let c=c0;c<=c1;c++){const ch=tileAt(c,r);if(SOLID(ch)||(ch==='='&&prevFeet<=r*T+.5)){p.y=r*T-p.h;p.vy=0;p.onG=true;break;}}}
 else if(dy<0){const r=Math.floor(p.y/T);for(let c=c0;c<=c1;c++){if(SOLID(tileAt(c,r))){p.y=(r+1)*T+.01;p.vy=0;p.cut=true;break;}}}}
function stepPlayer(p,inp,dt){const Wd=lv.world;if(p.dead)return;
 if(p.inv>0)p.inv-=dt;if(p.vineCd>0)p.vineCd-=dt;
 if(p.ride){moveX(p,p.ride.dx);p.y+=p.ride.dy;}p.ride=null;
 const cx=p.x+p.w/2,cy=p.y+p.h/2,here=tileAt(Math.floor(cx/T),Math.floor(cy/T));
 const onVine=here==='L';
 const dir=(inp.right?1:0)-(inp.left?1:0);if(dir)p.face=dir;
 if(onVine&&!p.climb&&p.vineCd<=0&&(inp.up||(inp.down&&!p.onG)))p.climb=true;
 if(!onVine)p.climb=false;
 if(p.climb){p.vx=dir*110;p.vy=((inp.down?1:0)-(inp.up?1:0))*150;p.dbl=true;if(p.vy<0&&tileAt(Math.floor(cx/T),Math.floor((cy-8)/T))!=='L')p.vy=0;

function overlap(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;}

 // platforms

  const py=s.y;s.y+=s.vy*dt;const c=Math.floor(s.x/T),r=Math.floor(s.y/T),ch=tileAt(c,r);

  el('h3',null,'Treasures'),ig,el('h3',null,'Friends'),fg,el('div',{class:'row'},btn('Close',close,'go')));
 openOv(p,{back:close,ok:close});}

/* ============ TITLE / SAVE SLOTS ============ */
function toTitle(){state.screen='title';lv=null;music('map');setHud(el('div',{class:'topbar'},el('span',{class:'spacer'}),soundBtn()));showSlots();}
function showSlots(renaming,confirmDel){const wrapEl=el('div',{class:'panel',style:'background:rgba(255,250,240,.93);text-align:center'});
 const slots=el('div',{class:'slots'});
 store.slots.forEach((s,i)=>{const card=el('div',{class:'slot'});
  if(!s){card.append(el('div',{class:'nm'},'Empty Slot'),el('div',{class:'st'},'Start a brand new adventure!'),btn('✨ New Game',()=>{slotIdx=i;save=newSave('Adventure '+(i+1));store.slots[i]=save;persist();showSlots(i);},'go'));}
  else if(renaming===i){const inp=el('input',{type:'text',maxlength:'18',value:s.name});const ok=()=>{const v=inp.value.trim();if(v)s.name=v;persist();showSlots();};
   inp.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')ok();});card.append(el('div',{class:'st'},'Name this save:'),inp,el('div',{class:'row',style:'margin-top:.4em'},btn('✓ OK',ok,'go')));setTimeout(()=>{inp.focus();inp.select();},50);}
  else{card.append(el('div',{class:'nm'},s.name),el('div',{class:'st'},'★ '+totalStars(s)+'/30 · 💎 '+s.gems+' · 💗 '+Object.keys(s.friends).length+'/10'),
   el('div',{class:'row'},btn('▶ Play',()=>playSlot(i),'go'),btn('✏️',()=>showSlots(i)),btn(confirmDel===i?'Sure? 🗑':'🗑',()=>{if(confirmDel===i){store.slots[i]=null;persist();showSlots();}else showSlots(undefined,i);},confirmDel===i?'warn':'')));}
  slots.append(card);});
 wrapEl.append(slots,el('div',{class:'help'},'Your progress saves by itself in this browser. ✏️ renames a save.'));
 const box=el('div',{style:'display:flex;flex-direction:column;align-items:center;gap:.5em;width:100%'},wrapEl);
 openOv(box,{ok:()=>{const i=store.slots.findIndex(s=>s);if(i>=0)playSlot(i);}},true);}
function playSlot(i){slotIdx=i;save=store.slots[i];
 // fill missing fields for older saves
 const d=newSave(save.name);for(const k in d)if(save[k]===undefined)save[k]=d[k];for(const k in d.ab)if(save.ab[k]===undefined)save.ab[k]=false;
 closeOv();
 if(!save.seen.intro){save.seen.intro=true;writeSave();dialog(["Once upon a time, a fluffy silkie chicken named Pip lived in a cozy treehouse in Wanderleaf.","One windy night, a great big storm blew all of Pip's friends far, far away!","Some landed in the forest, some sank down to the reef, and some floated all the way up to the stars.","Pip fluffed up her feathers. \"Don't worry, friends. I'll find every one of you and bring you home!\""],toMap);}
 else toMap();}
function drawTitle(){const t=state.t;ctx.fillStyle='#e8f2d8';ctx.fillRect(0,0,W,H);ctx.beginPath();ctx.arc(800,90,40,0,7);ctx.fillStyle='#fff1b8';ctx.fill();
 for(let i=0;i<4;i++){wcloud(((i*300-t*12)%1300+1300)%1300-150,80+i*28,60,20,7,i+40,.35);fs('#fff',1.6);}
 wcloud(200,560,360,170,10,1,.12);fs('#cfe6b6',2.4);wcloud(760,580,380,190,10,2,.12);fs('#b6d79d',2.4);
 for(const [x,h] of [[90,150],[870,180],[650,130]]){ctx.beginPath();ctx.rect(x-6,H-h-40,12,h);fs('#c7a97f',2);wcloud(x,H-h-60,46,38,8,x,.3);fs('#8cc56a',2.2);}
 ctx.save();ctx.translate(480,92);ctx.rotate(Math.sin(t)*.015);txt('Wanderleaf',0,0,92,'#ffcf5a','center',10);ctx.font='92px '+FONT;ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.strokeText('Wanderleaf',0,0);ctx.restore();
 txt('a silkie chicken adventure',480,150,28,'#6a5a4a','center',5);
 const px=480+Math.sin(t*.6)*250,dir=Math.cos(t*.6)>0?1:-1;drawChicken(px,250-Math.abs(Math.sin(t*5))*10,1.8,'white','none',dir,{t,walk:t});
 drawFriend('chick',px-dir*60,252-Math.abs(Math.sin(t*5+1))*6,t,1.2);}

/* ============ MAIN LOOP ============ */
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;state.t+=dt;BOIL=Math.floor(now/150)%3;
 if(state.screen==='level'&&lv&&!state.pause&&!ovOpen)updateLevel(dt);else if(state.screen==='map'&&!ovOpen)updateMap(dt);else if(state.screen==='home'&&!ovOpen)updateHome(dt);
 ctx.setTransform(S*DPR,0,0,S*DPR,0,0);ctx.lineCap='round';ctx.lineJoin='round';
 try{if(state.screen==='level'&&lv)drawLevel();else if(state.screen==='map')drawMap();else if(state.screen==='home')drawHome();else drawTitle();}catch(e){console.error(e);}
 paperOverlay();}
cv.addEventListener('pointerdown',e=>{initAudio();const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;if(ovOpen)return;if(state.screen==='map')mapClick(x,y);else if(state.screen==='home')homeClick(x,y);});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.screen==='level'&&!ovOpen)pauseMenu();});
toTitle();requestAnimationFrame(frame);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{});
</script>
</body>
