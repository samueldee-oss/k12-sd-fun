<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Chameleon Hide & Seek</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; background: #1d3b2a; font-family: "Comic Sans MS", "Chalkboard SE", "Trebuchet MS", sans-serif; color: #fff; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #bar { width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; gap: 8px; }
  .pill { background: rgba(0,0,0,.35); border-radius: 999px; padding: 6px 14px; font-size: 19px; font-weight: bold; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .pill img { height: 22px; }
  #bar button { font-size: 20px; border: none; border-radius: 999px; padding: 6px 14px; background: #ffd23f; color: #5a3b00; font-weight: bold; cursor: pointer; font-family: inherit; box-shadow: 0 3px 0 #b8860b; }
  #stage { position: relative; }
  canvas { display: block; border-radius: 18px; box-shadow: 0 6px 24px rgba(0,0,0,.4); touch-action: none; cursor: pointer; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; border-radius: 18px; padding: 16px; background: rgba(10, 40, 25, .82); }
  .overlay h1 { margin: 0; font-size: clamp(28px, 6vw, 58px); text-shadow: 0 4px 0 #0b5d2a; color: #b6ff6b; }
  .overlay h2 { margin: 0; font-size: clamp(24px, 4.4vw, 42px); text-shadow: 0 3px 0 rgba(0,0,0,.4); }
  .overlay p { margin: 0; font-size: clamp(15px, 2.5vw, 23px); max-width: 680px; }
  .big { font-size: clamp(17px, 2.8vw, 26px); border: none; border-radius: 18px; padding: 10px 18px; font-weight: bold; cursor: pointer; font-family: inherit; color: #fff; }
  .big:active { transform: translateY(3px); }
  .green { background: #2ecc71; box-shadow: 0 5px 0 #1e8449; }
  .blue  { background: #3a8dde; box-shadow: 0 5px 0 #1f5f9e; }
  .orange{ background: #ff8c2a; box-shadow: 0 5px 0 #b85a00; }
  .brown { background: #9b6b3d; box-shadow: 0 5px 0 #5e3d1f; }
  .purple{ background: #9b59b6; box-shadow: 0 5px 0 #6c3483; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .dock { position: absolute; left: 0; right: 0; bottom: 8px; display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; pointer-events: none; padding: 0 8px; }
  .dock > * { pointer-events: auto; }
  .card { background: rgba(0,0,0,.6); border-radius: 18px; padding: 8px 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .card .t { font-size: clamp(16px, 2.6vw, 24px); font-weight: bold; }
  .part { display: flex; align-items: center; gap: 6px; background: #fff; color: #333; border: none; border-radius: 14px; padding: 6px 10px; font-family: inherit; font-weight: bold; font-size: clamp(14px, 2.2vw, 20px); cursor: pointer; box-shadow: 0 4px 0 #aaa; }
  .part .sw { width: 26px; height: 26px; border-radius: 50%; border: 3px solid #333; }
  .part.sel { outline: 5px solid #ffd23f; transform: translateY(-3px); }
  .tool.sel { outline: 5px solid #ffd23f; }
  .hidden { display: none !important; }
  .starsBig { font-size: clamp(30px, 6vw, 54px); letter-spacing: 6px; }
</style>

<link rel="manifest" href="manifest.webmanifest">

<meta name="apple-mobile-web-app-title" content="Chameleon Hide & Seek">

</head>
<body>
<div id="wrap">
  <div id="bar">
    <button id="mapBtn" title="Map">🗺️ Map</button>
    <div class="pill" id="placePill">🏠 Home</div>
    <div class="pill" id="invPill"></div>
    <div class="pill" id="starPill">⭐ 0</div>
  </div>
  <div id="stage">
    <canvas id="c" width="1000" height="625"></canvas>

    <!-- title -->
    <div class="overlay" id="title">
      <h1>🦎 Chameleon<br>Hide &amp; Seek</h1>
      <p>Climb to a sneaky spot, copy colors from the world onto your chameleon, and hide so well nobody can find you!</p>
      <button class="big green" id="startBtn" style="font-size:30px;padding:14px 30px">▶ Let's Go!</button>
    </div>

    <!-- map dock -->
    <div class="dock hidden" id="mapDock" style="top:8px;bottom:auto"><div class="card" id="mapCard"></div></div>

    <!-- climb dock -->
    <div class="dock hidden" id="climbDock" style="justify-content:flex-end">
      <span class="hidden" id="climbTip"></span>
      <button class="big green" id="hideHereBtn">✅ Hide here!</button>
    </div>

    <!-- paint dock -->
    <div class="dock hidden" id="paintDock">
      <div class="card" id="partRow"></div>
      <button class="big orange" id="paintDone">👀 I'm hidden!</button>
    </div>

    <!-- workshop dock -->
    <div class="dock hidden" id="workDock"><div class="card" id="workCard"></div></div>

    <!-- curtain for 2 player -->
    <div class="overlay hidden" id="curtain">
      <h2>🙈 Seeker's turn!</h2>
      <p>Hider, cover your eyes... just kidding, look away! 😄<br>Seeker: tap where you think the chameleon is.<br>Wrong taps say <b>HOT 🔥</b> or <b>COLD ❄️</b>.</p>
      <button class="big orange" id="seekGo">👀 Ready, set, SEEK!</button>
    </div>

    <!-- results -->
    <div class="overlay hidden" id="result">
      <h2 id="resTitle"></h2>
      <div class="starsBig" id="resStars"></div>
      <p id="resText"></p>
      <div class="row">
        <button class="big green" id="resAgain">🔁 Hide again</button>
        <button class="big blue" id="resMap">🗺️ Back to map</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
const W = 1000, H = 625;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H; const bctx = buf.getContext('2d');
const $ = id => document.getElementById(id);
const FONT = '"Comic Sans MS", "Chalkboard SE", sans-serif';

// ---------- helpers ----------
function rngFrom(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hex = h => { h = h.replace('#',''); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; };
const rgb = (c, a=1) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const mix = (a, b, t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
const shade = (c, f) => c.map(v => Math.max(0, Math.min(255, v*f)));
const pick = (r, arr) => arr[Math.floor(r()*arr.length)];
const dist = (a, b) => Math.hypot(a.x-b.x, a.y-b.y);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const GREEN = [76, 209, 55], DKGREEN = [40, 140, 40];
function hslRgb(h) { const s=0.85,l=0.55,k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))); return [f(0)*255,f(8)*255,f(4)*255]; }

// ---------- save ----------
const S = { stars: { tree: 0, field: 0, mountain: 0 }, branch: null, hasStick: false, stickImg: null };
try { const s = JSON.parse(localStorage.getItem('chamHS') || 'null'); if (s) Object.assign(S, s); } catch(e) {}
function save() { try { localStorage.setItem('chamHS', JSON.stringify(S)); } catch(e) {} }
let stickImage = null;
function loadStickImg() { if (S.stickImg) { stickImage = new Image(); stickImage.src = S.stickImg; } }
loadStickImg();

// ---------- sound ----------
let actx = null;
function snd(freq, dur=0.12, type='sine', vol=0.15, delay=0, slide=0) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
const sfx = {
  yay: () => [523,659,784,1047,1319].forEach((f,i)=>snd(f,0.18,'triangle',0.18,i*0.09)),
  hop: () => snd(300, 0.15, 'sine', 0.15, 0, 700),
  slip: () => snd(700, 0.4, 'sawtooth', 0.06, 0, 150),
  pop: () => snd(880, 0.08, 'sine', 0.15),
  drip: () => { snd(1200, 0.06, 'sine', 0.12, 0, 600); snd(900, 0.08, 'sine', 0.1, 0.06, 1400); },
  no: () => { snd(220, 0.15, 'square', 0.06); snd(180, 0.2, 'square', 0.06, 0.12); },
  hoot: () => { snd(420, 0.25, 'sine', 0.18, 0, 380); snd(420, 0.35, 'sine', 0.18, 0.35, 360); },
  carve: () => snd(2000 + Math.random()*1500, 0.04, 'sawtooth', 0.025),
  sizzle: () => snd(3000 + Math.random()*2000, 0.05, 'square', 0.015),
  sad: () => [392, 330, 262].forEach((f,i)=>snd(f,0.25,'triangle',0.15,i*0.2)),
};

// ---------- shape painters ----------
function leaf(g, x, y, s, r, c) { g.save(); g.translate(x,y); g.rotate(r); g.fillStyle = rgb(c); g.beginPath(); g.moveTo(-s,0); g.quadraticCurveTo(0,-s*0.6,s,0); g.quadraticCurveTo(0,s*0.6,-s,0); g.fill(); g.strokeStyle = rgb(shade(c,0.78)); g.lineWidth = Math.max(1.5,s*0.06); g.beginPath(); g.moveTo(-s*0.9,0); g.lineTo(s*0.9,0); g.stroke(); g.restore(); }
function flower(g, x, y, s, c) { g.fillStyle = rgb(c); for (let i=0;i<5;i++){ const a=i*Math.PI*2/5; g.beginPath(); g.arc(x+Math.cos(a)*s*0.55, y+Math.sin(a)*s*0.55, s*0.45, 0, Math.PI*2); g.fill(); } g.fillStyle = '#ffe14d'; g.beginPath(); g.arc(x,y,s*0.3,0,Math.PI*2); g.fill(); }
function rock(g, x, y, s, c, rr, sq=0.8) { g.fillStyle = rgb(c); g.beginPath(); const n=9; for (let i=0;i<=n;i++){ const a=i/n*Math.PI*2, rad=s*(0.8+0.22*Math.sin(i*2.3+rr*10)); const px=x+Math.cos(a)*rad*1.25, py=y+Math.sin(a)*rad*sq; i?g.lineTo(px,py):g.moveTo(px,py);} g.closePath(); g.fill(); g.fillStyle = rgb(shade(c,1.15),0.55); g.beginPath(); g.ellipse(x-s*0.3,y-s*0.3*sq,s*0.4,s*0.18,0,0,Math.PI*2); g.fill(); }
function cloud(g, x, y, s) { g.fillStyle = 'rgba(255,255,255,.92)'; g.beginPath(); g.arc(x,y,s,0,Math.PI*2); g.arc(x+s,y+s*0.2,s*0.8,0,Math.PI*2); g.arc(x-s,y+s*0.25,s*0.7,0,Math.PI*2); g.fill(); }
function tuft(g, x, y, s, c) { g.strokeStyle = rgb(c); g.lineWidth = 3; g.lineCap='round'; for (let i=-2;i<=2;i++){ g.beginPath(); g.moveTo(x+i*3,y); g.quadraticCurveTo(x+i*5,y-s*0.6,x+i*8,y-s); g.stroke(); } }

// ---------- chameleon (with paintable parts) ----------
const PARTS = [
  { k: 'body', name: 'Body', pts: [[0,0],[-20,-8],[20,8],[-25,8],[15,-12],[0,14]] , w: 0.32 },
  { k: 'head', name: 'Head', pts: [[34,6],[50,4],[30,-10],[40,-18]], w: 0.2 },
  { k: 'tail', name: 'Tail', pts: [[-50,10],[-62,25],[-45,40],[-38,24]], w: 0.16 },
  { k: 'legs', name: 'Legs', pts: [[-24,28],[-2,28],[11,28],[30,26]], w: 0.16 },
  { k: 'stripes', name: 'Stripes', pts: [[-18,-6],[-4,6],[10,-4],[-18,10]], w: 0.16 },
];
function defaultPaint() { return { body: GREEN, head: GREEN, tail: GREEN, legs: GREEN, stripes: DKGREEN }; }

function drawCham(g, x, y, s, P, flip, o={}) {
  g.save(); g.translate(x, y); g.scale(flip * s, s);
  if (o.wiggle) g.rotate(Math.sin(o.wiggle) * 0.15);
  g.lineCap = 'round'; g.lineJoin = 'round';
  const out = o.outline ? 'rgba(20,60,20,.9)' : null;
  // tail
  g.strokeStyle = rgb(P.tail); g.lineWidth = 11;
  g.beginPath(); g.moveTo(-32, 6); g.quadraticCurveTo(-62, 8, -62, 30); g.arc(-50, 30, 12, Math.PI, Math.PI * 2.7); g.stroke();
  // legs
  g.strokeStyle = rgb(P.legs); g.lineWidth = 7;
  [[-20,14,-26,32],[-6,16,-2,33],[14,16,10,33],[26,12,32,30]].forEach(([a,b,c,d])=>{ g.beginPath(); g.moveTo(a,b); g.lineTo(c,d); g.stroke(); });
  // body
  g.fillStyle = rgb(P.body); g.beginPath(); g.ellipse(0, 0, 40, 22, 0, 0, Math.PI*2); g.fill();
  if (out) { g.strokeStyle = out; g.lineWidth = 2.5; g.stroke(); }
  // head
  g.fillStyle = rgb(P.head);
  g.beginPath(); g.moveTo(22,-16); g.quadraticCurveTo(34,-34,48,-10); g.lineTo(62,2); g.quadraticCurveTo(58,20,30,18); g.closePath(); g.fill();
  if (out) { g.strokeStyle = out; g.lineWidth = 2.5; g.stroke(); }
  // stripes + crest
  g.strokeStyle = rgb(P.stripes); g.lineWidth = 5;
  [-18,-4,10].forEach(sx => { g.beginPath(); g.moveTo(sx,-18); g.quadraticCurveTo(sx+6,0,sx,18); g.stroke(); });
  g.fillStyle = rgb(P.stripes);
  for (let i=-30;i<=20;i+=10){ g.beginPath(); g.arc(i, -21 + Math.abs(i)*0.08, 3.4, 0, Math.PI*2); g.fill(); }
  // eye turret
  g.fillStyle = rgb(shade(P.head, 1.08)); g.beginPath(); g.arc(40, -3, 10, 0, Math.PI*2); g.fill();
  g.strokeStyle = rgb(shade(P.head, 0.7)); g.lineWidth = 2; g.stroke();
  if (!o.blink) {
    g.fillStyle = '#fff'; g.beginPath(); g.arc(41, -3, 5.5, 0, Math.PI*2); g.fill();
    g.fillStyle = '#111'; g.beginPath(); g.arc(43, -3, 3, 0, Math.PI*2); g.fill();
  } else { g.strokeStyle = '#222'; g.lineWidth = 2; g.beginPath(); g.moveTo(35,-3); g.lineTo(47,-3); g.stroke(); }
  g.strokeStyle = rgb(shade(P.head, 0.6)); g.lineWidth = 2; g.beginPath(); g.arc(50, 6, 7, 0.2, 1.3); g.stroke();
  if (o.tongue) { g.strokeStyle = '#ff4d79'; g.lineWidth = 3; g.beginPath(); g.moveTo(60,6); g.lineTo(60 + o.tongue, 4); g.stroke(); g.fillStyle='#ff4d79'; g.beginPath(); g.arc(60+o.tongue,4,4,0,Math.PI*2); g.fill(); }
  g.restore();
}

// ---------- owl ----------
function drawOwl(g, x, y, s, t) {
  g.save(); g.translate(x, y + Math.sin(t*6)*4); g.scale(s, s);
  const flap = Math.sin(t*10) * 0.35;
  // little wings (waving)
  g.fillStyle = '#c9a0dc';
  g.save(); g.rotate(-0.3 - flap); g.beginPath(); g.ellipse(-30, 4, 18, 11, 0.3, 0, Math.PI*2); g.fill(); g.restore();
  g.save(); g.rotate(0.3 + flap); g.beginPath(); g.ellipse(30, 4, 18, 11, -0.3, 0, Math.PI*2); g.fill(); g.restore();
  // round fluffy body
  g.fillStyle = '#b388d6'; g.beginPath(); g.arc(0, 0, 32, 0, Math.PI*2); g.fill();
  g.fillStyle = '#f3e1ff'; g.beginPath(); g.ellipse(0, 12, 20, 18, 0, 0, Math.PI*2); g.fill();
  // tiny soft ear tufts
  g.fillStyle = '#b388d6'; g.beginPath(); g.arc(-20, -27, 8, 0, Math.PI*2); g.arc(20, -27, 8, 0, Math.PI*2); g.fill();
  // big sparkly eyes
  g.fillStyle = '#fff'; g.beginPath(); g.arc(-12, -8, 12, 0, Math.PI*2); g.arc(12, -8, 12, 0, Math.PI*2); g.fill();
  const blink = (t % 3) < 0.15;
  if (blink) { g.strokeStyle = '#3a2350'; g.lineWidth = 3; g.beginPath(); g.arc(-12,-8,6,0.2,Math.PI-0.2); g.stroke(); g.beginPath(); g.arc(12,-8,6,0.2,Math.PI-0.2); g.stroke(); }
  else {
    g.fillStyle = '#3a2350'; g.beginPath(); g.arc(-11, -7, 7, 0, Math.PI*2); g.arc(13, -7, 7, 0, Math.PI*2); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(-8, -10, 2.8, 0, Math.PI*2); g.arc(16, -10, 2.8, 0, Math.PI*2); g.fill();
  }
  // rosy cheeks + tiny beak smile
  g.fillStyle = 'rgba(255,120,160,.55)'; g.beginPath(); g.ellipse(-22, 6, 6, 4, 0, 0, Math.PI*2); g.ellipse(22, 6, 6, 4, 0, 0, Math.PI*2); g.fill();
  g.fillStyle = '#ffb347'; g.beginPath(); g.moveTo(-4, 2); g.lineTo(4, 2); g.lineTo(0, 8); g.fill();
  // flower on head
  flower(g, 14, -30, 6, [255,140,190]);
  // basket held below
  g.translate(0, 40);
  g.strokeStyle = '#8b5a2b'; g.lineWidth = 4; g.beginPath(); g.arc(0, -4, 16, Math.PI, 0); g.stroke();
  g.fillStyle = '#d9a05b'; g.beginPath(); g.moveTo(-20, -4); g.lineTo(20, -4); g.lineTo(15, 16); g.lineTo(-15, 16); g.closePath(); g.fill();
  g.strokeStyle = '#a8743c'; g.lineWidth = 2; for (let y = 1; y < 16; y += 5) { g.beginPath(); g.moveTo(-19 + y*0.3, y); g.lineTo(19 - y*0.3, y); g.stroke(); }
  // berries + flowers peeking out of basket
  g.fillStyle = '#e74c3c'; g.beginPath(); g.arc(-8, -7, 4, 0, Math.PI*2); g.arc(6, -8, 4, 0, Math.PI*2); g.fill();
  flower(g, -1, -9, 4, [255,230,90]);
  g.restore();
}

// ---------- LEVELS ----------
function newCanvas() { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; }

function buildTree() {
  const c = newCanvas(), g = c.getContext('2d'), r = rngFrom(11);
  const sky = g.createLinearGradient(0,0,0,H); sky.addColorStop(0,'#8fd8ff'); sky.addColorStop(1,'#d9f5ff'); g.fillStyle = sky; g.fillRect(0,0,W,H);
  cloud(g, 120, 80, 28); cloud(g, 880, 60, 24);
  g.fillStyle = '#9bd47a'; g.beginPath(); g.ellipse(200, 560, 400, 120, 0, Math.PI, 0); g.fill(); g.beginPath(); g.ellipse(850, 560, 350, 100, 0, Math.PI, 0); g.fill();
  g.fillStyle = '#5cb85c'; g.fillRect(0, 545, W, 80);
  for (let i=0;i<70;i++) tuft(g, r()*W, 560+r()*65, 10+r()*10, pick(r, [[60,150,60],[90,180,70],[50,130,50]]));
  // trunk
  const bark = [[122,82,48],[94,61,34],[140,100,62],[107,72,40]];
  g.fillStyle = rgb(bark[0]); g.beginPath(); g.moveTo(420, 560); g.quadraticCurveTo(455, 500, 458, 150); g.lineTo(542, 150); g.quadraticCurveTo(545, 500, 580, 560); g.closePath(); g.fill();
  // branches
  g.lineCap = 'round'; g.strokeStyle = rgb(bark[0]);
  [[470,345,260,312,24],[530,275,770,232,22],[480,215,230,188,18]].forEach(([a,b,cx,d,w])=>{ g.lineWidth=w; g.beginPath(); g.moveTo(a,b); g.quadraticCurveTo((a+cx)/2,(b+d)/2-20,cx,d); g.stroke(); });
  for (let i=0;i<120;i++) { const y = 160+r()*400, x = 462+r()*76; g.strokeStyle = rgb(pick(r, bark)); g.lineWidth = 3+r()*4; g.beginPath(); g.moveTo(x, y); g.lineTo(x+(r()-0.5)*6, y+12+r()*20); g.stroke(); }
  // moss
  for (let i=0;i<14;i++) { g.fillStyle = rgb(pick(r, [[107,142,35],[85,120,40],[130,160,60]])); g.beginPath(); g.ellipse(465+r()*70, 330+r()*200, 8+r()*8, 5+r()*5, 0, 0, Math.PI*2); g.fill(); }
  // canopy
  const greens = [[63,163,77],[45,138,62],[92,196,99],[31,110,47],[123,209,107],[76,175,80],[147,201,74]];
  for (let i=0;i<70;i++) { const x = 190 + r()*620, y = 40 + r()*190 - Math.abs(x-500)*-0.05; g.fillStyle = rgb(pick(r, greens)); g.beginPath(); g.arc(x, y, 30+r()*40, 0, Math.PI*2); g.fill(); }

const LEVELS = {};
function getLevel(id) {
  if (!LEVELS[id]) {
    const L = id === 'tree' ? buildTree() : id === 'field' ? buildField() : buildMountain();
    L.data = L.canvas.getContext('2d').getImageData(0, 0, W, H).data;
    L.holds.forEach(h => h.high = h.y < L.stickLine);
    LEVELS[id] = L;
  }
  return LEVELS[id];
}
function px(L, x, y) { x = clamp(Math.round(x), 0, W-1); y = clamp(Math.round(y), 0, H-1); const i = (y*W + x)*4; return [L.data[i], L.data[i+1], L.data[i+2]]; }

// ---------- camo score ----------
function camoScore(L, ch) {
  let total = 0; const per = {};
  PARTS.forEach(p => {
    let sum = 0;
    p.pts.forEach(([lx, ly]) => {
      const bg = px(L, ch.x + ch.flip * ch.s * lx, ch.y + ch.s * ly);
      const c = ch.paint[p.k];
      const d = Math.hypot(c[0]-bg[0], c[1]-bg[1], c[2]-bg[2]);
      sum += Math.max(0, 1 - d / 160);
    });
    per[p.k] = sum / p.pts.length;
    total += per[p.k] * p.w;
  });
  return { total, per };
}

function strokePts(g, pts) { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i=1;i<pts.length-1;i++){ const mx=(pts[i][0]+pts[i+1][0])/2, my=(pts[i][1]+pts[i+1][1])/2; g.quadraticCurveTo(pts[i][0], pts[i][1], mx, my); } g.lineTo(pts[pts.length-1][0], pts[pts.length-1][1]); g.stroke(); }
function drawBranchSprite(g, x, y, type, s=0.16, rot=0) {
  const B = BRANCHES[type];

  g.restore();
}

  updateBar();
}

function holdPos(i) { const h = L.holds[i]; return { x: h.x, y: h.y - 12 }; }
const REACH = 175;

function tryHop(i) {
  if (anim) return;
  const h = L.holds[i], cur = L.holds[cham.hold];
  if (i === cham.hold) return;
  if (h.high && !S.hasStick) { sfx.no(); msg('🔒 Too high! Make a walking stick 🦯 in the Workshop!', W/2, 90, '#ffd23f', 2.4); return; }
  if (dist(h, cur) > REACH) { sfx.no(); msg('Too far! Hop to a closer 🟡 spot', h.x, h.y - 40, '#fff'); return; }
  const to = holdPos(i);
  cham.flip = to.x >= cham.x ? 1 : -1;
  anim = { type: 'hop', from: { x: cham.x, y: cham.y }, to, t: 0, dur: 0.45, target: i };
  sfx.hop();
}

function animStep(dt) {
  if (!anim) return;
  anim.t += dt / anim.dur;
  const k = Math.min(1, anim.t);
  if (anim.type === 'hop') {
    cham.x = anim.from.x + (anim.to.x - anim.from.x) * k;
    cham.y = anim.from.y + (anim.to.y - anim.from.y) * k - Math.sin(k * Math.PI) * 50;
  } else if (anim.type === 'slide') {
    const e = k * k;
    cham.x = anim.from.x + (anim.to.x - anim.from.x) * e;
    cham.y = anim.from.y + (anim.to.y - anim.from.y) * e;
  }
  if (k >= 1) {
    const a = anim; anim = null;
    if (a.type === 'hop') {
      cham.prevHold = cham.hold; cham.hold = a.target;
      const h = L.holds[a.target];
      if (h.slip) {
        if (S.hasStick) { msg('Slippery! Your walking stick kept you steady 🦯', h.x, h.y - 50, '#7fd6ff', 2); sfx.pop(); }
        else {
          msg('Whoa! Slippery! 💧', h.x, h.y - 50, '#7fd6ff', 1.6); sfx.slip();
          const back = holdPos(cham.prevHold);
          anim = { type: 'slide', from: { x: cham.x, y: cham.y }, to: back, t: -0.35, dur: 0.6, target: cham.prevHold };
        }
      }
    } else if (a.type === 'slide') { cham.hold = a.target; }
  }
}

  if (anim) return;
  mode = 'paint'; selPart = 'body';
  hideAllDocks(); show('paintDock', true); buildPartRow();
  msg('Pick a body part, then tap the world to copy its color! 🎨', W/2, 70, '#fff', 3);
  updateBar();
}

function buildPartRow() {
  const row = $('partRow'); row.innerHTML = '';
  PARTS.forEach(p => {
    const b = document.createElement('button'); b.className = 'part' + (p.k === selPart ? ' sel' : '');
    b.innerHTML = `<span class="sw" style="background:${rgb(cham.paint[p.k])}"></span>${p.name}`;
    b.onclick = () => { selPart = p.k; sfx.pop(); buildPartRow(); };
    row.appendChild(b);
  });
}

function insetRect() { const w = 250, h = 170; return cham.x > 560 ? { x: 14, y: 14, w, h } : { x: W - w - 14, y: 14, w, h }; }
const ZOOM = 2.4;

function paintTap(p) {
  let wp = p;
  const R = insetRect();
  if (p.x > R.x && p.x < R.x + R.w && p.y > R.y && p.y < R.y + R.h) {
    wp = { x: cham.x + (p.x - (R.x + R.w/2)) / ZOOM, y: cham.y + (p.y - (R.y + R.h/2)) / ZOOM };
  }
  const col = px(L, wp.x, wp.y);
  cham.paint[selPart] = col;
  sfx.drip();
  for (let i=0;i<14;i++) parts.push({ x: p.x, y: p.y, vx: (Math.random()-0.5)*6, vy: (Math.random()-0.5)*6, c: rgb(col), life: 0.8, sz: 8, g: 0 });
  // auto-advance to the next part so it's easy
  const idx = PARTS.findIndex(q => q.k === selPart);
  selPart = PARTS[(idx + 1) % PARTS.length].k;
  buildPartRow();
}

function finishHiding() {
  hideAllDocks();
  const sc = camoScore(L, cham);
  cham.score = sc.total;
  if (players === 2) { mode = 'curtain'; show('curtain', true); sfx.pop(); }
  else startOwl();
  updateBar();
}

// ---------- owl seeker ----------
function startOwl() {
  mode = 'owl';
  const hb = clamp(1 - cham.y / H, 0, 1);
  const stealth = clamp(cham.score * 0.8 + hb * 0.3, 0, 0.97);
  const pFound = clamp(1.05 - stealth, 0.04, 0.92);
  const others = L.holds.map((h, i) => ({ h, i })).filter(o => o.i !== cham.hold && dist(o.h, cham) > 140).sort(() => Math.random() - 0.5).slice(0, 3);
  const looks = others.map(o => ({ x: o.h.x + (Math.random()-0.5)*40, y: o.h.y - 10, me: false }));
  const idx = stealth < 0.45 ? 1 : 3;
  looks.splice(idx, 0, { x: cham.x + (Math.random()-0.5)*30, y: cham.y + (Math.random()-0.5)*20, me: true });
  seek = { looks, i: 0, phase: 'move', t: 0, beam: { x: 60, y: 60 }, from: { x: 60, y: 60 }, pFound, stealth, said: '' , owl: { x: 60, y: 60 } };
  sfx.hoot();
  msg('🦉 Hoo hoo! Ready or not, here I come! 🧺', W/2, 80, '#ffd23f', 2.2);
}

function owlStep(dt) {
  const s = seek; if (!s || mode !== 'owl') return;
  s.t += dt;
  const look = s.looks[s.i];
  if (s.phase === 'wait0') { if (s.t > 1.0) { s.phase = 'move'; s.t = 0; } return; }
  if (s.phase === 'move') {
    const k = Math.min(1, s.t / 1.0), e = k < 0.5 ? 2*k*k : 1 - Math.pow(-2*k+2, 2)/2;
    s.beam.x = s.from.x + (look.x - s.from.x) * e; s.beam.y = s.from.y + (look.y - s.from.y) * e;
    if (k >= 1) { s.phase = 'look'; s.t = 0; }
  } else if (s.phase === 'look') {
    if (s.t > 1.1) {
      if (look.me && Math.random() < s.pFound) { owlEnd(true); return; }
      s.said = look.me ? pick(Math.random, ['Hmm... just leaves?', 'Nope, nothing here...', 'Was that a wiggle? Nah!']) : pick(Math.random, ['Not here...', 'Hmm, nope! 🍓', 'Where could my friend be?']);
      if (look.me) s.said = s.said.replace('leaves', L.id === 'mountain' ? 'rocks' : L.id === 'field' ? 'hay' : 'leaves');
      msg('🦉 ' + s.said, clamp(look.x, 150, W-150), Math.max(60, look.y - 90), '#fff', 1.4);
      s.i++; s.from = { x: s.beam.x, y: s.beam.y }; s.t = 0;
      if (s.i >= s.looks.length) { owlEnd(false); return; }
      s.phase = 'move';
    }
  }
  s.owl.x += (s.beam.x - s.owl.x) * Math.min(1, dt * 3); s.owl.y += (s.beam.y - 110 - s.owl.y) * Math.min(1, dt * 3);
}

function owlEnd(found) {
  mode = 'result';
  const pct = Math.round(cham.score * 100);
  const high = cham.y < H * 0.5;
  if (!found) {
    let stars = 1 + (pct >= 70 ? 1 : 0) + (high ? 1 : 0);
    S.stars[L.id] = Math.max(S.stars[L.id], stars); save();
    sfx.yay(); confetti(cham.x, cham.y);
    showResult('🏆 Owly couldn\'t find you!', stars, `Camo score: ${pct}%${high ? ' · High spot bonus! 🧗' : ''}<br>${pct < 70 ? 'Tip: copy colors from right next to your chameleon!' : 'Super sneaky chameleon! 🦎'}`);
  } else {
    sfx.hoot();
    msg('🦉 Peekaboo! Found you! Want a berry? 🍓', W/2, 90, '#ffd23f', 2.2);
    setTimeout(() => { sfx.sad(); showResult('🦉 Peekaboo! Owly found you!', 0, `Camo score: ${pct}%<br>Tip: tap the colors right around your chameleon${S.hasStick ? '' : ', or make a walking stick to climb higher'}!`); }, 1300);
  }
  updateBar();
}

// ---------- 2 player seek ----------
function startFriendSeek() { show('curtain', false); mode = 'friend'; seek = { tries: 0 }; updateBar(); }
function friendTap(p) {
  seek.tries++; updateBar();
  const d = Math.hypot(p.x - (cham.x + cham.flip * 8 * cham.s), p.y - cham.y);
  if (d < 52 * cham.s + 12) {
    mode = 'result'; sfx.yay(); confetti(cham.x, cham.y);
    const t = seek.tries, stars = t >= 10 ? 3 : t >= 6 ? 2 : t >= 3 ? 1 : 0;
    if (stars) { S.stars[L.id] = Math.max(S.stars[L.id], stars); save(); }
    setTimeout(() => showResult('🎉 Found it!', stars, `The seeker needed <b>${t}</b> ${t===1?'try':'tries'}!<br>Camo score: ${Math.round(cham.score*100)}%<br>Now switch: the seeker gets to hide! 🔁`), 1200);
    updateBar(); return;
  }
  let txt, c;
  if (d < 120) { txt = 'SO HOT! 🔥🔥'; c = '#ff3b3b'; } else if (d < 240) { txt = 'Warm ☀️'; c = '#ffb02e'; } else if (d < 420) { txt = 'Cool 🌬️'; c = '#7fd6ff'; } else { txt = 'Brrr, cold! ❄️'; c = '#bfe8ff'; }
  snd(d < 240 ? 520 : 200, 0.15, 'square', 0.07);
  taps.push({ x: p.x, y: p.y, life: 1 }); msg(txt, p.x, p.y - 30, c, 1.2);
}

function showResult(title, stars, text) {
  $('resTitle').textContent = title;
  $('resStars').textContent = stars ? '⭐'.repeat(stars) + '☆'.repeat(3 - stars) : '';
  $('resText').innerHTML = text;
  show('result', true); updateBar();
}
function confetti(x, y) { for (let i=0;i<120;i++) parts.push({ x, y, vx: (Math.random()-0.5)*14, vy: -Math.random()*14-3, c: `hsl(${Math.random()*360},90%,60%)`, life: 1.6, sz: 5+Math.random()*7, g: 0.45 }); }

// ---------- WORKSHOP ----------
let W_ = null; // workshop state
function enterWorkshop() {
  hideAllDocks(); mode = 'workshop';
  if (!S.branch) {
    W_ = { step: 'nobranch' };
  } else {
    const B = BRANCHES[S.branch];
    const mask = newCanvas(), mg = mask.getContext('2d');
    mg.lineCap = 'round'; mg.lineJoin = 'round'; mg.strokeStyle = '#000';
    mg.lineWidth = B.w; strokePts(mg, B.main); if (B.fork) { mg.lineWidth = B.w * 0.6; strokePts(mg, B.fork); }
    const r = rngFrom(5);
    const wood = newCanvas(), wg = wood.getContext('2d');
    wg.fillStyle = '#ecd0a2'; wg.fillRect(0,0,W,H);
    for (let i=0;i<60;i++) { wg.strokeStyle = `rgba(190,140,90,${0.3+r()*0.4})`; wg.lineWidth = 1+r()*2; const y0 = 260+r()*140; wg.beginPath(); wg.moveTo(0, y0); for (let x=0;x<=W;x+=40) wg.lineTo(x, y0 + Math.sin(x/90 + i)*4); wg.stroke(); }
    wg.globalCompositeOperation = 'destination-in'; wg.drawImage(mask, 0, 0);
    const bark = newCanvas(), kg = bark.getContext('2d');
    kg.fillStyle = '#6b4a2b'; kg.fillRect(0,0,W,H);
    for (let i=0;i<500;i++) { kg.strokeStyle = pick(r, ['#4e341d','#8a6440','#5a3d22','#7a5634']); kg.lineWidth = 2+r()*3; const x=r()*W, y=240+r()*180; kg.beginPath(); kg.moveTo(x,y); kg.lineTo(x+10+r()*30, y+(r()-0.5)*4); kg.stroke(); }
    for (let i=0;i<6;i++) { kg.fillStyle = '#3e2914'; kg.beginPath(); kg.ellipse(150+r()*700, 300+r()*40, 8, 5, 0, 0, Math.PI*2); kg.fill(); }
    kg.globalCompositeOperation = 'destination-in'; kg.drawImage(mask, 0, 0);
    const burn = newCanvas();
    W_ = { step: 'whittle', B, mask, wood, bark, burn, tool: 'pen', barkTotal: countAlpha(bark), progress: 0, last: null, moves: 0 };
  }
  show('workDock', true); buildWorkCard(); updateBar();
}
function countAlpha(c) { const d = c.getContext('2d').getImageData(0, 0, W, H).data; let n = 0; for (let y=0;y<H;y+=6) for (let x=0;x<W;x+=6) if (d[(y*W+x)*4+3] > 30) n++; return n; }

function buildWorkCard() {
  const card = $('workCard'); card.innerHTML = '';
  const add = (html, cls, fn, sel) => { const b = document.createElement('button'); b.className = 'big ' + cls + ' tool' + (sel ? ' sel' : ''); b.innerHTML = html; b.onclick = fn; card.appendChild(b); return b; };
  const txt = t => { const s = document.createElement('span'); s.className = 't'; s.innerHTML = t; card.appendChild(s); };
  if (W_.step === 'nobranch') {
    txt('🌿 You need a branch! Find one under the 🌳 Big Tree.');
    add('🗺️ Go to map', 'blue', enterMap);
  } else if (W_.step === 'whittle') {
    txt(`🔪 Whittle! Rub to carve off the bark: ${Math.min(100, Math.round(W_.progress / 0.75 * 100))}%`);
    if (W_.progress >= 0.75) add('🔥 Next: Wood burning ➜', 'orange', () => { W_.step = 'burn'; W_.tool = 'pen'; sfx.yay(); buildWorkCard(); });
  } else if (W_.step === 'burn') {
    txt('🔥 Wood burn!');
    [['pen','✏️ Draw'],['star','⭐'],['heart','❤️'],['bolt','⚡'],['spiral','🌀'],['zig','〰️']].forEach(([k, label]) => add(label, 'brown', () => { W_.tool = k; sfx.pop(); buildWorkCard(); }, W_.tool === k));
    add('🧽', 'blue', () => { W_.burn.getContext('2d').clearRect(0,0,W,H); sfx.pop(); });
    add('✅ Finish stick!', 'green', finishStick);
  } else if (W_.step === 'done') {
    txt('🦯 Your walking stick is ready!');
    add('🗺️ Go climb!', 'green', enterMap);
  }
}

function stickComposite() {
  const c = newCanvas(), g = c.getContext('2d');
  g.drawImage(W_.wood, 0, 0); g.drawImage(W_.bark, 0, 0);
  const b = newCanvas(), bg = b.getContext('2d'); bg.drawImage(W_.burn, 0, 0); bg.globalCompositeOperation = 'destination-in'; bg.drawImage(W_.mask, 0, 0);
  g.drawImage(b, 0, 0);
  return c;
}

function finishStick() {
  const full = stickComposite();
  const crop = document.createElement('canvas'); crop.width = 860; crop.height = 200;
  crop.getContext('2d').drawImage(full, 70, 220, 860, 200, 0, 0, 860, 200);
  S.stickImg = crop.toDataURL('image/png'); S.hasStick = true; S.branch = null; save(); loadStickImg();
  W_.step = 'done'; sfx.yay(); confetti(500, 320);
  msg('🦯 Walking stick made! Now you can climb HIGH spots and never slip!', W/2, 120, '#ffd23f', 3.5);
  buildWorkCard(); updateBar();
}

function stamp(g, type, x, y) {
  g.save(); g.translate(x, y); g.fillStyle = g.strokeStyle = '#3b1f0e'; g.lineWidth = 5; g.lineCap = 'round'; g.lineJoin = 'round';
  if (type === 'star') { g.beginPath(); for (let i=0;i<10;i++){ const a = -Math.PI/2 + i*Math.PI/5, rr = i%2 ? 8 : 18; g.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); } g.closePath(); g.fill(); }
  if (type === 'heart') { g.beginPath(); g.moveTo(0, 14); g.bezierCurveTo(-24, -2, -10, -20, 0, -8); g.bezierCurveTo(10, -20, 24, -2, 0, 14); g.fill(); }
  if (type === 'bolt') { g.beginPath(); g.moveTo(4,-18); g.lineTo(-10,2); g.lineTo(0,2); g.lineTo(-4,18); g.lineTo(10,-2); g.lineTo(0,-2); g.closePath(); g.fill(); }
  if (type === 'spiral') { g.beginPath(); for (let a=0;a<Math.PI*5;a+=0.2){ const rr = 16*a/(Math.PI*5); g.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); } g.lineWidth = 3.5; g.stroke(); }
  if (type === 'zig') { g.beginPath(); for (let i=0;i<=6;i++) g.lineTo(-30 + i*10, i%2 ? -8 : 8); g.lineWidth = 4; g.stroke(); }
  g.restore();
}

function workDown(p) {
  if (!W_ || !W_.B) return;
  if (W_.step === 'burn' && W_.tool !== 'pen') { stamp(W_.burn.getContext('2d'), W_.tool, p.x, p.y); smoke(p.x, p.y, 8); sfx.sizzle(); sfx.sizzle(); return; }
  W_.last = p; workMove(p);
}
function workMove(p) {
  if (!W_ || !W_.last || !W_.B) return;
  const a = W_.last, steps = Math.max(1, Math.ceil(dist(a, p) / 6));
  if (W_.step === 'whittle') {
    const g = W_.bark.getContext('2d'); g.save(); g.globalCompositeOperation = 'destination-out';
    for (let i=1;i<=steps;i++){ const x = a.x + (p.x-a.x)*i/steps, y = a.y + (p.y-a.y)*i/steps; g.beginPath(); g.arc(x, y, 24, 0, Math.PI*2); g.fill(); }
    g.restore();
    if (Math.random() < 0.5) parts.push({ x: p.x, y: p.y, vx: (Math.random()-0.5)*4, vy: -Math.random()*3, c: '#8a6440', life: 1.2, sz: 6, g: 0.3, curl: true, rot: Math.random()*6 });
    sfx.carve();
    if (++W_.moves % 8 === 0) { W_.progress = 1 - countAlpha(W_.bark) / W_.barkTotal; buildWorkCard(); }
  } else if (W_.step === 'burn' && W_.tool === 'pen') {
    const g = W_.burn.getContext('2d'); g.strokeStyle = '#3b1f0e'; g.lineWidth = 6; g.lineCap = 'round';
    g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(p.x, p.y); g.stroke();
    if (Math.random() < 0.4) smoke(p.x, p.y, 1);
    if (Math.random() < 0.3) sfx.sizzle();
  }
  W_.last = p;
}
function workUp() { if (W_ && W_.last) { W_.last = null; if (W_.step === 'whittle') { W_.progress = 1 - countAlpha(W_.bark) / W_.barkTotal; buildWorkCard(); } } }
function smoke(x, y, n) { for (let i=0;i<n;i++) parts.push({ x, y, vx: (Math.random()-0.5)*1.5, vy: -1-Math.random()*1.5, c: 'rgba(200,200,200,.6)', life: 1, sz: 10, g: -0.02, smoke: true }); }

// ---------- UI helpers ----------
function show(id, on) { $(id).classList.toggle('hidden', !on); }
function hideAllDocks() { ['mapDock','climbDock','paintDock','workDock','curtain','result'].forEach(id => show(id, false)); }
function updateBar() {
  const total = S.stars.tree + S.stars.field + S.stars.mountain;
  $('starPill').textContent = mode === 'friend' ? `👆 Tries: ${seek.tries}` : `⭐ ${total}/9`;
  const inv = $('invPill'); inv.innerHTML = '';
  if (S.hasStick && S.stickImg) inv.innerHTML = `<img src="${S.stickImg}" alt="stick">`;
  if (S.branch) inv.innerHTML += ' 🌿';
  if (!inv.innerHTML) inv.innerHTML = '🎒';
  let place = '🗺️ Map';
  if (mode === 'workshop') place = '🪵 Workshop';
  else if (L) place = `${L.emoji} ${L.name}`;
  else if (mapPos.node && !walkPath) place = `${MAP_NODES[mapPos.node].emoji} ${MAP_NODES[mapPos.node].name}`;
  $('placePill').textContent = place;
  $('mapBtn').style.visibility = mode === 'title' || mode === 'map' ? 'hidden' : 'visible';
}

function fit() {
  const barH = $('bar').offsetHeight + 12;
  const maxW = Math.min(window.innerWidth - 12, 1000), maxH = window.innerHeight - barH;
  let w = maxW, h = w * H / W; if (h > maxH) { h = maxH; w = h * W / H; }
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  $('stage').style.width = w + 'px'; $('stage').style.height = h + 'px';
}
window.addEventListener('resize', fit);

// ---------- input ----------
function toCanvas(e) { const rc = cv.getBoundingClientRect(); return { x: (e.clientX - rc.left) * W / rc.width, y: (e.clientY - rc.top) * H / rc.height }; }
cv.addEventListener('pointerdown', e => {
  const p = toCanvas(e);
  if (mode === 'map') {
    if (walkPath && walkPath.length) return;
    for (const [k, n] of Object.entries(MAP_NODES)) {
      if (dist(p, n) < 70) {
        if (k === mapPos.node) { updateMapCard(); return; }
        walkPath = routePoints(mapPos.node, k); walkPath.dest = k; mapPos.node = null; sfx.pop(); updateMapCard(); updateBar(); return;
      }
    }
    if (dist(p, { x: 385, y: 525 }) < 60 && mapPos.node === 'home') { enterWorkshop(); return; }
  } else if (mode === 'climb') {
    if (L.branches) {
      for (const b of L.branches) {
        if (!b.taken && dist(p, b) < 60) {
          b.taken = true; S.branch = b.type; save(); sfx.yay();
          msg(`🌿 You picked a ${b.type} branch! Take it to the 🪵 Workshop at home.`, W/2, 120, '#b6ff6b', 3);
          updateBar(); return;
        }
      }
    }
    let best = -1, bd = 45;
    L.holds.forEach((h, i) => { const d = dist(p, h); if (d < bd) { bd = d; best = i; } });
    if (best >= 0) tryHop(best);
  } else if (mode === 'paint') {
    paintTap(p);
  } else if (mode === 'friend') {
    friendTap(p);
  } else if (mode === 'workshop') {
    cv.setPointerCapture(e.pointerId); workDown(p);
  }
});
cv.addEventListener('pointermove', e => { if (mode === 'workshop') workMove(toCanvas(e)); });
cv.addEventListener('pointerup', () => { if (mode === 'workshop') workUp(); });
cv.addEventListener('pointercancel', () => { if (mode === 'workshop') workUp(); });

$('startBtn').onclick = () => { show('title', false); sfx.yay(); enterMap(); };
$('mapBtn').onclick = () => { if (walkPath) return; L = null; enterMap(); };
$('hideHereBtn').onclick = startPaint;
$('paintDone').onclick = finishHiding;
$('seekGo').onclick = startFriendSeek;
$('resAgain').onclick = () => enterLevel(L.id);
$('resMap').onclick = enterMap;

// ---------- render ----------
function drawWorld(g) {
  g.drawImage(L.canvas, 0, 0);
  if (L.branches && (mode === 'climb')) L.branches.forEach((b, i) => { if (!b.taken) { drawBranchSprite(g, b.x, b.y, b.type, 0.16, (i-1)*0.1); if (!S.branch && !S.hasStick) { g.fillStyle = `rgba(255,255,255,${0.4+0.4*Math.sin(T*5+i)})`; g.font = `bold 22px ${FONT}`; g.textAlign = 'center'; g.fillText('✨', b.x, b.y - 22); } } });
}

function render(dt) {
  const g = bctx;
  g.clearRect(0, 0, W, H);
  if (mode === 'title') {
    if (!mapCanvas) mapCanvas = buildMap();
    g.drawImage(mapCanvas, 0, 0);
    drawCham(g, W/2, H - 80, 1.4, defaultPaint(), 1, { wiggle: T*3, blink: (T % 3) < 0.15, tongue: (T % 4) < 0.3 ? 20 : 0 });
  }
  else if (mode === 'map') {
    g.drawImage(mapCanvas, 0, 0);
    // nodes
    for (const [k, n] of Object.entries(MAP_NODES)) {
      if (k === 'home') continue;
      g.fillStyle = 'rgba(255,255,255,.9)'; g.beginPath(); g.arc(n.x, n.y + 50, 30 + Math.sin(T*3)*2, 0, Math.PI*2); g.fill();
      g.strokeStyle = '#ffd23f'; g.lineWidth = 5; g.stroke();
      g.font = `30px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(n.emoji, n.x, n.y + 52);
      const st = S.stars[k]; g.font = `16px ${FONT}`; g.fillText('⭐'.repeat(st) + '☆'.repeat(3-st), n.x, n.y + 96);
      g.fillStyle = '#fff'; g.font = `bold 20px ${FONT}`; g.lineWidth = 5; g.strokeStyle = 'rgba(0,0,0,.5)';
      g.strokeText(n.name, n.x, n.y + 118); g.fillText(n.name, n.x, n.y + 118);
      g.textBaseline = 'alphabetic';
    }
    // walk
    if (walkPath && walkPath.length) {
      const tgt = walkPath[0], dx = tgt.x - mapPos.x, dy = tgt.y - mapPos.y, d = Math.hypot(dx, dy), step = 260 * dt;
      if (d <= step) { mapPos.x = tgt.x; mapPos.y = tgt.y; walkPath.shift(); if (!walkPath.length) { mapPos.node = walkPath.dest; walkPath = null; sfx.pop(); updateMapCard(); updateBar(); } }
      else { mapPos.x += dx / d * step; mapPos.y += dy / d * step; mapPos.flip = dx >= 0 ? 1 : -1; }
    }
    const bob = walkPath ? Math.abs(Math.sin(T*12)) * 6 : 0;
    if (stickImage && stickImage.complete) { g.save(); g.translate(mapPos.x + (mapPos.flip||1)*30, mapPos.y - 10 - bob); g.rotate(-Math.PI/2 + 0.15); g.drawImage(stickImage, -55, -13, 110, 26); g.restore(); }
    drawCham(g, mapPos.x, mapPos.y - bob, 0.75, defaultPaint(), mapPos.flip || 1, { blink: (T % 3.5) < 0.15, outline: true });
    if (S.branch) { drawBranchSprite(g, mapPos.x - 10, mapPos.y - 40 - bob, S.branch, 0.09, 0.2); }
  }
  else if (mode === 'climb') {
    animStep(dt);
    drawWorld(g);
    // stick line
    g.setLineDash([12, 10]); g.strokeStyle = S.hasStick ? 'rgba(255,255,255,.25)' : 'rgba(255,210,63,.6)'; g.lineWidth = 3; g.beginPath(); g.moveTo(0, L.stickLine); g.lineTo(W, L.stickLine); g.stroke(); g.setLineDash([]);
    if (!S.hasStick) { g.font = `bold 18px ${FONT}`; g.textAlign = 'left'; g.fillStyle = '#ffd23f'; g.strokeStyle = 'rgba(0,0,0,.6)'; g.lineWidth = 4; g.strokeText('🔒 Walking stick needed above this line', 12, L.stickLine - 10); g.fillText('🔒 Walking stick needed above this line', 12, L.stickLine - 10); }
    const cur = L.holds[cham.hold];
    L.holds.forEach((h, i) => {
      if (i === cham.hold) return;
      const locked = h.high && !S.hasStick, reach = dist(h, cur) <= REACH;
      const pulse = 1 + Math.sin(T * 5 + i) * 0.12;
      g.beginPath(); g.arc(h.x, h.y, 14 * (reach && !locked ? pulse : 1), 0, Math.PI*2);
      g.fillStyle = locked ? 'rgba(80,80,80,.55)' : reach ? (h.slip ? 'rgba(110,200,255,.85)' : 'rgba(255,210,63,.9)') : 'rgba(255,255,255,.35)';
      g.fill(); g.strokeStyle = 'rgba(0,0,0,.4)'; g.lineWidth = 3; g.stroke();
      g.font = `15px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
      if (locked) g.fillText('🔒', h.x, h.y + 1); else if (h.slip) g.fillText('💧', h.x, h.y + 1);
      g.textBaseline = 'alphabetic';
    });
    drawCham(g, cham.x, cham.y, cham.s, cham.paint, cham.flip, { outline: true, blink: (T % 3) < 0.12 });
  }
  else if (mode === 'paint') {
    drawWorld(g);
    drawCham(g, cham.x, cham.y, cham.s, cham.paint, cham.flip, {});
    // selected-part highlight ring
    g.strokeStyle = `rgba(255,210,63,${0.5 + 0.4*Math.sin(T*6)})`; g.lineWidth = 3; g.setLineDash([6,6]);
    g.beginPath(); g.arc(cham.x, cham.y + 5, 62 * cham.s + 10, 0, Math.PI*2); g.stroke(); g.setLineDash([]);
  }
  else if (mode === 'owl' || mode === 'curtain' || mode === 'friend' || (mode === 'result' && L)) {
    drawWorld(g);
    if (mode === 'result') {
      const won = !seek || seek.tries !== undefined || true;
      drawCham(g, cham.x, cham.y - Math.abs(Math.sin(T*6))*14, cham.s * 1.1, cham.paint, cham.flip, { tongue: 18, wiggle: T*8, outline: true });
    } else if (mode !== 'curtain') {
      drawCham(g, cham.x, cham.y, cham.s, cham.paint, cham.flip, {});
    }
    if (mode === 'owl' && seek) {
      owlStep(dt);
      const b = seek.beam;
      g.save(); g.fillStyle = 'rgba(40,20,70,.38)'; g.beginPath(); g.rect(0, 0, W, H); g.arc(b.x, b.y, 105, 0, Math.PI*2, true); g.fill('evenodd');
      const rg = g.createRadialGradient(b.x, b.y, 60, b.x, b.y, 110); rg.addColorStop(0, 'rgba(255,240,150,0)'); rg.addColorStop(1, 'rgba(255,200,240,.35)'); g.fillStyle = rg; g.beginPath(); g.arc(b.x, b.y, 110, 0, Math.PI*2); g.fill();
      g.restore();
      drawOwl(g, clamp(seek.owl.x, 60, W-60), clamp(seek.owl.y, 55, H-60), 1.1, T);
    }
    if (mode === 'curtain') { g.fillStyle = 'rgba(0,0,0,.4)'; g.fillRect(0,0,W,H); }
  }
  else if (mode === 'workshop') {
    // bench
    const wb = g.createLinearGradient(0,0,0,H); wb.addColorStop(0,'#5e3d22'); wb.addColorStop(1,'#3e2814'); g.fillStyle = wb; g.fillRect(0,0,W,H);
    g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = 3; for (let y=40;y<H;y+=70){ g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); }
    g.fillStyle = '#b5834f'; g.fillRect(40, 200, 920, 250); g.strokeStyle = '#7a5230'; g.lineWidth = 6; g.strokeRect(40, 200, 920, 250);
    if (W_ && W_.B) {
      g.drawImage(stickComposite(), 0, 0);
      g.font = `bold 26px ${FONT}`; g.textAlign = 'center'; g.fillStyle = '#fff';
      const head = W_.step === 'whittle' ? '🔪 Rub the stick to carve off the bark!' : W_.step === 'burn' ? (W_.tool === 'pen' ? '🔥 Draw on your stick to burn designs!' : '🔥 Tap the stick to burn a stamp!') : '🦯 Great job, woodworker!';
      g.fillText(head, W/2, 60);
      g.font = `18px ${FONT}`; g.fillStyle = '#ffe9b0';
      g.fillText('🧤 Real-life tip: always carve AWAY from you, and use a wood burner with a grown-up!', W/2, 100);
    } else {
      g.font = `bold 30px ${FONT}`; g.textAlign = 'center'; g.fillStyle = '#fff';
      g.fillText('🪵 The Workshop', W/2, 150);
      g.font = `24px ${FONT}`; g.fillText('Bring a branch from under the Big Tree 🌳', W/2, 330);
      g.fillText('to whittle and wood-burn a walking stick! 🦯', W/2, 370);
    }
  }

  // tap ripples
  taps.forEach(t => { t.life -= dt * 1.5; g.strokeStyle = `rgba(255,255,255,${Math.max(0,t.life)})`; g.lineWidth = 4; g.beginPath(); g.arc(t.x, t.y, 40 * (1 - t.life) + 8, 0, Math.PI*2); g.stroke(); });
  taps = taps.filter(t => t.life > 0);
  // particles
  parts.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life -= dt * (p.smoke ? 0.8 : 0.6);
    g.globalAlpha = clamp(p.life, 0, 1);
    if (p.smoke) { p.sz += dt * 20; g.fillStyle = p.c; g.beginPath(); g.arc(p.x, p.y, p.sz, 0, Math.PI*2); g.fill(); }
    else if (p.curl) { p.rot += 0.2; g.strokeStyle = p.c; g.lineWidth = 3; g.beginPath(); g.arc(p.x, p.y, 6, p.rot, p.rot + 4); g.stroke(); }
    else { g.fillStyle = p.c; g.fillRect(p.x, p.y, p.sz, p.sz); }
    g.globalAlpha = 1;
  });
  parts = parts.filter(p => p.life > 0 && p.y < H + 30);
  // messages
  msgs.forEach(m => {
    m.life -= dt; const a = clamp(Math.min(m.life * 2, (m.max - m.life) * 6 + 0.2), 0, 1);
    g.globalAlpha = a; g.font = `bold 30px ${FONT}`; g.textAlign = 'center';
    const x = clamp(m.x, 200, W - 200);
    g.lineWidth = 7; g.strokeStyle = 'rgba(0,0,0,.65)'; g.strokeText(m.text, x, m.y); g.fillStyle = m.color; g.fillText(m.text, x, m.y);
    g.globalAlpha = 1;
  });
  msgs = msgs.filter(m => m.life > 0);

  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(buf, 0, 0);

  // paint mode extras: zoom inset + camo meter
  if (mode === 'paint') {
    const R = insetRect();
    ctx.save(); ctx.fillStyle = '#000'; ctx.fillRect(R.x - 4, R.y - 4, R.w + 8, R.h + 8);
    ctx.drawImage(buf, cham.x - R.w / ZOOM / 2, cham.y - R.h / ZOOM / 2, R.w / ZOOM, R.h / ZOOM, R.x, R.y, R.w, R.h);
    ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 4; ctx.strokeRect(R.x, R.y, R.w, R.h);
    ctx.font = `bold 15px ${FONT}`; ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.lineWidth = 4;
    ctx.strokeText('🔍 Close-up (tap here too!)', R.x + 8, R.y + R.h - 10); ctx.fillText('🔍 Close-up (tap here too!)', R.x + 8, R.y + R.h - 10);
    // camo meter
    const sc = camoScore(L, cham).total;
    const mx = R.x, my = R.y + R.h + 14, mw = R.w;
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(mx, my, mw, 34);
    ctx.fillStyle = sc < 0.5 ? '#ff6b6b' : sc < 0.7 ? '#ffd23f' : '#2ecc71'; ctx.fillRect(mx + 4, my + 4, (mw - 8) * sc, 26);
    ctx.fillStyle = '#fff'; ctx.font = `bold 18px ${FONT}`; ctx.textAlign = 'center';
    ctx.strokeText(`🦎 Camo: ${Math.round(sc * 100)}%`, mx + mw/2, my + 24); ctx.fillText(`🦎 Camo: ${Math.round(sc * 100)}%`, mx + mw/2, my + 24);
    ctx.restore();
  }
}

let last = performance.now();
function frame(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt; render(dt); requestAnimationFrame(frame); }
updateBar(); fit(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
