<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Spark Burst</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#06061a;overflow:hidden;font-family:Fredoka,system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px 12px;pointer-events:none;gap:8px;flex-wrap:wrap;z-index:2}
.modes,.right{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap}
button{font:inherit;font-weight:600;font-size:15px;border-radius:999px;padding:8px 14px;background:rgba(255,255,255,.08);color:#fff;cursor:pointer;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);transition:transform .1s,background .2s}
button:active{transform:scale(.92)}
button.on{background:linear-gradient(135deg,#ff4fd8,#7a5cff);border-color:transparent;box-shadow:0 0 18px #b04fff88}
#stats{position:fixed;top:62px;left:0;right:0;text-align:center;pointer-events:none;z-index:2}
#score{font-size:30px;font-weight:700;text-shadow:0 0 14px #ff7bf1}
#stats.light #score,#stats.light #lives,#stats.light #meterLabel{color:#3b1d5e;text-shadow:0 1px 0 #fff8;opacity:1}
#lives{font-size:22px;letter-spacing:4px;margin-top:2px}
#meterBox{transition:opacity .3s}
#meterWrap{width:min(320px,70vw);height:10px;margin:6px auto 0;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
#meter{height:100%;width:0;background:linear-gradient(90deg,#ffd84f,#ff4fd8,#4fd8ff);transition:width .25s;box-shadow:0 0 10px #ff4fd8}
#meterLabel{font-size:12px;opacity:.6;margin-top:4px;letter-spacing:2px}
#hint{position:fixed;bottom:18px;left:0;right:0;text-align:center;font-size:16px;opacity:0;pointer-events:none;transition:opacity .6s;padding:0 14px;text-shadow:0 2px 8px #000;z-index:2}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#1a104099,#06061ae6);z-index:5;cursor:pointer;text-align:center}
#start h1{font-size:clamp(48px,11vw,96px);margin:0;background:linear-gradient(90deg,#ffd84f,#ff4fd8,#4fd8ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px #ff4fd866)}
#start p{opacity:.85;font-size:18px;margin:10px 24px;max-width:520px}
.big{margin-top:20px;font-size:24px;padding:14px 38px;background:linear-gradient(135deg,#ff4fd8,#7a5cff);border:0;animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 0 34px #ff4fd8}}
</style>
<!-- home-screen-app -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=9409ee98">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=9409ee98">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spark Burst">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0e0a24">
<script id="home-screen-sw">if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
<!-- /home-screen-app -->
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="modes"></div>
  <div class="right"><button id="snd">🔊</button></div>
</div>
<div id="stats"><div id="score">0</div><div id="lives"></div>
  <div id="meterBox"><div id="meterWrap"><div id="meter"></div></div><div id="meterLabel">SUPERNOVA METER</div></div></div>
<div id="hint"></div>
<div id="start"><h1>Spark Burst</h1><p>Pop glowing orbs into chain reactions and supernovas!</p><button class="big">Tap to play</button></div>

<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#06061a';ctx.fillRect(0,0,W,H);}
addEventListener('resize',resize);resize();
const R=Math.random,TAU=Math.PI*2;
const rr=(a,b)=>a+R()*(b-a);
const $=id=>document.getElementById(id);

/* ---------- glow sprites ---------- */
function mk(h,white){const s=64,c=document.createElement('canvas');c.width=c.height=s;const g=c.getContext('2d');
  const gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  gr.addColorStop(0,white?'rgba(255,255,255,1)':`hsla(${h},100%,88%,1)`);
  gr.addColorStop(.22,`hsla(${h},100%,66%,.85)`);
  gr.addColorStop(.55,`hsla(${h},100%,52%,.2)`);
  gr.addColorStop(1,`hsla(${h},100%,50%,0)`);
  g.fillStyle=gr;g.fillRect(0,0,s,s);return c;}
const SP=[],SPW=[];for(let i=0;i<36;i++){SP.push(mk(i*10,false));SPW.push(mk(i*10,true));}
const spr=(h,w)=>{const i=((Math.round(h/10)%36)+36)%36;return w?SPW[i]:SP[i];};

/* ---------- sound ---------- */
let AC=null,master=null,muted=false,sndN=0,NB=null;
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.45;master.connect(AC.destination);}catch(e){AC=null}}
  if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});}
function tone(f,d,type='sine',v=.15,f2){if(!AC||muted||sndN>8)return;sndN++;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02);}
function noise(d,v,fq,fq2,type='lowpass'){if(!AC||muted||sndN>8)return;sndN++;
  if(!NB){NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=R()*2-1;}
  const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;f.type=type;
  f.frequency.setValueAtTime(fq,t);if(fq2)f.frequency.exponentialRampToValueAtTime(fq2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d);}
const SC=[0,2,4,7,9];
const note=i=>{const o=Math.min(3,Math.floor(i/5));return 300*Math.pow(2,(SC[i%5]+12*o)/12);};

/* ---------- shared world ---------- */
const P=[],MAXP=6500;
const RINGS=[],TXT=[],MOTES=[];
let mode='pop',shake=0,tNow=0,flash=0,timeScale=1,slowT=0;
const ptr={x:0,y:0,px:0,py:0,down:false};

function add(x,y,vx,vy,o={}){if(P.length>=MAXP)return null;const L=o.life||1;
  const p={x,y,vx,vy,life:L,max:L,size:o.size||2.5,hue:o.hue||0,drag:o.drag??.97,grav:o.grav||0,white:!!o.white,tw:o.tw||0,col:o.col};
  P.push(p);return p;}
function burst(x,y,hue,n,speed,o={}){for(let i=0;i<n;i++){const a=R()*TAU,s=speed*Math.sqrt(R())*rr(.6,1.15);
  add(x,y,Math.cos(a)*s,Math.sin(a)*s,{life:rr(o.lmin||.6,o.lmax||1.3),size:rr(o.smin||1.6,o.smax||3.4),hue:hue+rr(-(o.hj??22),(o.hj??22)),drag:o.drag??.955,grav:o.grav??40,white:R()<(o.wp??.12),tw:o.tw||0});}}
function ring(x,y,hue,max,dur=.35,pops=false){RINGS.push({x,y,hue,max,dur,age:0,r:0,pops});}
function text(x,y,str,hue,size=22,life=.9){TXT.push({x,y,str,hue,size,life,max:life});}
for(let i=0;i<70;i++)MOTES.push({x:R(),y:R(),s:rr(.4,1.4),v:rr(.004,.015),h:rr(180,320),ph:R()*TAU});

/* =================== POP =================== */
const ORBS=[],Q=[];
let score=0,combo=0,lastPop=-9,meter=0,goal=30,level=1,orbTimer=0;
function spawnOrb(){const golden=R()<.06,r=golden?24:rr(14,28);
  ORBS.push({x:rr(r+20,W-r-20),y:rr(Math.max(130,r),H-r-20),vx:rr(-45,45),vy:rr(-45,45),r,hue:golden?45:R()*360,golden,ph:R()*TAU,grow:0});}
function popOrb(o){if(o.dead)return;o.dead=true;const i=ORBS.indexOf(o);if(i>=0)ORBS.splice(i,1);
  if(tNow-lastPop<.9)combo++;else combo=1;lastPop=tNow;
  const pts=10*combo*(o.golden?5:1);score+=pts;updateStats();
  if(o.golden){burst(o.x,o.y,45,520,620,{lmax:2,hj:30,wp:.3,grav:70,drag:.965});burst(o.x,o.y,0,160,300,{hj:180,tw:1});
    ring(o.x,o.y,45,280,.5,true);shake=Math.min(30,shake+18);text(o.x,o.y-30,'GOLDEN! +'+pts,45,30,1.3);
    tone(523,.5,'triangle',.18,1046);tone(784,.6,'sine',.12,1568);noise(.6,.25,3000,200);}
  else{burst(o.x,o.y,o.hue,80+o.r*3,260+o.r*6);add(o.x,o.y,0,0,{life:.18,size:o.r*1.2,hue:o.hue,white:true,drag:1});
    ring(o.x,o.y,o.hue,o.r*3.4+55,.35,true);shake=Math.min(22,shake+3+combo*.4);text(o.x,o.y-o.r,'+'+pts,o.hue,18+Math.min(16,combo*1.5));
    const f=note(combo-1);tone(f,.22,'triangle',.13,f*1.5);tone(f*2,.1,'sine',.05);noise(.12,.08,2500,400);}
  if(combo>=3&&combo%2===1)text(W/2,H*.42,combo+'x COMBO!',(combo*35)%360,34+Math.min(30,combo*2),1.1);
  meter+=o.golden?6:1;
  if(meter>=goal)supernova();
  $('meter').style.width=Math.min(100,meter/goal*100)+'%';}
function supernova(){meter=0;level++;goal=30+level*8;const cx=W/2,cy=H/2;
  burst(cx,cy,0,2200,Math.max(W,H)*.9,{hj:180,lmin:1,lmax:2.6,smax:4,wp:.25,grav:30,drag:.965});
  add(cx,cy,0,0,{life:.4,size:Math.max(W,H)*.25,white:true,hue:50,drag:1});
  ring(cx,cy,50,Math.max(W,H),.9);ring(cx,cy,300,Math.max(W,H)*.7,1.1);
  ORBS.forEach(o=>{if(!o.q){o.q=1;Q.push({o,t:Math.hypot(o.x-cx,o.y-cy)/900+.25});}});
  shake=40;text(cx,cy,'SUPERNOVA!',50,64,2);text(cx,cy+56,'Level '+level,300,30,2);
  tone(110,1.6,'sawtooth',.12,880);tone(220,1.4,'triangle',.12,1760);noise(1.6,.4,6000,80);}
function updatePop(dt){
  orbTimer-=dt;const target=Math.min(32,10+level*2);
  if(ORBS.length<target&&orbTimer<=0){spawnOrb();orbTimer=.3;}
  for(const o of ORBS){o.grow=Math.min(1,o.grow+dt*3);o.ph+=dt*2;o.x+=o.vx*dt;o.y+=o.vy*dt;
    if(o.x<o.r){o.x=o.r;o.vx=Math.abs(o.vx)}if(o.x>W-o.r){o.x=W-o.r;o.vx=-Math.abs(o.vx)}
    if(o.y<o.r+100){o.y=o.r+100;o.vy=Math.abs(o.vy)}if(o.y>H-o.r){o.y=H-o.r;o.vy=-Math.abs(o.vy)}
    if(R()<dt*(o.golden?30:4))add(o.x+rr(-o.r,o.r),o.y+rr(-o.r,o.r),rr(-10,10),rr(-30,-10),{life:rr(.5,1),size:rr(1,2),hue:o.hue,grav:-10,tw:1});}
  for(let i=Q.length-1;i>=0;i--){Q[i].t-=dt;if(Q[i].t<=0){const o=Q[i].o;Q.splice(i,1);popOrb(o);}}
}
function drawPop(){
  for(const o of ORBS){const s=o.r*o.grow*(1+Math.sin(o.ph)*.06);
    ctx.globalAlpha=.75;ctx.drawImage(spr(o.hue),o.x-s*2.4,o.y-s*2.4,s*4.8,s*4.8);
    ctx.globalAlpha=.9;ctx.drawImage(spr(o.hue,true),o.x-s,o.y-s,s*2,s*2);
    ctx.globalAlpha=.7;ctx.strokeStyle=`hsl(${o.hue},100%,${o.golden?75:65}%)`;ctx.lineWidth=o.golden?3:2;ctx.beginPath();ctx.arc(o.x,o.y,s,0,TAU);ctx.stroke();
    if(o.golden){ctx.globalAlpha=.5+.5*Math.sin(tNow*8);ctx.beginPath();ctx.arc(o.x,o.y,s+6,0,TAU);ctx.stroke();}}
}

/* ---------- input ---------- */
function pos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];}
cv.addEventListener('pointerdown',e=>{au();const[x,y]=pos(e);ptr.x=ptr.px=x;ptr.y=ptr.py=y;ptr.down=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}
  if(mode==='pop'){let bestO=null,bd=1e9;for(const o of ORBS){const d=Math.hypot(o.x-x,o.y-y)-o.r;if(d<16&&d<bd){bd=d;bestO=o;}}
    if(bestO)popOrb(bestO);else{burst(x,y,R()*360,35,180,{lmax:.8});ring(x,y,R()*360,55,.3,true);tone(rr(900,1200),.08,'sine',.05);}}
});
cv.addEventListener('pointermove',e=>{const[x,y]=pos(e);ptr.px=ptr.x;ptr.py=ptr.y;ptr.x=x;ptr.y=y;
  if(!ptr.down||mode!=='pop')return;
  const d=Math.hypot(x-ptr.px,y-ptr.py),n=Math.max(1,Math.floor(d/8));
  for(let i=0;i<n;i++){const t=i/n,sx=ptr.px+(x-ptr.px)*t,sy=ptr.py+(y-ptr.py)*t;add(sx,sy,rr(-30,30),rr(-30,30),{life:rr(.25,.5),size:rr(1.5,2.6),hue:(tNow*200)%360,drag:.9,white:R()<.3});
    for(const o of ORBS.slice())if(Math.hypot(o.x-sx,o.y-sy)<o.r+6)popOrb(o);}});
const up=()=>{ptr.down=false;};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{});

/* ---------- UI ---------- */
const HINTS={pop:'Tap or swipe through the orbs — chain the explosions! Fill the meter for a SUPERNOVA. ✨ Golden orbs are worth 5×.',};
let hintTO;
function updateStats(){$('lives').textContent='';$('score').textContent=score.toLocaleString();$('meterLabel').textContent='SUPERNOVA METER';$('meter').style.width=Math.min(100,meter/goal*100)+'%';}
function setMode(m){if(m===mode)return;mode=m;P.length=0;RINGS.length=0;TXT.length=0;
  document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  {ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#06061a';ctx.fillRect(0,0,W,H);}
  updateStats();
  const h=$('hint');h.textContent=HINTS[m];h.style.opacity=.9;clearTimeout(hintTO);hintTO=setTimeout(()=>h.style.opacity=0,6000);
  tone(660,.12,'sine',.06,990);}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=e=>{au();setMode(b.dataset.m);b.blur();});
$('snd').onclick=e=>{au();muted=!muted;e.currentTarget.textContent=muted?'🔇':'🔊';e.currentTarget.blur();};
$('start').onclick=()=>{au();$('start').remove();const m=mode;mode='';setMode(m);
  if(m==='pop')for(let i=0;i<4;i++)setTimeout(()=>{const x=rr(W*.2,W*.8),y=rr(H*.3,H*.7);burst(x,y,R()*360,150,350);ring(x,y,R()*360,120,.4);tone(note(i*2),.3,'triangle',.1);},i*120);};
updateStats();

/* ---------- loop ---------- */
let last=performance.now();
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;sndN=0;tNow+=dt;
  updatePop(dt);

  for(let i=P.length-1;i>=0;i--){const p=P[i];p.life-=dt;if(p.life<=0){P[i]=P[P.length-1];P.pop();continue;}
    const dr=Math.pow(p.drag,dt*60);p.vx*=dr;p.vy*=dr;p.vy+=p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  for(let i=RINGS.length-1;i>=0;i--){const g=RINGS[i];g.age+=dt;const k=Math.min(1,g.age/g.dur);g.r=g.max*(1-Math.pow(1-k,3));
    if(g.pops&&mode==='pop')for(const o of ORBS)if(!o.q&&Math.hypot(o.x-g.x,o.y-g.y)<g.r+o.r){o.q=1;Q.push({o,t:.07});}
    if(g.age>=g.dur*1.4)RINGS.splice(i,1);}
  for(let i=TXT.length-1;i>=0;i--){TXT[i].life-=dt;TXT[i].y-=30*dt;if(TXT[i].life<=0)TXT.splice(i,1);}
  shake*=Math.pow(.88,dt*60);

  {
    ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
    ctx.fillStyle='rgba(6,6,26,.28)';ctx.fillRect(0,0,W,H);
    const sx=(R()-.5)*shake,sy=(R()-.5)*shake;
    ctx.setTransform(DPR,0,0,DPR,sx*DPR,sy*DPR);
    ctx.globalCompositeOperation='lighter';
    for(const m of MOTES){m.y-=m.v*dt;if(m.y<0)m.y=1;ctx.globalAlpha=.25+.2*Math.sin(tNow*2+m.ph);ctx.drawImage(spr(m.h),m.x*W-m.s*3,m.y*H-m.s*3,m.s*6,m.s*6);}
    for(const g of RINGS){const k=g.age/g.dur;ctx.globalAlpha=Math.max(0,1-k)*.9;ctx.strokeStyle=`hsl(${g.hue},100%,70%)`;ctx.lineWidth=1+4*Math.max(0,1-k);
      ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,TAU);ctx.stroke();}
    drawPop();
    for(const p of P){let a=p.life/p.max;if(p.tw)a*=.55+.45*Math.sin(tNow*22+p.x*.3);
      const s=p.size*(.45+.55*a);ctx.globalAlpha=a;ctx.drawImage(spr(p.hue,p.white),p.x-s*2,p.y-s*2,s*4,s*4);}
  }

  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalCompositeOperation='source-over';
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const t of TXT){const age=t.max-t.life,pop=age<.15?1+(1-age/.15)*.6:1;ctx.globalAlpha=Math.min(1,t.life/t.max*2);
    ctx.font=`700 ${t.size*pop}px Fredoka,system-ui,sans-serif`;
    {ctx.shadowColor=`hsl(${t.hue},100%,60%)`;ctx.shadowBlur=18;ctx.fillStyle=`hsl(${t.hue},100%,88%)`;ctx.fillText(t.str,t.x,t.y);ctx.shadowBlur=0;}}
  ctx.globalAlpha=1;
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
