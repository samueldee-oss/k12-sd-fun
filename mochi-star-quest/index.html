{w:0,t:'The Falling Star',n:'A bee is buzzing about something shiny in the garden...',x:`Mochi is a little gray cat with big green eyes. One night, she sat on a hill to look at the sky. Then she saw a big flash! A star fell down, down, down. It hit a rock and broke into twelve shiny bits. The bits flew all over the land. "Oh no!" said Mochi. "The sky will be so dark." Just then, something glowed in the grass by her paw. It was one tiny bit of the star! A little bug with a glowing tail flew up. "I am Pip," said the bug. "I will help you find the rest." Mochi smiled. "Let's go!"`},
{w:0,t:'The Tall Sunflower',n:'Something is glowing at the bottom of the pond...',x:`In the morning, Mochi and Pip ran to the garden. The flowers were red, pink, and gold. A fat bee buzzed past them. "Have you seen a star bit?" asked Mochi. "Yes," said the bee. "It fell into the big sunflower. But it is too heavy for me to carry." Mochi looked up. The sunflower was very, very tall. She dug her claws into the stem and climbed up, up, up. At the top, something was shining in the yellow petals. It was the second star bit! "Two!" yelled Pip. "You did it!"`},
{w:0,t:'The Frog Joke',n:'The path leads into the dark, whispery woods...',x:`The next star bit was at the bottom of the pond. Mochi did not want to get wet. "Cats and water do not mix," she said. A green frog hopped onto a lily pad. "I will dive for it," said the frog, "if you tell me a funny joke." Mochi thought and thought. "Why did the frog take the bus to work?" she asked. "Why?" said the frog. "Because his car got toad away!" The frog laughed so hard that he fell off his lily pad. Splash! When he came back up, he had the star bit in his mouth. "Here you go," he said. That made three.`},
{w:1,t:'The Wise Owl',n:'A squirrel who LOVES shiny things lives nearby...',x:`The path went into the deep woods. The trees were tall, and the light was dim. Mochi felt a little scared. "Do not worry," said Pip. "My tail will light the way." Pip's tail glowed bright yellow. They walked past old logs and soft green moss. "Who goes there?" said a voice from a branch. It was a big brown owl. "It is just us," said Mochi. "We are looking for bits of a fallen star." The owl blinked her round eyes. "Something warm and shiny landed in my nest last night," she said. "You may have it." She dropped it down, and Mochi caught it. Four star bits!`},
{w:1,t:"Nutmeg's Treasure",n:'Uh oh... are those rain clouds?',x:`Inside a hollow tree lived a squirrel named Nutmeg. Nutmeg loved shiny things. She had buttons, bottle caps, and a silver spoon. Right in the middle of her pile was a star bit. "That is mine now," said Nutmeg. "I found it first." Mochi did not get mad. She sat and thought for a moment. "A star bit will stop shining if it is kept away from the sky," she said softly. "But I can give you something just as shiny." She took the little bell off her collar and gave it a shake. Ding, ding, ding! Nutmeg's eyes got wide. "It's a deal!" she said. Now Mochi had five.`},
{w:1,t:'Mushroom Rain',n:'The path ends at a sparkly, sandy beach...',x:`Plip, plop, plip! Big drops of rain began to fall. Mochi and Pip hid under a giant red mushroom with white spots. "My fur is getting wet," said Mochi with a frown. A slow snail slid up next to them. "I love the rain," said the snail. "It makes the ground nice and soft for my belly." Then the snail stopped and pointed with one eye. "Is that the thing you are looking for?" Under the next mushroom, a light was blinking on and off. Mochi raced across the wet grass, grabbed the star bit, and dashed back. She was soaked from nose to tail, but she was smiling. "That makes six!" cheered Pip. "We are halfway there!"`},
{w:2,t:'The Sandcastle',n:'Something is sparkling on a faraway island...',x:`After the woods, the path ended at a sandy beach. The waves went swish, swish on the shore. A red crab was building a giant sandcastle. On the very top of the tallest tower sat a star bit, glowing like a tiny lamp. "Please may we have that?" asked Mochi. "Only if you help me finish my castle," said the crab. So Mochi dug a moat with her paws. Pip found pretty shells to put on the walls. The crab made a bridge out of a stick. When the castle was done, it was the best castle on the whole beach. The crab clicked his claws with joy and handed them the star bit. Seven!`},
{w:2,t:'Turtle Ride',n:'The water is starting to rumble...',x:`Far out in the sea was a small island. "I can see something sparkling over there," said Pip. "But how will we get across?" asked Mochi. "I do not like to swim." Just then, a big sea turtle poked her head out of the water. "Hop on my back," she said kindly. "I am slow, but I am strong." Mochi held on tight as the turtle paddled through the waves. Little fish jumped and played around them. The sun was warm on Mochi's back, and she started to feel brave. On the island, they found the star bit inside a pink shell. "Thank you, turtle!" said Mochi. Now they had eight bits of the star.`},
{w:2,t:'Grandma Whale',n:'The last bits are up on a snowy mountain. Brrr!',x:`On the way back, the water began to rumble. A huge gray whale rose up next to them. She was bigger than a house! Mochi's fur stood straight up. "Do not be afraid," said the turtle. "That is Grandma Whale. She is very gentle." The whale sang a long, low song. Then she blew a giant spout of water high into the air. Something sparkly shot up with the water and came twirling back down. Mochi stretched out her paws and caught it. It was the ninth star bit! "I kept it safe for you," sang Grandma Whale. "The sea is happy to help the sky." Mochi waved goodbye as the whale swam away.`},
{w:3,t:'The Snowy Mountain',n:'Two bits are floating way up on a cloud...',x:`The last three bits had landed on top of a snowy mountain. It was a long, cold climb. The wind blew, and snowflakes stuck to Mochi's whiskers. "Brrr," said Mochi. "My paws are freezing." A fluffy white goat came hopping down the rocks. "Follow me," said the goat. "I know the safe path to the top." Mochi and Pip followed the goat around big rocks and over icy bridges. At last, they found a star bit, but it was stuck inside a block of ice. Pip flew close and made his tail glow as bright as he could. Slowly, the ice began to melt. Drip, drip, drip. Soon the star bit popped out into Mochi's paws. Ten!`},
{w:3,t:'The Cloud Bridge',n:'All twelve bits are found. Time to fix the star!',x:`At the very top of the mountain, the clouds were so low that Mochi could almost touch them. Two bits of the star were floating on a cloud, just out of reach. "How can we get up there?" asked Mochi. A flock of bluebirds landed next to her. "We can help," they chirped. The birds held the ends of a long ribbon in their beaks. They flew up and made a bridge from the mountain to the cloud. Mochi took a deep breath. She stepped onto the ribbon, one paw at a time. She did not look down. When she reached the cloud, she scooped up both star bits. "Eleven and twelve!" yelled Pip. "We found them all!"`},

function toast(m,ms){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),ms||1800)}

/* ---------- STATE ---------- */
function defaults(){return{v:1,updated:0,settings:{name:'',startWpm:48,startAcc:93,goalWpm:104,goalAcc:98,startDate:'2026-11-11',goalDate:'2027-04-30',glow:false,sound:true},ch:{},log:[],fishBest:{}}}
function loadState(){
 let emb=null,loc=null;
 try{emb=JSON.parse(document.getElementById('state').textContent)}catch(e){}
 try{loc=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 const best=[emb,loc].filter(x=>x&&x.v===1).sort((a,b)=>(b.updated||0)-(a.updated||0))[0];
 const d=defaults();
 if(best){Object.assign(d.settings,best.settings||{});d.ch=best.ch||{};d.log=best.log||[];d.fishBest=best.fishBest||{};d.updated=best.updated||0}
 return d}
let S=loadState();
function saveLocal(){S.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function buildHTML(){
 const css=document.getElementById('css').textContent, app=document.getElementById('app').textContent;
 const json=JSON.stringify(S).replace(/</g,'\\u003c');const SC='</'+'script>';
 return '<!DOCTYPE html>\n<html lang="en"><head>'+HEAD+'<style id="css">'+css+'</style></head><body><div id="root"></div><script id="state" type="application/json">'+json+SC+'<script id="app">'+app+SC+'</body></html>'}
async function saveAll(){
 saveLocal();
 try{const a=(window.claude&&window.claude.use)?await window.claude.use('artifact'):null;
  if(!a)return;toast('Saving progress… ⭐',4000);await a.publish(buildHTML())}catch(e){/* not the owner or offline: browser copy is kept */}
}

/* goal line */
function goalOn(ds){const s=S.settings;const a=pdate(s.startDate),b=pdate(s.goalDate),t=pdate(ds);let f=(t-a)/(b-a);if(!isFinite(f))f=1;f=Math.max(0,Math.min(1,f));return Math.round(+s.startWpm+(s.goalWpm-s.startWpm)*f)}
const todayGoal=()=>goalOn(dstr(new Date()));
function streak(){const days=new Set(S.log.map(l=>l.d));const d=new Date();if(!days.has(dstr(d)))d.setDate(d.getDate()-1);let n=0;while(days.has(dstr(d))){n++;d.setDate(d.getDate()-1)}return n}

/* sound */
let AC=null;
function tone(f,dur,type,vol,delay){if(!S.settings.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=f;const t=AC.currentTime+(delay||0);g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+(dur||.1));o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+(dur||.1)+.03)}catch(e){}}
const sfx={tap:()=>tone(560,.05),good:()=>{tone(660,.1);tone(990,.12,'square',.05,.08)},miss:()=>tone(220,.14,'triangle',.08),star:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.16,'square',.05,i*.11)),count:()=>tone(440,.1),go:()=>tone(880,.2)};
function confetti(){const em=['⭐','✨','💛','🌟','🐾'];for(let i=0;i<40;i++){const s=document.createElement('span');s.className='conf';s.textContent=em[i%em.length];s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.7+'s';s.style.fontSize=(18+Math.random()*24)+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),3600)}}

let timers=[],raf=0;
function stopTimers(){timers.forEach(t=>{clearTimeout(t);clearInterval(t)});timers=[];if(raf)cancelAnimationFrame(raf);raf=0;window.onkeydown=null}

 if(cur===-1)h+=`<div class="card win">🌟 You saved the star! Read any chapter again — every re-read makes you faster. Can you get ★★★ on all of them?</div>`;

  h+='</div></div>'});
 h+=`<div class="bottomBar"><button class="btn blue big" id="fish">🐟 Fish Flash</button><button class="btn yel big" id="prog">📈 Progress</button><button class="btn big" id="set">⚙️ Grown-ups</button></div>`;

/* ---------- CHAPTER ---------- */
let run=null;
const SKIPWARM=new Set(['mochi','there','their','would','could','about','which','these','those','where','little']);
function warmWords(x){const seen=new Set(),arr=[];tokens(x).forEach(t=>{const w=clean(t);const lw=w.toLowerCase();if(w.length>=5&&!seen.has(lw)&&!SKIPWARM.has(lw)){seen.add(lw);arr.push(w)}});arr.sort((a,b)=>b.length-a.length);return shuffle(arr.slice(0,5))}
function startChapter(i){run={i,reads:[],toks:tokens(CH[i].x),warm:warmWords(CH[i].x)};renderIntro()}
function renderIntro(){
 const c=CH[run.i],w=WORLDS[c.w];
 show(`<div class="card center" style="background:${w.bg}"><div class="small">${w.e} ${w.n} · Chapter ${run.i+1}</div><h1 class="ctitle">${esc(c.t)}</h1><div class="sprites">${im('mochi',8,'bob')}${im('pip',6,'bob2')}</div><p class="big">Read one little story and help Mochi find star bit #${run.i+1}!</p><div class="steps">① Warm-up words → 🎈 → ② Read the story → 🎈 → ③ Read it again → 🎈 → ⭐</div><div class="row"><button class="btn" id="back">⬅ Map</button><button class="btn go big" id="start">Let's go! ▶</button></div></div>`);
 on('back',renderMap);on('start',()=>{sfx.go();renderWarm(0)});
}
function renderWarm(k){
 const ws=run.warm;if(k>=ws.length)return playBreak(renderRead);
 show(`<div class="card center"><div class="small">Warm-up! Read each word out loud. 🔥</div><div class="dots">${ws.map((_,j)=>`<span class="${j<k?'on':j===k?'cur':''}"></span>`).join('')}</div><div class="wcard pop">${esc(ws[k])}</div><div class="row"><button class="btn" id="skip">Skip warm-up</button><button class="btn go big" id="next">Got it! ➜</button></div><div class="tip">Grown-up: if he gets stuck, sound it out together, then let him read it once more on his own.</div></div>`);
 on('next',()=>{sfx.good();renderWarm(k+1)});on('skip',()=>playBreak(renderRead));
 window.onkeydown=e=>{if(e.key==='Enter'||e.key===' '||e.key==='ArrowRight'){e.preventDefault();sfx.good();renderWarm(k+1)}};
}
function fastest(){return run.reads.reduce((m,r)=>!m||r.secs<m.secs?r:m,null)}
function renderRead(){
 const c=CH[run.i],t=run.toks,att=run.reads.length+1,prev=att>1?fastest():null;
 const glow=S.settings.glow&&att>1;const glowWpm=prev?Math.max(todayGoal(),prev.wpm+4):todayGoal();
 let h=`<div class="readTop"><button class="btn sm" id="back">⬅ Map</button><div class="rt"><b>${esc(c.t)}</b> · ${att===1?'Read the story':'Read it again — nice and smooth 🌟'}</div>${im('pip',3,'bob2')}</div>`;
 h+=`<div class="passage" id="pass">${t.map((w,j)=>`<span class="w" data-j="${j}">${esc(w)}</span>`).join(' ')}<div class="overlay" id="ov"><div class="center">${im('mochi',6,'bob')}<br><button class="btn go big" id="go">Ready? GO! 📖</button><div class="tip">Take your time and read your best!</div></div></div></div>`;
 h+=`<div class="helper" id="helper">Grown-up: tap any word he misses, skips, or you have to tell him. Tap again to undo. (Fixing it himself counts as right!)</div><div class="row"><button class="btn" id="restart">↺ Start over</button><button class="btn go big" id="done" disabled>I'm done! 🏁</button></div>`;
 show(h);
 const miss=new Set();let mode='ready',t0=0,secs=0,lastGlow=null;
 const wordIdx=[];t.forEach((w,j)=>{if(isWord(w))wordIdx.push(j)});
 root.querySelectorAll('.w').forEach(s=>s.onclick=()=>{if(mode==='ready')return;const j=+s.dataset.j;if(miss.has(j)){miss.delete(j);s.classList.remove('miss')}else{miss.add(j);s.classList.add('miss')}sfx.tap()});
 on('back',renderMap);on('restart',renderRead);
  function loop(){const el=(performance.now()-t0)/1000;
  if(glow){const k=Math.min(wordIdx.length-1,Math.floor(el*glowWpm/60));const sp=root.querySelector(`.w[data-j="${wordIdx[k]}"]`);if(sp!==lastGlow){if(lastGlow)lastGlow.classList.remove('glow');if(sp)sp.classList.add('glow');lastGlow=sp}}
  raf=requestAnimationFrame(loop)}
 on('go',()=>{const ov=$('#ov');let n=3;sfx.count();ov.innerHTML=`<div class="countNum">${n}</div>`;
  const iv=setInterval(()=>{n--;if(n>0){sfx.count();ov.innerHTML=`<div class="countNum">${n}</div>`}else{clearInterval(iv);sfx.go();ov.remove();mode='run';t0=performance.now();raf=requestAnimationFrame(loop);timers.push(setTimeout(()=>{const d=$('#done');if(d)d.disabled=false},6000))}},800);timers.push(iv)});
 function finish(){
  if(mode==='run'){mode='check';secs=(performance.now()-t0)/1000;cancelAnimationFrame(raf);raf=0;if(lastGlow)lastGlow.classList.remove('glow');sfx.good();
   $('#helper').innerHTML='<b>Grown-up check:</b> make sure every missed word is red, then tap <b>See my score</b>.';
   const b=$('#done');b.textContent='See my score ⭐';b.className='btn yel big';}
  else if(mode==='check'){score(miss,secs)}}
 on('done',finish);
 window.onkeydown=e=>{if(e.key==='Enter'&&mode!=='ready'){e.preventDefault();finish()}};
}
function score(miss,secs){
 const t=run.toks;const words=t.filter(isWord).length;const errs=[...miss].filter(j=>isWord(t[j])).length;
 const wpm=Math.round((words-errs)/(secs/60));const acc=Math.round((words-errs)/words*1000)/10;const goal=todayGoal();
 const stars=1+(acc>=S.settings.goalAcc?1:0)+(wpm>=goal?1:0);
 const missed=[...new Set([...miss].sort((a,b)=>a-b).map(j=>clean(t[j])).filter(Boolean))];
 const res={words,errs,secs:Math.round(secs*10)/10,wpm,acc,stars,goal,missed};
 const prevBest=fastest();
 const st=S.ch[run.i]||{done:false,stars:0,reads:0,bestWpm:0,bestAcc:0};
 const cold=run.reads.length===0&&!st.reads;
 st.reads++;st.bestWpm=Math.max(st.bestWpm,wpm);st.bestAcc=Math.max(st.bestAcc,acc);st.stars=Math.max(st.stars,stars);S.ch[run.i]=st;
 S.log.push({t:Date.now(),d:dstr(new Date()),c:run.i,k:cold?'cold':'practice',wpm,acc,secs:res.secs,errs,words});
 run.reads.push(res);saveLocal();
 renderResult(res,prevBest);
}
function renderResult(res,prevBest){
 const beat=prevBest&&res.wpm>prevBest.wpm;const ga=S.settings.goalAcc;const allow=Math.floor(res.words*(1-ga/100)+1e-9);
 const name=S.settings.name?', '+esc(S.settings.name):'';
 const head=beat?'You got even smoother'+name+'! 🚀':pick(['Great reading','Wow, nice job','You did it','Awesome reading','Super reading'])+name+'!';
 let h=`<div class="card center"><div class="sprites">${im('mochi',7,'bob')}${im('pip',5,'bob2')}</div><h2>${head}</h2>
 <div class="stats"><div class="stat"><div class="num">${res.wpm}</div>words a minute</div><div class="stat"><div class="num">${res.acc}%</div>careful reading</div></div>
 <div class="bigstars">${starsHtml(res.stars)}</div>
 <ul class="whys"><li>⭐ You read the whole story!</li><li>${res.acc>=ga?'⭐ Super careful reader!':'☆ Careful star next time: try for '+(allow>0?'just '+allow+' oops'+(allow>1?'es':''):'no oopses')}</li><li>${res.wpm>=res.goal?'⭐ Speedy star!':'☆ Speedy star next time: '+res.goal+' words a minute'}</li></ul>`;
 if(res.missed.length)h+=`<div class="small">Tricky words — read them once more:</div><div class="chips">${res.missed.map(w=>`<span class="chip">${esc(w)}</span>`).join('')}</div>`;
 h+=`<div class="row">${run.reads.length===1?'<button class="btn go big" id="again">🎈 Fun break, then read it again ➜</button><button class="btn" id="fin">Finish chapter ➜</button>':'<button class="btn" id="again">🔁 Read it once more</button><button class="btn go big" id="fin">🎈 Fun break, then get your star bit ➜</button>'}</div></div>`;
 show(h);
 if(beat||res.stars===3){sfx.star();confetti()}else sfx.good();
 on('again',()=>{sfx.tap();playBreak(renderRead)});on('fin',()=>{sfx.tap();playBreak(renderReward)});
}
function renderReward(){
 const i=run.i,st=S.ch[i],first=!st.done;st.done=true;saveLocal();
 const c=CH[i],next=CH[i+1];
 show(`<div class="card center" style="background:${WORLDS[c.w].bg}"><div class="spin" style="display:inline-block;margin-top:10px">${im('star',16)}</div><h2>${first?'You found star bit #'+(i+1)+'!':'Chapter complete!'}</h2><div class="bigstars">${starsHtml(st.stars)}</div><p class="big">${next?(first?'🔓 New chapter unlocked: ':'Next up: ')+'<b>'+esc(next.t)+'</b><br>'+esc(c.n):'You saved the star! 🌟<br>The End... for now!'}</p><button class="btn go big" id="map">Back to map 🗺️</button></div>`);
 sfx.star();confetti();
 on('map',()=>{renderMap();saveAll()});
}

/* ---------- FUN BREAKS ---------- */
const BREAKS=[
 {t:'Pop the bubbles!',e:['🫧'],bg:'linear-gradient(#d6f6ff,#6cc4ef)',mv:'up'},
 {t:'Catch the fireflies!',e:['✨','🌟'],bg:'linear-gradient(#2e2560,#6b4bb5)',mv:'wander'},
 {t:'Catch fish for Mochi!',e:['🐟','🐠'],bg:'linear-gradient(#c9f3ff,#4aa8e0)',mv:'down'},
 {t:'Catch the butterflies!',e:['🦋','🌸'],bg:'linear-gradient(#fff4b8,#c9f2b0)',mv:'wander'},
 {t:'Catch the falling stars!',e:['⭐'],bg:'linear-gradient(#1f2a5c,#4b5fb5)',mv:'down'}];
let lastBreak=-1;
function playBreak(next){
 let bi;do{bi=Math.floor(Math.random()*BREAKS.length)}while(bi===lastBreak);lastBreak=bi;
 const B=BREAKS[bi],GOAL=10;let got=0,crits=[],last=0,finished=false;
 show(`<div class="card center"><h2>🎈 Fun break! ${B.t}</h2><div class="big">Tap them! <b id="bc">0</b> / ${GOAL}</div><div class="play" id="play" style="background:${B.bg}"><div class="mochiCorner">${im('mochi',5,'bob')}</div></div><div class="row"><button class="btn sm" id="skipb">Skip ➜</button></div></div>`);
 const play=$('#play');on('skipb',next);
 function spawn(){const W=play.clientWidth,H=play.clientHeight;const el=document.createElement('button');el.className='crit';el.textContent=pick(B.e);
  const c={el,x:Math.random()*(W-90)+6,y:0,vx:0,vy:0,ph:Math.random()*6};
  if(B.mv==='up'){c.y=H;c.vy=-(45+Math.random()*30)}else if(B.mv==='down'){c.y=-80;c.vy=40+Math.random()*30}else{c.y=Math.random()*(H-90);const a=Math.random()*6.28;c.vx=Math.cos(a)*55;c.vy=Math.sin(a)*55}
  el.onpointerdown=e=>{e.preventDefault();if(finished)return;got++;$('#bc').textContent=got;sfx.good();const pf=document.createElement('span');pf.className='poof';pf.textContent='✨';pf.style.left=c.x+14+'px';pf.style.top=c.y+14+'px';play.appendChild(pf);setTimeout(()=>pf.remove(),550);el.remove();crits=crits.filter(o=>o!==c);if(got>=GOAL)win()};
  play.appendChild(el);crits.push(c)}
 function win(){finished=true;sfx.star();confetti();crits.forEach(c=>c.el.remove());crits=[];const y=document.createElement('div');y.className='yay';y.innerHTML=`${im('mochi',7,'bob')}<h2>Yay! You got them all!</h2><button class="btn go big" id="cont">Keep going ➜</button>`;play.appendChild(y);on('cont',()=>{sfx.tap();next()})}
 function loop(ts){const dt=last?Math.min(.05,(ts-last)/1000):0;last=ts;const W=play.clientWidth,H=play.clientHeight;
  if(!finished&&crits.length<5&&Math.random()<.05)spawn();
  crits.forEach(c=>{c.ph+=dt*2;c.x+=(c.vx+(B.mv==='wander'?0:Math.sin(c.ph)*30))*dt;c.y+=c.vy*dt;
   if(B.mv==='wander'){if(c.x<0||c.x>W-78)c.vx*=-1;if(c.y<0||c.y>H-78)c.vy*=-1;c.x=Math.max(0,Math.min(W-78,c.x));c.y=Math.max(0,Math.min(H-78,c.y))}
   c.el.style.transform=`translate(${c.x}px,${c.y}px)`});
  crits=crits.filter(c=>{if(c.y<-100||c.y>H+20){c.el.remove();return false}return true});
  raf=requestAnimationFrame(loop)}
 spawn();spawn();raf=requestAnimationFrame(loop);
}

/* ---------- FISH FLASH ---------- */
function renderFishMenu(){
 let h=`<div class="card center"><h1 class="ctitle">🐟 Fish Flash</h1><p class="big">Read words fast! Every word you read right, Mochi catches a fish. You have 45 seconds.</p><div class="tiers">`;
 FISH.forEach((f,i)=>{h+=`<div class="card tier"><div class="e">${f.e}</div><h2>${f.n}</h2><div class="small">${f.w.slice(0,4).join(', ')}…</div><div class="small">Best: ${S.fishBest[i]||0} fish</div><button class="btn go" data-t="${i}">Play</button></div>`});
 h+=`</div><div class="tip">Grown-up: tap “Got it!” (or → key) when he reads the word right, “Tricky” (or ← key) when he doesn't. Tricky words come back again.</div><div class="row"><button class="btn" id="back">⬅ Map</button></div></div>`;
 show(h);root.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{sfx.tap();playFish(+b.dataset.t)});on('back',renderMap);
}
function playFish(ti){
 const F=FISH[ti],DUR=45;let q=shuffle(F.w.slice()),cur=null,caught=0,missed=[],t0=0,running=false;
 show(`<div class="card"><div class="fishTop"><span>⏱ <span id="ft">${DUR}</span></span><span>🪣 <span id="fc">0</span> fish</span></div><div class="timebar"><div id="tb"></div></div><div class="pond center" id="pond"><div class="wcard" id="wc">Ready?</div><div class="dock">${im('mochi',5,'bob')}<span style="font-size:40px">🪣</span></div></div><div class="row"><button class="btn pink big" id="no" disabled>🔁 Tricky</button><button class="btn go big" id="yes" disabled>Got it! 🐟</button></div><div class="row"><button class="btn sm" id="back">⬅ Stop</button></div></div>`);
 on('back',renderFishMenu);
 const wc=$('#wc');
 function next(){if(!q.length)q=shuffle(F.w.slice());cur=q.shift();wc.textContent=cur;wc.classList.remove('pop');void wc.offsetWidth;wc.classList.add('pop')}
 function yes(){if(!running)return;caught++;$('#fc').textContent=caught;sfx.good();const f=document.createElement('span');f.className='jump';f.textContent=F.e;f.style.left='46%';f.style.top='62%';$('#pond').appendChild(f);setTimeout(()=>f.remove(),800);next()}
 function no(){if(!running)return;sfx.miss();if(!missed.includes(cur))missed.push(cur);q.splice(Math.min(3,q.length),0,cur);next()}
 on('yes',yes);on('no',no);
 window.onkeydown=e=>{if(e.key==='ArrowRight'||e.key===' '||e.key==='Enter'){e.preventDefault();yes()}else if(e.key==='ArrowLeft'){e.preventDefault();no()}};
 let n=3;wc.textContent=n;sfx.count();
 const cd=setInterval(()=>{n--;if(n>0){wc.textContent=n;sfx.count()}else{clearInterval(cd);sfx.go();running=true;$('#yes').disabled=false;$('#no').disabled=false;t0=performance.now();next();
  const iv=setInterval(()=>{const el=(performance.now()-t0)/1000;const left=Math.max(0,DUR-el);$('#ft').textContent=Math.ceil(left);$('#tb').style.width=(left/DUR*100)+'%';if(left<=0){clearInterval(iv);running=false;endFish()}},100);timers.push(iv)}},800);
 timers.push(cd);
 function endFish(){
  const best=S.fishBest[ti]||0,nb=caught>best;if(nb)S.fishBest[ti]=caught;
  S.log.push({t:Date.now(),d:dstr(new Date()),c:-1,k:'fish',tier:ti,wpm:Math.round(caught*60/DUR),acc:null,fish:caught});saveLocal();
  show(`<div class="card center"><div class="sprites">${im('mochi',7,'bob')}<span style="font-size:60px">${F.e}</span></div><h2>You caught ${caught} fish!</h2>${nb?'<p class="big">🏆 New best!</p>':'<p class="big">Best: '+best+' fish</p>'}${missed.length?'<div class="small">Tricky words to practice:</div><div class="chips">'+missed.map(w=>'<span class="chip">'+esc(w)+'</span>').join('')+'</div>':'<p class="big">No tricky words — wow! 🌟</p>'}<div class="row"><button class="btn" id="menu">⬅ Fish menu</button><button class="btn go big" id="again">Play again 🐟</button><button class="btn yel" id="map">🗺️ Map</button></div></div>`);
  if(nb||!missed.length){sfx.star();confetti()}else sfx.good();
  on('menu',renderFishMenu);on('again',()=>playFish(ti));on('map',()=>{renderMap();saveAll()});
 }
}

/* ---------- PROGRESS ---------- */
function renderProgress(){
 const s=S.settings;const reads=S.log.filter(l=>l.k!=='fish');const colds=reads.filter(l=>l.k==='cold');
 const wk=reads.filter(l=>Date.now()-l.t<7*864e5);const bestWk=wk.length?Math.max(...wk.map(l=>l.wpm)):'–';
 const lastCold=colds[colds.length-1];const accs=wk.map(l=>l.acc);const avgAcc=accs.length?Math.round(accs.reduce((a,b)=>a+b,0)/accs.length*10)/10+'%':'–';
 let h=`<div class="card"><div class="row" style="justify-content:space-between;margin:0"><h1 style="margin:0">📈 Progress</h1><button class="btn" id="back">⬅ Map</button></div>
 <div class="grid4" style="margin-top:12px"><div class="stat"><div class="num">${todayGoal()}</div>today's goal (wpm)</div><div class="stat"><div class="num">${lastCold?lastCold.wpm:'–'}</div>last first-read wpm</div><div class="stat"><div class="num">${bestWk}</div>best wpm this week</div><div class="stat"><div class="num">${avgAcc}</div>accuracy this week</div><div class="stat"><div class="num">🐾 ${streak()}</div>day streak</div></div></div>
 <div class="card"><canvas class="chart" id="cv"></canvas><div class="legend"><span><i style="background:#ff7a59"></i>First read of a new story (the real score)</span><span><i style="background:#b9a8e6"></i>Practice re-reads</span><span><i style="background:#ff4f8b;border-radius:0;height:4px"></i>Goal path: ${s.startWpm} → ${s.goalWpm} wpm by ${pdate(s.goalDate).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span></div></div>`;
 const rec=S.log.slice(-15).reverse();
 h+=`<div class="card"><h2>Recent reading</h2>${rec.length?'<table><tr><th>Day</th><th>What</th><th>wpm</th><th>Accuracy</th></tr>'+rec.map(l=>`<tr><td>${pdate(l.d).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</td><td>${l.k==='fish'?'🐟 Fish Flash ('+l.fish+' fish)':(l.k==='cold'?'📖 First read: ':'🔁 Re-read: ')+esc(CH[l.c].t)}</td><td>${l.wpm}</td><td>${l.acc==null?'–':l.acc+'%'}</td></tr>`).join('')+'</table>':'<p>No reading yet — go find the first star bit! ⭐</p>'}</div>`;
 show(h);on('back',renderMap);
 requestAnimationFrame(()=>drawChart($('#cv')));
}
function drawChart(cv){
 if(!cv)return;const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;const x=cv.getContext('2d');x.scale(dpr,dpr);
 const s=S.settings;const a=pdate(s.startDate).getTime(),b=pdate(s.goalDate).getTime()+864e5;
 const pts=S.log.filter(l=>l.k!=='fish');const ymax=Math.min(220,Math.max(130,...pts.map(l=>l.wpm+10)));
 const L=46,R=16,T=16,B=32;const X=t=>L+Math.max(0,Math.min(1,(t-a)/(b-a)))*(W-L-R);const Y=v=>T+(1-Math.min(v,ymax)/ymax)*(H-T-B);
 x.font='13px Fredoka, sans-serif';x.fillStyle='#3b3346';x.strokeStyle='#eee8f5';x.lineWidth=1;
 for(let v=0;v<=ymax;v+=20){x.beginPath();x.moveTo(L,Y(v));x.lineTo(W-R,Y(v));x.stroke();x.fillText(v,8,Y(v)+4)}
 const m=new Date(a);m.setDate(1);m.setMonth(m.getMonth()+1);
 while(m.getTime()<b){const px=X(m.getTime());x.strokeStyle='#f3eefa';x.beginPath();x.moveTo(px,T);x.lineTo(px,H-B);x.stroke();x.fillText(m.toLocaleDateString(undefined,{month:'short'}),px-12,H-10);m.setMonth(m.getMonth()+1)}
 x.setLineDash([8,6]);x.strokeStyle='#ff4f8b';x.lineWidth=3;x.beginPath();x.moveTo(X(a),Y(s.startWpm));x.lineTo(X(b),Y(s.goalWpm));x.stroke();x.setLineDash([]);
 x.fillStyle='#ff4f8b';x.font='bold 14px Fredoka, sans-serif';x.fillText('Goal '+s.goalWpm,X(b)-62,Y(s.goalWpm)-8);
 const tn=Date.now();x.strokeStyle='#6b4bb5';x.lineWidth=2;x.beginPath();x.moveTo(X(tn),T);x.lineTo(X(tn),H-B);x.stroke();x.fillStyle='#6b4bb5';x.fillText('today',X(tn)+4,T+12);
 pts.filter(l=>l.k!=='cold').forEach(l=>{x.fillStyle='#b9a8e6';x.beginPath();x.arc(X(l.t),Y(l.wpm),4,0,7);x.fill()});
 const cs=pts.filter(l=>l.k==='cold');x.strokeStyle='#ff7a59';x.lineWidth=2.5;x.beginPath();cs.forEach((l,i)=>{i?x.lineTo(X(l.t),Y(l.wpm)):x.moveTo(X(l.t),Y(l.wpm))});x.stroke();
 cs.forEach(l=>{x.fillStyle='#ff7a59';x.beginPath();x.arc(X(l.t),Y(l.wpm),6,0,7);x.fill();x.strokeStyle='#3b3346';x.lineWidth=1.5;x.stroke()});
}

/* ---------- GROWN-UPS ---------- */
function renderSettings(){
 const s=S.settings;
 show(`<div class="card"><div class="row" style="justify-content:space-between;margin:0"><h1 style="margin:0">⚙️ Grown-ups</h1><button class="btn" id="back">⬅ Map</button></div>
 <div class="form" style="margin-top:12px">
 <label>Reader's name (optional)<input type="text" id="f_name" value="${esc(s.name)}"></label>
 <label>Starting speed (wpm)<input type="number" id="f_sw" value="${s.startWpm}"></label>
 <label>Goal speed (wpm)<input type="number" id="f_gw" value="${s.goalWpm}"></label>
 <label>Accuracy goal (%)<input type="number" id="f_ga" value="${s.goalAcc}" step="0.5"></label>
 <label>Start date<input type="date" id="f_sd" value="${s.startDate}"></label>
 <label>Goal date<input type="date" id="f_gd" value="${s.goalDate}"></label>
 <label class="check"><input type="checkbox" id="f_glow" ${s.glow?'checked':''}> Glow guide on re-reads (a yellow highlight moves at goal pace)</label>
 <label class="check"><input type="checkbox" id="f_snd" ${s.sound?'checked':''}> Sounds</label>
 </div><div class="row"><button class="btn go big" id="save">Save ✓</button></div></div>
 <div class="card guide"><h2>How to use it</h2>
 <h3>Small spurts</h3>One chapter a day is plenty (about 5 minutes): warm-up words → fun break → first read → fun break → re-read → fun break → star bit. The breaks are 10 easy taps with no timer and no way to lose. Fish Flash is a 45-second bonus for days he wants more.
 <h3>Scoring (you tap, he reads)</h3>Tap a word if he skips it, says a different word, or you have to tell him (wait about 3 seconds first). If he fixes it himself, it counts as right. Words a minute = words read correctly ÷ minutes.
 <h3>Which number matters</h3>The <b>first read</b> of each new chapter is the honest measure — it's his first time seeing that text. Re-reads are practice; they're supposed to be faster, and that builds fluency.
 <h3>Accuracy first, then speed</h3>If accuracy dips below the goal, have him slow down. Speed grows on its own once reading is smooth and accurate.
 <div class="note" style="margin-top:12px">The stories get a little longer and harder as the chapters go on, so his speed may dip a bit on new worlds — that's normal. Scores on school passages can differ, because every passage is different.</div>
 <h3>Reset</h3><button class="btn pink" id="reset">Erase all progress</button></div>`);
 on('back',renderMap);
 on('save',()=>{const g=id=>document.getElementById(id);const num=(id,d)=>{const v=parseFloat(g(id).value);return isFinite(v)&&v>0?v:d};
  s.name=g('f_name').value.trim().slice(0,30);s.startWpm=num('f_sw',48);s.goalWpm=num('f_gw',104);s.goalAcc=Math.min(100,num('f_ga',98));
  if(g('f_sd').value)s.startDate=g('f_sd').value;if(g('f_gd').value)s.goalDate=g('f_gd').value;s.glow=g('f_glow').checked;s.sound=g('f_snd').checked;
  sfx.good();renderMap();saveAll()});
 let armed=false;on('reset',e=>{const b=e.currentTarget;if(!armed){armed=true;b.textContent='Tap again to erase everything';return}const keep=S.settings;S=defaults();S.settings=keep;renderMap();saveAll()});
}

renderMap();
})();
</script></body></html>
