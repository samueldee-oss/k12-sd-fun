<!DOCTYPE html>
<html lang="en">
<head>

<title>Supernova Run</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #2a0636; touch-action: none; user-select: none; -webkit-user-select: none; }
  body { font-family: 'Rajdhani', system-ui, sans-serif; color: #fff; }
  canvas { display: block; transition: filter .25s; }
  canvas.hit { filter: grayscale(.85) brightness(.9); }
  .ui { position: fixed; inset: 0; pointer-events: none; }
  .tbtn { position: absolute; pointer-events: auto; width: 40px; height: 40px; border-radius: 8px; background: linear-gradient(#1f8fa8, #0d5466); border: 2px solid #0a3b48; box-shadow: inset 0 2px 0 rgba(255,255,255,.35); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  #pauseBtn { top: 14px; left: 14px; }
  .bars { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); width: min(560px, 70vw); }
  .row1 { display: flex; align-items: center; gap: 10px; }
  .stageNum { font-family: 'Russo One'; font-size: 18px; min-width: 20px; text-align: right; text-shadow: 0 2px 0 rgba(0,0,0,.35); }
  .bar { flex: 1; height: 14px; background: rgba(10,40,55,.75); border: 2px solid rgba(10,40,55,.9); border-radius: 3px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: linear-gradient(#a6fbff, #5be7f2); transition: width .15s; }
  .row2 { display: flex; align-items: center; margin: 8px 0 0 30px; gap: 0; }
  .seg { flex: 1; height: 12px; background: rgba(10,40,55,.75); border: 2px solid rgba(10,40,55,.95); overflow: hidden; }
  .seg + .seg { border-left: 0; }
  .seg > div { height: 100%; width: 0; background: #5be7f2; transition: width .15s; }
  .rocket { width: 20px; height: 20px; margin-left: 4px; border-radius: 4px; background: #0d5466; border: 2px solid #0a3b48; font-size: 11px; display: flex; align-items: center; justify-content: center; }
  .speed { position: absolute; left: 18px; bottom: 16px; font-family: 'Russo One'; line-height: .9; text-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .speed .l { font-size: 15px; opacity: .85; }
  .speed .n { font-size: 64px; transition: color .2s; }
  .speed .n.red { color: #ff5a6e; }
  .speed .b { font-size: 12px; opacity: .8; margin-top: 4px; }
  .pop { position: absolute; left: 50%; top: 32%; transform: translate(-50%, -50%) scale(.9); font-family: 'Russo One'; font-size: clamp(22px, 5vw, 40px); letter-spacing: 2px; opacity: 0; transition: opacity .25s, transform .25s; text-shadow: 0 4px 0 rgba(0,0,0,.3); white-space: nowrap; text-align: center; }
  .pop small { display: block; font-size: .45em; opacity: .9; }
  .pop.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .toast { position: absolute; left: 50%; top: 84px; transform: translateX(-50%); background: rgba(13,84,102,.9); border: 2px solid #5be7f2; border-radius: 10px; padding: 8px 18px; font-family: 'Russo One'; font-size: 14px; opacity: 0; transition: opacity .3s; white-space: nowrap; }
  .toast.show { opacity: 1; }
  .arrows { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); display: none; gap: 90px; pointer-events: none; }
  .arrows.on { display: flex; }
  .arrows div { width: 64px; height: 64px; border-radius: 12px; border: 2px solid rgba(255,255,255,.55); background: rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center; font-size: 26px; }
  .arrows div.on { background: rgba(255,255,255,.35); }
  .panel { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
  .panel.dim { background: rgba(30,4,40,.55); }
  .panel.hidden { display: none; }
  .card { text-align: center; padding: 24px; max-width: 94vw; }
  .title { font-family: 'Russo One'; font-size: clamp(54px, 13vw, 140px); line-height: 1; letter-spacing: 2px;
    background: linear-gradient(#ffffff 0%, #e6ecf5 45%, #9fb0c8 55%, #dfe7f2 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 6px 0 #3b3f63) drop-shadow(0 10px 18px rgba(0,0,0,.35)); }
  .sub { font-family: 'Russo One'; letter-spacing: 6px; font-size: 13px; opacity: .85; margin: 14px 0 34px; }
  .play { font-family: 'Russo One'; font-size: 30px; letter-spacing: 3px; color: #fff; padding: 12px 50px 10px; border-radius: 8px; border: 3px solid #fff; background: linear-gradient(#1aa3c2, #0b6178); cursor: pointer; box-shadow: 0 6px 0 rgba(0,0,0,.25); }
  .play small { display: block; font-size: 12px; letter-spacing: 1px; opacity: .9; }
  .play:hover, .alt:hover, .tbtn:hover { filter: brightness(1.15); }
  .alt { font-family: 'Russo One'; font-size: 15px; color: #fff; padding: 10px 22px; border-radius: 8px; border: 2px solid rgba(255,255,255,.7); background: rgba(11,97,120,.7); cursor: pointer; margin: 8px 5px 0; }
  .help { margin-top: 26px; font-size: 16px; opacity: .85; line-height: 1.6; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  kbd { font-family: 'Russo One'; font-size: 12px; border: 1px solid rgba(255,255,255,.6); border-radius: 4px; padding: 1px 6px; }
  h2 { font-family: 'Russo One'; font-size: 38px; margin-bottom: 8px; text-shadow: 0 4px 0 rgba(0,0,0,.3); }
  .stats { font-size: 19px; margin: 6px 0 16px; }
  .stats b { font-family: 'Russo One'; color: #a6fbff; }
  .ships { display: grid; grid-template-columns: repeat(3, minmax(120px, 160px)); gap: 12px; margin: 14px auto 18px; justify-content: center; }
  @media (max-width: 560px) { .ships { grid-template-columns: repeat(2, minmax(120px, 1fr)); } }
  .ship { background: rgba(11,60,80,.75); border: 3px solid rgba(255,255,255,.2); border-radius: 12px; padding: 12px 8px; cursor: pointer; }
  .ship.sel { border-color: #a6fbff; }
  .ship .sw { width: 44px; height: 44px; border-radius: 50%; margin: 0 auto 8px; }
  .ship .nm { font-family: 'Russo One'; font-size: 14px; }
  .ship .pr { font-size: 14px; margin-top: 4px; opacity: .85; }
  .ship.locked { opacity: .5; cursor: default; }
  .ship.locked .sw { filter: grayscale(1) brightness(.45); }
  .hangarTitle { position: absolute; top: 34px; left: 0; right: 0; text-align: center; font-family: 'Russo One'; font-size: 40px; letter-spacing: 3px; text-shadow: 0 0 18px rgba(255,255,255,.35); }
  .hangarName { position: absolute; top: 88px; left: 0; right: 0; text-align: center; font-size: 18px; opacity: .8; letter-spacing: 2px; }
  .hangarNav { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px; align-items: center; }
  .navb { position: static; width: 46px; height: 54px; font-size: 26px; }
  .navb:disabled { filter: grayscale(1) brightness(.6); cursor: default; }
  .selb { font-family: 'Russo One'; font-size: 18px; letter-spacing: 3px; color: #fff; min-width: 190px; height: 54px; border-radius: 8px; border: 3px solid #fff; background: linear-gradient(#1aa3c2, #0b6178); cursor: pointer; }
  .selb.locked { background: linear-gradient(#9a9a9a, #5a5a5a); border-color: #cfcfcf; cursor: default; }
  .selb.on { background: linear-gradient(#ffd34a, #c98a0a); }
  .hangarBack { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); margin: 0; }
  .mute { position: absolute; top: 14px; right: 14px; pointer-events: auto; font-size: 18px; }
  .err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 30px; font-size: 18px; }

<script type="module">
import * as THREE from 'three';

// ---------- basics ----------
const RC = 1.7;                 // track (cylinder) radius: thin, like the original
const HX = 0.4, HZ = 0.45;      // ship hitbox half-size (sideways along the surface, and forward)
const SHIP_Y = 0.28;            // ship hover height above the surface
const TAU = Math.PI * 2;
const PER_CP = 10, CP_PER_STAGE = 3, PER_STAGE = PER_CP * CP_PER_STAGE;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];
const wrap = a => ((a + Math.PI) % TAU + TAU) % TAU - Math.PI;
const mod = (a, n) => ((a % n) + n) % n;

// worlds: the original's (OG) mixed in with the extra ones made for this game
const THEMES = [
  { name: 'Pink Nebula',  og: true,  top: 0xc81fd8, hor: 0xff86e2, track: 0x47f0ff, dark: 0x0f5a68, ob: 0x5ff4ff, mount: 0x7a1c96, style: 'hills' },
  { name: 'Lagoon',       og: false, top: 0x15a99a, hor: 0xa6ffe0, track: 0xff6fd8, dark: 0x5a1050, ob: 0xff8ae0, mount: 0x0d4a5a, style: 'hills' },
  { name: 'Deep Teal',    og: true,  top: 0x081420, hor: 0x2a7f86, track: 0x3fd8d0, dark: 0x0c3a40, ob: 0x47e6dc, mount: 0x0c2a34, style: 'hills' },
  { name: 'Ember',        og: false, top: 0xff4f3a, hor: 0xffc27a, track: 0xfff15a, dark: 0x6a4a10, ob: 0xffe96a, mount: 0x8a2448, style: 'hills' },
  { name: 'Sunset Peaks', og: true,  top: 0xe0661a, hor: 0xffe27a, track: 0x47f0ff, dark: 0x0f5a68, ob: 0x5ff4ff, mount: 0x2a1406, style: 'peaks' },
  { name: 'Ice Blue',     og: false, top: 0x2a3aff, hor: 0x9ad6ff, track: 0xffffff, dark: 0x3a4a8a, ob: 0xe8f0ff, mount: 0x1d1d72, style: 'peaks' },
  { name: 'Crystal',      og: true,  top: 0x14147a, hor: 0x7a4aff, track: 0x47f0ff, dark: 0x0f5a68, ob: 0x5ff4ff, mount: 0x6a3ae0, style: 'crystals' },
  { name: 'Jungle Dusk',  og: false, top: 0x8a0a3a, hor: 0xff7a6a, track: 0x8aff5a, dark: 0x1f5a10, ob: 0xa6ff7a, mount: 0x3f0b30, style: 'peaks' },
  { name: 'Ash Volcano',  og: true,  top: 0xa81828, hor: 0xffa0a0, track: 0x47f0ff, dark: 0x0f5a68, ob: 0x5ff4ff, mount: 0x26080e, style: 'peaks', ash: true },
  { name: 'Amethyst',     og: false, top: 0x3a0a6a, hor: 0xc98aff, track: 0xffb02e, dark: 0x6a3a0a, ob: 0xffc65a, mount: 0x2a1252, style: 'crystals' },
];
const NON_COLOR = ['style', 'ash', 'name', 'og'];
let terrStyle = 'hills';

// ships unlock when you reach a stage ("level"), like the original
// ships unlock when you reach a level. Each level unlocks one of this game's ships AND one from the original (OG) together.
const SHIPS = [
  { id: 'dart',     name: 'Dart',         need: 1,  color: 0x2ee6ff, accent: 0xffffff },
  { id: 'ogstart',  name: 'Starter',      need: 1,  color: 0xffe07a, accent: 0xffc23a, og: true },
  { id: 'manta',    name: 'Manta',        need: 2,  color: 0xff4fa3, accent: 0xffd23f },
  { id: 'reddome',  name: 'Red Rocket',   need: 2,  color: 0xff2a10, accent: 0xd81a08, og: true },
  { id: 'twin',     name: 'Twin Pod',     need: 3,  color: 0x39ff88, accent: 0x0b3d2a },
  { id: 'greyrock', name: 'Grey Rock',    need: 3,  color: 0x4a4a52, accent: 0x8a8a92, og: true },
  { id: 'snowpod',  name: 'Snow Pod',     need: 4,  color: 0xf4f2ff, accent: 0x9a86c8, og: true },
  { id: 'halo',     name: 'Halo',         need: 5,  color: 0xffd23f, accent: 0x7c5cff },
  { id: 'sunbat',   name: 'Gold Bat',     need: 5,  color: 0xffc21a, accent: 0xff8a00, og: true },
  { id: 'comet',    name: 'Comet',        need: 8,  color: 0xff6b3d, accent: 0xffe0a0 },
  { id: 'spiky',    name: 'Spike Rocket', need: 8,  color: 0x8a8a94, accent: 0x5a5a64, og: true },
  { id: 'nova',     name: 'Nova Prime',   need: 12, color: 0xd7c8ff, accent: 0xff4fa3 },
  { id: 'lemon',    name: 'White Lemon',  need: 12, color: 0xffffff, accent: 0xbfe9ff, og: true },
];

let save = { best: 100, ship: 'ogstart', muted: false, cp: 0, cpSpeed: 100, topStage: 1 };
try { const s = JSON.parse(localStorage.getItem('supernovarun2') || 'null'); if (s) save = Object.assign(save, s); } catch (e) {}
const persist = () => { try { localStorage.setItem('supernovarun2', JSON.stringify(save)); } catch (e) {} };
const unlocked = s => save.topStage >= s.need;

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(66, innerWidth / innerHeight, 0.1, 1200);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

const col = {}, tgt = {};
for (const k of Object.keys(THEMES[0])) { if (NON_COLOR.includes(k)) continue; col[k] = new THREE.Color(THEMES[0][k]); tgt[k] = col[k].clone(); }

scene.add(new THREE.HemisphereLight(0xffffff, 0x552266, 0.9));
const sunLight = new THREE.DirectionalLight(0xffffff, 1.5); scene.add(sunLight); scene.add(sunLight.target);
scene.fog = new THREE.Fog(col.hor, 40, 260);

// sky: a vertical gradient painted on a tiny canvas
const skyCanvas = document.createElement('canvas'); skyCanvas.width = 2; skyCanvas.height = 256;
const skyTex = new THREE.CanvasTexture(skyCanvas);
skyTex.colorSpace = THREE.SRGBColorSpace;
scene.background = skyTex;
function paintSky() {
  const g = skyCanvas.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#' + col.top.getHexString()); gr.addColorStop(0.62, '#' + col.hor.getHexString()); gr.addColorStop(1, '#' + col.mount.getHexString());
  g.fillStyle = gr; g.fillRect(0, 0, 2, 256); skyTex.needsUpdate = true;
}
paintSky();

// ---------- the winding path ----------
// Gameplay happens on a straight line (distance z and angle). The picture is bent along this curve.
const curveX = z => 30 * Math.sin(z * 0.0062) + 11 * Math.sin(z * 0.0165 + 1.3);
const curveY = z => 13 * Math.sin(z * 0.0085 + 2.1) + 5 * Math.sin(z * 0.021 + 0.4);
const UP = new THREE.Vector3(0, 1, 0);
const _a = new THREE.Vector3(), _bx = new THREE.Vector3(), _by = new THREE.Vector3(), _bz = new THREE.Vector3(), _m = new THREE.Matrix4();
function frameAt(z, obj) {
  obj.position.set(curveX(z), curveY(z), z);
  _a.set(curveX(z - 1), curveY(z - 1), z - 1).sub(obj.position).normalize(); // forward
  _bz.copy(_a).negate(); _bx.crossVectors(UP, _bz).normalize(); _by.crossVectors(_bz, _bx);
  _m.makeBasis(_bx, _by, _bz); obj.quaternion.setFromRotationMatrix(_m);
  return obj;
}

// ---------- the track ----------
const SEGL = 2.4, NSEG = 140;
const segGeo = new THREE.CylinderGeometry(RC, RC, SEGL * 1.04, 10, 1, true); segGeo.rotateX(Math.PI / 2);
const trackMat = new THREE.MeshStandardMaterial({ color: col.track, emissive: col.track, emissiveIntensity: 0.35, flatShading: true, roughness: 0.5, side: THREE.DoubleSide });
const darkMat = new THREE.MeshStandardMaterial({ color: col.dark, emissive: col.dark, emissiveIntensity: 0.25, flatShading: true, roughness: 0.6, side: THREE.DoubleSide });
const segs = [];
for (let i = 0; i < NSEG; i++) {
  const fr = new THREE.Object3D(), spin = new THREE.Object3D(), mesh = new THREE.Mesh(segGeo, trackMat);
  spin.add(mesh); fr.add(spin); scene.add(fr); segs.push({ fr, spin, mesh });
}
function updateTrack() {
  const base = Math.floor(S.z / SEGL) * SEGL + SEGL * 6;
  for (let i = 0; i < NSEG; i++) {
    const z = base - i * SEGL, g = Math.round(z / SEGL), s = segs[i];
    frameAt(z, s.fr);
    s.spin.rotation.z = S.ang + g * 0.31;                 // a little twist per ring gives the chevron look
    s.mesh.material = mod(g, 3) === 0 ? trackMat : darkMat;
  }
}

// ---------- hills on both sides ----------
const TCOLS = 44, TROWS = 56, TSTEP = 8, TW = 300;
const terrGeo = new THREE.PlaneGeometry(1, 1, TCOLS, TROWS);
const terrMat = new THREE.MeshStandardMaterial({ color: col.mount, emissive: col.mount, emissiveIntensity: 0.25, flatShading: true, roughness: 0.9 });
const terrain = new THREE.Mesh(terrGeo, terrMat); terrain.frustumCulled = false; scene.add(terrain);
function updateTerrain() {
  const pos = terrGeo.attributes.position, base = Math.floor(S.z / TSTEP) * TSTEP + 40, t = S.time;
  for (let j = 0; j <= TROWS; j++) {
    const z = base - j * TSTEP, cx = curveX(z), cy = curveY(z);
    for (let i = 0; i <= TCOLS; i++) {
      const u = (i / TCOLS - 0.5) * TW, au = Math.abs(u);
      const ridge = Math.max(0, au - 16);
      let h;
      if (terrStyle === 'peaks') {        // sharp mountain silhouettes
        const tri = x => 1 - Math.abs(((x % 2) + 2) % 2 - 1);
        h = -24 + Math.pow(ridge, 1.05) * 0.35 + 26 * tri(u * 0.035 + z * 0.006) * Math.min(1, ridge / 20) + 8 * tri(z * 0.02 + u * 0.08) * Math.min(1, ridge / 30);
      } else if (terrStyle === 'crystals') { // low ground; the crystal spires do the work
        h = -26 + Math.pow(ridge, 1.02) * 0.12 + 2 * Math.sin(u * 0.1 + z * 0.03);
      } else {
        h = -22 + Math.pow(ridge, 1.08) * 0.42
          + 7 * Math.sin(u * 0.07 + z * 0.018 + t * 0.4) + 4 * Math.sin(z * 0.041 - u * 0.05)
          + 3 * Math.sin(u * 0.19 + z * 0.09);
      }
      if (au < 14) h = -24 + 2 * Math.sin(z * 0.05 + u * 0.3);
      pos.setXYZ(j * (TCOLS + 1) + i, cx + u, cy + h, z);
    }
  }
  pos.needsUpdate = true; terrGeo.computeVertexNormals();
}

// ---------- sun, sparkles ----------
const glowTex = (() => {

let actx = null, master = null, hum = null;
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume().catch(() => {}); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = save.muted ? 0 : 0.5; master.connect(actx.destination);
    const o = actx.createOscillator(), o2 = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain();
    o.type = 'sawtooth'; o2.type = 'square'; o.frequency.value = 50; o2.frequency.value = 75.3; f.type = 'lowpass'; f.frequency.value = 300; g.gain.value = 0;
    o.connect(f); o2.connect(f); f.connect(g); g.connect(master); o.start(); o2.start(); hum = { o, o2, f, g };

}
function beep(freq, dur = 0.1, type = 'sine', vol = 0.2, slide = 0) {
  if (!actx || save.muted) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();

}

  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = buf; f.type = 'lowpass'; f.frequency.value = 800; g.gain.value = 0.7; s.connect(f); f.connect(g); g.connect(master); s.start();
}

    if (st + 1 > save.topStage) {
      const before = save.topStage; save.topStage = st + 1; persist();
      const got = SHIPS.filter(s => s.need > before && s.need <= save.topStage);
      if (got.length) { newShipQueue.push(...got.map(s => SHIPS.indexOf(s))); setTimeout(() => showNewShip(newShipQueue.shift()), 1300); }
    }
    if (st !== S.stage && st % LEVELS_PER_WORLD === 0) {
      // flying through the portal: flash white, then arrive in the new world
      const w = $('whiteout'); w.style.transition = 'opacity .12s'; w.style.opacity = 1;
      setTimeout(() => { w.style.transition = 'opacity 1.1s'; w.style.opacity = 0; }, 260);
      beep(300, 0.9, 'sine', 0.15, 4);
      const wth = THEMES[Math.floor(st / LEVELS_PER_WORLD) % THEMES.length];
      setTimeout(() => toast('NEW WORLD: ' + wth.name.toUpperCase()), 700);
    }
    if (st !== S.stage) { S.stage = st; setTheme(st, st % LEVELS_PER_WORLD === 0); S.speedD = 100 + Math.min(20, st * 2); save.cpSpeed = S.speedD; pop(`<span style="font-size:1.8em;opacity:.85">LEVEL ${st + 1}</span>`, 1800); [523, 659, 784, 1046].forEach((f, j) => setTimeout(() => beep(f, 0.16, 'square', 0.1), j * 80)); }
    else { pop('CHECKPOINT', 900); [784, 1046].forEach((f, j) => setTimeout(() => beep(f, 0.14, 'square', 0.1), j * 90)); }
  }
  updateBars();
}
function pauseToggle() {
  if (S.mode === 'play' || S.mode === 'hit') { S.prevMode = S.mode; S.mode = 'paused'; $('pausestats').innerHTML = `Speed <b>${S.speedD}</b> · Best <b>${save.best}</b>`; show('pause'); persist(); }
  else if (S.mode === 'paused') { S.mode = S.prevMode || 'play'; show(null); }
}
function toMenu() { persist(); S.mode = 'menu'; clearWorld(); renderer.domElement.classList.remove('hit'); shipHolder.visible = true; shadow.visible = true; hud(false); setTheme(0); refreshMenu(); show('menu'); }
$('playBtn').onclick = () => startRun(save.cp, save.cp > 0 ? save.cpSpeed : 100);
$('restartBtn').onclick = () => { save.cp = 0; save.cpSpeed = 100; persist(); startRun(0, 100); };
$('resumeBtn').onclick = pauseToggle;
// skip ahead to the next checkpoint
$('skipBtn').onclick = () => {
  const cp = Math.floor(S.streak / PER_CP) + 1;
  S.mode = S.prevMode === 'hit' ? 'play' : (S.prevMode || 'play');
  S.cp = cp; S.streak = cp * PER_CP - 1; passed();
  renderer.domElement.classList.remove('hit'); $('speedNum').classList.remove('red');
  clearWorld(); S.spawned = S.streak; S.safe = underShip(); S.nextZ = S.z - 55; S.mode = 'play'; S.invuln = 0;
  shipHolder.visible = true; shadow.visible = true; show(null); hud(true); last = performance.now();
}; $('pauseBtn').onclick = pauseToggle;
$('pauseMenu').onclick = toMenu;
$('shipsBtn').onclick = () => { initAudio(); hangarFrom = 'menu'; refreshHangar(); show('hangar'); };
$('pauseShips').onclick = () => { hangarFrom = 'pause'; refreshHangar(); show('hangar'); };
$('hangarBack').onclick = closeHangar;
const muteBtn = $('muteBtn');
function updateMute() { muteBtn.textContent = save.muted ? '🔇' : '🔊'; if (master) master.gain.value = save.muted ? 0 : 0.5; }
muteBtn.addEventListener('click', e => { e.stopPropagation(); initAudio(); save.muted = !save.muted; persist(); updateMute(); muteBtn.blur(); });
updateMute();

// ---------- input ----------
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyP' || e.code === 'Escape') pauseToggle();
  if (e.code === 'KeyM') { save.muted = !save.muted; persist(); updateMute(); }
  if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat && S.mode === 'menu' && !$('menu').classList.contains('hidden')) $('playBtn').click();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (S.mode === 'play') pauseToggle(); });
const touches = new Map(), cv = renderer.domElement;
cv.addEventListener('pointerdown', e => { initAudio(); if (e.pointerType !== 'mouse') touches.set(e.pointerId, e.clientX); });
cv.addEventListener('pointermove', e => { if (touches.has(e.pointerId)) touches.set(e.pointerId, e.clientX); });
const endT = e => touches.delete(e.pointerId);
cv.addEventListener('pointerup', endT); cv.addEventListener('pointercancel', endT);
function readInput() {
  if (window.__bot) return window.__bot();
  let x = 0;
  if (keys.KeyA || keys.ArrowLeft) x -= 1;
  if (keys.KeyD || keys.ArrowRight) x += 1;
  for (const tx of touches.values()) x += tx < innerWidth / 2 ? -1 : 1;
  x = clamp(x, -1, 1);
  $('arL').classList.toggle('on', x < 0); $('arR').classList.toggle('on', x > 0);
  return { x };
}


// animate a ship's moving parts (used in game and on the Ships screen)
const _hsl = new THREE.Color();
function animateShip(m, t, dt) {
  if (!m) return;
  m.traverse(ch => {
    if (ch.userData.engine) ch.scale.setScalar(0.75 + Math.random() * 0.55);
    if (ch.userData.spin === 'z') ch.rotation.z += dt * 3;
    if (ch.userData.spin === 'x') ch.rotation.x += dt * 2;
    if (ch.userData.spin === 'xy') { ch.rotation.x += dt * 2; ch.rotation.y += dt * 1.3; }
    if (ch.userData.nova === 'orbit') ch.rotation.y += dt * 2.5;
    if (ch.userData.lemon === 'body' && ch.material !== silMat) ch.material.emissiveIntensity = 0.3 + 0.25 * Math.sin(t * 4);
    if (ch.userData.lemon === 'band') {
      const u = ((t * 0.6 + ch.userData.k / 3) % 1), zz = (u - 0.5) * 1.2, r = 0.42 * Math.sqrt(Math.max(0.02, 1 - (zz / 0.65) ** 2));
      ch.position.z = zz; ch.scale.set(r / 0.3, r * 0.62 / 0.3, 1); if (ch.material !== silMat) ch.material.opacity = Math.sin(u * Math.PI);
    }
    if (ch.userData.nova === 'core') {
      const s = 1 + 0.25 * Math.sin(t * 6); ch.scale.setScalar(s); ch.rotation.y += dt * 3;
      if (ch.material !== silMat) ch.material.color.copy(_hsl.setHSL((t * 0.15) % 1, 1, 0.65));
    }
  });
}

// ---------- loop ----------
const SPIN = 3.8;    // how fast the track turns (radians per second)
const camFrame = new THREE.Object3D(), lookFrame = new THREE.Object3D(), tmpV = new THREE.Vector3(), lookV = new THREE.Vector3(), upV = new THREE.Vector3();
function frame(now) {
  requestAnimationFrame(frame); const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!$('hangar').classList.contains('hidden')) {
    if (hShip) { hShip.rotation.y += dt * 0.9; hShip.position.y = Math.sin(now / 600) * 0.06; animateShip(hShip, now / 1000, dt); }
    hRock.rotation.x += dt * 0.3; hRock.rotation.y += dt * 0.5;
    renderer.render(hScene, hCam); return;
  }
  update(dt); renderer.render(scene, camera);
}

function update(dt) {
  if (S.mode === 'paused') return;
  S.time += dt;
  const playing = S.mode === 'play';

  if (playing) {
    const inp = readInput();
    // pressing left turns the track clockwise, which brings its left side up under the ship
    S.vang += (inp.x * SPIN - S.vang) * Math.min(1, dt * 14);
    S.ang += S.vang * dt;
    S.speed += (realSpeed(S.speedD) - S.speed) * Math.min(1, dt * 2);
    S.z -= S.speed * dt;
    S.invuln = Math.max(0, S.invuln - dt);
  } else if (S.mode === 'hit') {
    S.hitT += dt; S.z -= S.speed * 0.35 * dt; S.vang *= Math.pow(0.05, dt); S.ang += S.vang * dt;
    if (S.hitT > 0.85) respawn();
  } else {
    S.speed = 32; S.z -= S.speed * dt; S.vang = Math.sin(S.time * 0.5) * 0.8; S.ang += S.vang * dt;
  }

  // colors ease toward the stage theme
  const k = Math.min(1, dt * 1.8); let moving = false;
  for (const key of Object.keys(col)) { if (!col[key].equals(tgt[key])) { col[key].lerp(tgt[key], k); moving = true; } }
  if (moving || S.time < 0.1 || S.forcePaint) { S.forcePaint = false;
    paintSky(); scene.fog.color.copy(col.hor);
    trackMat.color.copy(col.track); trackMat.emissive.copy(col.track);
    darkMat.color.copy(col.dark); darkMat.emissive.copy(col.dark);
    obMat.color.copy(col.ob); obMat.emissive.copy(col.ob);
    terrMat.color.copy(col.mount); terrMat.emissive.copy(col.mount);
    ringMat.color.copy(col.ob).lerp(new THREE.Color(0xffffff), 0.5);
  }

  updateTrack(); updateTerrain(); updateSparks(dt); updateCrystals();
  frameAt(S.z - 560, sun); sun.position.y += 40;
  const p = 1 + 0.04 * Math.sin(S.time * 2); sunCore.scale.set(170 * p, 170 * p, 1);

  // ship
  frameAt(S.z, shipFrame);
  shipHolder.position.set(0, RC + SHIP_Y, 0);
  shipHolder.visible = S.mode !== 'hit' && (S.invuln <= 0 || Math.floor(S.time * 14) % 2 === 0 || S.mode === 'menu');
  if (shipMesh) {
    shipMesh.rotation.z = -S.vang * 0.1;
    shipMesh.position.y = Math.sin(S.time * 4) * 0.03;
    animateShip(shipMesh, S.time, dt);
  }

  // trail
  if (shipHolder.visible) {
    shipHolder.getWorldPosition(tmpV);
    for (let n = 0; n < 2; n++) {
      const i = trailIdx; trailIdx = (trailIdx + 1) % TRAIL_N;
      trailPos[i * 3] = tmpV.x + rand(-0.06, 0.06); trailPos[i * 3 + 1] = tmpV.y + rand(-0.05, 0.05); trailPos[i * 3 + 2] = tmpV.z + 0.5 + n * S.speed * dt * 0.5; trailLife[i] = 1;
    }
  }
  for (let i = 0; i < TRAIL_N; i++) if (trailLife[i] > 0) { trailLife[i] -= dt * 2.2; if (trailLife[i] <= 0) trailPos[i * 3 + 2] = 9999; }
  trailGeo.attributes.position.needsUpdate = true;
  for (let i = shards.length - 1; i >= 0; i--) {
    const s = shards[i]; s.life -= dt; s.m.position.addScaledVector(s.v, dt); s.v.multiplyScalar(Math.pow(0.4, dt));
    s.m.rotation.x += dt * 6; s.m.rotation.y += dt * 4; s.m.material.opacity = Math.max(0, s.life);
    if (s.life <= 0) { scene.remove(s.m); s.m.material.dispose(); shards.splice(i, 1); }
  }

  // obstacles

  const under = underShip();
  for (let i = S.obs.length - 1; i >= 0; i--) {
    const o = S.obs[i];

    for (const u of o.updaters) u(o.t, dt);
    for (const sp of o.spins) sp.rotation.z = S.ang;
    if (playing && S.mode === 'play' && !o.passed) {

        if (S.mode !== 'play') continue;
      }
      if (S.z + HZ < o.zMin) { o.passed = true; passed(); }
    }
    if (o.zMin > S.z + 20) { scene.remove(o.frame); S.obs.splice(i, 1); }
  }
  for (let i = S.rings.length - 1; i >= 0; i--) {
    const r = S.rings[i]; r.spin.rotation.z += dt * (r.portal ? 0.6 : 1.5);
    if (r.z > S.z + 20) { scene.remove(r.frame); S.rings.splice(i, 1); }
  }

  // camera: low and behind, following the bends
  frameAt(S.z + 6, camFrame); frameAt(S.z - 16, lookFrame);
  camera.position.set(0, RC + 1.75, 0).applyMatrix4(camFrame.matrixWorld.compose(camFrame.position, camFrame.quaternion, camFrame.scale));
  lookV.set(0, RC + 0.35, 0).applyMatrix4(lookFrame.matrixWorld.compose(lookFrame.position, lookFrame.quaternion, lookFrame.scale));
  upV.set(0, 1, 0).applyQuaternion(camFrame.quaternion);
  if (S.mode === 'hit') { camera.position.x += rand(-1, 1) * 0.25 * (1 - S.hitT); camera.position.y += rand(-1, 1) * 0.25 * (1 - S.hitT); }
  camera.up.copy(upV); camera.lookAt(lookV);
  S.camRoll += (-S.vang * 0.03 - S.camRoll) * Math.min(1, dt * 5);
  camera.rotateZ(S.camRoll);
  const fov = 64 + clamp((S.speedD - 100) * 0.12, 0, 14);
  if (Math.abs(camera.fov - fov) > 0.05) { camera.fov += (fov - camera.fov) * Math.min(1, dt * 3); camera.updateProjectionMatrix(); }
  sunLight.position.copy(sun.position); sunLight.target.position.copy(shipFrame.position);

  if (hum && actx) {
    hum.g.gain.setTargetAtTime((playing ? 0.045 : 0.02) * (save.muted ? 0 : 1), actx.currentTime, 0.2);
    hum.o.frequency.setTargetAtTime(38 + S.speed * 0.8, actx.currentTime, 0.3);
    hum.o2.frequency.setTargetAtTime(57 + S.speed * 1.2, actx.currentTime, 0.3);
    hum.f.frequency.setTargetAtTime(200 + S.speed * 9, actx.currentTime, 0.3);
  }
}

setShip(SHIPS.find(s => s.id === save.ship && unlocked(s)) ? save.ship : 'dart');
setTheme(0); refreshMenu();
requestAnimationFrame(frame);
window.__S = S;
</script>
