// ================= CORE LOGIC =================
let G=null;
const rnd=Math.random,ri=n=>Math.floor(rnd()*n),pick=a=>a[ri(a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=ri(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function T(x,y){return G.map[y*G.N+x];}
function inb(x,y){return x>=0&&y>=0&&x<G.N&&y<G.N;}
function nbrs(x,y,r=1){const o=[];for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(!dx&&!dy)continue;const X=x+dx,Y=y+dy;if(inb(X,Y))o.push([X,Y]);}return o;}
function dist(a,b,c,d){return Math.max(Math.abs(a-c),Math.abs(b-d));}
function isWater(t){return t.ter==='water'||t.ter==='ocean';}
function isLandT(t){return !isWater(t);}
function P(i){return G.players[i];}
function pcol(p){const t=TRIBES[p.t];return[t.c,t.sc,t.tc||t.sc][p.skin|0];}
function pname(p){const t=TRIBES[p.t];return[t.n,t.s,t.s3||t.s][p.skin|0];}
function phat(p){const h=TRIBES[p.t].hat;return h[p.skin|0]||h[0];}
function isND(p){return psp(p)==='bug'&&(p.skin|0)>0;}
function skinCount(t){return TRIBES[t].s3?3:2;}
function uname(type,p){const U=UNITS[type];return p&&psp(p)==='bug'&&!isND(p)&&U.cn?U.cn:U.n;}
function curName(p){return isND(p)?'hearts':'stars';}
function logEv(a,txt,tg,k){if(!G.ev)G.ev=[];G.ev.push({r:G.turn,a,t:txt,tg:tg==null?-1:tg,k:k||''});if(G.ev.length>400)G.ev.splice(0,100);}
function psp(p){return TRIBES[p.t].sp||null;}
function UD(u){return UNITS[u.type];}
function has(u,s){return UNITS[u.type].sk.includes(s);}
function usz(u){return u.sz||1;}
function maxHp(u){let h=UNITS[u.type].hp;if(!h)h=UNITS[u.base||'warrior'].hp;return h*usz(u)+(u.vet?5:0);}
function defVal(u){return UNITS[u.type].d*(1+.5*(usz(u)-1));}
function tileOwner(t){return t.terr>=0?G.cities[t.terr].owner:-1;}
function cityOf(t){return t.city>=0?G.cities[t.city]:null;}
function utype(p,b){const sp=psp(p);return(sp&&REPL[sp]&&REPL[sp][b])||b;}

// occupancy
let OCC=null;
function occDirty(){OCC=null;}
function unitAt(x,y){if(!OCC){OCC=new Map();for(const u of G.units)OCC.set(u.y*G.N+u.x,u);}return OCC.get(y*G.N+x)||null;}

// ----- visibility -----
function reveal(p,x,y,r){for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const X=x+dx,Y=y+dy;if(inb(X,Y))p.ex[Y*G.N+X]=1;}}
function unitSight(u){const t=T(u.x,u.y);reveal(P(u.owner),u.x,u.y,(t.ter==='mountain'||has(u,'fly')||has(u,'sight'))?2:1);if(G.lights)checkLighthouses(u);}
function canSee(u,pi){if(u.owner===pi)return true;const p=P(pi);if(!p.ex[u.y*G.N+u.x])return false;if(has(u,'hide')){return nbrs(u.x,u.y).some(([a,b])=>{const v=unitAt(a,b);return v&&v.owner===pi;});}return true;}

// ----- creation -----
function cityName(p){const s=TRIBES[p.t].syl;for(let k=0;k<50;k++){let n=pick(s)+pick(s).toLowerCase();if(rnd()<.3)n=pick(s)+'-'+pick(s);if(!G.cities.some(c=>c.name===n))return n;}return pick(s)+G.cities.length;}
function makeCity(x,y,owner,cap){const t=T(x,y);const c={id:G.cities.length,x,y,owner,name:cityName(P(owner)),level:1,pop:0,cap:!!cap,wall:0,ws:0,parks:0,border:1};G.cities.push(c);t.city=c.id;t.village=0;t.ter=t.ter==='mountain'?'field':t.ter;t.res=null;t.imp=null;t.terr=c.id;claim(c,1);reveal(P(owner),x,y,2);return c;}
function claim(c,r){for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const X=c.x+dx,Y=c.y+dy;if(!inb(X,Y))continue;const t=T(X,Y);if(t.terr<0||(t.terr===c.id)){t.terr=c.id;}if(t.terr===c.id)reveal(P(c.owner),X,Y,1);}}
function makeUnit(type,owner,x,y,city){const u={id:G.nextId++,type,owner,x,y,hp:0,city:city==null?-1:city,cm:false,ca:false,kills:0,vet:0,base:null,frozen:0,poisoned:0,boost:0,age:0};u.hp=maxHp(u);G.units.push(u);occDirty();unitSight(u);return u;}

// ----- map generation -----
function genMap(N,np,mt){mt=mt||'continents';
 const WD=mt==='wild'?(G.wild=G.wild||{water:.05+rnd()*.8,smooth:ri(5),shape:pick(['none','center','ring','stripes','holes','cross','spots','edges']),fr:rnd()*.4,mtn:.2+rnd()*2.2,forest:.2+rnd()*2.2,field:.4+rnd()*1.6,res:.4+rnd()*1.4,ruins:.5+rnd()*2.5,freq:1+rnd()*3}):null;
 const M=[];for(let i=0;i<N*N;i++)M.push({ter:'field',res:null,imp:null,road:0,city:-1,terr:-1,clim:0,village:0,ruin:0});
 G.map=M;
 const caps=[];
 for(let k=0;k<np;k++){let best=null,bd=-1;for(let t=0;t<120;t++){const x=2+ri(N-4),y=2+ri(N-4);let md=caps.length?99:ri(10);for(const c of caps)md=Math.min(md,dist(x,y,c[0],c[1]));if(md>bd){bd=md;best=[x,y];}}caps.push(best);}
 let v=new Float32Array(N*N).map(()=>rnd());
 const sm=WD?WD.smooth:({archipelago:1,waterworld:1,lakes:2}[mt]||3);
 for(let s=0;s<sm;s++){const w=new Float32Array(N*N);for(let y=0;y<N;y++)for(let x=0;x<N;x++){let sum=v[y*N+x],n=1;for(const[a,b]of nbrs(x,y)){sum+=v[b*N+a];n++;}w[y*N+x]=sum/n;}v=w;}
 // climate
 const clim=new Int32Array(N*N);
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){let bi=0,bd=1e9;caps.forEach((c,i)=>{const d=dist(x,y,c[0],c[1])+rnd()*1.3;if(d<bd){bd=d;bi=i;}});clim[y*N+x]=bi;
  for(const c of caps){const d=dist(x,y,c[0],c[1]);if(d<=1)v[y*N+x]+=1;else if(d<=3)v[y*N+x]+=.06*(4-d);}
  if(mt!=='lakes'&&mt!=='drylands'&&(x===0||y===0||x===N-1||y===N-1))v[y*N+x]-=.08;
  const cx=(N-1)/2;const dc=Math.hypot(x-cx,y-cx)/(N/2);
  if(mt==='pangea')v[y*N+x]-=dc*.5;
  if(WD){const fx=x/N,fy=y/N,F=WD.freq;let sh=0;switch(WD.shape){case'center':sh=-dc*.6;break;case'ring':sh=-Math.abs(dc-.6)*.8;break;case'stripes':sh=Math.sin(fx*Math.PI*2*F)*.18;break;case'holes':sh=-Math.max(0,.35-Math.hypot(Math.sin(fx*Math.PI*F),Math.sin(fy*Math.PI*F))*.5)*1.2;break;case'cross':sh=-Math.min(Math.abs(fx-.5),Math.abs(fy-.5))*.9;break;case'spots':sh=Math.sin(fx*Math.PI*2*F)*Math.sin(fy*Math.PI*2*F)*.2;break;case'edges':sh=dc*.45;break;}v[y*N+x]+=sh+(rnd()-.5)*WD.fr;}
  if(mt==='continents'||mt==='archipelago'){const ds=caps.map(c=>dist(x,y,c[0],c[1])).sort((a,b)=>a-b);if(ds.length>1&&ds[1]-ds[0]<1.6)v[y*N+x]-=mt==='continents'?.45:.25;}
  if(mt==='lakes'&&(x===0||y===0||x===N-1||y===N-1))v[y*N+x]+=.3;}
 let wa=0;for(const p of G.players)wa+=TRIBES[p.t].wa;wa/=np;
 const base=WD?WD.water:({drylands:.04,lakes:.24,pangea:.42,continents:.5,archipelago:.62,waterworld:.86}[mt]||.45);

 const sorted=Array.from(v).sort((a,b)=>a-b);const th=sorted[Math.floor(frac*N*N)];
 for(let i=0;i<N*N;i++){const t=M[i];const tr=TRIBES[G.players[clim[i]].t];t.clim=G.players[clim[i]].t;t.cs=G.players[clim[i]].skin|0;
  if(v[i]<th){t.ter='water';continue;}
  const w=WD?[tr.w[0]*WD.field,tr.w[1]*WD.forest,tr.w[2]*WD.mtn]:tr.w,s=w[0]+w[1]+w[2]*.6;let r=rnd()*s;t.ter=r<w[0]?'field':r<w[0]+w[1]?'forest':'mountain';}
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){const t=T(x,y);if(t.ter==='water'&&!nbrs(x,y).some(([a,b])=>isLandT(T(a,b))))t.ter='ocean';}
 for(const c of caps){for(const[a,b]of nbrs(c[0],c[1])){const t=T(a,b);if(isWater(t)||t.ter==='mountain')t.ter=rnd()<.7?'field':'forest';}T(c[0],c[1]).ter='field';}
 // fix oceans next to new land
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){const t=T(x,y);if(t.ter==='ocean'&&nbrs(x,y).some(([a,b])=>isLandT(T(a,b))))t.ter='water';}
 // villages
 const vil=[];const cand=[];for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++){if(isLandT(T(x,y)))cand.push([x,y]);}

 for(const[x,y]of cand){if(vil.length>=target)break;if(caps.some(c=>dist(x,y,c[0],c[1])<3))continue;if(vil.some(c=>dist(x,y,c[0],c[1])<3))continue;vil.push([x,y]);const t=T(x,y);t.village=1;t.ter='field';}

 // resources

  let md=99;for(const s of spots)md=Math.min(md,dist(x,y,s[0],s[1]));

  if(t.ter==='field'){const f=R.fruit,c=R.crop*.7;if(rnd()<pr*Math.min(1.4,(f+c)/1.5)){t.res=rnd()<f/(f+c)?'fruit':'crop';}}
  else if(t.ter==='forest'){if(rnd()<pr*R.animal*.8)t.res='animal';}

 for(let y=0;y<N;y++)for(let x=0;x<N;x++){const t=T(x,y);if(t.ter==='ocean'&&!t.res&&rnd()<.06)t.res='starfish';}
 G.lights=[[0,0],[N-1,0],[0,N-1],[N-1,N-1]];for(const[x,y]of G.lights){const t=T(x,y);t.lighthouse=1;t.res=null;t.village=0;t.ruin=0;}

}

function newGame(o){

 const caps=genMap(N,np,G.mt);occDirty();
 G.players.forEach((p,i)=>{const tr=TRIBES[p.t];const[x,y]=caps[i];const c=makeCity(x,y,i,true);
  if(tr.tech)p.techs[tr.tech]=1;
  makeUnit(tr.unit,i,x,y,c.id);
  if(tr.lux){c.level=2;c.ws=1;p.stars+=3;}

function foamTile(t){if(isWater(t)&&!t.imp&&t.city<0){t.under=t.ter;t.ter='ice';t.foam=1;t.res=null;}}
function freezeTile(t){if(isWater(t)&&!t.imp&&t.city<0){t.under=t.ter;t.ter='ice';t.res=null;}}

// ----- tech -----
function cityCount(p){return G.cities.filter(c=>c.owner===p.i).length;}
function techCost(p,k){let c=TECH[k].t*Math.max(1,cityCount(p))+4;if(p.techs.philosophy)c=Math.ceil(c*.67);return c;}
function techAvail(p,k){return !p.techs[k]&&(!TECH[k].req||p.techs[TECH[k].req]);}
function research(p,k){const c=techCost(p,k);if(!techAvail(p,k)||p.stars<c)return false;p.stars-=c;p.techs[k]=1;if(k==='diplomacy')for(const c2 of G.cities)if(c2.cap)reveal(p,c2.x,c2.y,1);logEv(p.i,TECH[k].n,-1,'tech');return true;}

// ----- training -----
function trainList(p){const sp=psp(p);const o=[];for(const[b,t]of TRAIN_BASE){o.push([utype(p,b),t]);}if(sp&&EXTRA[sp])for(const e of EXTRA[sp])o.push(e);return o;}
function cityUnits(c){return G.units.filter(u=>u.city===c.id).length;}
function cityCap(c){return c.level+1;}
function canTrain(p,c,type,tech){if(tech&&!p.techs[tech])return'Needs '+TECH[tech].n;if(p.stars<UNITS[type].c)return'Not enough stars';if(cityUnits(c)>=cityCap(c))return'City is full';if(unitAt(c.x,c.y))return'City tile is busy';return null;}
function train(p,c,type){const u=makeUnit(type,p.i,c.x,c.y,c.id);p.stars-=UNITS[type].c;logEv(p.i,uname(type,p),-1,'train');return u;}

// ----- movement -----
function canStand(u,t,p){
 const naval=has(u,'naval'),fly=has(u,'fly'),amph=has(u,'amph');
 if(naval){if(isWater(t))return t.ter!=='ocean'||!!p.techs.sailing||psp(p)==='aqua';return t.ter!=='mountain'||!!p.techs.climbing;}
 if(fly)return true;
 if(isWater(t)){if(amph)return true;if(psp(p)==='polar')return false;return t.imp==='port'&&tileOwner(t)===p.i;}
 if(t.ter==='mountain')return !!p.techs.climbing;
 return true;
}
function isRoad(t){return t.road||t.city>=0;}
function enemyAdj(u,x,y){for(const[a,b]of nbrs(x,y)){const v=unitAt(a,b);if(v&&v.owner!==u.owner&&!atPeace(u.owner,v.owner)&&!(has(v,'hide')))return true;}return false;}
function reachable(u){
 const p=P(u.owner),N=G.N,res=new Map();if(!u.cm||u.frozen)return res;
 const best=new Float32Array(N*N).fill(-1);const s0=u.y*N+u.x;best[s0]=UD(u).m;const q=[s0];
 const slime=has(u,'slime'),naval=has(u,'naval'),skate=has(u,'skate'),creep=has(u,'creep')||has(u,'fly'),amph=has(u,'amph'),fly=has(u,'fly');
 while(q.length){let bi=0;for(let i=1;i<q.length;i++)if(best[q[i]]>best[q[bi]])bi=i;const c=q.splice(bi,1)[0];const rem=best[c];if(rem<=0)continue;
  const cx=c%N,cy=(c/N)|0;const ct=G.map[c];
  for(const[x,y]of nbrs(cx,cy)){const k=y*N+x;const t=G.map[k];
   if(!p.ai&&!p.ex[k])continue;
   if(unitAt(x,y))continue;
   if(!canStand(u,t,p))continue;
   let cost=1;if(!naval&&isRoad(t)&&isRoad(ct)&&!isWater(t))cost=.5;if(skate&&t.ter==='ice')cost=.5;
   if(rem<cost-1e-6)continue;
   let nr=rem-cost;
   if(naval&&!isWater(t))nr=0;
   if(!naval&&!amph&&!fly&&isWater(t))nr=0;
   if(!creep&&(t.ter==='forest'||t.ter==='mountain')&&!(isRoad(t)&&isRoad(ct)))nr=0;
   if(enemyAdj(u,x,y))nr=0;
   if(t.goo&&t.goo!==u.owner+1&&!fly&&!atPeace(u.owner,t.goo-1))nr=0;
   if(nr>best[k]){best[k]=nr;q.push(k);res.set(k,1);}
  }}
 return res;
}
function moveUnit(u,x,y){

 u.ax=u.x;u.ay=u.y;u.t0=(typeof performance!=='undefined'?performance.now():0);
 const naval=has(u,'naval');
 if(!naval&&isWater(to)&&!has(u,'amph')&&!has(u,'fly')){u.base=u.type;u.type='raft';}
 else if(naval&&!isWater(to)){u.type=u.base||'warrior';u.base=null;}
 u.x=x;u.y=y;u.cm=false;if(!has(u,'dash'))u.ca=false;

function infiltrate(u){const c=G.cities[T(u.x,u.y).city];const spots=nbrs(c.x,c.y).filter(([a,b])=>!unitAt(a,b)&&canStand({type:'dagger',owner:u.owner},T(a,b),P(u.owner)));
 killUnit(u,true);let n=0;const tp=utype(P(u.owner),'dagger');
 makeUnit(tp,u.owner,c.x,c.y,-1).cm=false;for(const[a,b]of shuffle(spots)){if(n>=2)break;makeUnit(tp,u.owner,a,b,-1);n++;}

// ----- combat -----
function defBonus(d){const t=T(d.x,d.y),p=P(d.owner);let b=1;
 if(has(d,'naval')||isWater(t)){if(p.techs.aquatism)b=1.5;}
 else if(t.ter==='forest'&&p.techs.archery)b=1.5;else if(t.ter==='mountain'&&p.techs.climbing)b=1.5;
 if(t.city>=0&&G.cities[t.city].owner===d.owner&&has(d,'fortify'))b=G.cities[t.city].wall?4:1.5;
 if(d.poisoned)b*=.5;return b;}
function atkVal(u){return(UD(u).a+(u.boost?.5:0))*(1+.5*(usz(u)-1));}
function calcDmg(a,d){const at=atkVal(a),df=defVal(d);const aF=at*a.hp/maxHp(a),dF=df*d.hp/maxHp(d)*defBonus(d);const tot=aF+dF;
 if(tot<=0)return{dmg:0,ret:0};const dmg=Math.round(aF/tot*at*4.5);let ret=Math.round(dF/tot*df*4.5);
 const dist_=dist(a.x,a.y,d.x,d.y);if(d.hp-dmg<=0||(dist_>UD(d).r&&!has(d,'bounce'))||UD(d).a<=0||d.frozen)ret=0;return{dmg,ret};}
function targets(u){if(!u.ca||u.frozen)return[];const D=UD(u);if(D.a<=0&&!has(u,'freeze')&&!has(u,'convert'))return[];const o=[];
 for(const v of G.units){if(v.owner===u.owner||atPeace(u.owner,v.owner))continue;if(dist(u.x,u.y,v.x,v.y)>D.r)continue;if(!canSee(v,u.owner))continue;o.push(v);}return o;}
function doAttack(a,d){
 const p=P(a.owner);
 a.ca=false;if(!has(a,'escape'))a.cm=false;noteHit(a.owner,d.owner);p.lastAtk=G.turn;
 if(has(a,'convert')){logEv(a.owner,pname(p)+' converted '+pname(P(d.owner))+'\'s '+uname(d.type,P(d.owner)),d.owner,'conv');d.owner=a.owner;d.city=a.city;d.cm=d.ca=false;occDirty();fx(d.x,d.y,'Converted!','#e0a0ff');unitSight(d);sfx('magic');return;}
 if(UD(a).a<=0&&has(a,'freeze')){d.frozen=1;fx(d.x,d.y,'Frozen!','#bfe8ff');sfx('magic');return;}
 const{dmg,ret}=calcDmg(a,d);a.boost=0;
 d.hp-=dmg;fx(d.x,d.y,'-'+dmg,'#ff5050');sfx('hit');
 if(has(a,'poison')&&d.hp>0)d.poisoned=1;
 if(has(a,'freeze')&&d.hp>0)d.frozen=1;
 if(has(a,'splash')){for(const v of G.units.slice()){if(v===d||v.owner===a.owner||atPeace(a.owner,v.owner))continue;if(dist(v.x,v.y,d.x,d.y)===1){const s=Math.round(dmg/2);v.hp-=s;fx(v.x,v.y,'-'+s,'#ff8050');if(has(a,'poison'))v.poisoned=1;if(v.hp<=0){killUnit(v);a.kills++;p.kills++;}}}}
 if(d.hp<=0){const dx=d.x,dy=d.y;logEv(a.owner,pname(p)+'\'s '+uname(a.type,p)+' defeated '+pname(P(d.owner))+'\'s '+uname(d.type,P(d.owner)),d.owner,'kill');killUnit(d);a.kills++;p.kills++;
  if(has(a,'gulp')&&G.units.includes(a)){a.hp=Math.min(maxHp(a),a.hp+5);fx(a.x,a.y,'Gulp! +5','#80ff80');}
  if(UD(a).r===1&&!has(a,'stiff')&&dist(a.x,a.y,dx,dy)===1&&canStand(a,T(dx,dy),p)&&G.units.includes(a)&&!unitAt(dx,dy)){a.ax=a.x;a.ay=a.y;a.t0=(typeof performance!=='undefined'?performance.now():0);
   const to=T(dx,dy);if(has(a,'naval')&&!isWater(to)){}else{a.x=dx;a.y=dy;occDirty();unitSight(a);}}
  if(has(a,'persist'))a.ca=true;}
 else{logEv(a.owner,pname(p)+' attacked '+pname(P(d.owner))+'\'s '+uname(d.type,P(d.owner))+' (-'+dmg+')',d.owner,'hit');}
 if(d.hp>0&&ret>0){a.hp-=ret;fx(a.x,a.y,'-'+ret,'#ff5050');if(has(d,'poison')&&a.hp>0)a.poisoned=1;if(a.hp<=0)killUnit(a);}
}

 const c=G.cities[t.city];const old=c.owner;logEv(u.owner,pname(p)+' captured '+c.name+(c.cap?' (a capital!)':'')+' from '+pname(P(old)),old,'cap');c.owner=u.owner;c.cap=false;

 else if(r===3){const cs=G.cities.filter(c=>c.owner===p.i).sort((a,b)=>dist(a.x,a.y,u.x,u.y)-dist(b.x,b.y,u.x,u.y));if(cs.length){addPop(cs[0],3);msg='Lost people found! +3 population.';}else{p.stars+=10;msg='Found 10 '+cn+'!';}}
 else{const fr=nbrs(u.x,u.y).filter(([a,b])=>!unitAt(a,b)&&isLandT(T(a,b))&&T(a,b).ter!=='mountain');if(fr.length){const[a,b]=pick(fr);const v=makeUnit(utype(p,'swordsman'),p.i,a,b,-1);v.vet=1;v.hp=maxHp(v);msg='A veteran warrior joins you!';}else{p.stars+=10;msg='Found 10 '+cn+'!';}}
 fx(u.x,u.y,'Ruins','#ffd23f');return msg;}

// ----- economy -----
function addPop(c,n){c.pop+=n;while(c.pop>=c.level+1){c.pop-=c.level+1;c.level++;logEv(c.owner,c.name+' grew to level '+c.level,-1,'grow');if(P(c.owner).ai)aiReward(c);else G.lvq.push(c.id);}}
function canFoamAt(p,x,y){const t=T(x,y);return psp(p)==='bug'&&isWater(t)&&!t.imp&&!t.res&&t.city<0&&(tileOwner(t)===p.i||nbrs(x,y).some(([a,b])=>tileOwner(T(a,b))===p.i||T(a,b).foam&&tileOwner(t)<0));}
function impList(p,x,y){const t=T(x,y);if(t.city>=0||t.village)return[];if(tileOwner(t)!==p.i){if(canFoamAt(p,x,y))return IMPS.filter(im=>im.k==='foam');return[];}const c=G.cities[t.terr];
 return IMPS.filter(im=>im.ok(t,x,y)&&!(im.noBug&&psp(p)==='bug')&&!(im.onlyBug&&psp(p)!=='bug')&&!(im.k==='port'&&psp(p)==='polar')).filter(im=>{if(im.lvl){return !cityHas(c,im.k);}return true;});}
function cityHas(c,k){for(let i=0;i<G.map.length;i++){const t=G.map[i];if(t.terr===c.id&&t.imp===k)return true;}return false;}
function impName(p,im){if(im.k==='flowers')return isND(p)?'Flowers':'Fungi';if(im.k==='foam')return isND(p)?'Foam':'Algae';if(psp(p)==='bug'){if(im.k==='fruit')return'Collect Nectar';if(im.k==='hunt')return'Catch Snulle';}return im.n;}
function impCost(im){return Math.max(0,im.c);}
function impPop(im,x,y){if(im.lvl){let n=0;for(const[a,b]of nbrs(x,y)){if((T(a,b).imp===im.lvl||(im.lvl==='farm'&&T(a,b).imp==='flowers'))&&T(a,b).terr===T(x,y).terr)n++;}return n*im.per;}return im.pop||0;}
function doImp(p,x,y,im){const t=T(x,y);const c=t.terr>=0?G.cities[t.terr]:null;const cost=impCost(im);if(p.stars<cost)return false;p.stars-=cost;
 const pop=impPop(im,x,y);
 switch(im.k){case'fruit':case'hunt':case'fish':t.res=null;break;
  case'flowers':if(im.k==='flowers')t.res=null;case'farm':case'mine':case'lumber':case'port':case'market':case'windmill':case'forge':case'sawmill':case'temple':case'mtemple':case'ftemple':case'wtemple':t.imp=im.k;break;
  case'clear':t.ter='field';p.stars+=1;break;
  case'burn':t.ter='field';t.res='crop';break;
  case'grow':t.ter='forest';break;
  case'road':t.road=1;break;
  case'foam':foamTile(t);{const v=unitAt(x,y);if(v&&has(v,'naval')){v.type=v.base||'warrior';v.base=null;}}break;
  case'foam':foamTile(t);{const v=unitAt(x,y);if(v&&has(v,'naval')){v.type=v.base||'warrior';v.base=null;}}break;}
 if(pop&&c)addPop(c,pop);
 // adjacency for level buildings
 const L={farm:['windmill',1],flowers:['windmill',1],mine:['forge',2],lumber:['sawmill',1]}[im.k];
 if(L){for(const[a,b]of nbrs(x,y)){const n=T(a,b);if(n.imp===L[0]&&n.terr>=0&&G.cities[n.terr].owner===p.i)addPop(G.cities[n.terr],L[1]);}}
 sfx('build');return true;}
function income(p){let s=0;for(const c of G.cities){if(c.owner!==p.i)continue;const o=unitAt(c.x,c.y);if(o&&o.owner!==p.i)continue;s+=c.level+(c.cap?1:0)+(c.ws?1:0);}
 for(let y=0;y<G.N;y++)for(let x=0;x<G.N;x++){const t=T(x,y);if(t.imp==='market'&&tileOwner(t)===p.i){let n=0;for(const[a,b]of nbrs(x,y)){const q=T(a,b).imp;if(q==='windmill'||q==='forge'||q==='sawmill'||(q==='flowers'&&psp(p)==='bug'))n++;}s+=Math.min(n,4)*2;}}
 s+=embassyIncome(p.i);if(p.ai)s+=[0,1,3][G.diff]||0;return s;}
function applyReward(c,k){const p=P(c.owner);
 switch(k){case'workshop':c.ws=1;break;
  case'explorer':{let x=c.x,y=c.y;for(let i=0;i<14;i++){const n=pick(nbrs(x,y));x=n[0];y=n[1];reveal(p,x,y,1);}break;}
  case'wall':c.wall=1;break;case'resources':p.stars+=5;break;
  case'popgrowth':addPop(c,3);break;case'border':c.border=2;claim(c,2);break;
  case'park':c.parks++;break;
  case'super':{let sp=[[c.x,c.y]].concat(nbrs(c.x,c.y)).find(([a,b])=>!unitAt(a,b)&&isLandT(T(a,b))&&(T(a,b).ter!=='mountain'||p.techs.climbing));if(sp)makeUnit(utype(p,'giant'),p.i,sp[0],sp[1],c.id);else p.stars+=10;break;}}}
function rewardOpts(level){return REWARDS[Math.min(level,5)];}


// ----- diplomacy -----
function metTribe(p,q){if(p.i===q.i)return true;if(!p.met)p.met={};if(p.met[q.i])return true;const r=G.rel&&G.rel[rk(p.i,q.i)];const m=atPeace(p.i,q.i)||!!(r&&(r.hit[p.i]||r.hit[q.i]||r.brk))||G.cities.some(c=>c.owner===q.i&&p.ex[c.y*G.N+c.x])||G.units.some(u=>u.owner===q.i&&p.ex[u.y*G.N+u.x]);if(m)p.met[q.i]=1;return m;}
function rk(a,b){return a<b?a+'-'+b:b+'-'+a;}
function rel(a,b){if(!G.rel)G.rel={};return G.rel[rk(a,b)]||(G.rel[rk(a,b)]={s:'war',t:0,emb:{},hit:{}});}
function atPeace(a,b){return a!==b&&G.rel&&G.rel[rk(a,b)]&&G.rel[rk(a,b)].s==='peace';}
function makePeace(a,b){const r=rel(a,b);r.s='peace';r.t=G.turn;for(const[x,y]of[[a,b],[b,a]]){const c=G.cities.find(c=>c.owner===y&&c.cap)||G.cities.find(c=>c.owner===y);if(c)reveal(P(x),c.x,c.y,1);}logEv(a,pname(P(a))+' and '+pname(P(b))+' made peace',b,'peace');}
function declareWar(a,b){const r=rel(a,b);if(r.s==='peace')r.brkBy=a;r.s='war';r.t=G.turn;r.emb={};r.hit[a]=G.turn;r.brk=G.turn;logEv(a,pname(P(a))+' declared war on '+pname(P(b))+'!',b,'war');}
function noteHit(a,b){const r=rel(a,b);r.hit[a]=G.turn;for(const[x,y]of[[a,b],[b,a]]){const p=P(x);if(!p.met)p.met={};p.met[y]=1;}}
function peaceChance(from,to){const m=moodOf(to,from);let c=.45+m.v/120;if(power(from)>power(to)*1.6)c+=.15;return Math.max(.03,Math.min(.95,c));}
function offerPeace(from,to){if(!P(from).techs.strategy)return'Needs Strategy';const ok=rnd()<peaceChance(from,to);if(ok)makePeace(from,to);else logEv(to,pname(P(to))+' refused peace with '+pname(P(from)),from,'refuse');return ok?'yes':'no';}
function buildEmbassy(a,b){const p=P(a);if(!p.techs.diplomacy||!atPeace(a,b)||p.stars<5)return false;p.stars-=5;rel(a,b).emb[a]=1;logEv(a,pname(p)+' built an embassy with '+pname(P(b)),b,'emb');return true;}
function embassyIncome(i){let s=0;if(!G.rel)return 0;for(const k in G.rel){const r=G.rel[k];if(r.s!=='peace')continue;const[a,b]=k.split('-').map(Number);if(a!==i&&b!==i)continue;const o=a===i?b:a;if(r.emb[i])s++;if(r.emb[o])s++;}return s;}

// ----- moods: how tribe a feels about tribe b -----
function power(i){let s=0;for(const u of G.units)if(u.owner===i&&UD(u).a>0)s+=(UNITS[u.base||u.type].c||4)*usz(u);return s;}
function fought(a,b,turns){const r=G.rel&&G.rel[rk(a,b)];if(!r)return false;return(r.hit[a]&&G.turn-r.hit[a]<=turns)||(r.hit[b]&&G.turn-r.hit[b]<=turns);}
function moodOf(a,b){// how a thinks of b
 const r=rel(a,b);let v=0;const tags=[];const add=(t,n,good,why)=>{v+=n;tags.push({t,good,why});};
 if(r.s==='peace'){add('Friendly',20,1,'You are at peace with them');if(G.turn-r.t>=10)add('Peaceful',10,1,'Your peace has lasted a long time');}
 if(r.emb[b])add('Generous',15,1,'You built an embassy with them');
 if(r.hit[b]&&G.turn-r.hit[b]<=5)add('Aggressive',-30,0,'You attacked them recently');
 if(r.brkBy===b&&G.turn-r.brk<=15)add('Backstabber',-35,0,'You broke a peace treaty with them');
 let near=0;for(const u of G.units){if(u.owner!==b||UD(u).a<=0)continue;const t=T(u.x,u.y);if(tileOwner(t)===a||nbrs(u.x,u.y).some(([x,y])=>tileOwner(T(x,y))===a))near++;}
 if(near&&r.s!=='peace')add('Threatening',-Math.min(30,10*near),0,near+' of your fighters '+(near>1?'are':'is')+' at their borders');
 let foolish=0,brave=0;for(const q of G.players){if(q.i===a||q.i===b||!q.alive)continue;const theirEnemy=fought(a,q.i,6)&&!atPeace(a,q.i),theirFriend=atPeace(a,q.i);
  if(theirEnemy&&atPeace(b,q.i))foolish++;if(theirFriend&&fought(b,q.i,6)&&!atPeace(b,q.i))foolish++;if(theirEnemy&&fought(b,q.i,6)&&!atPeace(b,q.i))brave++;}
 if(foolish>brave)add('Foolish',-15,0,'You made peace with their enemies or fight their friends');
 else if(brave>foolish)add('Brave',10,1,'You fight their enemies too');
 const pa=power(a),pb=power(b);
 if(pb<pa*.5&&pa>6)add('Weak',-10,0,'Your army is much smaller than theirs');
 else if(pb>pa*1.6&&pb>6)add('Powerful',8,1,'Your army is much bigger than theirs');
 if(score(P(b))>score(P(a))*1.5)add('Envious',-8,0,'You are doing way better than them');
 v=Math.max(-100,Math.min(100,v));
 const label=v>=40?'Great':v>=15?'Decent':v>-15?'Neutral':v>-40?'Bad':'Horrible';
 return{v,label,tags};}
// ----- lighthouses -----
function checkLighthouses(u){const p=P(u.owner);if(!p.lh)p.lh=[];const r=(T(u.x,u.y).ter==='mountain'||has(u,'sight'))?2:1;
 for(const L of G.lights||[]){if(p.lh.includes(L[0]+','+L[1]))continue;if(dist(u.x,u.y,L[0],L[1])<=r){p.lh.push(L[0]+','+L[1]);reveal(p,L[0],L[1],3);p.stars+=3;fx(L[0],L[1],'Lighthouse found!','#ffe14a');logEv(p.i,pname(p)+' found a lighthouse',-1,'lh');if(p.lh.length===4){p.stars+=10;logEv(p.i,pname(p)+' found all 4 lighthouses!',-1,'lh');if(!p.ai&&typeof toast==='function')toast('All 4 lighthouses found! +10');}}}}

// ----- tasks & monuments -----
function taskDone(p,k){if(!p.tasks)p.tasks={};const T_=TASKS.find(t=>t.k===k);if(T_.tech&&!p.techs[T_.tech]&&!(T_.tech==='construction'&&psp(p)==='bug'&&p.techs.farming&&p.techs.construction))return false;
 switch(k){case'pacifist':return G.turn>=5&&G.turn-(p.lastAtk||0)>=5;case'wealth':return p.stars>=100;case'genius':return Object.keys(TECH).every(t=>p.techs[t]);
  case'network':return G.map.filter(t=>t.road&&tileOwner(t)===p.i).length>=10;case'explorer':return p.ex.every(e=>e);case'killer':return(p.kills||0)>=10;case'metropolis':return G.cities.some(c=>c.owner===p.i&&c.level>=5);}return false;}
function checkTasks(p){if(!p.tasks)p.tasks={};if(!p.mons)p.mons={};for(const T_ of TASKS){if(p.tasks[T_.k])continue;if(taskDone(p,T_.k)){p.tasks[T_.k]=1;p.mons[T_.k]=0;logEv(p.i,pname(p)+' completed the '+T_.n+' task',-1,'task');if(!p.ai&&typeof toast==='function')toast('Task done: '+T_.n+'! Build the '+T_.mon+'.');}}}
function monumentsToBuild(p){return TASKS.filter(T_=>p.mons&&p.mons[T_.k]===0);}
function buildMonument(p,x,y,k){const t=T(x,y);t.imp='mon';t.mon=k;p.mons[k]=1;const c=G.cities[t.terr];if(c)addPop(c,3);logEv(p.i,pname(p)+' built the '+TASKS.find(q=>q.k===k).mon,-1,'mon');sfx('city');}

// ----- slime tribe -----
function mergeTargets(u){if(!has(u,'slime')||!u.cm||!u.ca)return[];return nbrs(u.x,u.y).map(([a,b])=>unitAt(a,b)).filter(v=>v&&v.owner===u.owner&&v.type===u.type&&usz(u)+usz(v)<=4);}
function mergeSlimes(u,v){const hp=u.hp+v.hp;u.sz=usz(u)+usz(v);u.hp=Math.min(maxHp(u),hp);u.poisoned=0;killUnit(v,true);u.cm=u.ca=false;fx(u.x,u.y,'Merge! Size '+u.sz,'#9aff6a');sfx('magic');}
function splitSpot(u){return nbrs(u.x,u.y).find(([a,b])=>!unitAt(a,b)&&canStand(u,T(a,b),P(u.owner)));}
function canSplit(u){return has(u,'slime')&&!UNITS[u.type].sup&&usz(u)>=2&&u.cm&&u.ca&&!!splitSpot(u);}
function splitSlime(u){const s=usz(u),a=Math.ceil(s/2),b=s-a;const sp=splitSpot(u);const frac=u.hp/maxHp(u);u.sz=a;u.hp=Math.max(1,Math.round(maxHp(u)*frac));
 const v=makeUnit(u.type,u.owner,sp[0],sp[1],u.city);v.sz=b;v.hp=Math.max(1,Math.round(maxHp(v)*frac));v.cm=v.ca=false;u.cm=u.ca=false;occDirty();fx(u.x,u.y,'Split!','#9aff6a');sfx('magic');}
function canGobble(u){const t=T(u.x,u.y);return has(u,'slime')&&u.cm&&u.ca&&['fruit','animal','fish','crop'].includes(t.res)&&!t.imp;}
function gobble(u){const t=T(u.x,u.y);t.res=null;const p=P(u.owner);p.stars+=3;u.hp=Math.min(maxHp(u),u.hp+3);u.cm=u.ca=false;fx(u.x,u.y,'Gobble! +3','#ffd23f');sfx('build');}
// ----- score -----
function score(p){let s=0;for(const e of p.ex)if(e)s+=5;
 for(const c of G.cities)if(c.owner===p.i)s+=100+c.level*50+c.parks*250;
 for(const k in p.techs)s+=TECH[k].t*100;s+=(p.lh||[]).length*100;
 for(const u of G.units)if(u.owner===p.i)s+=(UNITS[u.base||u.type].c||5)*5;
 for(const t of G.map){if(TEMPLES.includes(t.imp)&&tileOwner(t)===p.i)s+=150;if(t.imp==='mon'&&tileOwner(t)===p.i)s+=400;}
 return s;}

// ----- turns -----
function startTurn(i){const p=P(i);
 for(const u of G.units){if(u.owner!==i)continue;
  if(has(u,'grow')){u.age=(u.age||0)+1;if(u.age>=3){const om=maxHp(u);u.type=u.type==='wyrmegg'?'babywyrm':'firewyrm';u.age=0;u.hp=Math.min(maxHp(u),u.hp+maxHp(u)-om);fx(u.x,u.y,'Grew up!','#ffb050');}}
  if(has(u,'hatch')){u.type='larvy';u.hp=maxHp(u);fx(u.x,u.y,'Hatched!','#ff9be0');}
  if(u.frozen){u.cm=u.ca=false;u.frozen=0;u.wasFrozen=1;}else{u.cm=u.ca=true;u.wasFrozen=0;}
  if(has(u,'slime')&&T(u.x,u.y).goo===i+1&&u.hp<maxHp(u)&&!u.poisoned){u.hp=Math.min(maxHp(u),u.hp+2);}
 }
 p.stars+=income(p);
 checkTasks(p);
 for(const q of G.players)if(q.i!==p.i)metTribe(p,q);
}
function endTurnEffects(i){
 for(const u of G.units){if(u.owner!==i)continue;const t=T(u.x,u.y);if(has(u,'slime')&&isLandT(t)&&t.city<0)t.goo=i+1;else if(t.goo&&t.goo!==i+1&&!has(u,'fly'))t.goo=0;}
 for(const u of G.units.slice()){if(u.owner!==i||!has(u,'foamarea'))continue;for(const[a,b]of nbrs(u.x,u.y)){const t=T(a,b);if(isWater(t)&&!t.imp&&t.city<0){const v=unitAt(a,b);foamTile(t);if(v&&has(v,'naval')){v.type=v.base||'warrior';v.base=null;}}}}
 for(const u of G.units.slice()){if(u.owner!==i||!has(u,'freezearea'))continue;
  for(const[a,b]of nbrs(u.x,u.y)){const t=T(a,b);if(isWater(t)&&!t.imp&&t.city<0){const v=unitAt(a,b);freezeTile(t);if(v&&has(v,'naval')){v.type=v.base||'warrior';v.base=null;}}
   const v=unitAt(a,b);if(v&&v.owner!==i){v.frozen=1;}}}
}
function aliveList(){return G.players.filter(p=>p.alive);}
function checkWin(){if(G.over)return null;const al=aliveList();const humans=al.filter(p=>!p.ai);
 if(humans.length===0){return{lose:true};}
 if(al.length===1){if(G.mode==='inf'){if(!G.wonShown){G.wonShown=1;if(typeof toast==='function')toast(pname(al[0])+' rules the world! Keep playing as long as you like.');}return null;}return{win:al[0].i};}
 return null;}

// ----- save -----
const SAVE_KEY='tinyrealms_slot_';
function saveGame(slot){if(!G)return false;try{const s=JSON.stringify({v:1,G,when:Date.now()},(k,v)=>(k==='t0'||k==='ax'||k==='ay')?undefined:v);localStorage.setItem(SAVE_KEY+slot,s);return true;}catch(e){return false;}}
function loadGame(slot){try{const s=localStorage.getItem(SAVE_KEY+slot);if(!s)return false;const o=JSON.parse(s);if(!o.G)return false;G=o.G;for(const u of G.units){delete u.t0;delete u.ax;delete u.ay;}occDirty();return true;}catch(e){return false;}}
function saveInfo(slot){try{const s=localStorage.getItem(SAVE_KEY+slot);if(!s)return null;const o=JSON.parse(s);const hs=o.G.players.filter(p=>!p.ai).map(p=>pname(p));return{when:o.when,turn:o.G.turn,who:hs.join(', '),n:o.G.players.length,over:o.G.over};}catch(e){return null;}}
function delSave(slot){try{localStorage.removeItem(SAVE_KEY+slot);}catch(e){}}

// ================= AI =================
function aiReward(c){const o=rewardOpts(c.level);let k;
 if(c.level===2)k='workshop';else if(c.level===3)k=rnd()<.6?'wall':'resources';else if(c.level===4)k=rnd()<.5?'border':'popgrowth';else k=rnd()<.7?'super':'park';
 if(!o.some(x=>x[0]===k))k=o[0][0];applyReward(c,k);}
function enemyNear(u,r){for(const v of G.units){if(v.owner!==u.owner&&dist(u.x,u.y,v.x,v.y)<=r)return true;}return false;}
function bestTarget(u){let best=null;for(const d of targets(u)){let s;
  if(has(u,'convert'))s=5+(UNITS[d.base||d.type].c||2);
  else if(UD(u).a<=0)s=d.frozen?-1:3;
  else{const{dmg,ret}=calcDmg(u,d);if(dmg<=0)continue;s=dmg>=d.hp?12+(UNITS[d.base||d.type].c||2):dmg-ret*.9;if(ret>=u.hp)s-=25;if(T(d.x,d.y).city>=0)s+=2;}
  if(!best||s>best.s)best={d,s};}return best;}
function aiGoal(u,p,claimed){const N=G.N;let best=null,bd=1e9;const atk=UD(u).a>0;
 // defend threatened city
 for(const c of G.cities){if(c.owner!==p.i)continue;const d=dist(u.x,u.y,c.x,c.y);if(d>4)continue;
  if(G.units.some(v=>v.owner!==p.i&&!atPeace(p.i,v.owner)&&dist(v.x,v.y,c.x,c.y)<=2)){const o=unitAt(c.x,c.y);const sc=d-2.5;if((!o||o===u||o.owner!==p.i)&&sc<bd){bd=sc;best=[c.x,c.y];}}}
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){const t=T(x,y);const k=y*N+x;let w=null;
  if(t.village&&!claimed.has(k))w=0;
  else if(t.city>=0&&G.cities[t.city].owner!==p.i&&atk&&!atPeace(p.i,G.cities[t.city].owner))w=.5;
  else if(t.ruin&&!claimed.has(k))w=1;
  else if(!p.ex[k])w=3.5;
  else if(t.lighthouse&&!(p.lh||[]).includes(x+','+y))w=4;
  else{const v=unitAt(x,y);if(v&&v.owner!==p.i&&atk&&!has(v,'hide')&&!atPeace(p.i,v.owner))w=1.5;}

 box.querySelectorAll('[data-war]').forEach(b=>b.onclick=()=>{const q=+b.dataset.war;declareWar(p.i,q);toast('You declared war on '+pname(P(q))+'!');sfx('hit');$('modal').style.display='none';dirty=true;openTribes();});
 box.querySelectorAll('[data-emb]').forEach(b=>b.onclick=()=>{const q=+b.dataset.emb;if(buildEmbassy(p.i,q)){toast('Embassy built!');sfx('build');}$('modal').style.display='none';updHud();openTribes();});}
function showOffers(p,done){const i=(G.offers||[]).findIndex(o=>o.to===p.i);if(i<0)return done();const o=G.offers.splice(i,1)[0];const q=P(o.from);if(!q.alive||atPeace(p.i,q.i))return showOffers(p,done);
 const[c1]=pcol(q);modal('<h2><span class="dot" style="background:'+c1+'"></span>'+pname(q)+' wants peace</h2><p>If you agree, your tribes cannot attack each other or take each other\'s cities. Either side can declare war later.</p>',[['Make peace',()=>{makePeace(q.i,p.i);sfx('city');showOffers(p,done);},'big'],['No thanks',()=>{logEv(p.i,pname(p)+' refused peace with '+pname(q),q.i,'refuse');showOffers(p,done);}]]);}

function showRecap(p){const ev=(G.ev||[]).slice(p.evSeen||0).filter(e=>e.a!==p.i);p.evSeen=(G.ev||[]).length;if(!ev.length||G.turn<=1)return false;
 const by=new Map();for(const e of ev){if(e.k==='hit'&&e.tg!==p.i)continue;if(!by.has(e.a))by.set(e.a,{tech:[],train:0,lines:[],grow:0});const g=by.get(e.a);
  if(e.k==='tech')g.tech.push(e.t);else if(e.k==='train')g.train++;else if(e.k==='grow')g.grow++;else g.lines.push(e);}
 let h='<h2>While you waited</h2><div class="recap">';let any=false;
 for(const[a,g]of by){const q=P(a);const met=metTribe(p,q);const[c1]=pcol(q);const nm=met?pname(q):'An unknown tribe';
  const bits=[];for(const e of g.lines){if(!met&&e.tg!==p.i)continue;bits.push('<li class="'+(e.tg===p.i?'bad':'')+'">'+(met?e.t:e.t.split(pname(q)).join('Someone'))+'</li>');}
  if(met){if(g.tech.length)bits.push('<li>Learned '+g.tech.join(', ')+'</li>');if(g.train)bits.push('<li>Trained '+g.train+' unit'+(g.train>1?'s':'')+'</li>');if(g.grow)bits.push('<li>'+g.grow+' cit'+(g.grow>1?'ies':'y')+' grew</li>');}
  if(!bits.length)continue;any=true;h+='<div class="rt"><span class="dot" style="background:'+(met?c1:'#888')+'"></span><b>'+nm+'</b><ul>'+bits.slice(0,8).join('')+'</ul></div>';}
 h+='</div>';if(!any)return false;modal(h,[['OK',()=>setTimeout(showLvq,30),'big']]);return true;}
function nextPlayer(){let i=G.cur+1;if(i>=G.players.length){i=0;G.turn++;if(G.mode==='perf'&&G.turn>G.maxT)return gameOver({perf:true});}beginPlayer(i);}
function endTurn(){if(!G||busy||G.over)return;const p=humanP();if(p.ai)return;sfx('click');endTurnEffects(p.i);clearSel();const w=checkWin();if(w)return gameOver(w);nextPlayer();}
function gameOver(w){G.over=true;busy=false;$('aiwait').style.display='none';saveGame('auto');
 const rank=G.players.slice().sort((a,b)=>score(b)-score(a));let title='';
 if(w.perf)title=pname(rank[0])+' wins with the highest score!';else if(w.lose)title='All players were defeated...';else title=pname(P(w.win))+' rules the world!';
 const rows=rank.map((p,i)=>'<tr><td>'+(i+1)+'.</td><td><span class="dot" style="background:'+pcol(p)[0]+'"></span>'+pname(p)+(p.ai?'':' (player)')+'</td><td>'+score(p)+'</td><td>'+(p.alive?'':'out')+'</td></tr>').join('');
 modal('<h2>Game Over</h2><p>'+title+'</p><table class="rank">'+rows+'</table>',[['Look at map',null],['Main menu',()=>{G=null;showTitle();}, 'big']]);}

// ---------- menus ----------
function openTasks(){const p=humanP()&&!humanP().ai?humanP():P(G.view);checkTasks(p);let h='<h2>Tasks & Monuments</h2><p class="sk">Finish a task to unlock its monument. Build it on an empty field or forest in your land for +3 population and +400 score.</p><div class="dip">';
 for(const T_ of TASKS){const done=p.tasks&&p.tasks[T_.k],built=p.mons&&p.mons[T_.k]===1,locked=T_.tech&&!p.techs[T_.tech];
  h+='<div class="drow"><span class="dot" style="background:'+T_.col+'"></span><div class="dn"><b>'+T_.n+'</b><small>'+T_.d+(locked?' &middot; needs '+TECH[T_.tech].n:'')+'</small></div><div class="db"><small class="'+(built||done?'pc':'wr')+'">'+(built?'Built: '+T_.mon:done?'Ready to build!':'Not done')+'</small></div></div>';}
 modal(h+'</div>',[['Close',null]]);}
function openMenu(){if(!G)return;const rank=G.players.slice().sort((a,b)=>score(b)-score(a));
 const rows=rank.map(p=>'<tr><td><span class="dot" style="background:'+pcol(p)[0]+'"></span>'+pname(p)+(p.ai?'':' (player)')+'</td><td>'+score(p)+'</td><td>'+(p.alive?'':'out')+'</td></tr>').join('');
 modal('<h2>Menu</h2><table class="rank">'+rows+'</table>',[['Resume',null],['Tasks & Monuments',openTasks],['Save game',saveMenu],['How to play',help],[MUTE?'Sound: off':'Sound: on',()=>{MUTE=!MUTE;}],['Quit to title',()=>{G=null;clearSel();showTitle();}]]);}
function slotLabel(s){const i=saveInfo(s);if(!i)return'Empty';return'Turn '+i.turn+' &middot; '+i.who+' &middot; '+i.n+' tribes'+(i.over?' (over)':'')+'<small>'+new Date(i.when).toLocaleString()+'</small>';}
function saveMenu(){modal('<h2>Save game</h2><p>Pick a slot.</p>',[1,2,3].map(s=>['Slot '+s+': '+slotLabel(s),()=>{toast(saveGame(s)?'Saved to slot '+s:'Could not save');}]).concat([['Back',openMenu]]));}
function help(){modal('<h2>How to play</h2><div class="help"><p><b>Goal:</b> Perfection mode: highest score after 30 turns. Domination: be the last tribe standing.</p><p><b>Stars</b> come in every turn from your cities. Spend them on tech, units and buildings.</p><p><b>Units:</b> tap a unit, then a white tile to move or a red enemy to attack. Most units can move then attack.</p><p><b>Villages:</b> move a unit onto one, then next turn tap Capture to make a new city.</p><p><b>Grow cities:</b> tap tiles in your land to harvest fruit, hunt, fish, build farms and mines. Full population bars level the city up and give you a reward.</p><p><b>Water:</b> learn Fishing and build a Port. Walk onto it to become a Raft.</p><p><b>Pass and play:</b> each human player takes a turn, then hands the device to the next player.</p><p>Drag to look around, pinch or scroll to zoom.</p></div>',[['Got it',null]]);}

// ---------- title / setup ----------
let SETUP=null;
function showTitle(){$('top').style.display='none';$('bottom').style.display='none';$('panel').style.display='none';$('tech').style.display='none';$('modal').style.display='none';$('modal').classList.remove('dark');
 const s=$('setup');s.style.display='block';s.innerHTML='<div class="title"><h1>Tiny Realms</h1><p>A little tribe strategy game</p><div id="tcan" class="tcan"></div>'+(saveInfo('auto')&&!saveInfo('auto').over?'<button class="btn big go" id="bCont">Continue</button>':'')+'<button class="btn big" id="bNew">New Game</button><button class="btn big" id="bLoad">Load Game</button><button class="btn" id="bHelp">How to play</button></div>';
 [0,4,6,14,5,2].forEach((t,i)=>{const tr=TRIBES[t];const ty=['warrior','petalshaman','snowling','tidecrawler','wildhorn','rider'][i];$('tcan').appendChild(iconCanvas(ty,tr.c[0],tr.c[1],tr.hat[0],56));});resetWorld();dirty=true;
 $('bNew').onclick=()=>{sfx('click');setupScreen();};if($('bCont'))$('bCont').onclick=()=>{if(loadGame('auto')){$('setup').style.display='none';resumeLoaded();}};$('bLoad').onclick=()=>{sfx('click');loadScreen();};$('bHelp').onclick=help;}
function loadScreen(){const s=$('setup');let h='<div class="title"><h1>Load Game</h1>';
 for(const sl of['auto',1,2,3]){const i=saveInfo(sl);h+='<div class="slot"><div><b>'+(sl==='auto'?'Autosave':'Slot '+sl)+'</b><div class="sk">'+slotLabel(sl)+'</div></div>'+(i?'<button class="btn" data-l="'+sl+'">Load</button><button class="btn red" data-d="'+sl+'">X</button>':'')+'</div>';}
 h+='<button class="btn" id="bBack">Back</button></div>';s.innerHTML=h;$('bBack').onclick=showTitle;
 s.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{if(loadGame(b.dataset.l)){s.style.display='none';resumeLoaded();}});
 s.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{delSave(b.dataset.d);loadScreen();});}
function resumeLoaded(){FX=[];if(G.over){updHud();centerOn(G.N/2,G.N/2);gameOver(checkWin()||{perf:true});return;}
 const p=P(G.cur);if(!p||p.ai||G.cur<0){G.cur=-1;nextPlayer();return;}humanStart();}
function setupScreen(){if(!SETUP){SETUP={slots:[{t:0,skin:0,ai:false}],ai:3,size:16,mt:'continents',mode:'perf',diff:1};}renderSetup();}
function renderSetup(){const S=SETUP,s=$('setup');let h='<div class="setup"><h2>New Game</h2><div class="sub">Players (pass and play)</div><div id="hl"></div><button class="btn" id="addH">+ Add human player</button>';
 h+='<div class="sub">Computer tribes: <button class="btn sm" id="aim">-</button> <b id="ain">'+S.ai+'</b> <button class="btn sm" id="aip">+</button></div>';
 const seg=(id,opts,val)=>'<div class="seg" id="'+id+'">'+opts.map(([v,l])=>'<button class="'+(v===val?'on':'')+'" data-v="'+v+'">'+l+'</button>').join('')+'</div>';
 h+='<div class="sub">Map size</div>'+seg('sz',[[11,'Tiny'],[14,'Small'],[16,'Normal'],[18,'Large'],[20,'Huge'],[30,'Massive']],S.size)+'<div class="sub">World type</div>'+seg('mt',[['wild','Wild'],['random','Random'],['drylands','Drylands'],['lakes','Lakes'],['pangea','Pangea'],['continents','Continents'],['archipelago','Archipelago'],['waterworld','Water World']],S.mt)+'<button class="btn sm" id="rndAll" style="margin-top:6px;width:100%">Surprise me: random size, world and tribes</button>'+'<div class="sub">Game mode</div>'+seg('md',[['perf','Perfection (30 turns)'],['dom','Domination'],['inf','Infinite']],S.mode)+'<div class="sub">Computer skill</div>'+seg('df',[[0,'Easy'],[1,'Normal'],[2,'Hard']],S.diff);
 h+='<div class="row"><button class="btn" id="sBack">Back</button><button class="btn big go" id="sGo">Start!</button></div></div>';s.innerHTML=h;
 const hl=$('hl');S.slots.forEach((sl,i)=>{const tr=TRIBES[sl.t];const d=document.createElement('div');d.className='prow';const col=[tr.c,tr.sc,tr.tc||tr.sc][sl.skin|0];d.appendChild(iconCanvas(tr.unit,col[0],col[1],(tr.hat[sl.skin|0]||tr.hat[0]),52));
  const info=document.createElement('div');info.className='pi';info.innerHTML='<b>Player '+(i+1)+': '+([tr.n,tr.s,tr.s3||tr.s][sl.skin|0])+'</b><small>'+tr.perk+'</small>';d.appendChild(info);
  const ch=document.createElement('button');ch.className='btn sm';ch.textContent='Tribe';ch.onclick=()=>tribePicker(i);d.appendChild(ch);
  if(i>0){const rm=document.createElement('button');rm.className='btn sm red';rm.textContent='X';rm.onclick=()=>{S.slots.splice(i,1);renderSetup();};d.appendChild(rm);}
  hl.appendChild(d);});
 $('addH').onclick=()=>{const used=S.slots.map(x=>x.t);const free=TRIBES.map((_,i)=>i).filter(i=>!used.includes(i));if(!free.length||S.slots.length+S.ai>=TRIBES.length)return toast('Too many tribes');S.slots.push({t:free[0],skin:0,ai:false});renderSetup();};
 $('aim').onclick=()=>{S.ai=Math.max(S.slots.length>1?0:1,S.ai-1);renderSetup();};$('aip').onclick=()=>{if(S.slots.length+S.ai<TRIBES.length)S.ai++;renderSetup();};
 for(const[id,k,num]of[['sz','size',1],['mt','mt',0],['md','mode',0],['df','diff',1]])$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{S[k]=num?+b.dataset.v:b.dataset.v;renderSetup();});
 $('sBack').onclick=showTitle;$('sGo').onclick=startGame;$('rndAll').onclick=()=>{S.size=pick([11,14,16,18,20]);S.mt='wild';S.ai=1+ri(Math.min(6,14-S.slots.length+1));for(const sl of S.slots){const used=S.slots.filter(o=>o!==sl).map(o=>o.t);const fr=TRIBES.map((_,i)=>i).filter(i=>!used.includes(i));sl.t=pick(fr);sl.skin=ri(skinCount(sl.t));}sfx('magic');renderSetup();toast('Wild random world! Size '+S.size+', '+S.ai+' computer tribes. Every Wild map is different.');};}
function tribePicker(i){const S=SETUP;const s=$('setup');let h='<div class="setup"><h2>Pick a tribe for Player '+(i+1)+'</h2><div class="tgrid">';
 TRIBES.forEach((tr,ti)=>{const taken=S.slots.some((x,j)=>j!==i&&x.t===ti);h+='<div class="tcard'+(taken?' taken':'')+'"><div class="pics" data-ti="'+ti+'"></div><b>'+tr.n+'</b><small>'+tr.like+'</small><div class="skins">'+[0,1,2].slice(0,skinCount(ti)).map(sk=>{const cc=[tr.c,tr.sc,tr.tc][sk][0],nm=[tr.n,tr.s,tr.s3][sk];return'<button class="btn sm" data-t="'+ti+'" data-s="'+sk+'" style="background:'+cc+';color:'+(lum(cc)>.6?'#222':'#fff')+'">'+nm+'</button>';}).join('')+'</div><small class="perk">'+tr.perk+'</small></div>';});
 h+='</div><button class="btn" id="pBack">Back</button></div>';s.innerHTML=h;s.scrollTop=0;
 s.querySelectorAll('.pics').forEach(cn=>{const tr=TRIBES[+cn.dataset.ti];for(let sk=0;sk<skinCount(+cn.dataset.ti);sk++){const cc=[tr.c,tr.sc,tr.tc][sk];cn.appendChild(iconCanvas(tr.unit,cc[0],cc[1],tr.hat[sk]||tr.hat[0],skinCount(+cn.dataset.ti)>2?44:56));}});
 s.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const ti=+b.dataset.t;if(S.slots.some((x,j)=>j!==i&&x.t===ti))return toast('Another player has that tribe');S.slots[i]={t:ti,skin:+b.dataset.s,ai:false};renderSetup();});
 $('pBack').onclick=renderSetup;}
function startGame(){const S=SETUP;const used=S.slots.map(x=>x.t);const free=shuffle(TRIBES.map((_,i)=>i).filter(i=>!used.includes(i)));
 const slots=S.slots.map(x=>({...x}));for(let k=0;k<S.ai&&free.length;k++)slots.push({t:free.pop(),skin:ri(skinCount(0)&&TRIBES[free[free.length-1]].s3?3:2),ai:true});
 if(slots.length<2)return toast('Add at least one opponent');
 newGame({slots,size:S.size,mt:S.mt==='random'?pick(WORLD_TYPES):S.mt,mode:S.mode,diff:S.diff});$('setup').style.display='none';FX=[];
 const p0=G.cities.find(c=>c.owner===0);centerOn(p0.x,p0.y);nextPlayer();}

$('endBtn').onclick=endTurn;$('nextBtn').onclick=nextUnit;$('tribeBtn').onclick=openTribes;$('techBtn').onclick=openTech;$('menuBtn').onclick=openMenu;
addEventListener('pagehide',()=>{if(G&&!busy&&P(G.cur)&&!P(G.cur).ai)saveGame('auto');});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&!busy&&P(G.cur)&&!P(G.cur).ai)saveGame('auto');});
showTitle();

</script>
</body></html>
