/* Layout: a single arcade-cabinet column — pixel screen on top, chunky touch pad below. Deliberately one dark look. */
:root{
  --bg:#1d1a33; --panel:#2a2547; --edge:#463c78; --fg:#f4ecff; --muted:#b3a8d6; --accent:#ffcc33; --pink:#ff8fc7;
  --display:'Press Start 2P', ui-monospace, Menlo, monospace;
  --body:'Pixelify Sans', ui-rounded, system-ui, sans-serif;
  color-scheme:dark;

html,body{min-height:100%}
body{
  background:var(--bg); color:var(--fg); font-family:var(--body); font-size:16px; margin:0; box-sizing:border-box;
  padding-block:16px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex; flex-direction:column; align-items:center; gap:14px;
  overscroll-behavior:none;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
}
*,*::before,*::after{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
button{touch-action:manipulation}
.wrap{width:min(100%, 960px, calc((100dvh - 250px) * 1.5)); min-width:min(100%, 320px); display:flex; flex-direction:column; gap:10px}
.top{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
h1{font-family:var(--display); font-size:clamp(12px, 2.4vw, 18px); margin:0; color:var(--accent); letter-spacing:.04em; text-shadow:3px 3px 0 #6a3fb0}
#mute{font-family:var(--display); font-size:10px; background:var(--panel); color:var(--fg); border:3px solid var(--edge); padding:8px 10px; cursor:pointer; border-radius:4px}
#mute:focus-visible,.btn:focus-visible,canvas:focus-visible{outline:3px solid var(--pink); outline-offset:2px}
canvas{display:block; width:100%; height:auto; aspect-ratio:3/2; image-rendering:pixelated; image-rendering:crisp-edges; background:#000; border:4px solid var(--edge); border-radius:6px; box-sizing:border-box; touch-action:none; cursor:pointer}
.keys{color:var(--muted); font-size:15px; line-height:1.5; margin:0; text-align:center}
.keys b{color:var(--fg); font-weight:600}
.pad{display:none; width:min(100%, 520px); justify-content:space-between; align-items:center; user-select:none; -webkit-user-select:none; touch-action:none; -webkit-touch-callout:none}
.dpad{display:grid; grid-template-columns:repeat(3, 58px); grid-template-rows:repeat(3, 58px); grid-template-areas:". u ." "l . r" ". d ."}

.u{grid-area:u}.l{grid-area:l}.r{grid-area:r}.d{grid-area:d}
.abtn{width:96px; height:96px; border-radius:50%; background:#e2475f; border-color:#ff8fa3; font-size:12px}
.abtn.on{background:#b8304a}
@media (pointer:coarse){ .pad{display:flex} .keys.desk{display:none} }

.tools{display:flex; gap:8px}
#fsbtn{font-family:var(--display); font-size:10px; background:var(--accent); color:#1d1a33; border:3px solid #fff3b0; padding:8px 10px; cursor:pointer; border-radius:4px}

/* ---------- LEVEL 7: puffling morning, setting them free from the cliff ---------- */
const R_TOP = 96;            // cliff-top grass line
const R_EDGE = 80;           // where the cliff drops to the sea
const R_SEA = 150;           // where tossed pufflings land
const R_PXM = 4;
const R_EDGEX = 58;         // girl x where she can toss
const R_CARX = 40;          // girl x below which she reaches the boxes
const R_PERIOD = 44;         // frames per swing

function initRel() {
  L = {g:{x:30, y:R_TOP - 16, face:1, walk:false}, car:3, hold:0, freed:0, best:0, glides:0, idle:0,
       sw:null, fly:null, swim:[], endT:0, empties:[]};
  
}

/* swinging: arms rise and fall on their own; press when they're up high */
const relArm = sw => (1 - Math.cos(2 * Math.PI * sw.f / R_PERIOD)) / 2;
function relHand() {
  const g = L.g, s = L.sw ? relArm(L.sw) : 0, th = 2.6 - s * 2.8, sx = g.x + 7, sy = g.y + 9;
  return {sx, sy, hx:Math.round(sx + Math.sin(th) * 7), hy:Math.round(sy - Math.cos(th) * 7)};
}
function relSwing() {
  const sw = L.sw; sw.f++;
  if (sw.f % R_PERIOD === Math.floor(R_PERIOD / 2)) tone(300 + sw.marks.length * 80, 0.08, 'triangle', 0.03, 380 + sw.marks.length * 80);
  if (K.left) { L.sw = null; L.hold++; L.puffOut = false; return; }
  if (P.a && sw.f - sw.last > 12) {
    sw.last = sw.f;
    const q = relArm(sw);
    sw.marks.push(q);
    const word = q > 0.9 ? 'GREAT!' : q > 0.7 ? 'GOOD!' : 'OOPS, LOW';
    addFloat(L.g.x - 8, L.g.y - 26 - sw.marks.length * 2, word, q > 0.9 ? '#c8f08a' : q > 0.7 ? '#ffd23f' : '#ff8fa3');
    tone(q > 0.9 ? 880 : q > 0.7 ? 660 : 330, 0.1, 'square', 0.04);
    if (sw.marks.length >= 3) relToss();
  }
}
function relToss() {
  const sw = L.sw, h = relHand();
  const p = clamp(sw.marks.reduce((a, b) => a + b, 0) / 3, 0, 1);
  const pw = p * p;  // reward good timing a lot
  L.fly = {x:h.hx - 4, y:h.hy - 5, vx:0.5 + 0.9 * pw, vy:-0.8 - 0.9 * pw, t:0, p:pw, flaps:0,
           flapUntil:40 + 90 * pw, glide:p > 0.88 ? Math.round(35 + (p - 0.88) / 0.12 * 35) : 0, gliding:false};
  L.sw = null; L.puffOut = false;
  sfx.swish(); addFloat(h.hx - 18, h.hy - 18, 'FLIPPETY FLAP!', '#ffd23f');
  if (L.hold === 0) { L.empties.push({x:L.g.x - 6 + rand(-4, 4)}); addFloat(L.g.x - 14, L.g.y - 34, 'BOX EMPTY!', '#ffffff'); }
}
function relFly() {
  const f = L.fly; f.t++;
  if (f.gliding) {
    f.vy = Math.min(f.vy + 0.008, 0.28); f.vx = Math.max(f.vx * 0.99, 0.5);
    if (--f.glide <= 0) { f.gliding = false; f.glided = true; }
  } else {
    f.vy += 0.07;
    if (f.t < f.flapUntil && f.t % 6 === 0) { f.vy -= 0.06 + 0.08 * f.p; f.flaps++; if (f.flaps % 2) tone(1100, 0.03, 'square', 0.012); }
    if (f.glide > 0 && !f.glided && f.vy > 0.3 && f.t > 40) { f.gliding = true; f.vy = Math.min(f.vy, 0.2); addFloat(f.x - 10, f.y - 14, 'GLIDING!', '#9fe0ff'); tone(520, 0.6, 'sine', 0.05, 880); }
  }
  f.x += f.vx; f.y += f.vy;
  if (f.x > W - 10) { f.x = W - 10; f.vx = 0; }
  if (f.y >= R_SEA - 6 && f.vy > 0) {
    const m = Math.max(1, Math.round((f.x + 4 - R_EDGE) / R_PXM));
    L.freed++; if (m > L.best) L.best = m; if (f.glided) L.glides++;
    burst(f.x + 4, R_SEA, ['#cfe8ff', '#ffffff'], 10 + Math.round(f.p * 8), 1.2); sfx.splash();
    const word = f.glided ? 'WHAT A GLIDE!' : m < 12 ? 'PLOP!' : m < 20 ? 'NICE TOSS!' : 'GREAT FLAPPING!';
    L.result = {word, m, flaps:f.flaps, glided:!!f.glided, t:110};
    if (f.glided || m >= 20) sfx.gold();
    L.swim.push({x:f.x, y:R_SEA - 6, ph:Math.random() * 6});
    if (L.swim.length > 9) L.swim.shift();
    L.fly = null;
    if (L.freed >= 9) L.endT = 120;
  }
}

function updRel() {
  const g = L.g;
  if (L.sw) relSwing();
  else {
    const ax = (K.right ? 1 : 0) - (K.left ? 1 : 0);
    g.walk = ax !== 0; if (ax) g.face = ax;
    g.x = clamp(g.x + ax * 1.2, 2, 64);
    if (!L.hold && L.car > 0 && g.x < R_CARX) { L.car--; L.hold = 3; sfx.ok(); addFloat(g.x - 8, g.y - 20, 'GOT A BOX!', '#ffd23f'); }
    // at the edge, holding a box, nothing in the air, standing still: start swinging
    if (L.hold > 0 && g.x >= R_EDGEX && !L.fly && !g.walk) {
      if (++L.idle > 25) { L.hold--; L.puffOut = true; g.face = 1; L.sw = {f:0, last:-99, marks:[]}; L.idle = 0; }
    } else L.idle = 0;
  }
  if (L.fly) relFly();
  for (const s of L.swim) s.x += 0.12;
  L.swim = L.swim.filter(s => s.x < W + 10);
  if (L.result && --L.result.t <= 0) L.result = null;
  if (L.endT && --L.endT <= 0 && state === 'play') finishLevel();
}

  if (tapPos) {
    const tp = tapPos; tapPos = null;
    for (let i = 0; i < LEVELS.length; i++) { const r = tileXY(i); if (tp.x >= r.x && tp.x < r.x + r.w && tp.y >= r.y && tp.y < r.y + r.h) { sel = i; pickLevel(i); return; } }
    return;
  }
  if (P.a || P.enter) pickLevel(sel);
}
function drawSelect() {
  bgMeadow();
  rect(6, 14, W - 12, 140, 'rgba(29,26,51,0.82)');
  text('PICK A LEVEL', W / 2, 20, '#ffcc33', 2, 'center');
  for (let i = 0; i < LEVELS.length; i++) {
    const r = tileXY(i), ok = canPlay(i), on = i === sel;
    if (on) rect(r.x - 2, r.y - 2, r.w + 4, r.h + 4, (t >> 3) % 2 ? '#ffcc33' : '#fff3b0');
    rect(r.x, r.y, r.w, r.h, ok ? '#463c78' : '#2a2547');
    text(String(i + 1), r.x + r.w / 2, r.y + 6, ok ? '#ffffff' : '#6a6290', 3, 'center');
    const nm = LV_NAMES[i];
    text(nm, r.x + r.w / 2, r.y + 30, ok ? '#c8f08a' : '#6a6290', 1, 'center');
    if (!ok) { rect(r.x + r.w - 11, r.y + 6, 7, 6, '#b3a8d6'); rect(r.x + r.w - 10, r.y + 3, 1, 3, '#b3a8d6'); rect(r.x + r.w - 6, r.y + 3, 1, 3, '#b3a8d6'); rect(r.x + r.w - 9, r.y + 2, 3, 1, '#b3a8d6'); rect(r.x + r.w - 8, r.y + 8, 1, 2, '#2a2547'); }
    if (beaten.has(i)) { rect(r.x + 3, r.y + 7, 1, 2, '#5cc95a'); rect(r.x + 4, r.y + 8, 1, 2, '#5cc95a'); rect(r.x + 5, r.y + 6, 1, 3, '#5cc95a'); rect(r.x + 6, r.y + 4, 1, 3, '#5cc95a'); rect(r.x + 7, r.y + 2, 1, 3, '#5cc95a'); }
  }
  text('A CHECK MARK MEANS YOU DID IT! YAY!', W / 2, 142, '#c8f08a', 1, 'center');
}
document.getElementById('lvbtn').addEventListener('click', () => { ensureAudio(); fx.length = 0; floats.length = 0; openSelect(); cv.focus(); });

/* ---------- title: a moving home screen ----------
   Four long scenes from her day take turns (about 20 seconds each).
   Each day starts on a different scene, so the home screen changes day to day. */
let T = {};
const tHearts = [];
const T_LEN = 1200;
function titleWords(night) {
  text("MIRIAM'S", W / 2, 16, '#ffcc33', 3, 'center', '#6a3fb0');
  text('SKY DAY', W / 2, 38, '#ffffff', 3, 'center', '#6a3fb0');
  if ((t >> 5) % 2 === 0) text(coarse ? 'TAP TO START' : 'PRESS SPACE TO START', W / 2, 60, night ? '#ffffff' : '#3b2a4a', 1, 'center', night ? '#6a3fb0' : '#ffffff');
}
function tSceneStart(k) {
  T.k = k; T.u = 0; fx.length = 0; tHearts.length = 0;
  T.g = {x:40, y:FLOOR - 16, vx:0, vy:0, face:1, ground:true, swing:0};
  T.pf = []; T.objs = []; T.ps = 20; T.sp = 20;
  if (k === 0) T.pf = [{x:120, y:FLOOR - 7, vx:0, vy:0, st:'sit', timer:40, gold:false}];
  if (k === 3) T.pf = [{x:150, y:FLOOR - 8, st:'sit', ph:0}];
}
// Miriam walks to the closest critter that is sitting still and scoops it up with her net
function tCatcher(sittingY, cols) {
  const g = T.g; let tgt = null, bd = 1e9;
  for (const p of T.pf) if (p.st === 'sit' && Math.abs(p.x - g.x) < bd) { bd = Math.abs(p.x - g.x); tgt = p; }
  g.vx = 0;
  if (tgt && g.swing === 0) {
    const want = tgt.x - (tgt.x > g.x ? 18 : -10);
    if (Math.abs(want - g.x) > 2) { g.face = Math.sign(want - g.x); g.vx = g.face; g.x = clamp(g.x + g.vx, 2, W - 14); }
    else { g.face = tgt.x > g.x ? 1 : -1; g.swing = 16; }
  }
  if (g.swing > 0 && --g.swing === 8) {
    const n = netGeom(g);
    for (const p of T.pf) if (p.st === 'sit' && Math.abs(p.x + 4 - n.cx) < 12) {
      p.gone = true; burst(p.x + 4, p.y + 3, p.gold ? ['#ffd23f', '#fff6b0', '#ffffff'] : cols, 10);
      tHearts.push({x:p.x + 1, y:p.y - 10, life:50});
    }
  }
  T.pf = T.pf.filter(p => !p.gone);
}
function tFlyer(dx, dy, plane) {
  T.dx = dx; T.dy = dy;
  if (t % 3 === 0) fx.push({x:dx + 1, y:dy + (plane ? 5 : 13), vx:-1, vy:rand(-0.25, 0.25), life:22, c:plane ? '#ffffff' : ['#ff9ad5', '#fff1c9', '#ffd23f'][t % 3]});
  if (--T.sp <= 0) { T.sp = 34 + (rand(0, 30) | 0); T.objs.push({x:W + 4, y:rand(70, 120), ph:Math.random() * 6, book:!plane && Math.random() < 0.5}); }
  for (const o of T.objs) {
    o.x -= 1.4;
    if (!o.gone && o.x > dx && o.x < dx + 30 && o.y > dy - 6 && o.y < dy + 16) { o.gone = true; burst(o.x + 3, o.y + 3, ['#ffd23f', '#ffffff'], 10); tHearts.push({x:o.x, y:o.y - 8, life:40}); }
  }
  T.objs = T.objs.filter(o => !o.gone && o.x > -10);
}
function initTitle() {
  const day = Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 86400000);
  tSceneStart(((day % 4) + 4) % 4);
}
function updTitle() {
  if (++T.u >= T_LEN) tSceneStart((T.k + 1) % 4);
  const k = T.k;
  if (k === 0) {
    if (--T.ps <= 0 && T.pf.length < 4) {
      T.ps = 70 + (rand(0, 60) | 0);
      T.pf.push({x:POND_X - 5 + rand(-20, 20), y:104, vx:(Math.random() < 0.5 ? -1 : 1) * rand(0.6, 1.1), vy:-2.4, st:'hop', timer:0, gold:Math.random() < 0.15});
      burst(POND_X, 108, ['#9fe0ff', '#ffffff'], 6, 0.8);
    }
    for (const f of T.pf) {
      if (f.st === 'sit') { if (--f.timer <= 0) { f.st = 'hop'; f.vy = -2.6; f.vx = f.x > 180 ? -1.2 : f.x < 60 ? 1.2 : (Math.random() < 0.5 ? -1.2 : 1.2); } }
      else { f.vy += 0.14; f.x += f.vx; f.y += f.vy; if (f.y >= FLOOR - 7 && f.vy > 0) { f.y = FLOOR - 7; f.st = 'sit'; f.timer = 50 + (rand(0, 50) | 0); } }
    }
    tCatcher(FLOOR - 7, ['#5cc95a', '#c8f08a', '#ffffff']);
  } else if (k === 1) tFlyer(66 + Math.sin(t * 0.025) * 30, 86 + Math.sin(t * 0.06) * 8, true);
  else if (k === 2) tFlyer(96 + Math.sin(t * 0.025) * 34, 84 + Math.sin(t * 0.06) * 7, false);
  else {
    if (--T.ps <= 0 && T.pf.length < 4) { T.ps = 60 + (rand(0, 40) | 0); T.pf.push({x:rand(14, 200), y:-10, st:'fall', ph:Math.random() * 6}); }
    for (const p of T.pf) if (p.st === 'fall') { p.y += 0.5; p.x = clamp(p.x + Math.sin(t * 0.08 + p.ph) * 0.4, 6, 210); if (p.y >= FLOOR - 8) { p.y = FLOOR - 8; p.st = 'sit'; } }
    tCatcher(FLOOR - 8, ['#ffffff', '#ff8a2a', '#ffd23f']);
  }
  for (const h of tHearts) { h.y -= 0.4; h.life--; }
  for (let i = tHearts.length - 1; i >= 0; i--) if (tHearts[i].life <= 0) tHearts.splice(i, 1);
}
function drawTitle() {
  const k = T.k;
  if (k === 0) { bgMeadow(); for (const f of T.pf) drawFrog(f); drawGirlNet(T.g, false); }
  else if (k === 1 || k === 2) {
    if (k === 1) bgSky(t * 1.4); else bgTown(t * 1.4);
    put(BLUEBIRD[(t >> 3) % 2], ((W + 40 - t * 0.6) % (W + 60) + W + 60) % (W + 60) - 20, 50 + Math.sin(t * 0.08) * 3);
    put(BLUEBIRD[((t >> 3) + 1) % 2], ((W + 70 - t * 0.6) % (W + 60) + W + 60) % (W + 60) - 20, 56 + Math.sin(t * 0.08 + 1) * 3);
    for (const o of T.objs) put(o.book ? BOOK : STAR, o.x, o.y + Math.round(Math.sin(t * 0.12 + o.ph) * 1.5));
  } else {
    p6Harbor();
    for (const p of T.pf) {
      put(PUFF, p.x, p.y);
      if (p.st === 'fall' && (t >> 3) % 2) { rect(p.x - 2, p.y + 3, 2, 1, '#3d3d4f'); rect(p.x + 9, p.y + 3, 2, 1, '#3d3d4f'); }
    }
    drawGirlNet(T.g, false);
  }
  for (const p of fx) rect(p.x, p.y, p.life > 14 ? 2 : 1, p.life > 14 ? 2 : 1, p.c);
  for (const h of tHearts) put(HEART, h.x, h.y);
  if (k === 1) drawPlane(T.dx, T.dy); else if (k === 2) drawDragon(T.dx, T.dy);
  titleWords(k === 3);
  if (T.u < 12) rect(W * T.u / 12, 0, W, H, '#1d1a33');
}

/* ---------- cards ---------- */
function drawCard(lines) {
  const h = lines.reduce((a, l) => a + (l[2] || 1) * 6 + 4, 0) + 12;
  const y0 = Math.round((H - h) / 2);
  rect(12, y0 - 2, W - 24, h + 4, '#120f22');
  rect(14, y0, W - 28, h, '#2a2547');
  rect(14, y0, W - 28, 2, '#ffcc33'); rect(14, y0 + h - 2, W - 28, 2, '#ffcc33');
  rect(14, y0, 2, h, '#ffcc33'); rect(W - 16, y0, 2, h, '#ffcc33');
  let y = y0 + 8;
  for (const l of lines) { if (l[0]) text(l[0], W / 2, y, l[1] || '#ffffff', l[2] || 1, 'center'); y += (l[2] || 1) * 6 + 4; }
}
const prompt = s => [cardT > 20 && (t >> 5) % 2 === 0 ? (coarse ? 'TAP TO ' : 'PRESS SPACE TO ') + s : '', '#ff8fc7'];

/* ---------- fx ---------- */
function updFx() {
  for (const p of fx) { p.x += p.vx; p.y += p.vy; p.vy += 0.04; p.life--; }
  for (let i = fx.length - 1; i >= 0; i--) if (fx[i].life <= 0) fx.splice(i, 1);
  for (const f of floats) { f.y -= 0.4; f.life--; }
  for (let i = floats.length - 1; i >= 0; i--) if (floats[i].life <= 0) floats.splice(i, 1);
}
function drawFx() {
  for (const p of fx) rect(p.x, p.y, p.life > 14 ? 2 : 1, p.life > 14 ? 2 : 1, p.c);
  for (const f of floats) text(f.s, f.x, f.y, f.c);
}

/* ---------- main loop ---------- */
function update() {
  t++;
  for (const k in K) P[k] = K[k] && !prevK[k];
  const go = P.a || P.enter || tapped; tapped = false;
  if (state === 'play') LEVELS[levelIdx].update();
  else if (state === 'select') { cardT++; updSelect(go); }
  else {
    cardT++;
    if (state === 'title') updTitle();
    if (state === 'end' && L.landing) L.landT++;
    if (go && cardT > 20) advance();
  }
  updFx();
  if (inv > 0) inv--; if (shake > 0) shake--;
  prevK = {...K};
  musicTick();
}
function draw() {
  ctx.save();
  if (shake && !reduce) ctx.translate(Math.round(rand(-2, 2)), Math.round(rand(-2, 2)));
  if (state === 'title') drawTitle();
  else if (state === 'select') drawSelect();
  else {
    const lv = LEVELS[levelIdx];
    lv.draw(); drawFx(); lv.hud();
    if (state === 'intro') drawCard(lv.intro().concat([prompt('START')]));
    else if (state === 'clear') drawCard(lv.clear().concat([prompt('CONTINUE')]));
    else if (state === 'over') drawCard([['OOPS!', '#ff8fa3', 2], ['THAT WAS A BUMPY RIDE.'], ["LET'S TRY AGAIN!"], prompt('RETRY')]);
    else if (state === 'end' && cardT > 30) drawCard([['TOGETHER AGAIN!', '#ffcc33', 2], ['MIRIAM AND HER BIG BROTHER, REUNITED'], ['UNDER ONE UMBRELLA IN THE RAIN.'], ['FROGS ' + totals.frogs + '   STARS ' + totals.stars + '   BOOKS ' + totals.books, '#c8f08a'], ['SKIPS ' + totals.skips + '   PUFFLINGS SAVED ' + totals.puffins, '#c8f08a'], prompt('PLAY AGAIN')]);
  }
  ctx.restore();
}
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= STEP) { update(); acc -= STEP; }
  draw();
  requestAnimationFrame(loop);
}
initTitle(); setA();
requestAnimationFrame(loop);
})();
</script>
