<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brainy Owl: CogAT Level 7 Thinking Games</title>
<meta name="description" content="Adaptive practice for all nine CogAT Level 7 question types. No reading needed.">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2d2a40;--card:#fff;--line:#dfe3f2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Fredoka,'Trebuchet MS',Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,#bfe7ff 0%,#e8f6ff 55%,#fdf6e3 100%);background-attachment:fixed}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
svg{display:block}
.screen{display:none;min-height:100vh;min-height:100dvh}.screen.on{display:flex;flex-direction:column}
.plabel{font-size:11px;color:#6b7090;font-weight:500}
/* ---------- home */
#home{align-items:center;padding:10px 12px 20px;gap:10px}
.homeTop{width:100%;max-width:1000px;display:flex;align-items:center;gap:12px}
.owlWrap{width:clamp(70px,13vw,110px)}
.owl{width:100%;height:auto}.owl.small{width:90px}
.bob{animation:bob 2.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px)}}
.jump{width:150px;animation:jump 1s ease-in-out 3}@keyframes jump{30%{transform:translateY(-24px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
.sleepy{width:150px;opacity:.9}.sleepy .pupil{transform:scaleY(.2);transform-origin:center 56px}
.jars{display:flex;gap:6px;flex:1;flex-wrap:wrap;align-items:flex-end}
.jar{width:44px;height:52px;border:4px solid var(--ink);border-top-width:7px;border-radius:8px 8px 14px 14px;background:rgba(255,255,255,.7);position:relative;overflow:hidden;display:grid;place-items:center}
.jar svg{position:relative;z-index:1}.jar.full{background:#fff3b0}
.jarfill{position:absolute;left:0;right:0;bottom:0;background:#ffe680}
.ibtn{width:clamp(52px,9vw,66px);height:clamp(52px,9vw,66px);border-radius:50%;background:#fff;box-shadow:0 4px 0 #c5cbe4,0 6px 14px rgba(45,42,64,.12);display:grid;place-items:center;padding:12px;transition:transform .12s;flex:none}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 #c5cbe4}
.ibtn svg{width:100%;height:100%}
.ibtn.small{width:46px;height:46px;padding:10px}.ibtn.big{width:84px;height:84px}.ibtn.ghost{opacity:.6}
.lockBtn{margin-left:auto}
.playRow{display:flex;align-items:center;gap:22px}
.playBig{width:clamp(110px,22vw,150px);height:clamp(110px,22vw,150px);border-radius:50%;background:radial-gradient(circle at 35% 30%,#7ee08a,#2fa24a);box-shadow:0 8px 0 #1f7a35,0 14px 30px rgba(31,122,53,.35);display:grid;place-items:center;padding:30px;position:relative;animation:breathe 2.2s ease-in-out infinite}
.playBig.diag{background:radial-gradient(circle at 35% 30%,#ffd76b,#f2a01e);box-shadow:0 8px 0 #c47a07,0 14px 30px rgba(196,122,7,.35)}
.playBig svg{width:100%;height:100%}@keyframes breathe{50%{transform:scale(1.05)}}
.badge{position:absolute;right:-6px;top:-6px;width:52px;height:52px;background:#fff;border-radius:50%;padding:8px;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.chal{background:#fff7d6}
.batts{width:100%;max-width:1000px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.batts{grid-template-columns:1fr}}
.batt{border-radius:24px;padding:10px;box-shadow:0 6px 18px rgba(45,42,64,.12)}
.bV{background:#ffe1ea}.bQ{background:#d6f5ee}.bN{background:#e8defc}
.bhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}.bart{width:40px;height:40px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:#fff;border-radius:18px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 4px 0 rgba(0,0,0,.08);transition:transform .12s}
.tile:hover{transform:translateY(-3px)}.tile:active{transform:translateY(2px)}
.ticon{width:100%;aspect-ratio:12/7}.ticon svg{width:100%;height:100%}
.tile .plabel{font-size:10px;text-align:center;line-height:1.1}
.lstars{display:flex;gap:1px;align-items:center}.crown{font-size:14px;margin-right:2px}
.foot{max-width:800px;text-align:center;margin-top:6px}
/* ---------- question screen */
#play{align-items:center;padding:8px 10px 18px;gap:clamp(8px,1.6vh,16px)}
.bar{width:100%;max-width:1060px;display:flex;align-items:center;gap:10px}
.dots{flex:1;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.dot{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid #c5cbe4}
.dot.now{border-color:#3d82c4;transform:scale(1.25)}.dot.gold{background:#ffd23f;border-color:#e0a800}.dot.silver{background:#d6dbe6;border-color:#9aa0b5}.dot.tried{background:#fff;border-color:#9aa0b5}
.spk{background:#ffe680;width:clamp(60px,11vw,78px);height:clamp(60px,11vw,78px)}
.spk.talking .wave{animation:wave .8s infinite}.spk.talking .w2{animation-delay:.2s}@keyframes wave{50%{opacity:.2}}
#hintBtn.used{opacity:.45}
.demoBanner{display:flex;align-items:center;gap:14px;background:#fff7d6;border:4px dashed #f2a01e;border-radius:22px;padding:6px 14px}
.demoBanner .teach{width:64px}.watch{width:70px;height:46px;animation:bob 1.2s infinite}
.myTurn{width:64px;height:64px;padding:16px;opacity:.35;animation:none}.myTurn.ready{width:110px;height:110px;padding:28px;opacity:1;animation:breathe 1.2s ease-in-out infinite}
.demoMode .stem,.demoMode .choices{outline:5px dashed #f2a01e;outline-offset:6px;border-radius:26px;background-color:#fffaf0}
.demoMode .choice{pointer-events:none}.demoMode #hintBtn{display:none}
.soundFix{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);width:120px;height:120px;border-radius:50%;background:#ffe680;box-shadow:0 8px 0 #e0b800,0 14px 30px rgba(0,0,0,.25);padding:26px;z-index:90;animation:breathe 1.2s infinite}
.soundFix svg{width:100%;height:100%}.soundFix .tapHand{position:absolute;right:-8px;bottom:-10px;font-size:40px;animation:bob 1s infinite}
.stem{width:100%;max-width:1060px;background:var(--card);border-radius:26px;box-shadow:0 6px 20px rgba(45,42,64,.12);padding:clamp(10px,2vw,22px);display:flex;justify-content:center}
.stem.nostem{background:none;box-shadow:none;padding:0}
.oddArt{position:relative;width:110px}.oddArt .mag{position:absolute;right:-30px;bottom:6px;width:56px;height:56px;animation:bob 1.6s infinite}
.choices{display:flex;justify-content:center;gap:clamp(10px,2.4vw,26px);flex-wrap:wrap;width:100%;max-width:1060px}
.choice{width:clamp(76px,min(19vw,22vh),168px);aspect-ratio:1;background:#fff;border:5px solid var(--line);border-radius:24px;padding:clamp(6px,1.2vw,12px);box-shadow:0 6px 0 #c5cbe4;transition:transform .12s,opacity .3s,filter .3s;position:relative}
.choice:hover{transform:translateY(-4px);border-color:#9fb4ff}
.choice svg{width:100%;height:100%}
.choice.gone{opacity:.22;filter:grayscale(1);pointer-events:none;transform:scale(.92)}
.choice.right{border-color:#3aa35b;box-shadow:0 0 0 7px #b8f0c4,0 6px 0 #3aa35b;animation:pop .5s}
.choice.reveal{border-color:#ffd23f;animation:glow 1.1s infinite}
.shake{animation:shake .38s}
@keyframes pop{40%{transform:scale(1.12)}}@keyframes glow{50%{box-shadow:0 0 0 12px #fff2a8,0 6px 0 #c5cbe4}}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.choices.rods .choice{aspect-ratio:auto;width:clamp(60px,min(12vw,12vh),110px);height:clamp(130px,min(30vw,30vh),250px)}
.choices.L-groups .choice{aspect-ratio:1.2}
.ptext{display:none;font-size:15px;color:#5b6077;max-width:800px;text-align:center}.ptext.on{display:block}
/* stems */
.anaRow{display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,40px);flex-wrap:wrap}
.pair{display:flex;align-items:center;gap:clamp(4px,1.2vw,12px);padding:8px;border-radius:20px;background:#f7f8ff}
.pic{width:clamp(60px,min(15vw,19vh),138px);aspect-ratio:1}.pic svg{width:100%;height:100%}
.sep{width:6px;height:90px;border-radius:3px;background:#e1e5f5}
.arrow{font-size:clamp(22px,4vw,40px);color:#8a8fa8;font-weight:700}.arrow.small{font-size:clamp(16px,2.6vw,28px)}
.clsTop{display:flex;gap:clamp(8px,2.5vw,26px);justify-content:center;padding:10px;border-radius:20px;background:#f7f8ff}
.sentStem{display:flex;justify-content:center}.earBtn{width:clamp(90px,min(20vw,20vh),160px);height:clamp(90px,min(20vw,20vh),160px);border-radius:50%;background:#ffe680;padding:26px;box-shadow:0 6px 0 #e0b800;animation:breathe 2s infinite}
.naGrid{display:flex;flex-direction:column;gap:8px;align-items:center}
.naRow{display:flex;align-items:center;gap:clamp(6px,2vw,18px);padding:6px 12px;border-radius:18px}
.grp{width:clamp(58px,min(14vw,12vh),128px);aspect-ratio:1.2;background:#f7f8ff;border:3px solid #e1e5f5;border-radius:16px;padding:2px}.grp svg{width:100%;height:100%}
.grp.q,.mcell.q,.term.q{background:none;border:none}
.pzWrap{display:flex;flex-direction:column;gap:14px;align-items:center}
.bal{display:flex;align-items:flex-end;justify-content:center;gap:clamp(4px,1.6vw,14px);padding:6px;border-radius:18px;flex-wrap:nowrap}
.pan{display:flex;gap:6px;padding:8px;min-height:80px;align-items:center;background:#fff;border:3px solid #e1e5f5;border-bottom:9px solid #8a5a2b;border-radius:12px 12px 36px 36px}
.pan.baskets{border:5px solid #c98b4f;border-radius:10px 10px 26px 26px;background:repeating-linear-gradient(45deg,#fff7ea 0 8px,#fbe7c8 8px 16px)}
.pan .grp{width:clamp(52px,min(11vw,12vh),104px)}
.fulcrum{flex:none;align-self:center}
.srRow{display:flex;gap:clamp(4px,1.4vw,14px);align-items:flex-end;justify-content:center;padding:6px 10px;border-radius:18px}
.term{width:clamp(36px,min(8vw,8vh),72px);height:clamp(120px,min(27vw,28vh),230px)}.term svg{width:100%;height:100%}
.L-groups .term{width:clamp(52px,min(11vw,12vh),100px);height:auto;aspect-ratio:1.1;background:#f7f8ff;border:3px solid #e1e5f5;border-radius:12px}
.matrix{display:flex;flex-direction:column;gap:10px;align-items:center}
.mrow{display:flex;align-items:center;gap:clamp(6px,1.6vw,16px);padding:6px 10px;border-radius:18px}
.mcell{width:clamp(66px,min(16vw,17vh),146px);aspect-ratio:1;background:#fff;border:3px solid var(--line);border-radius:16px;padding:4px}.mcell svg{width:100%;height:100%}
.pfRow{display:flex;align-items:center;gap:clamp(4px,1.2vw,12px);flex-wrap:wrap;justify-content:center;padding:6px;border-radius:18px}
.pf{width:clamp(66px,min(16vw,19vh),150px);aspect-ratio:1}.pf svg{width:100%;height:100%}
.hint-on .hintable{animation:hintglow 1.2s 4;background:#fff6c9}
@keyframes hintglow{50%{box-shadow:0 0 0 8px #ffe680}}
@media (max-width:640px){
 .grp{width:min(30vw,14vh)}.pan .grp{width:min(21vw,11vh)}.bal{gap:2px}.pan{padding:5px;gap:4px}
 .pf{width:min(37vw,19vh)}.pfRow{gap:6px}.pfRow .arrow{display:none}
 .mcell{width:min(30vw,16vh)}.choice{width:min(21.5vw,21vh);border-width:4px;border-radius:18px}
 .pic{width:min(18vw,17vh)}.anaRow{gap:8px}.pair{padding:4px;gap:2px}.sep{display:none}
 .term{width:min(11vw,7vh)}.L-groups .term{width:min(20vw,11vh)}.srRow{gap:4px}
 .bar{gap:6px}.dots{gap:5px}.dot{width:14px;height:14px}
}
/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.cf{position:absolute;top:30vh;width:12px;height:16px;border-radius:3px;animation:cf 1.6s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes cf{0%{transform:translate(0,0) rotate(0)}30%{transform:translate(calc(var(--dx)*.4),-22vh) rotate(calc(var(--r)*.4))}100%{transform:translate(var(--dx),80vh) rotate(var(--r));opacity:.2}}
.burst{position:absolute;left:50%;top:38%;width:160px;height:160px;margin:-80px;animation:burst 1.2s ease-out forwards}
@keyframes burst{0%{transform:scale(.2) rotate(-30deg);opacity:0}30%{transform:scale(1.2) rotate(10deg);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(1.4) translateY(-30vh);opacity:0}}
.hand{position:fixed;left:50%;top:110%;font-size:54px;z-index:60;transition:left 1.1s ease-in-out,top 1.1s ease-in-out;pointer-events:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
/* end */
#end{align-items:center;justify-content:center;padding:20px}
.endCard{background:#fff;border-radius:30px;padding:26px;display:flex;flex-direction:column;align-items:center;gap:16px;box-shadow:0 10px 30px rgba(45,42,64,.18);max-width:94vw}
.starsRow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bigIcon{width:90px;height:90px}.row{display:flex;gap:24px;align-items:center}
/* parent */
#parent{background:#f7f8fc}
.pwrap h2{font-size:19px;font-weight:700;margin:22px 0 6px}
.pnote{color:#4a4f66;margin:6px 0;font-family:system-ui,Arial,sans-serif;font-size:14px}.pnote.small,.small{font-size:12.5px}.warn{color:#b3541e}
.ptable{overflow-x:auto;background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.ptable table{border-collapse:collapse;width:100%;font-family:system-ui,Arial,sans-serif;font-size:13px}
.ptable th{background:#eef0f7;text-align:left;padding:7px;font-weight:600;white-space:nowrap}.ptable td{padding:7px;border-top:1px solid #eef0f7;vertical-align:top}
.tiny{font-size:11px;color:#6b7090}.ptable table.wide{min-width:1050px}.ck{display:inline-block;white-space:nowrap;margin-right:6px}
.pbar{height:6px;background:#eef0f7;border-radius:3px;margin-top:3px;min-width:60px}.pbar div{height:100%;border-radius:3px}
.pbtn{background:#fff;border:2px solid #c9cde0;border-radius:10px;padding:7px 12px;font-family:system-ui,Arial,sans-serif;font-size:14px;cursor:pointer;display:inline-block}.pbtn.danger{border-color:#e4473f;color:#c0312a}
.pset{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;font-family:system-ui,Arial,sans-serif;font-size:14px}
.pset select{border:1px solid #c9cde0;border-radius:6px;padding:3px}
.chart{width:100%;max-width:700px;background:#fff;border-radius:12px;padding:8px;margin-bottom:8px}
.modal{position:fixed;inset:0;background:rgba(45,42,64,.55);display:grid;place-items:center;z-index:80}
.gate{background:#fff;border-radius:20px;padding:20px;position:relative;text-align:center;font-family:system-ui,Arial,sans-serif;width:280px}
.gq{font-size:15px}.gq b{font-size:28px}.gin{font-size:30px;margin:8px 0;border-bottom:2px solid #c9cde0;min-height:44px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pad button{background:#eef0f7;border-radius:10px;padding:12px;font-size:20px}
.gclose{position:absolute;right:10px;top:8px;font-size:20px}
</style><!-- home-screen-app -->

</head><body>

<script>
// ===== Picture library: consistent flat SVG icons (100x100), all same outline style =====
const OL='stroke="#2d2a40" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"';
const EYE=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r||3}" fill="#2d2a40"/>`;
// tags: properties used by verbal generators. amb: properties that are debatable for this picture (never used to decide a question).
const ICONS={
dog:{n:'dog',t:['animal','legs4','fur','pet','land'],amb:[],s:`<rect x="30" y="48" width="48" height="22" rx="11" fill="#d49a5c" ${OL}/><rect x="34" y="64" width="9" height="20" rx="4" fill="#d49a5c" ${OL}/><rect x="64" y="64" width="9" height="20" rx="4" fill="#d49a5c" ${OL}/><path d="M78 54 q12 -4 10 -18" fill="none" ${OL}/><circle cx="30" cy="40" r="16" fill="#d49a5c" ${OL}/><path d="M20 28 q-10 6 -6 24 q9 -2 10 -14z" fill="#8a5a2b" ${OL}/>${EYE(32,37)}<ellipse cx="16" cy="46" rx="4" ry="3" fill="#2d2a40"/>`},
cat:{n:'cat',t:['animal','legs4','fur','pet','land'],amb:[],s:`<rect x="30" y="50" width="46" height="20" rx="10" fill="#9aa0b5" ${OL}/><rect x="34" y="64" width="8" height="20" rx="4" fill="#9aa0b5" ${OL}/><rect x="64" y="64" width="8" height="20" rx="4" fill="#9aa0b5" ${OL}/><path d="M76 56 q16 0 14 -24" fill="none" ${OL}/><path d="M16 26 l6 12 l12 0 l6 -12 l2 18 a16 15 0 1 1 -28 0z" fill="#9aa0b5" ${OL}/>${EYE(23,43,2.5)}${EYE(35,43,2.5)}<path d="M27 50 l2 2 l2 -2" fill="none" ${OL}/>`},
bird:{n:'bird',t:['animal','flies','wings','bird','legs2'],amb:['pet'],s:`<ellipse cx="50" cy="52" rx="26" ry="20" fill="#5aa7e6" ${OL}/><circle cx="70" cy="38" r="13" fill="#5aa7e6" ${OL}/><path d="M82 36 l12 4 l-12 4z" fill="#f2b632" ${OL}/>${EYE(72,35)}<path d="M36 50 q14 -18 28 0 q-14 8 -28 0z" fill="#3d82c4" ${OL}/><path d="M24 50 l-16 -6 l6 14z" fill="#3d82c4" ${OL}/><path d="M46 72 v12 M56 72 v12" ${OL}/>`},
fish:{n:'fish',t:['animal','water','swims','nolegs'],amb:['pet'],s:`<path d="M20 50 q30 -30 60 0 q-30 30 -60 0z" fill="#f28c38" ${OL}/><path d="M80 50 l14 -14 v28z" fill="#f28c38" ${OL}/>${EYE(34,46)}<path d="M50 38 q6 12 0 24" fill="none" ${OL}/>`},
bee:{n:'bee',t:['animal','insect','flies','wings','small'],amb:[],s:`<ellipse cx="38" cy="34" rx="12" ry="16" fill="#e8f4ff" ${OL} transform="rotate(-25 38 34)"/><ellipse cx="58" cy="32" rx="12" ry="16" fill="#e8f4ff" ${OL} transform="rotate(25 58 32)"/><ellipse cx="50" cy="60" rx="28" ry="20" fill="#f6c932" ${OL}/><path d="M42 41 v38 M56 41 v38" stroke="#2d2a40" stroke-width="7"/><circle cx="24" cy="58" r="10" fill="#2d2a40"/><path d="M78 60 l10 0" ${OL}/>`},

const ICON_IDS=Object.keys(ICONS);
function iconSVG(id,size){const ic=ICONS[id];return `<svg viewBox="0 0 100 100" width="${size||'100%'}" height="${size||'100%'}" aria-hidden="true">${ic.s}</svg>`}

// ===== Question generation engine =====
// Every generator returns {type, level, concept, surface, dims, say, stem, choices:[{html,key,kind}], answer, sig, hintSay, layout}
// or null when its own validation fails (the caller then tries again).
const R={ri:(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick:a=>a[Math.floor(Math.random()*a.length)],
 shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},
 sample(a,n){return R.shuffle(a).slice(0,n)},chance:p=>Math.random()<p};
const QBOX=`<svg viewBox="0 0 100 100" width="100%" height="100%"><rect x="6" y="6" width="88" height="88" rx="14" fill="#fff8e6" stroke="#f2a01e" stroke-width="4" stroke-dasharray="10 7"/><text x="50" y="68" text-anchor="middle" font-size="54" font-weight="700" fill="#f2a01e" font-family="Fredoka,Arial,sans-serif">?</text></svg>`;
const NCH=l=>l<=2?3:4; // 3 picture choices at early levels, 4 later (more plausible distractors)

function finalize(q,correct,dists){
  const all=[{...correct,kind:'correct'},...dists];
  const keys=new Set(all.map(c=>c.key));
  if(keys.size!==all.length) return null;           // two choices look the same -> reject
  const sh=R.shuffle(all);
  q.choices=sh; q.answer=sh.findIndex(c=>c.kind==='correct');
  q.sig=q.type+'|'+q.stemKey+'|'+[...keys].sort().join(',');
  return q;
}

// ---------------------------------------------------------------- 1. PICTURE ANALOGIES
const RELS={
 eats:{lvl:1,name:'what an animal eats',pairs:[['dog','bone'],['rabbit','carrot'],['mouse','cheese'],['monkey','banana'],['bird','worm'],['cow','grass']]},
 home:{lvl:1,name:'where an animal lives',pairs:[['bird','nest'],['bee','hive'],['dog','doghouse'],['fish','fishbowl'],['cow','barn'],['frog','pond'],['duck','pond'],['sheep','barn']]},
 weather:{lvl:2,name:'what you need for the weather',pairs:[['sun','sunglasses'],['rain','umbrella'],['snow','mitten'],['snow','hat']]},
 tool:{lvl:2,name:'a tool and what it works on',pairs:[['hammer','nail'],['key','lock'],['pencil','paper'],['toothbrush','tooth'],['saw','log']]},
 part:{lvl:3,name:'a whole and its part',pairs:[['car','wheel'],['bike','wheel'],['bus','wheel'],['tree','leaf'],['house','door']]},
 cut:{lvl:3,name:'whole and cut into pieces',pairs:[['apple','appleslice'],['orange','orangeslice'],['bread','breadslice']]},
 becomes:{lvl:4,name:'what something grows into',pairs:[['egg','chick'],['tadpole','frog'],['caterpillar','butterfly'],['acorn','tree'],['chick','hen']]},
 gives:{lvl:4,name:'what an animal gives us',pairs:[['hen','egg'],['cow','milk'],['bee','honey'],['sheep','yarn']]},
};
function relHolds(rel,rev,a,b){return RELS[rel].pairs.some(p=>rev?(p[1]===a&&p[0]===b):(p[0]===a&&p[1]===b))}
function relsOf(a,b){const out=[];for(const r in RELS){if(relHolds(r,0,a,b))out.push([r,0]);if(relHolds(r,1,a,b))out.push([r,1])}return out}
function genAnalogy(level,opt){
  const allowed=Object.keys(RELS).filter(r=>RELS[r].lvl<=level);
  let rel=opt.concept&&allowed.includes(opt.concept)?opt.concept:R.pick(level>=3?allowed.filter(r=>RELS[r].lvl>=level-2):allowed);
  if(!rel) rel=R.pick(allowed);
  const rev=level>=3&&R.chance(level>=4?0.4:0.25)?1:0;
  const pairs=R.sample(RELS[rel].pairs,2); if(pairs.length<2) return null;
  let [A,B]=pairs[0],[C,D]=pairs[1]; if(rev){[A,B]=[B,A];[C,D]=[D,C]}
  if(new Set([A,B,C,D]).size<4) return null;
  const rAB=relsOf(A,B);
  const valid=x=>rAB.some(([r,rv])=>relHolds(r,rv,C,x));
  // plausible distractors: same kind as the answer, or things linked to C/A in other ways
  const sameKind=RELS[rel].pairs.map(p=>rev?p[0]:p[1]);
  const assocC=[];for(const r in RELS)for(const p of RELS[r].pairs){if(p[0]===C)assocC.push(p[1]);if(p[1]===C)assocC.push(p[0])}
  const used=new Set([A,B,C,D]);
  const ok=x=>!used.has(x)&&!valid(x);
  const nearPool=R.shuffle([...new Set([...assocC,...sameKind])].filter(ok));
  const farPool=R.shuffle(ICON_IDS.filter(x=>ok(x)&&!nearPool.includes(x)&&!assocC.includes(x)));
  const n=NCH(level)-1; const nNear=level===1?0:level===2?1:level===3?2:n;
  const d=[];
  for(const x of nearPool){if(d.length>=nNear)break;d.push({id:x,kind:'near'})}
  for(const x of farPool){if(d.length>=n)break;d.push({id:x,kind:'far'})}
  if(d.length<n) return null;
  const q={type:'va',level,concept:rel,surface:(rev?'rev:':'fwd:')+C,dims:['REL'].concat(nNear>=2?['DIS']:[]),
    say:'Look at the first two pictures. They go together. Which picture goes with this one in the same way?',
    hintSay:'Think about how the first two pictures go together. Then find the one that goes with this picture the same way.',
    stemKey:[A,B,C].join('-'),layout:'pics'};
  q.stem=`<div class="anaRow"><div class="pair hintable"><div class="pic">${iconSVG(A)}</div><div class="arrow">➜</div><div class="pic">${iconSVG(B)}</div></div><div class="sep"></div><div class="pair"><div class="pic">${iconSVG(C)}</div><div class="arrow">➜</div><div class="pic q">${QBOX}</div></div></div>`;
  return finalize(q,{html:iconSVG(D),key:D},d.map(x=>({html:iconSVG(x.id),key:x.id,kind:x.kind})));
}

// ---------------------------------------------------------------- 2. PICTURE CLASSIFICATION
const CLS=[
 {T:['animal'],l:1},{T:['food'],l:1},{T:['vehicle'],l:1},{T:['wear'],l:1},
 {T:['fruit'],l:2},{T:['animalhome'],l:2},{T:['weather'],l:2},{T:['kitchen'],l:2},{T:['animal','flies'],l:2},{T:['animal','water'],l:2},{T:['plant'],l:2},
 {T:['insect'],l:3},{T:['legs4'],l:3},{T:['wheels'],l:3},{T:['cuts'],l:3},{T:['writes'],l:3},{T:['baby'],l:3},{T:['farm'],l:3},{T:['cut'],l:3},{T:['fromanimal'],l:3},
 {T:['flies'],l:4,cross:1},{T:['round'],l:4,cross:1},{T:['hot'],l:4,cross:1},{T:['sharp'],l:4,cross:1},{T:['water'],l:4,cross:1},{T:['wings'],l:4,cross:1},{T:['light'],l:4,cross:1},
 {T:['animal','water','flies'],l:5,conj:1},{T:['vehicle','nomotor'],l:5,conj:1},{T:['food','fromanimal'],l:5,conj:1},{T:['fruit','cut'],l:5,conj:1},{T:['animal','baby'],l:5,conj:1},{T:['wear','warm'],l:5,conj:1},{T:['vehicle','motor','wheels'],l:5,conj:1},{T:['animal','legs4','farm'],l:5,conj:1},{T:['flies','motor'],l:5,conj:1},
];
const CAT_ORDER=['animal','vehicle','food','wear','plant','weather','toy','tool','animalhome'];
const catOf=id=>CAT_ORDER.find(c=>has(id,c))||'other';
const clsName=T=>T.join(' + ');
function defTags(id){return ICONS[id].t}
function genVClass(level,opt){
  let pool=CLS.filter(c=>c.l===level); if(level>=4) pool=pool.concat(CLS.filter(c=>c.l===level-1&&R.chance(.3)));
  let rule=opt.concept?CLS.find(c=>clsName(c.T)===opt.concept&&c.l<=level):null; if(!rule) rule=R.pick(pool);
  const T=rule.T, okT=id=>T.every(t=>has(id,t));
  const members=ICON_IDS.filter(okT);
  const failsT=id=>T.some(t=>!has(id,t)&&!amb(id,t)) && !T.some(t=>amb(id,t));
  if(members.length<3) return null;
  const odd=members.length===3||(level<=3&&R.chance(.35));
  const stems=R.sample(members,odd?3:3);
  if(rule.cross&&new Set(stems.map(catOf)).size<2) return null;
  const S=stems.map(defTags).reduce((a,b)=>a.filter(t=>b.includes(t)));
  const near=id=>{const c=new Set(stems.map(catOf));return c.has(catOf(id))};
  const simScore=id=>S.filter(t=>has(id,t)).length+(near(id)?2:0);
  let nonm=ICON_IDS.filter(id=>!stems.includes(id)&&failsT(id)&&!S.some(t=>amb(id,t)));
  if(rule.conj) nonm=nonm.filter(id=>T.filter(t=>has(id,t)).length===T.length-1).concat(nonm.filter(id=>T.filter(t=>has(id,t)).length<T.length-1&&near(id)));
  if(odd){
    // odd one out: 3 that share the rule + 1 that does not. Exactly one picture may be "clearly odd".
    const oddPool=level===1?nonm.filter(x=>!near(x)):nonm.filter(near);
    if(!oddPool.length) return null;
    const o=R.pick(oddPool); const four=R.shuffle([...stems,o]);
    const clearlyOdd=x=>{const others=four.filter(y=>y!==x);const I=others.map(defTags).reduce((a,b)=>a.filter(t=>b.includes(t)));return I.some(t=>!has(x,t))};
    const oddOnes=four.filter(clearlyOdd); if(oddOnes.length!==1||oddOnes[0]!==o) return null;
    const q={type:'vc',level,concept:clsName(T),surface:'odd:'+T.join('+'),dims:['REL'].concat(level>=2?['DIS']:[]),fmt:'odd',
      say:'One of these pictures does not belong with the others. Which one does not belong?',hintSay:'Three of these are alike in some way. Find the one that is different.',stemKey:'odd'+four.join('-'),layout:'pics'};
    q.stem=`<div class="clsTop hintable"><div class="hand">☝️</div></div>`;
    q.noStem=true;
    // In odd-one-out every picture is a choice; distractor kind is near (they all share the rule)
    return finalize(q,{html:iconSVG(o),key:o},four.filter(x=>x!==o).map(x=>({html:iconSVG(x),key:x,kind:'near'})));
  }
  const corrPool=members.filter(id=>!stems.includes(id)&&S.every(t=>has(id,t)));
  if(!corrPool.length) return null;
  const corr=R.pick(corrPool);
  const n=NCH(level)-1;
  nonm=R.shuffle(nonm).sort((a,b)=>level<=1?simScore(a)-simScore(b):simScore(b)-simScore(a));
  if(level===2) nonm=[nonm[0],...R.shuffle(nonm.slice(1))];
  const ds=nonm.slice(0,n); if(ds.length<n) return null;
  for(const x of ds) if(S.every(t=>has(x,t))) return null; // a distractor that fits the group -> ambiguous
  const q={type:'vc',level,concept:clsName(T),surface:'goes:'+T.join('+')+':'+[...stems].sort().join(''),dims:['REL'].concat(T.length>1&&rule.conj?['WM']:[]).concat(level>=3?['DIS']:[]),
    say:'These three pictures are alike in some way. Which picture below goes with them?',hintSay:'Look at the three pictures at the top. How are they alike? Find the one below that is alike in the same way.',stemKey:stems.slice().sort().join('-'),layout:'pics'};
  q.stem=`<div class="clsTop hintable">${stems.map(s=>`<div class="pic">${iconSVG(s)}</div>`).join('')}</div>`;
  return finalize(q,{html:iconSVG(corr),key:corr},ds.map(x=>({html:iconSVG(x),key:x,kind:simScore(x)>=2?'near':'far'})));
}

// ---------------------------------------------------------------- shared counters (quantitative)
const QCOL=['#e4473f','#3d82c4','#3aa35b','#f28c38','#8e5bd6','#e86aa6'];
function counterSVG(shape,x,y,r,c,crossed){
  let s;
  if(shape==='dot') s=`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" stroke="#2d2a40" stroke-width="1.6"/>`;
  else if(shape==='square') s=`<rect x="${x-r*.9}" y="${y-r*.9}" width="${r*1.8}" height="${r*1.8}" rx="2" fill="${c}" stroke="#2d2a40" stroke-width="1.6"/>`;
  else if(shape==='tri') s=`<path d="M${x} ${y-r} L${x+r} ${y+r*.8} L${x-r} ${y+r*.8}Z" fill="${c}" stroke="#2d2a40" stroke-width="1.6" stroke-linejoin="round"/>`;
  else {let p='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r*1.1;p+=(i?'L':'M')+(x+rr*Math.cos(a)).toFixed(1)+' '+(y+rr*Math.sin(a)).toFixed(1)}s=`<path d="${p}Z" fill="${c}" stroke="#2d2a40" stroke-width="1.4" stroke-linejoin="round"/>`}
  if(crossed) s=`<g opacity=".45">${s}</g><path d="M${x-r} ${y-r} L${x+r} ${y+r} M${x+r} ${y-r} L${x-r} ${y+r}" stroke="#2d2a40" stroke-width="2.4" stroke-linecap="round"/>`;

}
// A group of n counters. layout rows = rows of five (easy to see), scatter = loose (must count/estimate carefully)
function groupSVG(n,st,crossed){
  crossed=crossed||0;let pos=[];

    if(!st.cells) st.cells={};
    const key=n+'/'+crossed; if(!st.cells[key]) st.cells[key]=R.sample([...Array(20).keys()],n).map(i=>[i%5,Math.floor(i/5),R.ri(-1,1)*1.5,R.ri(-1,1)*1.5]);
    pos=st.cells[key].map(([cx,cy,jx,jy])=>[16+cx*22+jx,14+cy*22+jy]);
  } else {
    const rows=Math.ceil(n/5)||1, top=50-(rows-1)*11;
    for(let i=0;i<n;i++) pos.push([16+(i%5)*22,top+Math.floor(i/5)*22]);
  }
  return `<svg viewBox="0 0 120 100" width="100%" height="100%">${pos.map((p,i)=>counterSVG(st.shape,p[0],p[1],9,st.color,i>=n-crossed)).join('')}</svg>`;

function qStyle(level){return {shape:R.pick(['dot','star','square','tri']),color:R.pick(QCOL),layout:level>=3&&R.chance(.45)?'scatter':'rows'}}

// ---------------------------------------------------------------- 4. NUMBER ANALOGIES
const NRULES={

 dbl:x=>2*x,half:x=>x%2?NaN:x/2,dblp1:x=>2*x+1,dblm1:x=>2*x-1,halfp1:x=>x%2?NaN:x/2+1,triple:x=>3*x,

const NA_LV={1:{r:['add1','sub1','add2'],max:7},2:{r:['add2','sub2','add3','same','sub1'],max:9},3:{r:['dbl','add3','sub3','add4'],max:12},4:{r:['half','dbl','sub4','add5','sub3'],max:14},5:{r:['dblp1','dblm1','halfp1','triple','half'],max:16}};
const NA_NAME={add1:'add one',add2:'add two',add3:'add three',add4:'add four',add5:'add five',sub1:'take away one',sub2:'take away two',sub3:'take away three',sub4:'take away four',same:'stays the same',dbl:'double',half:'half',dblp1:'double and one more',dblm1:'double and one less',halfp1:'half and one more',triple:'three times as many'};

const UNIVERSE=(()=>{const u=[];for(let k=-10;k<=10;k++)u.push(x=>x+k);u.push(x=>2*x,x=>x%2?NaN:x/2,x=>3*x,x=>2*x+1,x=>2*x-1,x=>x%2?NaN:x/2+1,x=>x%2?NaN:x/2-1,x=>x%3?NaN:x/3);return u})();
function genNumAnalogy(level,opt){
  const L=NA_LV[level]; let rid=opt.concept&&L.r.includes(opt.concept)?opt.concept:R.pick(L.r); const f=NRULES[rid];
  const xs=R.sample([...Array(L.max).keys()].map(i=>i+1).filter(x=>{const y=f(x);return Number.isInteger(y)&&y>=1&&y<=L.max+4}),3);
  if(xs.length<3) return null;

  add(x3+(y1-x1),'rule');add(x3,'copy');add(ans+1,'near');add(ans-1,'near');add(y2,'copy');add(ans+2,'near');add(ans-2,'near');add(ans+3,'far');

// ---------------------------------------------------------------- 5. NUMBER PUZZLES
const SYM=`<svg viewBox="0 0 120 100" width="100%" height="100%"><path d="M60 14 L100 84 L20 84Z" fill="#8e5bd6" stroke="#2d2a40" stroke-width="3" stroke-linejoin="round"/><circle cx="60" cy="60" r="8" fill="#fff"/></svg>`;
const PZ_FORMS={1:['ab'],2:['sum','ab'],3:['two'],4:['three','take'],5:['sym1','sym2']};

function genPuzzle(level,opt){
  const forms=PZ_FORMS[level]; const form=opt.concept&&forms.includes(opt.concept)?opt.concept:R.pick(forms);
  const st=qStyle(level); st.layout=level>=4&&R.chance(.3)?'scatter':'rows'; if(st.shape==='tri')st.shape=R.pick(['dot','star','square']);
  const surf=R.pick(['scale','baskets']);

  const G=v=>({v}),Q={q:1};
  if(form==='ab'){const b=R.ri(level===1?3:5,level===1?6:10),a=R.ri(1,b-1);L=[G(a),Q];Rr=[G(b)];ans=b-a;extraD=[b,a]}
  else if(form==='sum'){const a=R.ri(1,6),b=R.ri(1,Math.min(6,10-a));L=[G(a),G(b)];Rr=[Q];ans=a+b;extraD=[a,b]}

  extraD.forEach(v=>add(v,'rule'));add(ans+1,'near');add(ans-1,'near');add(ans+2,'near');add(ans-2,'far');add(ans+3,'far');
  const d=(level<=2?R.shuffle(cand):[cand[0],...R.shuffle(cand.slice(1))]).slice(0,n); if(d.length<n) return null;

const SMAX=16;
function seriesFits(seq){ // seq with exactly one null. returns set of predicted values from every rule that is over-determined and fits

  const tryModel=(nParams,fn)=>{ if(known.length<nParams+1) return; const p=fn(); if(p!=null&&Number.isFinite(p)) preds.add(Math.round(p*1000)/1000) };
  // arithmetic

// ---------- recording a finished question
// r: 'f' first try, 'r' right on a later try (no hint), 'h' right after a hint, 'x' not found (answer shown)
function record(q,res,mode){

  e.tr=res.r==='f'&&!e.g&&prevCorrect&&!seenSurf;                       // transfer: known idea, brand-new look

  T.last=now;

  if(res.r==='f'&&!e.g){b.box=Math.min(4,b.box+1);b.due=now+SR_INT[b.box]}else if(res.r!=='f'){b.box=0;b.due=now+10*60e3;

  if(q.tpl){S.recentTpl.push(q.tpl);if(S.recentTpl.length>14)S.recentTpl=S.recentTpl.slice(-14)}

function adapt(t,qLevel){
  const T=S.types[t]; if(qLevel!==T.level) return;
  const at=T.hist.slice(T.since).filter(h=>h.l===T.level&&h.m!=='c'&&h.m!=='d');

  if(T.dropFrom&&T.level<T.dropFrom&&last(2).length===2&&last(2).every(ft)){T.level=T.dropFrom-1;up();T.dropFrom=0;return}
  if(T.level<5&&at.length>=4&&last(3).every(ft)&&at.filter(ft).length/at.length>=0.7&&new Set(last(3).map(h=>h.s)).size>=2){up();T.dropFrom=0;return}

function skillProfile(){

  const all=[];for(const t of TYPE_IDS)for(const h of S.types[t].hist)all.push({...h,t});
  for(const h of all){for(const d of h.dims||[]){const o=out[d];o.n++;if(h.r==='f'&&!h.g)o.ft++;else{o.err++;if(h.ek){if(PLAUSIBLE.has(h.ek))o.plaus++;else o.unrel++}}}}

  const wmTypes=new Set(all.filter(h=>(h.dims||[]).includes('WM')).map(h=>h.t));
  const single=all.filter(h=>wmTypes.has(h.t)&&!(h.dims||[]).includes('WM'));

// ---------- rounds
let SES=null,CUR=null;
function startRound(o){
  SES={mode:o.mode,type:o.type,batt:o.batt,len:o.mode==='c'?9:o.mode==='d'?6:S.settings.roundLen,items:[],order:o.mode==='c'?R.shuffle(TYPE_IDS):null,start:Date.now()};
  persistSes();nextQ();
}
function startDiag(){const b=['V','Q','N'].find(x=>!S.diag[x]);
  $('#end').innerHTML=`<div class="endCard">${OWL('owl bob')}<div class="bigIcon">${ICON.search}</div><button class="playBig" id="goDiag">${ICON.play}</button></div>`;show('end');
  speak("Let's find out which puzzles you like! Some will be easy and some will be tricky. Just try your best.");
  $('#goDiag').onclick=()=>startRound({mode:'d',batt:b});
}
function persistSes(){S.resume=SES&&SES.items.length<SES.len?{mode:SES.mode,type:SES.type,batt:SES.batt,len:SES.len,order:SES.order,items:SES.items.map(x=>({t:x.t,level:x.level,dims:x.dims,res:x.res})),start:SES.start}:null;save()}
function resumeRound(){const r=S.resume;SES={...r,items:r.items.slice()};speak("Welcome back! Let's keep going.");setTimeout(nextQ,400)}
function nextQ(){
  if(SES.items.length>=SES.len) return endRound();
  const it=SES.mode==='d'?diagNext(SES):nextItem(SES);
  if(!it) return endRound();
  const opt={concept:it.concept,avoid:new Set(S.recent),avoidTpl:new Set(S.recentTpl)};
  const q=generate(it.t,it.level,opt); if(!q){SES.items.push({t:it.t,level:it.level,res:{r:'skip'}});return nextQ()}
  CUR={q,it,tries:0,hint:false,revealed:false,firstWrongKind:null,t0:0,locked:false};
  const T=S.types[it.t];
  if(!T.demo&&SES.mode!=='c'&&S.settings.demos!==false) return runDemo(it.t,()=>{T.demo=true;save();present()});
  present();
}
function dotsHTML(){let h='';for(let i=0;i<SES.len;i++){const x=SES.items[i];h+=`<span class="dot ${x?(x.res.r==='f'?'gold':x.res.r==='x'?'tried':'silver'):i===SES.items.length?'now':''}"></span>`}return h}
function renderQ(q,demo){
  const sp=SP.ok&&S.settings.voice;
  $('#play').innerHTML=`<div class="bar"><button class="ibtn" id="homeBtn" aria-label="Home">${ICON.home}</button><div class="dots">${dotsHTML()}</div>
   <button class="ibtn spk" id="spk" aria-label="Say it again">${ICON.speaker}</button>${SES.mode==='c'||demo?'':`<button class="ibtn" id="hintBtn" aria-label="Clue">${ICON.bulb}</button>`}<button class="ibtn small" id="demoBtn" aria-label="Show me how">${ICON.eye}</button></div>
   ${demo?`<div class="demoBanner"><div class="teach">${OWL('owl')}</div><div class="watch">${ICON.eye}</div><button class="playBig myTurn" id="skipDemo" aria-label="My turn">${ICON.play}</button></div>`:''}
   <div class="stem L-${q.layout} ${q.noStem?'nostem':''}" id="stem">${q.noStem?`<div class="oddArt">${OWL('owl small')}<div class="mag">${ICON.search}</div></div>`:q.stem}</div>
   <div class="choices L-${q.layout} ${q.choiceRender==='beads'||q.choiceRender==='towers'?'rods':''}" id="choices">${q.choices.map((c,i)=>`<button class="choice" data-i="${i}" aria-label="choice">${c.html}</button>`).join('')}</div>
   <div class="ptext ${sp?'':'on'}">${q.say}</div>`;
  if(q.sentence&&$('#stem .bigEar')) $('#stem .bigEar').innerHTML=`<button class="earBtn" id="earBtn">${ICON.speaker}</button>`;
  $('#homeBtn').onclick=()=>{document.querySelectorAll('.hand').forEach(h=>h.remove());$('#play').classList.remove('demoMode');if(CUR&&CUR.demo)CUR=null;SP.token++;try{speechSynthesis.cancel()}catch(e){}persistSes();renderHome()};
  $('#spk').onclick=()=>speak(CUR.q.say);
  if($('#earBtn')) $('#earBtn').onclick=()=>speak(CUR.q.say);
  if($('#hintBtn')) $('#hintBtn').onclick=()=>giveHint();
  $('#demoBtn').onclick=()=>{if(demo)return;const keep=CUR;runDemo(CUR.q.type,()=>{CUR=keep;present(true)})};
  show('play');
}
function present(again){
  const q=CUR.q;renderQ(q);CUR.t0=Date.now();CUR.locked=false;
  document.querySelectorAll('#choices .choice').forEach(b=>b.onclick=()=>choose(+b.dataset.i,b));
  speak(q.say);
}
function choose(i,btn){
  if(!CUR||CUR.demo||CUR.locked||btn.classList.contains('gone'))return;
  const q=CUR.q;CUR.tries++;
  if(CUR.tries===1) CUR.ms=Date.now()-CUR.t0;
  if(i===q.answer){
    CUR.locked=true;btn.classList.add('right');
    const r=CUR.revealed?'x':CUR.tries===1&&!CUR.hint?'f':CUR.hint?'h':'r';
    if(r!=='x'){sfxRight();starBurst();confetti(r==='f'?46:22);speak(R.pick(PRAISE))}else speak('That is the one. Good looking!');
    S.stars+=r==='f'?1:r==='x'?0:0.5;
    const res={r,ms:CUR.ms,tries:CUR.tries,firstWrongKind:CUR.firstWrongKind};
    const mode=SES.mode==='d'?'d':SES.mode==='c'?'c':CUR.it.easy?'e':SES.mode==='t'?'t':(CUR.it.review?'r':'p');
    record(q,res,mode);
    SES.items.push({t:q.type,level:q.level,dims:q.dims,res});persistSes();
    setTimeout(nextQ,r==='f'?1700:1500);
    return;
  }
  if(CUR.tries===1) CUR.firstWrongKind=q.choices[i].kind;
  btn.classList.add('shake');setTimeout(()=>btn.classList.add('gone'),380);sfxSoft();
  const left=[...document.querySelectorAll('#choices .choice')].filter((b,k)=>k!==i&&!b.classList.contains('gone'));
  if(left.length<=1||CUR.tries>=3) return reveal();
  if(CUR.tries===2&&SES.mode!=='c'&&!CUR.hint){giveHint(true);return}
  if(CUR.tries===2&&SES.mode==='c') return reveal();
  speak(AGAIN);
}
function giveHint(auto){
  if(CUR.locked||CUR.hint&&!auto)return; const q=CUR.q;CUR.hint=true;
  $('#stem').classList.add('hint-on');
  const bs=[...document.querySelectorAll('#choices .choice')];const live=bs.filter((b,k)=>k!==q.answer&&!b.classList.contains('gone'));
  if(live.length>=2&&bs.filter(b=>!b.classList.contains('gone')).length>=3) R.pick(live).classList.add('gone');
  speak((auto?AGAIN+' Here is a clue. ':'')+q.hintSay,null,q.sentence?0.8:undefined);
  if($('#hintBtn'))$('#hintBtn').classList.add('used');
}
function reveal(){
  CUR.revealed=true;const b=document.querySelectorAll('#choices .choice')[CUR.q.answer];b.classList.add('reveal');
  speak("Here it is! This is the one that fits. Tap it.");
}
function runDemo(t,cb){
  const q=generate(t,1,{});if(!q)return cb();
  const realCur=CUR;CUR={q,demo:true,locked:true};renderQ(q,true);
  $('#play').classList.add('demoMode');
  const hand=document.createElement('div');hand.className='hand';hand.innerHTML='👆';document.body.appendChild(hand);
  let gone=false;const cleanup=()=>{if(gone)return;gone=true;hand.remove();$('#play').classList.remove('demoMode')};
  const finish=()=>{cleanup();CUR=realCur;cb()};
  $('#skipDemo').onclick=finish;
  speak('Let me show you how this game works. '+q.say,()=>{
    if(gone)return;const target=document.querySelectorAll('#choices .choice')[q.answer];if(!target){return finish()}
    const r=target.getBoundingClientRect();hand.style.left=(r.left+r.width/2-20)+'px';hand.style.top=(r.top+r.height/2)+'px';hand.classList.add('go');
    setTimeout(()=>{if(gone)return;target.classList.add('right');starBurst();sfxRight();
      setTimeout(()=>{hand.remove();if(gone)return;
        // wait for HIM to tap "my turn": the demo never runs into his own question
        const go=$('#skipDemo');go.classList.add('ready');
        speak("That's how you play. Now it's your turn! Tap the green button.")},900)},1400);
  });
}
function endRound(){
  const items=SES.items.filter(x=>x.res.r!=='skip');
  if(SES.mode==='d') diagPlace(SES);
  if(SES.mode==='c') S.challenges.push({d:Date.now(),res:Object.fromEntries(SES.items.map(x=>[x.t,{r:x.res.r,l:x.level}]))});
  S.rounds.push({day:today(),d:Date.now(),mode:SES.mode,n:items.length,f:items.filter(x=>x.res.r==='f').length});
  if(S.rounds.length>500)S.rounds=S.rounds.slice(-500);
  S.resume=null;save();
  const stars=items.map(x=>STAR(x.res.r==='f'?'#ffd23f':x.res.r==='x'?'#fff':'#d6dbe6','56')).join('');
  const nextDiag=SES.mode==='d'&&!diagDone();
  $('#end').innerHTML=`<div class="endCard">${OWL('owl jump')}<div class="starsRow">${stars}</div>${SES.mode==='c'?`<div class="bigIcon">${ICON.trophy}</div>`:''}<div class="row"><button class="ibtn big" id="endHome">${ICON.home}</button><button class="playBig" id="endAgain">${ICON.play}</button></div></div>`;
  show('end');confetti(70);tone([523,659,784,659,1047],0.12,'triangle');
  speak(SES.mode==='c'?'You finished the challenge! You should be proud of your thinking!':nextDiag?'Great work! Ready for more puzzles?':'You did it! Great thinking!');
  const last=SES;
  $('#endHome').onclick=renderHome;
  $('#endAgain').onclick=()=>{if(nextDiag)return startDiag();if(last.mode==='t')return startRound({mode:'t',type:last.type});if(!diagDone())return startDiag();if(roundsToday()>=S.settings.dailyCap)return restScreen();startRound({mode:'p'})};
}

function bar(p,col){return `<div class="pbar"><div style="width:${Math.round(100*p)}%;background:${col||'#3d82c4'}"></div></div>`}
function fmtDate(d){return new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function renderParent(){
  const prof=skillProfile();const E=prof._err;const totalQ=TYPE_IDS.reduce((a,t)=>a+S.types[t].hist.length,0);

  <p class="pnote small">"Mastery" here means consistent, independent performance in this game, at the hardest level, on new-looking problems, and again on later days. It is a practice measure; it does <b>not</b> predict a CogAT percentile, stanine, or score. Levels are the game's own learning stages, not official score bands.</p>`;

    h+=`<tr><td><b>${TYPES[t].name}</b><div class="tiny">${{V:'Verbal',Q:'Quantitative',N:'Nonverbal'}[b]}</div></td><td>${st.n}${st.easy?` <span class="tiny">+${st.easy}</span>`:''}</td><td>${st.n?pct(st.ft):'–'}</td><td>${st.n?pct(st.retry):'–'}</td><td>${st.n?pct(st.hint):'–'}</td><td>${st.n?pct(st.shown):'–'}</td><td>${S.types[t].level} / 5</td><td>${st.Lr||'–'}</td><td>${st.transfer}</td><td>${st.ret} day${st.ret===1?'':'s'}</td><td>${st.n?st.score:'–'}${st.n?bar(st.score/100,'#8e5bd6'):''}</td><td><b>${st.status}</b><div class="tiny">${ck}</div>${st.n&&st.n<20?'<div class="tiny warn">small sample: treat with caution</div>':''}</td></tr>`}
  h+=`</table></div><p class="pnote small">Mastered needs all five: accuracy (Wilson lower bound ≥ 65% over the last 20+), difficulty (solid at level 5, 10+ hard questions), variety (3+ different ideas at levels 4–5), transfer (3+ first-try wins on known ideas shown in a new way), retention (right again on 2+ later days).</p>`;
  // trouble concepts
  const trouble=[];for(const t of TYPE_IDS){const by={};for(const e of S.types[t].hist){const k=e.c;by[k]=by[k]||{n:0,f:0,pl:0,un:0};by[k].n++;if(e.r==='f'&&!e.g)by[k].f++;else if(e.ek){PLAUSIBLE.has(e.ek)?by[k].pl++:by[k].un++}}
    for(const k in by){const o=by[k];if(o.n>=3&&o.f/o.n<0.6)trouble.push({t,k,...o})}}

  // diagnostic snapshot
  h+=`<h2>Diagnostic snapshot</h2>`;
  if(['V','Q','N'].some(b=>S.diag[b])){h+=`<div class="ptable"><table><tr><th>Type</th><th>One-rule question (level 2)</th><th>Follow-up</th><th>Starting level</th><th>First wrong pick</th></tr>`;
    for(const b of ['V','Q','N'])if(S.diag[b])for(const t in S.diag[b].types){const o=S.diag[b].types[t];const R2={f:'✓ first try',r:'✓ on retry',h:'✓ with clue',x:'✗ shown'};
      h+=`<tr><td>${TYPES[t].name}</td><td>${R2[o.a]}</td><td>${R2[o.b]} <span class="tiny">(level ${o.bLevel}${o.bLevel>=3?', several attributes / look-alike answers':', easier check'})</span></td><td>${o.level}</td><td class="tiny">${o.ek.map(k=>k?(PLAUSIBLE.has(k)?'almost-right ('+k+')':'unrelated'):'–').join(' · ')}</td></tr>`}
    h+=`</table></div>`}else h+='<p class="pnote">Not taken yet. “Play” starts it automatically (three short parts, one per battery, 6 questions each).</p>';
  if(S.challenges.length){h+=`<h2>Challenge results</h2><div class="ptable"><table><tr><th>Date</th>${TYPE_IDS.map(t=>`<th class="tiny">${TYPES[t].name}</th>`).join('')}</tr>${S.challenges.slice(-8).reverse().map(c=>`<tr><td>${fmtDate(c.d)}</td>${TYPE_IDS.map(t=>{const x=c.res[t];return `<td>${x?(x.r==='f'?'✓':'○')+' <span class="tiny">L'+x.l+'</span>':''}</td>`}).join('')}</tr>`).join('')}</table></div><p class="pnote small">Challenge: one question per type at a stretch level, no clue button. ✓ = first try.</p>`}
  // settings
  const vs=SP.ok?speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)):[];
  h+=`<h2>Settings</h2><div class="pset">
   <label>Questions per round <select id="sLen">${[4,5,6,8,10].map(n=>`<option ${S.settings.roundLen==n?'selected':''}>${n}</option>`).join('')}</select></label>
   <label>Rounds per day before a rest suggestion <select id="sCap">${[[2,'2'],[3,'3'],[4,'4'],[6,'6'],[99,'no limit']].map(([v,l])=>`<option value="${v}" ${S.settings.dailyCap==v?'selected':''}>${l}</option>`).join('')}</select></label>
   <label>Voice speed <input type="range" id="sRate" min="0.7" max="1.15" step="0.05" value="${S.settings.rate}"></label>
   <label><input type="checkbox" id="sVoice" ${S.settings.voice?'checked':''}> Spoken instructions</label>
   <label><input type="checkbox" id="sSfx" ${S.settings.sfx?'checked':''}> Sound effects</label>
   <label><input type="checkbox" id="sDemo" ${S.settings.demos!==false?'checked':''}> Show a "watch me" demo the first time he meets each puzzle type</label>
   ${vs.length?`<label>Voice <select id="sVoiceName"><option value="">Automatic</option>${vs.map(v=>`<option ${S.settings.voiceName===v.name?'selected':''}>${v.name}</option>`).join('')}</select></label>`:''}
   <button class="pbtn" id="sTest">Test voice</button></div>
   ${SP.ok?'':'<p class="pnote warn">This browser has no speech synthesis. The instruction text is shown under each question so you can read it aloud.</p>'}
  <h2>Saving</h2><p class="pnote">This game has <b>one player</b>, so there is nothing to choose or log in to. Progress saves automatically after every question${S.lastSaved?` (last saved ${new Date(S.lastSaved).toLocaleString()})`:''}.${memOnly?' <b class="warn">Right now this browser is blocking saving (private browsing?), so progress will be lost when the page closes.</b>':''}</p>
  <p class="pnote small">The save lives inside the browser on this device. To keep one continuous record: <b>always open the game the same way on the same device</b> (for example, always from the K12 Games dashboard in Safari, or always from the Home Screen icon). On iPad and iPhone, the Home Screen app and Safari keep <i>separate</i> saves, and Safari may clear the saves of sites not opened for about a week, so using the Home Screen icon is the safest choice. To move to another device, use Export there and Import here.${persistNote()}</p>
  ${backupNag()}
  <h2>Data</h2><div class="pset"><button class="pbtn" id="dExport">Export progress (backup file)</button><label class="pbtn">Import progress<input type="file" id="dImport" accept=".json" hidden></label><button class="pbtn" id="dDiag">Run the diagnostic again</button><button class="pbtn danger" id="dReset">Reset all progress</button></div>
  <p class="pnote small">Progress is saved only in this browser on this device (no account, no server). Use Export/Import to move it.</p></div>`;
  $('#parent').innerHTML=h;show('parent');
  $('#pBack').onclick=renderHome;
  const set=(k,v)=>{S.settings[k]=v;save()};
  $('#sLen').onchange=e=>set('roundLen',+e.target.value);$('#sCap').onchange=e=>set('dailyCap',+e.target.value);$('#sRate').oninput=e=>set('rate',+e.target.value);
  $('#sVoice').onchange=e=>set('voice',e.target.checked);$('#sDemo').onchange=e=>set('demos',e.target.checked);$('#sSfx').onchange=e=>set('sfx',e.target.checked);
  if($('#sVoiceName'))$('#sVoiceName').onchange=e=>{set('voiceName',e.target.value);pickVoice()};
  $('#sTest').onclick=()=>speak('Look at the first two pictures. They go together.');
  $('#dExport').onclick=()=>{S.lastExport=Date.now();save();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='brainy-owl-progress-'+today()+'.json';a.click()};
  $('#dImport').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(o.v!==1||!o.types)throw 0;S=o;TYPE_IDS.forEach(id=>{if(!S.types[id])S.types[id]=freshType()});save();renderParent()}catch(err){alert('That file is not a Brainy Owl progress file.')}})};
  $('#dDiag').onclick=()=>{if(confirm('Run the three short diagnostic parts again next time Play is pressed? (Progress is kept.)')){S.diag={V:null,Q:null,N:null};save();renderParent()}};
  $('#dReset').onclick=()=>{if(confirm('Erase ALL progress, history and settings on this device?')&&confirm('Are you sure? This cannot be undone.')){localStorage.removeItem(KEY);S=fresh();save();renderHome()}};
}
function persistNote(){return SP.persisted===true?' This browser has agreed to keep the save permanently.':''}
function backupNag(){const n=TYPE_IDS.reduce((a,t)=>a+S.types[t].hist.length,0);if(n<40)return '';const last=S.lastExport||0;
  if(Date.now()-last<14*DAY)return `<p class="pnote small">Last backup: ${fmtDate(last)}.</p>`;
  return `<p class="pnote warn">${last?'Last backup was '+fmtDate(last)+'.':'No backup yet.'} Tap “Export progress” below to save a copy of ${n} answered questions, in case this browser's data is ever cleared.</p>`}
function progressChart(){
  const days=[...Array(14)].map((_,i)=>dayOf(Date.now()-(13-i)*DAY));const by={};days.forEach(d=>by[d]={n:0,f:0});
  for(const t of TYPE_IDS)for(const e of S.types[t].hist){const d=dayOf(e.d);if(by[d]){by[d].n++;if(e.r==='f'&&!e.g)by[d].f++}}
  const mx=Math.max(10,...days.map(d=>by[d].n)),W=640,H=190,bw=W/14;
  let s=`<svg viewBox="0 0 ${W} ${H+34}" class="chart"><line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="#c9cde0"/>`;
  days.forEach((d,i)=>{const o=by[d],bh=o.n/mx*(H-20);s+=`<rect x="${i*bw+6}" y="${H-bh}" width="${bw-12}" height="${bh}" rx="4" fill="#bfe3f7"><title>${d}: ${o.n} questions</title></rect>`;if(o.n)s+=`<text x="${i*bw+bw/2}" y="${H-bh-4}" font-size="11" text-anchor="middle" fill="#5b6077">${o.n}</text>`;s+=`<text x="${i*bw+bw/2}" y="${H+16}" font-size="10" text-anchor="middle" fill="#8a8fa8">${d.slice(5)}</text>`});
  const pts=days.map((d,i)=>by[d].n?[i*bw+bw/2,H-(by[d].f/by[d].n)*(H-20)]:null).filter(Boolean);
  if(pts.length)s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#8e5bd6" stroke-width="3"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#8e5bd6"/>`).join('');
  return s+`<text x="4" y="${H+32}" font-size="11" fill="#5b6077">Blue bars: questions per day. Purple line: first-try accuracy (top = 100%).</text></svg>`;
}
function init(){
  load();
  let defs='<marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e4473f"/></marker>';
  for(const [k,c] of Object.entries(NCOL)) defs+=`<pattern id="st-${k}" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fff"/><rect width="3.2" height="7" fill="${c}"/></pattern><pattern id="dt-${k}" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#fff"/><circle cx="3.5" cy="3.5" r="1.9" fill="${c}"/></pattern>`;
  $('#defs').innerHTML=`<defs>${defs}</defs>`;
  if(SP.ok){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().then(v=>SP.persisted=v)}catch(e){}
  renderHome();
}
window.addEventListener('DOMContentLoaded',init);

</script>
</body></html>
