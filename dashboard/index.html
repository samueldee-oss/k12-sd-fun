<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>K12 Games</title>
  <link rel="stylesheet" href="styles.css">
<!-- home-screen-app -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=c0834a80">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=c0834a80">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="K12 Games">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#16191f">
<script id="home-screen-sw">if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
<!-- /home-screen-app -->
</head>
<body>
  <main class="dashboard">
    <section class="home" aria-label="Game library">
      <header class="topbar">
        <h1>K12 Games</h1>
        <span id="offlinePill" class="pill" hidden>✈ Offline</span>
        <button id="saveOffline" class="save-btn" type="button">⬇ Save for airplane</button>
      </header>
      <div id="saveStatus" class="save-status" hidden></div>
      <input id="search" class="search" type="search" placeholder="Search games" autocomplete="off" aria-label="Search games">
      <div id="grid" class="grid" role="list"></div>
      <p class="foot">
        <b>Bank Game</b> runs only from the PC server (<code>tools\serve_dashboard.ps1</code>) and needs internet.
      </p>
    </section>

    <section id="player" class="player" aria-label="Selected game">
      <div class="bar">
        <button id="back" class="icon-btn back" type="button" aria-label="Back to games">‹ Games</button>
        <img id="barIcon" class="bar-icon" alt="">
        <div class="bar-title">
          <strong id="gameTitle">Pick a game</strong>
          <select id="versionPick" class="version" hidden aria-label="Version"></select>
        </div>
        <button id="infoBtn" class="icon-btn" type="button" aria-expanded="false" title="About + notes">ⓘ</button>
        <button id="fullBtn" class="icon-btn" type="button" title="Full screen">⤢</button>
        <a id="openLink" class="icon-btn" href="#" target="_blank" rel="noreferrer" title="Open in its own tab">↗</a>
      </div>
      <div id="info" class="info" hidden>
        <p id="gameDesc"></p>
        <button id="copyLink" class="chip" type="button">Copy link</button>
        <textarea id="notes" rows="3" placeholder="Notes: ideas, bugs, systems idea, level goals"></textarea>
      </div>
      <div class="stage">
        <iframe id="gameFrame" title="Selected game" allow="fullscreen; autoplay"></iframe>
        <div id="pickHint" class="pick-hint">Tap a game to play</div>
      </div>
    </section>
  </main>
  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
