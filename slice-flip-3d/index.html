<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Slice Flip 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#9fd3ff;font-family:Fredoka,system-ui,sans-serif;user-select:none;-webkit-user-select:none;color:#3b1d5e}
canvas{display:block;touch-action:none}
#hud{position:fixed;top:10px;left:0;right:0;text-align:center;pointer-events:none}
#score{font-size:34px;font-weight:700;text-shadow:0 2px 0 #fff}
#sub{font-size:16px;height:20px;opacity:.85}
#barWrap{width:min(320px,70vw);height:12px;margin:4px auto 0;border-radius:8px;background:rgba(255,255,255,.55);overflow:hidden;box-shadow:inset 0 1px 3px #0002}
#bar{height:100%;width:0;background:linear-gradient(90deg,#ffd43b,#ff6bcb,#4dabf7)}
#lvl{font-size:13px;letter-spacing:2px;margin-top:4px;font-weight:700}
.btns{position:fixed;top:10px;right:10px;display:flex;gap:6px;z-index:3}
#shop{position:fixed;inset:0;background:rgba(40,20,80,.55);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:6}
#shop.open{display:flex}
.panel{background:#fff;border-radius:22px;padding:16px;width:min(720px,94vw);max-height:88vh;overflow:auto;box-shadow:0 10px 0 #0002}
.panel h2{margin:0 0 4px;font-size:30px;text-align:center}.panel .bank{text-align:center;font-weight:700;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{border-radius:16px;padding:8px;text-align:center;background:#f3f0ff;border:3px solid transparent}
.card.eq{border-color:#845ef7;background:#ece4ff}.card canvas{width:100%;height:auto;display:block}
.card .nm{font-weight:700;font-size:16px}.card .ds{font-size:12px;opacity:.75;min-height:30px}
.card button{margin-top:6px;width:100%;font-size:14px;padding:7px}.card button.buy{background:#ffd43b}.card button.no{opacity:.45}
.card button.eqd{background:#845ef7;color:#fff}.close{display:block;margin:12px auto 0;background:#3b1d5e;color:#fff}
button{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:999px;padding:8px 13px;background:#fff;color:#3b1d5e;cursor:pointer;box-shadow:0 3px 0 #0002}
button:active{transform:translateY(2px);box-shadow:none}
#hint{position:fixed;bottom:16px;left:0;right:0;text-align:center;font-size:16px;font-weight:600;pointer-events:none;transition:opacity .6s;padding:0 14px;color:#fff;text-shadow:0 2px 4px #3b1d5e}
#big{position:fixed;left:0;right:0;top:26%;text-align:center;pointer-events:none;font-weight:700}
.bigt{font-size:clamp(42px,9vw,80px);color:#fff;-webkit-text-stroke:3px #3b1d5e;paint-order:stroke fill;animation:bigin 1.6s ease-out forwards}
@keyframes bigin{0%{transform:scale(2.2);opacity:0}12%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
.pop{position:fixed;pointer-events:none;font-weight:700;color:#fff;-webkit-text-stroke:2.5px #3b1d5e;paint-order:stroke fill;animation:up .8s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes up{0%{opacity:1;margin-top:0;scale:1.6}20%{scale:1}100%{opacity:0;margin-top:-50px}}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#ffffffaa,#9fd3ffee);cursor:pointer;text-align:center;z-index:5}
#start h1{font-size:clamp(48px,11vw,96px);margin:0;color:#fff;-webkit-text-stroke:4px #3b1d5e;paint-order:stroke fill}
#start p{font-size:18px;max-width:480px;margin:10px 20px;font-weight:600}
.go{margin-top:16px;font-size:24px;padding:14px 38px;background:linear-gradient(135deg,#ff6bcb,#845ef7);color:#fff;animation:pulse 1.3s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
</style>
</head>
<body>
<div id="hud"><div id="score">🔪 0</div><div id="sub"></div><div id="barWrap"><div id="bar"></div></div><div id="lvl">LEVEL 1</div></div>
<div class="btns"><button id="shopBtn">🛒</button><button id="restart">↻</button><button id="mus">🎵</button><button id="snd">🔊</button></div>
<div id="big"></div>
<div id="shop"><div class="panel"><h2>🛒 Knife Shop</h2><div class="bank" id="shopBank"></div><div class="grid" id="grid"></div><button class="close" id="shopClose">Back to slicing</button></div></div>
<div id="hint">Click, tap or press Space to flip the knife!</div>
<div id="start"><h1>Slice Flip 3D</h1><p>Flip your knife through piles of food, land blade-first, and stick the biggest multiplier at the end!</p><button class="go">Tap to play</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const R=Math.random,rr=(a,b)=>a+R()*(b-a),$=id=>document.getElementById(id);
const S=0.02;                 // game units -> three units
const KT=51,KB=40,GRAV=1500,DEPTH=80;

/* ---------- three setup ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#9fd3ff');scene.fog=new THREE.Fog('#c9e4ff',22,60);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,200);
scene.add(new THREE.HemisphereLight('#ffffff','#b197fc',.75));
const sun=new THREE.DirectionalLight('#fff4e0',.85);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-14,right:14,top:12,bottom:-12,near:1,far:60});sun.shadow.bias=-.0005;sun.shadow.normalBias=.03;
scene.add(sun,sun.target);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});

// scenery: hills + clouds
const hillMat=[new THREE.MeshLambertMaterial({color:'#d0bfff'}),new THREE.MeshLambertMaterial({color:'#b197fc'})];
const scenery=new THREE.Group();scene.add(scenery);
for(let i=0;i<40;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(rr(6,12),20,12),hillMat[i%2]);m.position.set(i*9-40,-14,-28-rr(0,8)-(i%2)*6);m.scale.y=.6;scenery.add(m);}
const cloudMat=new THREE.MeshLambertMaterial({color:'#ffffff'});
for(let i=0;i<26;i++){const g=new THREE.Group();for(let j=0;j<4;j++){const s=new THREE.Mesh(new THREE.SphereGeometry(rr(.9,1.6),12,8),cloudMat);s.position.set(j*1.3,rr(-.3,.3),rr(-.4,.4));g.add(s);}
  g.position.set(i*14-30,rr(1,5),-22-rr(0,6));scenery.add(g);}

/* ---------- textures ---------- */
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t;}
const woodTex=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#c98b4f';g.fillRect(0,0,w,h);
  for(let y=0;y<h;y+=32){g.fillStyle=y%64?'#c2844a':'#cc9055';g.fillRect(0,y,w,32);g.fillStyle='#8f5a30';g.fillRect(0,y,w,2);
    g.strokeStyle='rgba(120,70,30,.25)';g.lineWidth=1.5;for(let k=0;k<3;k++){g.beginPath();g.moveTo(0,y+8+k*8);for(let x=0;x<=w;x+=32)g.lineTo(x,y+8+k*8+Math.sin(x*.05+y)*2);g.stroke();}}});
woodTex.wrapS=woodTex.wrapT=THREE.RepeatWrapping;
const topMat=new THREE.MeshLambertMaterial({color:'#e6ad6e'});

/* ---------- sound ---------- */
let AC=null,master=null,sfxBus=null,musBus=null,muted=false,musicOn=true,sndN=0,NB=null;
try{muted=localStorage.getItem('slice3dMute')==='1';musicOn=localStorage.getItem('slice3dMusic')!=='0';}catch(e){}
function au(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();
      const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(AC.destination);
      master=AC.createGain();master.gain.value=muted?0:.9;master.connect(comp);
      sfxBus=AC.createGain();sfxBus.gain.value=1;sfxBus.connect(master);
      musBus=AC.createGain();musBus.gain.value=musicOn?.32:0;musBus.connect(master);
      const sb=AC.createBuffer(1,1,22050),src=AC.createBufferSource();src.buffer=sb;src.connect(AC.destination);src.start(0); // iOS unlock
      buildAsmr();setInterval(musicTick,25);}catch(e){AC=null}}
  if(AC&&AC.state!=='running')AC.resume().catch(()=>{});}
['pointerdown','pointerup','touchend','click','keydown'].forEach(ev=>addEventListener(ev,au,{capture:true,passive:true}));
function tone(f,d,type='sine',v=.15,f2,when=0,bus){if(!AC)return;if(!bus){if(sndN>12)return;sndN++;}
  const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(bus||sfxBus);o.start(t);o.stop(t+d+.03);}
function noise(d,v,fq,fq2,type='lowpass',when=0,bus,Q=1){if(!AC)return;if(!bus){if(sndN>12)return;sndN++;}
  if(!NB){NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=R()*2-1;}
  const t=AC.currentTime+when,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;f.type=type;f.Q.value=Q;
  f.frequency.setValueAtTime(fq,t);if(fq2)f.frequency.exponentialRampToValueAtTime(fq2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(bus||sfxBus);s.start(t,R()*1.5);s.stop(t+d+.02);}

/* ---------- ASMR slice textures (generated sample buffers) ---------- */
const ASMR={};
function mkBuf(dur,fn){const sr=AC.sampleRate,n=Math.floor(sr*dur),b=AC.createBuffer(1,n,sr),a=b.getChannelData(0);fn(a,sr,n);
  let m=0;for(let i=0;i<n;i++)m=Math.max(m,Math.abs(a[i]));if(m>0)for(let i=0;i<n;i++)a[i]/=m;return b;}
// sparse tiny clicks, dense at first then thinning out = crisp "crackle" (like cutting a crisp apple / soap)
function crackle(dens,dur,decay,click){return mkBuf(dur,(a,sr,n)=>{for(let i=0;i<n;i++){const t=i/sr,env=Math.exp(-t*decay);
    if(R()<dens*env){const amp=(.4+R()*.6)*env,len=Math.floor(sr*click*(.5+R()));for(let k=0;k<len&&i+k<n;k++)a[i+k]+=(R()*2-1)*amp*Math.exp(-k/(len*.3));}}});}
// soft wet squelch: lowpassed noise with little bubble swells
function squelch(dur,bub,lp){return mkBuf(dur,(a,sr,n)=>{let y=0;const bubs=[];for(let k=0;k<bub;k++)bubs.push([R()*dur*.8,.01+R()*.03,.4+R()*.6]);
  for(let i=0;i<n;i++){const t=i/sr;let env=Math.min(1,t/.006)*Math.exp(-t*(6/dur));for(const[c,w,h]of bubs){const d=(t-c)/w;env+=h*Math.exp(-d*d)*.8;}
    y+=lp*((R()*2-1)-y);a[i]=y*env;}});}
// gentle blade glide "shhh"
function glide(dur){return mkBuf(dur,(a,sr,n)=>{let y=0;for(let i=0;i<n;i++){const t=i/sr,env=Math.sin(Math.PI*Math.min(1,t/dur))**1.5;y+=.5*((R()*2-1)-y);a[i]=(R()*2-1-y)*env;}});}
function buildAsmr(){
  ASMR.crisp=[0,1,2].map(()=>crackle(.05,.16,18,.0007));     // carrot/cucumber: sharp, snappy
  ASMR.crust=[0,1,2].map(()=>crackle(.03,.2,12,.0012));      // bread: crusty, a bit coarser
  ASMR.soft=[0,1,2].map(()=>crackle(.012,.14,16,.0025));     // cheese/cake: muted creamy cut
  ASMR.wet=[0,1,2].map(()=>squelch(.22,4,.25));               // fruit juice
  ASMR.jelly=[0,1,2].map(()=>squelch(.32,6,.12));             // jelly wobble
  ASMR.glide=[0,1].map(()=>glide(.14));
  ASMR.snap=[0,1,2].map(()=>mkBuf(.03,(a,sr,n)=>{for(let i=0;i<n;i++){const t=i/sr;a[i]=(R()*2-1)*Math.exp(-t*260)+Math.sin(t*2*Math.PI*rr(1800,2600))*Math.exp(-t*400)*.6;}}));
  ASMR.puff=[0,1].map(()=>mkBuf(.25,(a,sr,n)=>{let y=0;for(let i=0;i<n;i++){const t=i/sr,env=Math.min(1,t/.03)*Math.exp(-t*9);y+=.08*((R()*2-1)-y);a[i]=y*env;}}));}
// food -> layered recipe: [buffer set, gain, filter type, freq, Q, playback rate]
// each food = layered recipe of textures + extras (drips = juice dripping, snap = skin/casing pop, puff = airy sponge)
// layer: [buffer set, gain, filter type, freq, Q, playback rate]
const ASMR_FOOD={
  melon:   {L:[['wet',1,'lowpass',2200,.7,.9],['wet',.7,'bandpass',900,1.2,.7]],drips:5,splash:.5},
  orange:  {L:[['wet',1,'lowpass',2800,.7,1.1],['crisp',.15,'bandpass',4000,.9,1.2]],drips:4,splash:.35},
  lemon:   {L:[['wet',.95,'lowpass',3200,.7,1.25]],drips:4,splash:.3},
  kiwi:    {L:[['wet',1,'lowpass',2000,.8,1],['soft',.25,'bandpass',2600,.8,1]],drips:3,splash:.3},
  apple:   {L:[['crisp',1,'bandpass',4200,.8,1],['wet',.35,'lowpass',2600,.7,1.2]],snap:.5,drips:1},
  cucumber:{L:[['crisp',1,'bandpass',4600,.9,1.05],['wet',.55,'lowpass',3000,.7,1.15]],snap:.4,drips:2},
  carrot:  {L:[['crisp',1,'bandpass',3400,1,.85],['crisp',.6,'bandpass',5200,1,1.1]],snap:.9},
  sausage: {L:[['wet',.8,'lowpass',1500,.8,.75],['soft',.3,'lowpass',2000,.7,.85]],snap:.55,drips:1},
  cheese:  {L:[['soft',1,'lowpass',2200,.7,.9],['soft',.5,'lowpass',1400,.7,.7]]},
  cake:    {L:[['soft',.45,'lowpass',1800,.7,.8]],puff:1},
  bread:   {L:[['crust',1,'bandpass',3000,.8,1],['crust',.5,'bandpass',4800,.8,1.15]],puff:.5},
  jelly:   {L:[['jelly',1,'lowpass',1300,1.4,.9],['jelly',.6,'lowpass',700,2,.6]],wobble:1}};
function playBuf(buf,gain,ftype,fq,Q,rate,pan,when=0){const t=AC.currentTime+when,src=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  src.buffer=buf;src.playbackRate.value=rate;f.type=ftype;f.frequency.value=fq;f.Q.value=Q;g.gain.value=gain;src.connect(f);f.connect(g);
  if(AC.createStereoPanner){const p=AC.createStereoPanner();p.pan.value=pan;g.connect(p);p.connect(sfxBus);}else g.connect(sfxBus);src.start(t);}
let duckT=0;
function duck(){if(!musBus||!musicOn)return;const t=AC.currentTime;musBus.gain.cancelScheduledValues(t);musBus.gain.setTargetAtTime(.1,t,.03);musBus.gain.setTargetAtTime(.32,t+.5,.35);}
const sfx={
  flip(){noise(.2,.16,700,5200,'bandpass',0,null,1.4);tone(rr(280,320),.12,'sine',.05,560);},
  slice(f,c,pan=0){if(!AC||!ASMR.wet||sndN>14)return;sndN++;
    const pick=a=>a[Math.floor(R()*a.length)],v=rr(.88,1.12),rc=ASMR_FOOD[f.n]||ASMR_FOOD.cheese;
    for(const[k,g,ft,fq,Q,rt]of rc.L)playBuf(pick(ASMR[k]),g*.9,ft,fq*v,Q,rt*v,pan);
    playBuf(pick(ASMR.glide),.16,'bandpass',5200*v,.7,v,pan*.6);                                 // blade glide
    if(rc.snap)playBuf(pick(ASMR.snap),rc.snap,'highpass',1800*v,.7,v,pan);                       // skin / casing snap
    if(rc.splash)playBuf(pick(ASMR.wet),rc.splash,'bandpass',1600*v,.8,1.4*v,pan,.02);            // juice splash
    for(let i=0;i<(rc.drips||0);i++){const w=rr(.06,.42),fq=rr(900,1600);                          // juice drips: tiny "plip"s
      tone(fq,.07,'sine',rr(.025,.05),fq*.55,w);}
    if(rc.puff)playBuf(pick(ASMR.puff),rc.puff*.8,'lowpass',1200*v,.6,v,pan);                     // airy spongy squeeze
    if(rc.wobble){tone(rr(70,90),.35,'sine',.12,rr(55,65));tone(rr(130,150),.25,'sine',.05,rr(90,110),.05);}
    tone(1800+Math.min(16,c)*90,.05,'sine',.01);
    duck();},
  stick(){tone(170,.2,'sine',.42,52);noise(.12,.3,1000,180);tone(2093,.45,'sine',.05);tone(2794,.35,'sine',.03,null,.006);},
  clank(){tone(1180,.14,'square',.045,820);tone(1760,.18,'triangle',.06);noise(.05,.14,5000,null,'highpass');},
  boing(){tone(170,.28,'triangle',.16,520);tone(85,.2,'sine',.15,60);},
  gem(){[1318,1568,2093,2637].forEach((n,i)=>tone(n,.3,'sine',.11,null,i*.055));},
  combo(){[523,659,784,1046,1318].forEach((n,i)=>tone(n,.28,'triangle',.1,null,i*.045));noise(.5,.12,8000,2000,'highpass');},
  finish(){[0,4,7,12,7,12,16,19].forEach((n,i)=>tone(523*Math.pow(2,n/12),i===7?.8:.18,'square',.06,null,i*.09));
    [0,4,7].forEach(n=>tone(262*Math.pow(2,n/12),1.1,'triangle',.1,null,.63));noise(1.2,.12,9000,3000,'highpass',.6);},
  fail(){tone(420,.55,'triangle',.16,140);tone(300,.6,'sawtooth',.05,90,.08);noise(.4,.15,800,150);},
  start(){[523,659,784,1046].forEach((n,i)=>tone(n,.2,'triangle',.11,null,i*.07));}};
/* ---------- background music: bouncy 4-chord loop ---------- */
const BPM=116,STEP=60/BPM/4;let mStep=0,mNext=0;
const CHORDS=[[48,55,60,64],[45,52,57,60],[41,48,53,57],[43,50,55,59]]; // C Am F G (midi)
const mtof=m=>440*Math.pow(2,(m-69)/12);
const MEL=[72,-1,76,79,-1,76,74,72,  69,-1,72,76,-1,74,72,69,  65,-1,69,72,-1,74,72,69,  67,-1,71,74,-1,72,71,67];
function musicTick(){if(!AC||AC.state!=='running')return;const now=AC.currentTime;if(mNext<now-.2)mNext=now+.05;
  while(mNext<now+.15){const st=mStep%64,bar=Math.floor(st/16),s16=st%16,ch=CHORDS[bar],w=mNext-now;
    if(s16%4===0)noise(.12,.5,160,40,'lowpass',w,musBus);                                   // kick
    if(s16===4||s16===12)noise(.14,.28,1800,900,'bandpass',w,musBus,.8);                   // clap
    if(s16%2===1)noise(.035,.12,9000,null,'highpass',w,musBus);                             // hat
    if(s16===0||s16===6||s16===8||s16===14)tone(mtof(ch[0]-12),.22,'triangle',.32,null,w,musBus); // bass
    if(s16%2===0)tone(mtof(ch[1+(s16/2)%3]+12),.12,'square',.035,null,w,musBus);           // arp
    const mi=bar*8+Math.floor(s16/2);if(s16%2===0&&MEL[mi]>0)tone(mtof(MEL[mi]),.24,'sine',.12,null,w,musBus);
    mStep++;mNext+=STEP;}}
const SC=[0,2,4,7,9];const note=i=>{const o=Math.min(3,Math.floor(i/5));return 300*Math.pow(2,(SC[i%5]+12*o)/12);};

/* ---------- food ---------- */
const boxGeo=new THREE.BoxGeometry(1,1,1);
const cylGeo=new THREE.CylinderGeometry(.5,.5,1,28);cylGeo.rotateZ(Math.PI/2); // axis along x; group1 cap faces -x
const L=c=>new THREE.MeshLambertMaterial({color:c});
renderer.localClippingEnabled=true;
// ---- cross-section (inside) textures, like the real game's cut faces ----
const TX=128,C=TX/2;
function circ(g,r,col){g.fillStyle=col;g.beginPath();g.arc(C,C,r,0,Math.PI*2);g.fill();}
function seeds(g,n,rad,col,len=5,wid=2.4){g.fillStyle=col;for(let i=0;i<n;i++){const a=i/n*Math.PI*2;g.save();g.translate(C+Math.cos(a)*rad,C+Math.sin(a)*rad);g.rotate(a);g.beginPath();g.ellipse(0,0,len,wid,0,0,Math.PI*2);g.fill();g.restore();}}
function segs(g,n,r,line){g.strokeStyle=line;g.lineWidth=3;for(let i=0;i<n;i++){const a=i/n*Math.PI*2;g.beginPath();g.moveTo(C,C);g.lineTo(C+Math.cos(a)*r,C+Math.sin(a)*r);g.stroke();}}
const INSIDE={
  melon:g=>{circ(g,64,'#2f9e44');circ(g,58,'#d8f5a2');circ(g,53,'#ff4d6d');seeds(g,10,30,'#222',5,2.6);seeds(g,6,14,'#222',4,2.2);},
