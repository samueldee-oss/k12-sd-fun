<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sensory Overload</title><style>[hidden]{display:none!important}</style></head><body>
<title>Sensory Overload</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DM+Mono:wght@400;500&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Layout: calm paper stage that fills up with clutter; shop below on phones, right rail on desktop. Single committed light look. */
:root{
  --paper:#ecebe6;
  --paper2:#f6f5f1;
  --ink:#1b1b1f;
  --muted:#6d6b74;
  --line:#d4d2ca;
  --btn:#e8432c;
  --btnDeep:#a52412;
  --good:#1f9e6a;
  --pop:#ffd23f;
  --blue:#2c6be8;
  --violet:#b04ce0;
  --card:#fff;
  --cardA:rgba(255,255,255,.92);
  --chrome:#1b1b1f;
  --display:'Dela Gothic One','Arial Black',Impact,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
/* screen modes (bought in the shop) */
:root[data-mode="dark"],:root[data-mode="terminal"]{--paper:#16151a;--paper2:#1e1d23;--ink:#efede6;--muted:#9a97a3;--line:#34323c;--card:#24232a;--cardA:rgba(36,35,42,.92);--chrome:#0a0a0c;color-scheme:dark}
:root[data-mode="vapor"]{--paper:#2a1240;--paper2:#341650;--ink:#ffe9fb;--muted:#d99ce8;--line:#5b2a7d;--card:#3e1b5c;--cardA:rgba(62,27,92,.92);--chrome:#12051f;--btn:#ff4fb8;--btnDeep:#a3226f;--pop:#5ff2ff;color-scheme:dark}
:root[data-mode="terminal"]{--display:'DM Mono',ui-monospace,Menlo,monospace;--body:'DM Mono',ui-monospace,Menlo,monospace}
#app{position:relative}
:root[data-mode="inverted"] #app{filter:invert(1)}
:root[data-mode="terminal"] #app{filter:grayscale(1) sepia(1) hue-rotate(65deg) saturate(5)}
:root[data-mode="terminal"] #app::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:30;background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.28) 2px 3px)}
:root[data-mode="sepia"] #app{filter:sepia(.85) contrast(.95)}
:root[data-mode="gray"] #app{filter:grayscale(1)}
:root[data-mode="fried"] #app{filter:saturate(3.5) contrast(1.7) hue-rotate(-12deg)}
:root[data-mode="upside"] #stage{transform:rotate(180deg)}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--paper);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}

#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) minmax(0,40%)}
@media (min-width:820px){
  #app{grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto minmax(0,1fr)}
  header{grid-column:1/3}
  #shop{border-top:0;border-left:1px solid var(--line)}
}

header{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--paper2);z-index:5}
.brand{font-family:var(--display);font-size:15px;letter-spacing:.01em;margin-right:auto}
.chip{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
#oc{font-family:var(--mono);font-size:11px;background:var(--chrome);color:var(--pop);padding:3px 7px;border-radius:4px;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.ghost{border:1px solid var(--line);background:transparent;border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer}
.ghost:focus-visible,.buy:focus-visible,#btn:focus-visible,#btn2:focus-visible,#slots button:focus-visible,#stocks button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

#stage{position:relative;overflow:hidden;background:var(--paper)}
#stage.rainbow{animation:hue 24s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
#fx{position:absolute;inset:0;pointer-events:none}
#fx > *{pointer-events:auto}

.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;pointer-events:none;z-index:3}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
#score{font-family:var(--display);font-size:clamp(34px,9vw,58px);line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 var(--paper)}
#score.oc{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
#rate{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
#streak{font-family:var(--display);font-size:14px;color:var(--btn);min-height:18px}
.btns{display:flex;align-items:center;gap:18px;margin-top:10px;pointer-events:auto}
#btn,#btn2{border:0;border-radius:50%;background:var(--btn);color:#fff;font-family:var(--display);cursor:pointer;box-shadow:0 10px 0 var(--btnDeep),0 16px 24px rgba(0,0,0,.18);transition:transform .06s,box-shadow .06s;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#btn{width:clamp(120px,32vw,168px);height:clamp(120px,32vw,168px);font-size:clamp(14px,3.6vw,18px)}
#btn2{width:90px;height:90px;font-size:12px;background:var(--blue);box-shadow:0 8px 0 #163f9a,0 12px 18px rgba(0,0,0,.18)}
#btn.down,#btn2.down{transform:translateY(8px);box-shadow:0 2px 0 var(--btnDeep),0 4px 8px rgba(0,0,0,.2)}
#btn2.down{box-shadow:0 2px 0 #163f9a}
#auto{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted)}

/* shop */
#shop{display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--line);background:var(--paper2)}
.shophead{display:flex;justify-content:space-between;align-items:baseline;padding-block:12px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shophead h2{font-family:var(--display);font-weight:400;font-size:16px;margin:0}
#list{overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:8px;padding-block:4px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tier{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding-top:4px}
.buy{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;cursor:pointer;transition:transform .08s}
.buy:active{transform:scale(.985)}
.buy .n{font-weight:700;font-size:14px}
.buy .d{grid-column:1;font-size:12.5px;color:var(--muted);line-height:1.4}
.buy .c{grid-row:1/3;grid-column:2;align-self:center;font-family:var(--mono);font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;padding:5px 8px;border-radius:6px;background:var(--paper)}
.buy.ok .c{background:var(--chrome);color:var(--pop)}
.modes{display:flex;flex-wrap:wrap;gap:6px}
.mchip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer}
.mchip[aria-pressed="true"]{background:var(--chrome);color:var(--pop);border-color:var(--chrome)}
.mchip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.buy[disabled]{cursor:default;opacity:.55}
.buy.locked{border-style:dashed;background:transparent}
.buy.final{border-color:var(--good)}
.buy.final.ok .c{background:var(--good);color:#fff}
.buy.rep{border-color:#c9c6ec}
.reset{align-self:flex-start;margin-top:6px}

/* radio */
#radio{display:flex;align-items:center;gap:10px;background:var(--chrome);color:#fff;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#rPlay{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--pop);color:#1b1b1f;font-size:13px;cursor:pointer;display:grid;place-items:center}
#rPlay:focus-visible,#rTrack:focus-visible,#rVol:focus-visible{outline:2px solid var(--pop);outline-offset:2px}
.rinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rl{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:#9a98a6}
#rTrack{width:100%;min-width:0;background:transparent;color:var(--pop);border:0;font-family:var(--mono);font-size:13px;font-weight:500;padding:0;cursor:pointer;text-overflow:ellipsis}
#rTrack option{color:#1b1b1f;background:#fff}
.eq{flex:none;display:flex;align-items:flex-end;gap:2px;height:16px}
.eq i{width:3px;height:16px;background:var(--pop);transform-origin:bottom;transform:scaleY(.25)}
#radio.playing .eq i{animation:eq .5s ease-in-out infinite alternate}
#radio.playing .eq i:nth-child(2){animation-delay:-.2s;animation-duration:.42s}
#radio.playing .eq i:nth-child(3){animation-delay:-.35s;animation-duration:.6s}
@keyframes eq{to{transform:scaleY(1)}}
#rVol{flex:none;width:72px;accent-color:var(--pop)}

/* effects */
.conf{position:absolute;width:8px;height:12px;border-radius:2px;pointer-events:none;animation:fly .9s cubic-bezier(.2,.6,.4,1) forwards;z-index:4}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.plus{position:absolute;font-family:var(--display);font-size:16px;pointer-events:none;animation:rise 1s ease-out forwards;z-index:7;white-space:nowrap;text-shadow:0 1px 0 var(--paper)}
@keyframes rise{to{transform:translateY(-46px);opacity:0}}

.tv{position:absolute;left:0;top:0;width:96px;height:44px;border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-size:13px;color:#fff;letter-spacing:.02em;z-index:1;pointer-events:none!important}

#notes{position:absolute;top:10px;right:max(10px,env(safe-area-inset-right,0px));width:min(250px,64%);display:flex;flex-direction:column;gap:6px;z-index:5}
.note{background:var(--cardA);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12.5px;line-height:1.35;box-shadow:0 6px 16px rgba(0,0,0,.12);cursor:pointer;animation:slide .25s ease-out}
.note b{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:2px}
@keyframes slide{from{transform:translateX(30px);opacity:0}}

.lava{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none!important;filter:blur(28px);opacity:.55}
.lava i{position:absolute;border-radius:50%;animation:blob 14s ease-in-out infinite alternate}
@keyframes blob{50%{transform:translate(40px,-80px) scale(1.3)}100%{transform:translate(-30px,60px) scale(.9)}}

#bars{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:7px;width:min(120px,26%);z-index:2;pointer-events:none!important}
.bar{height:10px;border-radius:5px;background:rgba(27,27,31,.1);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:5px}

#ticker{position:absolute;left:0;right:0;bottom:0;height:26px;background:var(--chrome);color:var(--pop);overflow:hidden;z-index:4;pointer-events:none!important}
#ticker div{position:absolute;white-space:nowrap;font-family:var(--mono);font-size:12px;line-height:26px;animation:crawl 40s linear infinite}
@keyframes crawl{from{transform:translateX(0)}to{transform:translateX(-50%)}}

#spinner{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:40px;width:74px;height:74px;cursor:pointer;z-index:4}
#chart{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:10px;width:150px;height:64px;background:var(--cardA);border:1px solid var(--line);border-radius:8px;z-index:2;pointer-events:none!important}
.box{position:absolute;width:52px;height:52px;cursor:pointer;z-index:5;animation:wob 1.2s ease-in-out infinite}
@keyframes wob{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
#runner{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:36px;width:150px;height:92px;border-radius:8px;border:2px solid var(--ink);z-index:2;pointer-events:none!important}
.toast{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);background:var(--chrome);color:#fff;border-radius:10px;padding:8px 12px;font-size:12.5px;display:flex;gap:8px;align-items:center;white-space:nowrap;z-index:6;animation:up .3s ease-out;pointer-events:none!important}
.toast em{font-style:normal;color:var(--pop);font-family:var(--mono);font-size:11px}
@keyframes up{from{transform:translate(-50%,20px);opacity:0}}
.woo{position:absolute;font-family:var(--display);font-size:clamp(36px,10vw,64px);color:var(--btn);-webkit-text-stroke:2px #fff;z-index:6;pointer-events:none!important;animation:woo 1.6s ease-out forwards}
@keyframes woo{0%{transform:scale(.3) rotate(-8deg);opacity:0}20%{transform:scale(1.1) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(-2deg) translateY(-30px);opacity:0}}

.drop{position:absolute;top:-40px;font-size:24px;pointer-events:none!important;z-index:1;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(calc(100vh + 60px)) rotate(var(--r))}}

#slots{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:124px;display:flex;flex-direction:column;gap:5px;align-items:stretch;background:var(--violet);padding:7px;border-radius:10px;z-index:4;box-shadow:0 6px 0 #7a2ba0}
#slots .reels{display:flex;gap:4px}
#slots .reels span{width:26px;height:30px;background:#fff;border-radius:5px;display:grid;place-items:center;font-family:var(--display);font-size:16px;color:#1b1b1f}
#slots button{border:0;border-radius:6px;background:var(--pop);color:#1b1b1f;font-family:var(--display);font-size:11px;padding:4px;cursor:pointer}
#slots button[disabled]{opacity:.6;cursor:default}

#pet{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;z-index:4;cursor:pointer}
#pet .body{width:52px;height:44px;border-radius:50% 50% 44% 44%;background:#ff8fb1;position:relative;animation:bob 1.4s ease-in-out infinite;transition:background .4s}
#pet .body::before,#pet .body::after{content:"";position:absolute;top:15px;width:7px;height:9px;border-radius:50%;background:#1b1b1f;transition:height .3s}
#pet .body::before{left:14px}#pet .body::after{right:14px}
#pet.hungry .body{background:#b9b4c4;animation-duration:3s}
#pet.hungry .body::before,#pet.hungry .body::after{height:3px;top:19px}
#pet span{font-family:var(--mono);font-size:10px;color:var(--muted);background:var(--cardA);padding:1px 5px;border-radius:4px}
@keyframes bob{50%{transform:translateY(-5px) scaleX(1.05)}}
.heart{position:absolute;color:#ff4d7d;font-size:18px;pointer-events:none!important;animation:rise 1s ease-out forwards;z-index:7}

#rain{position:absolute;inset:-20% 0 0;z-index:0;pointer-events:none!important;background:repeating-linear-gradient(105deg,transparent 0 14px,rgba(44,107,232,.18) 14px 15px);background-size:200px 200px;animation:rain .5s linear infinite}
@keyframes rain{to{background-position:-40px 200px}}
.flash{position:absolute;inset:0;background:#fff;z-index:8;pointer-events:none!important;animation:flash .45s ease-out forwards}
@keyframes flash{0%{opacity:0}10%{opacity:.85}30%{opacity:.1}45%{opacity:.6}100%{opacity:0}}
.bolt{position:absolute;width:46px;height:70px;cursor:pointer;z-index:6;filter:drop-shadow(0 0 8px #ffd23f);animation:wob .5s ease-in-out infinite}

.fish{position:absolute;left:0;width:44px;height:26px;cursor:pointer;z-index:5;animation:swim linear forwards}
@keyframes swim{from{transform:translateX(-60px)}to{transform:translateX(var(--tx))}}

#disco{position:absolute;inset:-60%;z-index:0;pointer-events:none!important;background:repeating-conic-gradient(rgba(255,210,63,.16) 0 6deg,transparent 6deg 20deg,rgba(176,76,224,.12) 20deg 26deg,transparent 26deg 40deg);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#ball{position:absolute;top:0;left:28%;width:2px;height:34px;background:var(--ink);z-index:3;pointer-events:none!important}
#ball::after{content:"";position:absolute;top:30px;left:-17px;width:36px;height:36px;border-radius:50%;background:conic-gradient(#ddd,#888,#fff,#999,#eee,#777,#ddd);box-shadow:inset -6px -6px 10px rgba(0,0,0,.25)}

#stocks{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:84px;width:150px;background:var(--cardA);border:1px solid var(--line);border-radius:8px;z-index:4;padding:5px;display:flex;flex-direction:column;gap:4px}
#stocks canvas{width:138px;height:44px;display:block}
#stocks button{border:0;border-radius:6px;background:var(--good);color:#fff;font-family:var(--mono);font-weight:500;font-size:11px;padding:4px;cursor:pointer;font-variant-numeric:tabular-nums}

/* ending */
#ending{position:fixed;inset:0;z-index:20;background:linear-gradient(#bfe3f5,#e9f6fb 55%,#9fd38a 55%,#6cb25a);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;animation:fade 2.4s ease}
#ending[hidden]{display:none}
#ending.night{background:linear-gradient(#03040c,#141a3a 62%,#9a9ca6 62%,#6f717c)}
@keyframes fade{from{opacity:0}}
#scene{position:absolute;left:0;right:0;bottom:0;width:100%;height:45%}
#ending.night #scene{height:100%;top:0}
.endcard{position:relative;background:rgba(255,255,255,.88);color:#1b1b1f;border-radius:16px;padding:24px;max-width:340px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center}
.endcard h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0}
.endcard p{margin:0;color:#6d6b74;font-size:14px;line-height:1.5}
.endcard .stats .k{color:#6d6b74}
.endcard .bonus{color:var(--good);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stats .v{font-family:var(--mono);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums}
.keep{border:0;border-radius:10px;padding:12px;background:#1b1b1f;color:#fff;font-weight:700;cursor:pointer}
.again{border:1px solid #d4d2ca;border-radius:10px;padding:10px;background:transparent;color:#6d6b74;font-weight:600;cursor:pointer}

@media (prefers-reduced-motion:reduce){
  #stage.rainbow,#disco,#rain{animation:none}
  .lava i,.box,#score.oc,#pet .body,.bolt{animation:none}
  #ticker div{animation-duration:120s}
}
</style>

<div id="app">
  <header>
    <span class="brand">Sensory Overload</span>
    <span id="oc" hidden>×2</span>
    <button class="ghost" id="musicBtn" aria-pressed="true" hidden>Music on</button>
    <span class="chip" id="clock">0:00</span>
    <button class="ghost" id="mute" aria-pressed="false">Sound on</button>
  </header>

  <main id="stage">
    <div id="fx"></div>
    <div class="center">
      <span class="lbl">Stimulation</span>
      <span id="score">0</span>
      <span id="rate">0 per second · 1 per tap</span>
      <span id="streak"></span>
      <div class="btns">
        <button id="btn" aria-label="Stimulate">TAP</button>
        <button id="btn2" aria-label="Second button" hidden>TAP</button>
      </div>
      <span id="auto" hidden>AUTO-TAPPER ON</span>
    </div>
  </main>

  <aside id="shop">
    <div id="radio" hidden>
      <button id="rPlay" type="button" aria-label="Play lofi radio">▶</button>
      <div class="rinfo"><span class="rl">LOFI RADIO</span><select id="rTrack" aria-label="Track"></select></div>
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
      <input id="rVol" type="range" min="0" max="1" step="0.05" aria-label="Music volume">
    </div>
    <div class="shophead"><h2>Upgrades</h2><span class="chip" id="owned">0</span></div>
    <div id="list"></div>
  </aside>
</div>

<div id="ending" hidden>
  <canvas id="scene"></canvas>
  <div class="endcard">
    <h2 id="eTitle">You touched grass</h2>
    <p id="eText"></p>
    <p class="bonus" id="eBonus"></p>
    <div class="stats">
      <div><span class="k">Time</span><span class="v" id="eTime">0:00</span></div>
      <div><span class="k">Taps</span><span class="v" id="eTaps">0</span></div>
      <div><span class="k">Earned</span><span class="v" id="eTotal">0</span></div>
    </div>
    <button class="keep" id="keep">Keep playing</button>
    <button class="again" id="again">Start over from zero</button>
  </div>
</div>

<script>
(() => {
const $=id=>document.getElementById(id);
const stage=$('stage'), fx=$('fx'), scoreEl=$('score'), rateEl=$('rate'), list=$('list');

function fmt(n){
  n=Math.floor(n);
  if(n<1000) return String(n);
  const u=[['Qi',1e18],['Qa',1e15],['T',1e12],['B',1e9],['M',1e6],['k',1e3]];
  for(const [s,v] of u) if(n>=v){ const x=n/v; return (x<10?x.toFixed(2):x<100?x.toFixed(1):Math.floor(x))+s; }
}
const tfmt=s=>{ s=Math.floor(s); const m=Math.floor(s/60), h=Math.floor(m/60); return h?`${h}:${String(m%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`:`${m}:${String(s%60).padStart(2,'0')}`; };

let AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function tone(f1,f2,dur,type,vol,delay){
  const a=ac(); if(!a||S.muted) return;
  const t=a.currentTime+(delay||0), o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol||.15,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.02);
}
function noise(dur,ftype,freq,vol){
  const a=ac(); if(!a||S.muted) return;
  const len=a.sampleRate*dur, buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++){ const env=Math.min(1,i/(len*.12))*Math.pow(1-i/len,1.5); d[i]=(Math.random()*2-1)*env*(.6+.4*Math.sin(i/900)); }
  const s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain();
  f.type=ftype; f.frequency.value=freq; f.Q.value=.6; g.gain.value=vol;
  s.buffer=buf; s.connect(f).connect(g).connect(a.destination); s.start();
}

const KITS=[
 {k:[0,8,10],s:[4,12],h:[0,2,4,6,8,10,12,14]},
 {k:[0,7,10],s:[4,12],h:[0,2,4,6,8,10,12,14,15]},

function mulberry(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
TRACKS.forEach(tr=>{
  const r=mulberry(tr.seed); tr.mel={};
  for(let s=0;s<64;s+=2){
    if(r()<.34){ const ch=tr.chords[s>>4]; tr.mel[s]={n:ch[Math.floor(r()*ch.length)]+12,len:r()<.3?4:2}; }
  }
});
const R={on:false,step:0,next:0,timer:null,bus:null,vol:null,lfo:null,noise:null,crackle:null};
const mtof=m=>440*Math.pow(2,(m-69)/12);
function bus(){
  const a=ac(); if(!a) return null;
  if(!R.bus){
    R.vol=a.createGain(); R.vol.connect(a.destination);
    const lp=a.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2300; lp.Q.value=.4; lp.connect(R.vol);
    R.bus=a.createGain(); R.bus.gain.value=.8; R.bus.connect(lp);
    R.lfo=a.createOscillator(); R.lfo.frequency.value=.45; const lg=a.createGain(); lg.gain.value=7; R.lfo.connect(lg); R.lfo.start(); R.lfoGain=lg;
    const len=a.sampleRate; R.noise=a.createBuffer(1,len,a.sampleRate); const d=R.noise.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    syncVol();
  }
  return a;
}
function syncVol(){ if(R.vol) R.vol.gain.value=S.muted?0:S.vol; }
function keys(m,t,dur,v){
  const a=AC, g=a.createGain();
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.03); g.gain.exponentialRampToValueAtTime(v*.35,t+dur); g.gain.exponentialRampToValueAtTime(.0001,t+dur+.4);
  g.connect(R.bus);
  [['triangle',0],['sine',8]].forEach(([type,det])=>{ const o=a.createOscillator(); o.type=type; o.frequency.value=mtof(m); o.detune.value=det; R.lfoGain.connect(o.detune); o.connect(g); o.start(t); o.stop(t+dur+.45); });
}
function bassN(m,t,dur){
  const a=AC, o=a.createOscillator(), g=a.createGain();
  o.type='sine'; o.frequency.value=mtof(m);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.22,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(R.bus); o.start(t); o.stop(t+dur+.05);
}
function lead(m,t,dur){
  const a=AC, o=a.createOscillator(), g=a.createGain(), f=a.createBiquadFilter();
  o.type='triangle'; o.frequency.value=mtof(m); R.lfoGain.connect(o.detune);
  f.type='lowpass'; f.frequency.value=1500;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.045,t+.04); g.gain.exponentialRampToValueAtTime(.0001,t+dur+.25);
  o.connect(f).connect(g).connect(R.bus); o.start(t); o.stop(t+dur+.3);
}
function kick(t){
  const a=AC, o=a.createOscillator(), g=a.createGain();
  o.frequency.setValueAtTime(110,t); o.frequency.exponentialRampToValueAtTime(40,t+.18);
  g.gain.setValueAtTime(.55,t); g.gain.exponentialRampToValueAtTime(.001,t+.32);
  o.connect(g).connect(R.bus); o.start(t); o.stop(t+.35);
}
function hit(t,ftype,freq,v,dur){
  const a=AC, s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain();
  s.buffer=R.noise; f.type=ftype; f.frequency.value=freq; f.Q.value=.8;
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f).connect(g).connect(R.bus); s.start(t,Math.random()*.5); s.stop(t+dur+.02);
}
function lofiStep(s,t,sp,tr){
  const bar=s>>4, i=s&15, ch=tr.chords[bar%tr.chords.length], kit=KITS[tr.kit];
  if(i===0) ch.forEach((n,j)=>keys(n,t+j*.012,sp*14,.045));
  if(i===8&&tr.kit!==2) ch.slice(1).forEach(n=>keys(n,t,sp*6,.022));
  if(i===0) bassN(ch[0]-24,t,sp*7);
  if(i===10) bassN(ch[0]-24+(tr.kit===1?7:0),t,sp*5);
  if(kit.k.includes(i)) kick(t);
  if(kit.s.includes(i)){ hit(t,'bandpass',1700,.16,.17); hit(t,'lowpass',400,.08,.09); }
  if(kit.h.includes(i)) hit(t,'highpass',7500,i%4===2?.035:.02,.04);
  const m=tr.mel[s]; if(m) lead(m.n,t,sp*m.len);
}
function sched(){
  const a=AC, tr=TRACKS[S.track]||TRACKS[0], sp=60/tr.bpm/4, ahead=document.hidden?1.5:.15;
  while(R.next<a.currentTime+ahead){
    lofiStep(R.step,R.next+(R.step%2?sp*.18:0),sp,tr);
    R.next+=sp; R.step=(R.step+1)%64;
  }
}
function startCrackle(){
  const a=AC, len=a.sampleRate*3, buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*.006+(Math.random()<.0009?(Math.random()*2-1)*.5:0);
  const s=a.createBufferSource(); s.buffer=buf; s.loop=true; s.connect(R.bus); s.start(); R.crackle=s;
}
function rPlay(){
  const a=bus(); if(!a||R.on) return;
  R.on=true; R.step=0; R.next=a.currentTime+.08;
  startCrackle(); R.timer=setInterval(sched,25); sched(); syncRadio();
}
function rStop(){
  if(!R.on) return; R.on=false; clearInterval(R.timer);
  try{ R.crackle.stop(); }catch(e){}
  syncRadio();
}

/* ---------- music: a 4-bar loop (C, Am, F, G) that gains layers as you upgrade ---------- */
const CH=[[48,[60,64,67]],[45,[57,60,64]],[41,[53,57,60]],[43,[55,59,62]]];
const MEL=[
 [0,-1,1,-1,2,-1,1,-1,0,-1,2,-1,3,-1,2,-1],
 [2,-1,1,-1,0,-1,1,-1,2,-1,-1,1,0,-1,-1,-1],
 [0,-1,2,-1,3,-1,2,1,0,-1,1,-1,2,-1,-1,-1],
 [3,-1,2,-1,1,-1,2,-1,3,-1,2,-1,1,-1,0,-1]];
const mus={next:0,step:0,gain:null,nbuf:null};
const mf=m=>440*Math.pow(2,(m-69)/12);
function mnote(m,t,dur,type,vol,f2){
  const a=AC, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(mf(m),t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.006); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(mus.gain); o.start(t); o.stop(t+dur+.02);
}
function mpad(m,t,dur,vol){
  const a=AC, o=a.createOscillator(), g=a.createGain();
  o.type='sine'; o.frequency.value=mf(m);
  g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(vol,t+.5); g.gain.linearRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(mus.gain); o.start(t); o.stop(t+dur+.05);
}
function mhit(t,dur,ftype,freq,vol){
  const a=AC;
  if(!mus.nbuf){ const len=a.sampleRate*.4; mus.nbuf=a.createBuffer(1,len,a.sampleRate); const d=mus.nbuf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; }
  const s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain();
  s.buffer=mus.nbuf; f.type=ftype; f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(mus.gain); s.start(t); s.stop(t+dur+.02);
}
function playStep(s,t){
  const bar=Math.floor(s/16), st=s%16, [root,tri]=CH[bar];
  if([0,3,6,8,11,14].includes(st)) mnote(root-12,t,.16,'square',.05);
  if(st===4||st===12) tri.forEach(n=>mnote(n,t,.22,'triangle',.03));
  const mi=MEL[bar][st];
  if(mi>=0){ const tones=[tri[0]+12,tri[1]+12,tri[2]+12,tri[0]+24]; mnote(tones[mi],t,.2,'square',.028); }
  if(has('beat')){
    if(st%4===0) mnote(43,t,.18,'sine',.32,38);
    if(st===4||st===12) mhit(t,.16,'highpass',1500,.16);
    if(st%2===1) mhit(t,.04,'highpass',7000,.05);
  }
  if(has('synth')){
    mnote([tri[0],tri[1],tri[2],tri[1]][st%4]+24,t,.09,'sawtooth',.012);
    if(st===0) tri.forEach(n=>mpad(n,t,2.1,.03));
  }
}
function musTick(){
  const a=AC; if(!a||a.state!=='running'||!has('music')) return;
  if(!mus.gain){ mus.gain=a.createGain(); mus.gain.gain.value=0; mus.gain.connect(a.destination); mus.next=a.currentTime+.1; }
  const on=S.music&&!S.muted&&!S.scene&&!document.hidden&&!R.on;
  mus.gain.gain.setTargetAtTime(on?.55:0,a.currentTime,.25);
  if(!on){ mus.next=a.currentTime+.1; return; }
  const spb=60/116/4;
  if(mus.next<a.currentTime) mus.next=a.currentTime+.05;
  while(mus.next<a.currentTime+.12){ playStep(mus.step,mus.next); mus.next+=spb; mus.step=(mus.step+1)%64; }
}
setInterval(musTick,25);

function tap(btn,e,auto){
  if(S.scene) return;

  ctx.beginPath(); st.hist.forEach((v,i)=>{ const x=i*(W-8)/49+4, y=H-6-(v/mx)*(H-16); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  const up=st.hist.length<2||st.p>=st.hist[st.hist.length-2];
  ctx.strokeStyle=up?'#1f9e6a':'#e8432c'; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle=COL.ink; ctx.font='500 18px "DM Mono", monospace'; ctx.fillText('$STIM',6,20);
  st.btn.textContent='Sell ×'+st.p.toFixed(1);
}

FX.hyper=()=>{ scoreEl.classList.add('oc'); };

FX.music=()=>{ musicBtn.hidden=false; syncMusic(); ac(); };

function enable(id,l){ if(FX[id]) FX[id](l||1); }

/* ---------- screen modes ---------- */
const COL={ink:'#1b1b1f'};
function applyMode(){
  const m=S.mode&&(S.mode==='normal'||S.modes[S.mode])?S.mode:'normal';
  if(m==='normal') delete document.documentElement.dataset.mode; else document.documentElement.dataset.mode=m;
  COL.ink=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#1b1b1f';
}
function setMode(m){ S.mode=m; applyMode(); dirty=true; save(); }
function buyMode(m){
  if(S.modes[m.id]||S.score<m.cost) return;
  S.score-=m.cost; S.modes[m.id]=1; sfx.buy(); setMode(m.id);
}
applyMode();

/* ---------- shop ---------- */
let dirty=true;
function buy(u){
  if(u==='finger'){ const c=fingerCost(); if(S.score<c) return; S.score-=c; S.finger++; sfx.buy(); dirty=true; save(); return; }
  if(u==='boost'){ const c=boostCost(); if(S.score<c) return; S.score-=c; S.boost++; sfx.buy(); dirty=true; save(); return; }
  const l=lv(u.id), cost=lvCost(u);
  if(l>=(u.stack||1)||S.score<cost) return;
  S.score-=cost; S.owned[u.id]=l+1; sfx.buy(); dirty=true;
  if(u.end){ S.scene=u.end; save(); return showScene(); }
  enable(u.id,l+1); save();
  if(u.id==='radio') rPlay();
}
function renderShop(){
  dirty=false; list.innerHTML='';
  $('owned').textContent=UP.filter(u=>has(u.id)).length+' / '+UP.length;
  const mk=(name,desc,cost,cls,fn)=>{
    const b=document.createElement('button'); b.className='buy'+(cls?' '+cls:''); b.dataset.cost=cost;
    b.innerHTML='<span class="n"></span><span class="d"></span><span class="c"></span>';
    b.querySelector('.n').textContent=name; b.querySelector('.d').textContent=desc; b.querySelector('.c').textContent=fmt(cost);
    if(fn) b.addEventListener('click',fn); list.appendChild(b); return b;
  };
  const next=UP.filter(u=>!has(u.id));
  const tier=next.length?(next[0].tier||0):2;
  const t=document.createElement('div'); t.className='tier'; t.textContent=TIERS[tier]; list.appendChild(t);
  next.slice(0,3).forEach(u=>mk(u.stack?`${u.name} · Lv 1/${u.stack}`:u.name,u.desc,u.cost,u.end?'final':'',()=>buy(u)));
  if(next[3]){ const b=mk('???','Keep going to find out.',next[3].cost,'locked'); b.disabled=true; b.dataset.locked='1'; }
  const ups=UP.filter(u=>u.stack&&has(u.id)&&lv(u.id)<u.stack);
  if(ups.length){
    const h=document.createElement('div'); h.className='tier'; h.textContent='Level up'; list.appendChild(h);
    ups.forEach(u=>mk(`${u.name} · Lv ${lv(u.id)+1}/${u.stack}`,u.lv,lvCost(u),'rep',()=>buy(u)));
  }
  const mh=document.createElement('div'); mh.className='tier'; mh.textContent='Screen modes · +5% each'; list.appendChild(mh);
  const row=document.createElement('div'); row.className='modes';
  [{id:'normal',name:'Normal'},...MODES.filter(m=>S.modes[m.id])].forEach(m=>{
    const c=document.createElement('button'); c.type='button'; c.className='mchip'; c.textContent=m.name;
    c.setAttribute('aria-pressed',String((S.mode||'normal')===m.id)); c.addEventListener('click',()=>setMode(m.id)); row.appendChild(c);
  });
  list.appendChild(row);
  MODES.filter(m=>!S.modes[m.id]).slice(0,2).forEach(m=>mk(m.name,'A new look for the whole screen. Switch any time. Everything earns +5%.',m.cost,'',()=>buyMode(m)));
  if(has('moon')) mk('Cosmic boost · lvl '+S.boost,'Everything earns ×1.5 more. Stacks forever.',boostCost(),'rep',()=>buy('boost'));
  mk('Stronger thumb · lvl '+S.finger,'+1 stimulation per tap. Buy as many as you like.',fingerCost(),'rep',()=>buy('finger'));
  const rs=document.createElement('button'); rs.className='ghost reset'; rs.textContent='Reset progress';
  rs.addEventListener('click',()=>{
    if(rs.dataset.armed){ wipe(); }
    else { rs.dataset.armed='1'; rs.textContent='Tap again to wipe everything'; setTimeout(()=>{ delete rs.dataset.armed; rs.textContent='Reset progress'; },3000); }
  });
  list.appendChild(rs);
  refreshShop();
}
function refreshShop(){
  list.querySelectorAll('.buy').forEach(b=>{
    if(b.dataset.locked) return;
    const ok=S.score>=+b.dataset.cost;
    b.disabled=!ok; b.classList.toggle('ok',ok);
  });
}
function wipe(){
  const muted=S.muted, vol=S.vol, track=S.track;
  rStop();
  S=fresh(); S.muted=muted; S.vol=vol; S.track=track;
  try{localStorage.removeItem('overload.save');}catch(e){}
  fx.innerHTML=''; timers.length=0; FX.tvs.length=0;
  FX.barState=FX.spin=FX.ch=FX.rn=FX.st=FX.petEl=null;
  stage.classList.remove('rainbow'); scoreEl.classList.remove('oc');
  ['btn2','auto','radio','musicBtn'].forEach(id=>{ const el=$(id); if(el) el.hidden=true; });
  $('ending').hidden=true; streak=0;
  applyMode();
  shownScore=shownRate=shownMul=shownStreak=''; $('oc').hidden=true;
  dirty=true; renderShop(); save();
}

/* ---------- scenes (endings you can return from) ---------- */
const SCENES={
  grass:{title:'You touched grass',text:'The screen is quiet. A breeze moves through the field. Nothing is asking for your attention.',bonus:'Fresh air: everything earns ×3 when you go back inside. A new set of upgrades is waiting.',keep:'Go back inside'},
  moon:{title:'You touched the moon',text:'It is cold and completely silent up here. Earth looks like a small, glowing screen.',bonus:'Moon dust: everything earns ×10 when you return, and Cosmic boost unlocks. It stacks forever.',keep:'Fly back home'},
};
function showScene(){
  const k=S.scene, sc=SCENES[k]; if(!sc) { S.scene=null; return; }
  $('eTitle').textContent=sc.title; $('eText').textContent=sc.text; $('eBonus').textContent=sc.bonus; $('keep').textContent=sc.keep;
  $('eTime').textContent=tfmt(S.time); $('eTaps').textContent=fmt(S.taps); $('eTotal').textContent=fmt(S.total);
  const end=$('ending'); end.classList.toggle('night',k==='moon'); end.hidden=false;
  drawScene(k);
}
let sceneRun=0;
function drawScene(kind){
  const id=++sceneRun, c=$('scene'), ctx=c.getContext('2d'), d=Math.min(devicePixelRatio||1,2);
  let items=[];
  function size(){
    c.width=c.clientWidth*d; c.height=c.clientHeight*d; items=[];
    const W=c.clientWidth, H=c.clientHeight;
    if(kind==='grass'){ const n=Math.floor(W/5); for(let i=0;i<n;i++) items.push({x:i*5+rnd(-2,2),h:rnd(.35,.9),p:rnd(0,6),c:pick(['#4f9a44','#5fae4f','#3f8a3a','#72bd5f'])}); }
    else { for(let i=0;i<160;i++) items.push({x:rnd(0,W),y:rnd(0,H*.6),r:rnd(.5,1.6),p:rnd(0,6)}); }
  }
  size(); const onR=()=>{ if(id===sceneRun) size(); }; addEventListener('resize',onR);
  (function draw(t){
    if($('ending').hidden||id!==sceneRun){ removeEventListener('resize',onR); return; }
    const W=c.clientWidth, H=c.clientHeight;
    ctx.setTransform(d,0,0,d,0,0); ctx.clearRect(0,0,W,H);
    if(kind==='grass'){
      for(const b of items){
        const sway=RM?0:Math.sin(t/1400+b.p+b.x/120)*10*b.h;
        ctx.strokeStyle=b.c; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(b.x,H); ctx.quadraticCurveTo(b.x,H-b.h*H*.5,b.x+sway,H-b.h*H); ctx.stroke();
      }
    } else {
      for(const s of items){ ctx.globalAlpha=RM?.8:.45+.45*Math.sin(t/700+s.p); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill(); }
      ctx.globalAlpha=1;
      const ex=W*.78, ey=H*.16;
      ctx.fillStyle='#2c6be8'; ctx.beginPath(); ctx.arc(ex,ey,22,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#1f9e6a'; ctx.beginPath(); ctx.ellipse(ex-6,ey-4,9,6,.4,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(ex+8,ey+8,6,4,-.3,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(0,0,0,.18)';
      [[.15,.75,40],[.4,.86,26],[.7,.8,52],[.9,.93,30]].forEach(([x,y,r])=>{ ctx.beginPath(); ctx.ellipse(W*x,H*y,r,r*.3,0,0,Math.PI*2); ctx.fill(); });
    }
    requestAnimationFrame(draw);
  })(0);
}
$('keep').addEventListener('click',()=>{
  S.scene=null; $('ending').hidden=true; dirty=true; save(); last=performance.now();
});
$('again').addEventListener('click',wipe);

/* ---------- boot & loop ---------- */
UP.forEach(u=>{ if(!u.end) for(let l=1;l<=lv(u.id);l++) enable(u.id,l); });
if(S.scene) showScene();

let last=performance.now(), saveT=0, uiT=0, shownScore='', shownRate='', shownMul='', shownStreak='';
function frame(now){
  const dt=Math.min((now-last)/1000,.1); last=now;
  if(!S.scene){
    S.time+=dt;
    const c=cps(); if(c){ S.score+=c*dt; S.total+=c*dt; }
    if(now-lastTap>650) streak=0;
    tickTv(dt); tickBars(dt); tickSpin(dt); tickChart(dt); tickRunner(dt); tickStocks(dt);
    for(const t of timers){ t.t-=dt; if(t.t<=0){ t.t=rnd(t.min,t.max); t.fn(); } }
    const s=fmt(S.score); if(s!==shownScore){ shownScore=s; scoreEl.textContent=s; }
    const r=fmt(c)+' per second · '+fmt(tapVal())+' per tap'; if(r!==shownRate){ shownRate=r; rateEl.textContent=r; }
    const sm=streakMul(), st=sm>1.04?'STREAK ×'+sm.toFixed(1):''; if(st!==shownStreak){ shownStreak=st; $('streak').textContent=st; }
    uiT+=dt;
    if(uiT>.25){
      uiT=0; if(dirty) renderShop(); else refreshShop();
      $('clock').textContent=tfmt(S.time); syncPet();
      const m=allMul(), mt=m>1?'×'+(m<100?(Math.round(m*100)/100):fmt(m))+' BOOST':'';
      if(mt!==shownMul){ shownMul=mt; $('oc').textContent=mt; $('oc').hidden=!mt; }
    }
    saveT+=dt; if(saveT>3){ saveT=0; save(); }
  }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(); last=performance.now(); });
renderShop();
requestAnimationFrame(frame);
})();
</script>
