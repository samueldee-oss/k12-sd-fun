<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
:root{--ink:#3b3350;--card:#fffdf7;--accent:#ff8a5c;--green:#5cc96b;--line:#e9dfcf}
html,body{margin:0;height:100%;font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);background:#2b2540;overflow:hidden}
#app{max-width:520px;margin:0 auto;height:100%;position:relative;overflow:hidden;background:#8fd3ff}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.tag{position:absolute;transform:translate(-50%,-100%);text-align:center;pointer-events:auto;cursor:pointer;white-space:nowrap}
.tag .n{font-size:11px;font-weight:600;background:rgba(255,255,255,.88);border-radius:8px;padding:1px 6px;display:inline-block}
.tag .b{font-size:20px;background:#fff;border-radius:14px;padding:1px 6px;box-shadow:0 2px 0 rgba(0,0,0,.18);display:inline-block;animation:bob 1s infinite alternate;margin-bottom:2px}
.tag .c{font-size:18px;background:#fff;border-radius:12px;padding:0 6px;display:inline-block;margin-bottom:2px}
@keyframes bob{to{transform:translateY(-4px)}}
header{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(255,255,255,.82);backdrop-filter:blur(6px);border-bottom:3px solid var(--line);z-index:5}
header h1{font-size:18px;margin:0;font-weight:700}
.pill{background:#fff;border:2px solid var(--line);border-radius:20px;padding:3px 9px;font-weight:600;font-size:12.5px}
#main{position:absolute;top:56px;bottom:64px;left:0;right:0;overflow-y:auto;padding:12px;z-index:3}
#main.pass{pointer-events:none}
#main.panel{background:rgba(255,248,235,.95)}
.hint{pointer-events:none;text-align:center}
.hint span{display:inline-block;background:rgba(255,255,255,.88);border-radius:14px;padding:5px 12px;font-size:13px;font-weight:500}
nav{position:absolute;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:3px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;font-family:inherit;font-size:11px;font-weight:600;color:#8a8198;padding:7px 0 9px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
nav button span{font-size:21px}
nav button.on{color:var(--accent)}
.card{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:17px}
.btn{font-family:inherit;font-weight:600;font-size:15px;border:0;border-radius:14px;padding:10px 12px;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.g{background:var(--green)}.btn.b{background:#5b9cf2}.btn.p{background:#d77be0}.btn.gr{background:#b9b0c4}.btn.y{background:#f2b33d}.btn.r{background:#e25a6e}.btn.k{background:#3b3350}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;cursor:pointer;font-size:13px;font-weight:500}
.item .e{font-size:30px;display:block}
.item small{color:#8a8198}
.item:active{transform:scale(.95)}
.place{background:#fff;border:3px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;text-align:center;font-weight:600}
.place .e{font-size:36px;display:block}
.place small{display:block;color:#8a8198;font-weight:500;font-size:12px}
.overlay{position:absolute;inset:0;background:rgba(40,30,60,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-height:94%;overflow-y:auto;border-radius:22px 22px 0 0;padding:14px;padding-bottom:28px;animation:up .25s ease-out}
.sheet.full{max-height:100%;height:100%;border-radius:0;padding:0;display:flex;flex-direction:column;overflow:hidden}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.sheet h2{margin:0 0 4px;text-align:center}
.bar{height:11px;background:#eee4d4;border-radius:8px;overflow:hidden;margin:2px 0 7px}
.bar>div{height:100%;border-radius:8px}
.lbl{font-size:13px;font-weight:600;display:flex;justify-content:space-between}
.problem{background:#fff3d6;border:3px dashed #f2b33d;border-radius:14px;padding:10px;margin:8px 0;text-align:center;font-weight:600}
.say{background:#fff;border:3px solid var(--line);border-radius:16px;padding:8px 12px;text-align:center;font-weight:500;margin:6px auto;max-width:94%;min-height:40px}
.pv{height:230px;border-radius:16px;overflow:hidden;position:relative;touch-action:none;margin:0 auto 6px}
.pv canvas{width:100%!important;height:100%!important;display:block}
.toast{position:absolute;top:64px;left:50%;transform:translateX(-50%);background:#3b3350;color:#fff;padding:8px 14px;border-radius:14px;font-weight:500;font-size:14px;z-index:40;max-width:88%;text-align:center}
.sw{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 10px;align-items:center}
.sw div,.sw label{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer;position:relative;overflow:hidden}
.sw div.on{box-shadow:0 0 0 3px var(--accent)}
.sw label{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
.sw label input{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.opt{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.opt button{font-family:inherit;border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 9px;font-weight:600;font-size:13px;color:var(--ink);cursor:pointer}
.opt button.on{border-color:var(--accent);background:#ffe9df}
input[type=text],textarea{font-family:inherit;font-size:16px;padding:8px 10px;border:2px solid var(--line);border-radius:10px;width:100%;margin:4px 0 8px;color:var(--ink);background:#fff;user-select:text;-webkit-user-select:text}
input[type=range]{width:100%;margin:2px 0 10px;accent-color:var(--accent)}
select{font-family:inherit;font-size:15px;padding:6px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.sec{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:#9b8fae;margin-top:4px;display:flex;justify-content:space-between;gap:6px}
.sub{font-weight:700;font-size:14px;margin:10px 0 2px;color:var(--accent)}
.news{font-size:14px;padding:7px 0;border-bottom:1px dashed var(--line)}
.news .tm{color:#a49bb3;font-size:11px;margin-right:4px}
.rel{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}
.rel img{width:38px;height:44px}
.rel .st{margin-left:auto;font-weight:600;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.row .btn{flex:1;min-width:84px}
.center{text-align:center}.muted{color:#8a8198;font-size:13px}
.heart{position:absolute;font-size:24px;pointer-events:none;animation:floatup 1.2s forwards;z-index:30}
@keyframes floatup{to{transform:translateY(-80px);opacity:0}}
.rps{font-size:44px;background:#fff;border:3px solid var(--line);border-radius:16px;padding:6px 14px;cursor:pointer}
.palcard{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--line);border-radius:16px;padding:6px 10px;margin-bottom:8px;cursor:pointer}
.palcard img{width:62px;height:72px;border-radius:12px}
.palcard .i{flex:1}.palcard b{font-size:16px}
.palcard .ic{font-size:24px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}
.chip{flex-shrink:0;text-align:center;border:3px solid var(--line);border-radius:14px;background:#fff;padding:2px 4px;font-size:11px;font-weight:600;cursor:pointer;width:64px}
.chip img{width:52px;height:60px;display:block;margin:0 auto}
.chip.on{border-color:var(--accent);background:#ffe9df}
.etabs{display:flex;overflow-x:auto;gap:4px;padding:6px 8px;background:#fff;border-bottom:3px solid var(--line);flex-shrink:0;scrollbar-width:none}
.etabs button{font-family:inherit;border:0;background:#f3ece0;border-radius:12px;padding:6px 10px;font-weight:600;font-size:13px;color:var(--ink);white-space:nowrap;cursor:pointer}
.etabs button.on{background:var(--accent);color:#fff}
.epanel{flex:1;overflow-y:auto;padding:10px 14px 20px}
.ebar{display:flex;gap:6px;padding:8px 10px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:#fff;border-top:3px solid var(--line);flex-shrink:0}
.ebar .btn{flex:1;padding:10px 4px;font-size:14px}
.ehead{position:relative;flex-shrink:0}
.ehead .pv{height:250px;border-radius:0;margin:0}
.etools{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.etools button,.exprs button{font-family:inherit;border:0;background:rgba(255,255,255,.9);border-radius:12px;padding:5px 8px;font-size:16px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.exprs{position:absolute;left:8px;bottom:8px;display:flex;gap:4px;flex-wrap:wrap;right:56px}
.ename{position:absolute;left:10px;top:8px;font-weight:700;font-size:17px;background:rgba(255,255,255,.88);padding:2px 10px;border-radius:12px}
.etype{position:absolute;left:10px;top:38px;font-weight:600;font-size:12px;background:rgba(255,255,255,.88);padding:1px 8px;border-radius:10px}
.lyrics{background:#2a2238;color:#fff;border-radius:14px;padding:10px;font-size:16px;line-height:1.6;min-height:110px;text-align:center}
.lyrics .w{opacity:.45;transition:all .1s}
.lyrics .w.on{opacity:1;color:#ffe36b;font-weight:700}
.lyrics .w.done{opacity:1}
.meter{height:26px;background:#eee4d4;border-radius:14px;overflow:hidden;margin:8px 0}
.meter div{height:100%;background:linear-gradient(90deg,#ff8fa3,#ff4f7b);border-radius:14px;width:0;transition:width .05s}
.bigpct{font-size:44px;font-weight:700;text-align:center;color:#ff4f7b}
.ptype{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px;text-align:center;margin:4px 0 10px}
.ptype b{font-size:17px}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;color:#fff;background:#6fb8e6;z-index:50;text-align:center;padding:20px}

function problemText(r){const p=r.problem,t=p.target&&byId(p.target),tn=t?esc(t.name):'';
  return {hungry:`I'm so hungry! Can I have something to eat? 🍽️`,hat:`I want something new to wear! 👗`,outfit:`I want something new to wear! 👗`,wear:`I want something new to wear! A hat, outfit or accessory! 👗`,

  crush:`Um... I think I have a crush on ${tn}. Should I tell them? 💗`,propose:`I love ${tn} so much... I want to propose! 💍`,
  play:`I'm bored! Play Rock-Paper-Scissors with me! 🎮`,sad:`I'm feeling a little gloomy today... 💧`,levelup:`I leveled up! ⭐ Pick a present for me!`,
  birthday:`It's my BIRTHDAY today!! 🎂 Did you get me something?`,room:`My room feels boring... I want to redecorate! 🛋️`,song:`I've got a song in my heart! Can I sing at the Concert Hall? 🎤`,sick:`Achoo! I think I caught a cold... 🤧 Some hot food would help.`}[p.type]}
function spawnProblem(r){
  const others=S.residents.filter(o=>o!==r),opts=[];
  if(r.hunger>55)opts.push(['hungry',6]);
  opts.push(['wear',3],['play',3],['sad',1.5],['room',1.5],['song',2],['sick',.6]);
  const strangers=others.filter(o=>['none','acq'].includes(rel(r,o).st));if(strangers.length)opts.push(['friend',3]);
  const pal=partner(r);const crushT=others.filter(o=>['friend','best'].includes(rel(r,o).st)&&rel(r,o).s>=55&&!partner(o));
  if(!pal&&crushT.length)opts.push(['crush',2]);
  if(pal&&rel(r,pal).st==='sweet'&&rel(r,pal).s>=85)opts.push(['propose',2]);
  const fr=others.filter(o=>['friend','best','sweet','married'].includes(rel(r,o).st)&&!rel(r,o).fight);if(fr.length)opts.push(['fight',1]);
  let x=Math.random()*opts.reduce((a,o)=>a+o[1],0),type='play';for(const[o,w]of opts){x-=w;if(x<=0){type=o;break}}
  const p={type};
  if(type==='friend')p.target=rnd(strangers).id;
  if(type==='crush')p.target=rnd(crushT).id;
  if(type==='propose')p.target=pal.id;
  if(type==='fight'){const o=rnd(fr);p.target=o.id;rel(r,o).fight=true;bump(r,o,-15);news(`<b>${esc(r.name)}</b> and <b>${esc(o.name)}</b> had a fight! 💢`)}
  r.problem=p}
let tickN=0;
function tick(){
  S.time+=1;
  if(S.time%1440===0){S.day++;news(`☀️ It's ${dateStr()} on Pal Island!`)}
  if(S.time%1440===7*60){const t=today();S.residents.forEach(r=>{if(r.bm===t.m&&r.bd===t.d){r.problem={type:'birthday'};news(`🎂 Happy birthday, <b>${esc(r.name)}</b>! Throw them a little celebration!`)}})}
  if(S.time%1440===22*60)news('🌙 Everyone heads home to bed. Sweet dreams!');
  const sl=asleep();
  S.residents.forEach(r=>{r.hunger=clamp(r.hunger+(sl?.03:.07),0,100);if(r.hunger>75)r.mood=clamp(r.mood-.04,0,100);
    if(!sl&&!r.problem&&S.time>=r.nextProb)spawnProblem(r);if(!sl&&!r.problem&&r.hunger>70)r.problem={type:'hungry'};
    const w=world.get(r.id);if(w&&w.P&&!(w.P.blinkT>0))setExpr(w.P,w.chat>0?'joy':exprOf(r))});
  tickN++;if(!sl&&tickN%18===0&&S.residents.length>1)randomMeet();
  if(tickN%5===0)save();
  syncWorld();renderTop();if(view==='pals'&&!ov)renderPals()}

  if(R2.st!=='none'){news(`<b>${esc(a.name)}</b> and <b>${esc(b.name)}</b> chatted about ${rnd(CHATS)}. ${n>0?'😊':'😐'}`);e=n>0?rnd(['💬','😂','🎵','💕','✨']):'😐'}
  else if(n>0){news(`<b>${esc(a.name)}</b> waved at <b>${esc(b.name)}</b> in the plaza. 👋`);e='👋'}

function playSong(singers,genre,lines,onWord,onBeat,onDone){
  const A=ac();if(!A){onDone();return()=>{}}
  const G=GENRES[genre],beat=60/G.t,master=A.createGain();master.gain.value=.9;master.connect(A.destination);
  if(!NOISE){NOISE=A.createBuffer(1,A.sampleRate*.3,A.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}

  const drum=(t,k)=>{if(k==='kick'){const o=A.createOscillator(),g=A.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g);g.connect(master);o.start(t);o.stop(t+.2)}
    else{const s=A.createBufferSource(),f=A.createBiquadFilter(),g=A.createGain();s.buffer=NOISE;f.type=k==='hat'?'highpass':'bandpass';f.frequency.value=k==='hat'?7000:1800;g.gain.setValueAtTime(k==='hat'?.06:.16,t);g.gain.exponentialRampToValueAtTime(.001,t+(k==='hat'?.05:.15));s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+.2)}};
  const at=(t,fn)=>timers.push(setTimeout(fn,Math.max(0,(t-A.currentTime)*1000)));
  const prog=[0,7,9,5],intro=4,totalBeats=intro+lines.length*8+4;

    if(b%4===0&&b<totalBeats-2){note(t,110*Math.pow(2,root/12),beat*3.8,'triangle',.12);if(genre!=='Rap')[0,4,7].forEach(s=>note(t,220*Math.pow(2,(root+s)/12),beat*3.8,genre==='Lullaby'?'sine':'triangle',.025))}

    if(b%2===0)at(t,onBeat)}
  lines.forEach((line,li)=>{const words=line.split(/\s+/).filter(Boolean).slice(0,14);const n=Math.max(1,words.length),span=7*beat,dur=span/n;let deg=Math.floor(rng()*3);
    const si=singers.length>1?(li===lines.length-1?-1:li%2):-1;
    words.forEach((w,wi)=>{const t=T0+(intro+li*8)*beat+wi*dur;deg=clamp(deg+Math.round((rng()-.5)*(genre==='Rap'?1.2:3.5)),0,G.sc.length-1);if(wi===n-1&&li%2===1)deg=0;
      const who=si===-1?singers:[singers[si]];who.forEach((s,k)=>{const base=220*(s.pitch||1)*(genre==='Opera'?1.25:1);const f=base*Math.pow(2,G.sc[deg]/12)*(k===1?1.0:1);
        const syl=Math.max(1,Math.min(3,Math.round(w.replace(/[^a-z]/gi,'').length/3)));for(let q=0;q<syl;q++)note(t+q*dur/syl,f*(q?1.0+(rng()-.5)*.06:1),dur/syl*.92,G.w==='sawtooth'?'square':G.w,G.w==='sine'?.13:.06,G.vib)});
      at(t,()=>onWord(li,wi,si))})});
  at(T0+totalBeats*beat,onDone);
  return()=>{timers.forEach(clearTimeout);try{master.gain.cancelScheduledValues(A.currentTime);master.gain.setValueAtTime(0,A.currentTime);setTimeout(()=>master.disconnect(),100)}catch(e){}}}

// ---------- COMPATIBILITY BOOTH ----------
function booth(){let sel=[];
  const draw=()=>{const el=sheet(`<h2>💞 Compatibility Booth</h2><p class="center muted" style="margin:0 0 6px">Pick two pals to see how well they'd get along!</p>${palChips(sel,2)}
    <div class="row" style="margin-top:6px"><button class="btn gr" id="cl">Close</button><button class="btn p" id="go">💞 Test!</button></div>`);
    el.querySelectorAll('[data-pid]').forEach(c=>c.onclick=()=>{const id=+c.dataset.pid;if(sel.includes(id))sel=sel.filter(x=>x!==id);else{sel.push(id);if(sel.length>2)sel.shift()}beep(700);draw()});
    el.querySelector('#cl').onclick=()=>closeSheet();el.querySelector('#go').onclick=()=>{if(sel.length<2)return toast('Pick two pals!');result(...sel.map(byId))}};
  const result=(a,b)=>{const R2=rel(a,b);const base=hashStr(key(a,b)+'💞')%30;const pct=clamp(Math.round(compat(a,b)*55+base+(R2.st==='married'?15:R2.st==='sweet'?10:R2.st==='best'?8:0)),3,100);
    const msg=pct>=90?'A match made in the stars! ✨💞':pct>=75?'Super compatible! 💕':pct>=55?'Pretty good pals! 🙂':pct>=35?'They could work on it... 🤔':'Like cats and cucumbers! 😹';
    const el=sheet(`<h2>💞 ${esc(a.name)} & ${esc(b.name)}</h2><div class="pv" id="pv"></div><div class="bigpct" id="pct">0%</div><div class="meter"><div id="mt"></div></div><div class="say" id="msg">Calculating... 🔮</div>
      <div class="center muted">${persOf(a).emo} ${persOf(a).name} × ${persOf(b).emo} ${persOf(b).name}</div><div class="row" style="margin-top:10px"><button class="btn gr" id="ag">Test another pair</button></div>`);
    showPortrait(el.querySelector('#pv'),[a,b],'meh',{room:'candy',auto:false});
    let v=0;const iv=setInterval(()=>{v=Math.min(pct,v+2);const p=document.getElementById('pct');if(!p){clearInterval(iv);return}p.textContent=v+'%';document.getElementById('mt').style.width=v+'%';if(v%6===0)beep(400+v*6,.05,'triangle');
      if(v>=pct){clearInterval(iv);document.getElementById('msg').textContent=msg;const ex=pct>=55?'love':pct>=35?'happy':'mad';port.Ps.forEach(P=>setExpr(P,ex));hopPortrait();if(pct>=75){hearts('💕',8);jingle()}else if(pct<35)sadsnd()}},40);
    el.querySelector('#ag').onclick=()=>{sel=[];draw()}};
  draw()}

const ETABS=[['face','😊 Face'],['hair','💇 Hair'],['eyes','👀 Eyes'],['brows','〰️ Brows'],['nm','👄 Nose & Mouth'],['body','🧍 Body'],['clothes','👕 Clothes'],['acc','🎩 Accessories'],['me','💬 Profile']];
const TABKEYS={face:['skin','head','ears','blush','blushColor','mark','freckles'],hair:['hTop','bangs','back','flip','hair','hair2'],eyes:['eyes','eyeColor','eyeSize','eyeGap','eyeY','eyeTilt','lashes'],brows:['brows','browColor','browSize','browY','browTilt'],nm:['nose','noseSize','noseY','mouth','mouthSize','mouthY','lip','facial'],body:['height','build'],clothes:['top','shirt','pat','patColor','acc','bottom','pants','shoes','shoeColor'],acc:['hat','hatColor','glasses','glassColor','neck','neckColor','backAcc','backColor','held','heldColor'],me:['pitch','speed','tone']};
let E=null;

  showPortrait(el.querySelector('#pv'),d,'happy',{zoom:false,auto:true,room:null});
  el.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{beep(700);E.tab=b.dataset.tab;if(['face','eyes','brows','nm','hair'].includes(E.tab)&&!port.zoom)port.zoom=true;if(['body','clothes','acc'].includes(E.tab))port.zoom=false;drawPanel()});
  el.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{E.ex=b.dataset.x;setExpr(port.Ps[0],E.ex);hopPortrait();beep(800)});
  el.querySelector('#zm').onclick=()=>{port.zoom=!port.zoom;beep(600)};
  el.querySelector('#spin').onclick=()=>{port.auto=true;beep(600)};
  el.querySelector('#walk').onclick=()=>{const P=port.Ps[0];if(!P)return;let k=0;const iv=setInterval(()=>{P.armR.rotation.z=-1.8-Math.sin(k*.5)*.4;if(++k>24){clearInterval(iv);P.armR.rotation.z=.18}},40);speak(d.catch||'Hello!',d);setExpr(P,'joy')};
  el.querySelector('#cancel').onclick=()=>{if(existing)openRoom(existing.id);else closeSheet()};
  el.querySelector('#undo').onclick=()=>{if(!E.hist.length)return toast('Nothing to undo');Object.assign(d,JSON.parse(E.hist.pop()));refresh(true)};
  el.querySelector('#rand').onclick=()=>{push();const keep={pitch:d.pitch,speed:d.speed,tone:d.tone};Object.assign(d,randLook(),keep);beep(900);refresh(true)};
  el.querySelector('#ok').onclick=()=>{const n=(d.name||'').trim();if(!n){E.tab='me';drawPanel();return toast('Give your pal a name! ✏️')}d.name=n;d.catch=(d.catch||'').trim();
    if(d.relation===1)S.residents.forEach(o=>{if(o!==existing&&o.relation===1)o.relation=0});
    if(existing){LOOK.concat(PROFILE).forEach(k=>existing[k]=d[k]);save();syncWorld();toast('Saved! ✨');openRoom(existing.id,'I feel brand new! ✨','joy')}
    else{const r=newResident(d);LOOK.concat(PROFILE).forEach(k=>r[k]=d[k]);r.room=freeRoom;S.residents.push(r);news(`🏠 <b>${esc(r.name)}</b> moved into Room ${freeRoom+1}! Welcome!`);jingle();save();syncWorld();closeSheet();setView('island');setTimeout(()=>openRoom(r.id,`Hi! I'm ${esc(r.name)}! ${esc(r.catch||'Nice to meet you!')}`,'joy'),150)}};
  drawPanel();refresh()}
function push(){E.hist.push(JSON.stringify(E.d));if(E.hist.length>60)E.hist.shift()}
function refresh(panel){const d=E.d;showPortrait(port.host,d,E.ex);$('#en').textContent=d.name||'New Pal';const p=persOf(d);$('#et').textContent=p.emo+' '+p.name;if(panel)drawPanel()}
function drawPanel(){
  const d=E.d,t=E.tab;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  const sw=(f,arr,label,noneLabel)=>`<div class="sec">${label}</div><div class="sw">${noneLabel?`<div data-f="${f}" data-v="" class="${!d[f]?'on':''}" title="${noneLabel}" style="background:repeating-linear-gradient(45deg,#fff,#fff 4px,#eee 4px,#eee 8px)"></div>`:''}${arr.filter(Boolean).map(c=>`<div data-f="${f}" data-v="${c}" class="${d[f]===c?'on':''}" style="background:${c}"></div>`).join('')}<label title="Any color"><input type="color" data-cf="${f}" value="${d[f]||'#ffffff'}"></label></div>`;
  const op=(f,arr,label,emo)=>`<div class="sec">${label}</div><div class="opt">${arr.map((n,i)=>n==null?'':`<button data-f="${f}" data-n="${i}" class="${(d[f]||0)===i?'on':''}">${emo&&emo[i]?emo[i]+' ':''}${n}</button>`).join('')}</div>`;
  const opA=(f,arr,label)=>`<div class="sec">${label}</div><div class="opt">${arr.map((n,i)=>`<button data-f="${f}" data-n="${i}" class="${(d[f]||0)===i?'on':''}">${n?n[0]+' '+n[1]:'None'}</button>`).join('')}</div>`;
  const sl=(f,min,max,step,label,lo,hi)=>`<div class="sec"><span>${label}</span><span>${lo} ↔ ${hi}</span></div><input type="range" data-s="${f}" min="${min}" max="${max}" step="${step}" value="${d[f]||0}">`;
  const tg=(f,on,off)=>`<button data-b="${f}" class="${d[f]?'on':''}">${d[f]?'✅ '+on:'⬜ '+off}</button>`;
  let h=`<div class="row" style="justify-content:flex-end;margin-bottom:4px"><button class="btn b" id="rtab" style="flex:none;width:auto;padding:6px 12px;font-size:13px">🎲 Randomize this tab</button></div>`;
  if(t==='face')h+=sw('skin',SKINS,'Skin tone')+op('head',HEADS,'Head shape')+op('ears',EARS,'Ears')+op('blush',BLUSH,'Cheeks')+sw('blushColor',['#ff8fa3','#ff5c7a','#ffb38a','#d77be0','#ff9ec4'],'Cheek color')+op('mark',MARKS,'Face marks')+`<div class="sec">Freckles</div><div class="opt">${tg('freckles','Freckles','No freckles')}</div>`;
  if(t==='hair')h+=`<p class="muted" style="margin:0 0 4px">✨ Mix & match! Any bangs work with any back.</p>`+op('bangs',BANGS,'Bangs (front)')+`<div class="opt">${tg('flip','Bangs flipped','Flip bangs')}</div>`+op('back',BACKS,'Back & length')+op('hTop',HTOP,'Top of head')+sw('hair',HAIRC,'Hair color')+sw('hair2',HAIRC,'Bangs color (two-tone!)','Same as hair');
  if(t==='eyes')h+=op('eyes',ESTY,'Eye style')+sw('eyeColor',EYEC,'Eye color')+`<div class="opt">${tg('lashes','Eyelashes','Add eyelashes')}</div>`+sl('eyeSize',.6,1.5,.05,'Size','small','big')+sl('eyeGap',26,56,1,'Spacing','close','far')+sl('eyeY',-18,18,1,'Height','up','down')+sl('eyeTilt',-.5,.5,.05,'Tilt','droopy','sharp');
  if(t==='brows')h+=op('brows',BROWS,'Eyebrow style')+sw('browColor',HAIRC,'Eyebrow color','Same as hair')+sl('browSize',.6,1.5,.05,'Size','small','big')+sl('browY',-14,14,1,'Height','up','down')+sl('browTilt',-.5,.5,.05,'Tilt','worried','fierce');
  if(t==='nm')h+=`<div class="sub">👃 Nose</div>`+op('nose',NOSES,'Nose style')+sl('noseSize',.6,1.6,.05,'Size','small','big')+sl('noseY',-16,16,1,'Height','up','down')+`<div class="sub">👄 Mouth</div>`+op('mouth',MOUTHS,'Mouth style')+sl('mouthSize',.6,1.5,.05,'Size','small','big')+sl('mouthY',-16,16,1,'Height','up','down')+`<div class="sec">Lip color</div><div class="opt">${LIPS.map((c,i)=>`<button data-f="lip" data-n="${i}" class="${(d.lip||0)===i?'on':''}">${c?`<span style="color:${c};font-size:18px">●</span>`:'Natural'}</button>`).join('')}</div>`+op('facial',FACIAL,'Facial hair');
  if(t==='body')h+=sl('height',.75,1.3,.01,'Height','short','tall')+sl('build',.75,1.35,.01,'Build','slim','round')+`<p class="muted">Tip: tap 🔍 to zoom out and see the whole body.</p>`;
  if(t==='clothes')h+=op('top',TOPS,'Top')+sw('shirt',CLOTH,'Favorite color (top)')+`<div class="sec">Pattern</div><div class="opt">${Object.entries(PATS).map(([k,v])=>`<button data-f="pat" data-v="${k}" class="${d.pat===k?'on':''}">${v[0]} ${v[1]}</button>`).join('')}</div>`+sw('patColor',['#ffffff','#3b3350','#ffe36b','#ff4f7b','#5b9cf2','#5cc96b'],'Pattern color','Auto')+sw('acc',CLOTH,'Accent (hood strings, belt, hair ties)')+op('bottom',BOTTOMS,'Bottoms')+sw('pants',['#3f5fa8','#5b9cf2','#3b3350','#1c1410','#8a5530','#e8d4a6','#b9b0c4','#2e7d5b','#e25a6e','#ffffff',...CLOTH.slice(3,6)],'Bottoms color')+op('shoes',SHOES,'Shoes')+sw('shoeColor',['#3b3350','#ffffff','#e25a6e','#8a5530','#f2b33d','#5b9cf2','#d77be0','#5cc96b','#ff9ec4','#ffe36b'],'Shoe color');
  if(t==='acc')h+=`<div class="sec">Hat</div><div class="opt"><button data-f="hat" data-v="" class="${!d.hat?'on':''}">None</button>${Object.entries(HATS).map(([k,v])=>`<button data-f="hat" data-v="${k}" class="${d.hat===k?'on':''}">${v[0]} ${v[1]}</button>`).join('')}</div>`+sw('hatColor',CLOTH,'Hat color')+opA('glasses',GLASSES,'Glasses')+sw('glassColor',['#3b3350','#8a5530','#e25a6e','#5b9cf2','#ffd34d','#ffffff','#d77be0','#ff4f7b'],'Glasses color')+opA('neck',NECKS,'Neck')+sw('neckColor',CLOTH,'Neck color')+opA('backAcc',BACKACC,'On your back')+sw('backColor',CLOTH,'Back item color')+opA('held',HELD,'Holding')+sw('heldColor',CLOTH,'Held item color');
  if(t==='me'){const p=persOf(d);h+=`<div class="sec">Name</div><input type="text" id="nm" maxlength="12" value="${esc(d.name)}" placeholder="Pal name">

    <div class="sub">🔊 Voice</div><div class="opt">${TONES.map((tn,i)=>`<button data-f="tone" data-n="${i}" class="${(d.tone||0)===i?'on':''}">${tn[1]}</button>`).join('')}</div>
    ${sl('pitch',.5,1.8,.05,'Pitch','low','high')}${sl('speed',.5,1.8,.05,'Speed','slow','fast')}
    <button class="btn b" id="test" style="width:100%;margin-bottom:12px">🔊 Test voice</button>
    <div class="sub">📤 Share code</div><p class="muted" style="margin:2px 0 6px">Copy this pal to share, or paste a code to load one.</p>
    <input type="text" id="code" placeholder="Paste a PAL- code here"><div class="row"><button class="btn y" id="cpy">📋 Copy code</button><button class="btn p" id="ld">📥 Load code</button></div>`}
  const ep=$('#ep');const st=ep.scrollTop;ep.innerHTML=h;ep.scrollTop=E._lastTab===t?st:0;E._lastTab=t;
  $('#rtab').onclick=()=>{push();const L=randLook();(TABKEYS[t]||[]).forEach(k=>d[k]=L[k]);if(t==='me'){['p1','p2','p3','p4'].forEach(k=>d[k]=ri(1,8));d.bm=ri(0,11);d.bd=ri(1,28)}beep(900);refresh(true);hopPortrait()};
  ep.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{push();const f=b.dataset.f;d[f]=b.dataset.n!==undefined?+b.dataset.n:(b.dataset.v||null);if(f==='pat'&&!d.pat)d.pat='plain';beep(750);refresh(true);hopPortrait(.2)});
  ep.querySelectorAll('[data-cf]').forEach(i=>{i.oninput=()=>{if(!i._p){push();i._p=1}d[i.dataset.cf]=i.value;refresh()};i.onchange=()=>{i._p=0;drawPanel()}});
  ep.querySelectorAll('[data-s]').forEach(i=>{i.onpointerdown=()=>push();i.oninput=()=>{d[i.dataset.s]=+i.value;if(['p1','p2','p3','p4'].includes(i.dataset.s)){const p=persOf(d);ep.querySelector('.ptype').innerHTML=`<b>${p.emo} ${p.name}</b><br><span class="muted">${GROUPS[p.g]} Also ${SUBS[p.s]}.</span>`}refresh()}});
  ep.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{push();d[b.dataset.b]=!d[b.dataset.b];beep(750);refresh(true)});
  const nm=$('#nm');if(nm){nm.oninput=()=>{d.name=nm.value;$('#en').textContent=d.name||'New Pal'};$('#cp').oninput=e=>d.catch=e.target.value;
    $('#bm').onchange=e=>d.bm=+e.target.value;$('#bd').onchange=e=>d.bd=+e.target.value;
    $('#test').onclick=()=>{speak(d.catch||lineFor(d),d);setExpr(port.Ps[0],'joy');hopPortrait()};
    $('#cpy').onclick=()=>{const code='PAL-'+btoa(unescape(encodeURIComponent(JSON.stringify(Object.fromEntries(LOOK.concat(PROFILE).map(k=>[k,d[k]]))))));const inp=$('#code');inp.value=code;
      try{navigator.clipboard.writeText(code).then(()=>toast('Code copied! 📋'),()=>{inp.select();toast('Code is in the box — copy it!')})}catch(e){inp.select();toast('Code is in the box — copy it!')}};
    $('#ld').onclick=()=>{try{const v=$('#code').value.trim().replace(/^PAL-/,'');const o=JSON.parse(decodeURIComponent(escape(atob(v))));push();
      if(o.hs!==undefined&&o.bangs===undefined){const m=OLDHS[o.hs]||[0,0,0];o.hTop=m[0];o.bangs=m[1];o.back=m[2]}
      LOOK.concat(PROFILE).forEach(k=>{if(o[k]!==undefined)d[k]=o[k]});['p1','p2','p3','p4'].forEach(k=>{if(!(d[k]>=1))d[k]=5});refresh(true);jingle();toast('Pal loaded! ✨')}catch(e){sadsnd();toast('That code doesn\'t work 🤔')}}}}
