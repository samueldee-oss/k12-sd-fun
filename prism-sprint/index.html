<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prism Sprint</title><style>[hidden]{display:none!important}</style></head><body>
<title>Prism Sprint</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* Layout: full-bleed canvas stage; HUD pinned to the top edge; menus as overlays on the stage. Single neon-arcade look by choice. */
:root{
  --void:#0b0820; --panel:rgba(14,10,38,.82); --ink:#f4f1ff; --dim:#a39dcc;
  --volt:#ffe14d; --cyan:#3ff0ff; --magenta:#ff3fa4; --line:rgba(244,241,255,.16);
  --display:'Bungee',Impact,'Arial Black',sans-serif;
  --body:'Chakra Petch',ui-rounded,system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:var(--body)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:12px;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.bar{flex:1;min-width:0;height:10px;border-radius:6px;background:rgba(255,255,255,.1);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--volt))}
.pct{font:700 15px/1 var(--body);font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right}
.att{font:700 13px/1 var(--body);color:var(--dim);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.ibtn{pointer-events:auto;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);
  color:var(--ink);font:700 16px/1 var(--body);display:grid;place-items:center;cursor:pointer}
.ibtn:focus-visible,.lvl:focus-visible,.cta:focus-visible{outline:2px solid var(--volt);outline-offset:2px}
.overlay{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:22px;
  padding-block:calc(env(safe-area-inset-top,0px) + 20px) calc(env(safe-area-inset-bottom,0px) + 20px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse at 50% 40%,rgba(11,8,32,.55),rgba(11,8,32,.9));text-align:center;overflow-y:auto}
h1{font:400 clamp(40px,11vw,84px)/.9 var(--display);margin:0;letter-spacing:.01em;text-wrap:balance;
  color:var(--volt);text-shadow:0 0 0 var(--void),4px 4px 0 var(--magenta),8px 8px 0 rgba(63,240,255,.55)}
.tag{margin:0;color:var(--dim);font-size:15px;letter-spacing:.04em}
.levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:min(520px,100%)}
.lvl{display:grid;gap:6px;text-align:left;padding:14px;min-width:0;border-radius:14px;border:1px solid var(--line);background:var(--panel);
  color:var(--ink);cursor:pointer;font-family:var(--body);transition:transform .12s,border-color .12s}
.lvl:hover{transform:translateY(-2px);border-color:var(--c)}
.lvl b{font:400 clamp(15px,4.4vw,20px)/1.05 var(--display);color:var(--c)}
.lvl .meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.lvl .best{font-variant-numeric:tabular-nums;color:var(--ink)}
.track{height:6px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
.track i{display:block;height:100%;background:var(--c)}
.keys{font-size:13px;color:var(--dim);letter-spacing:.05em}
.keys kbd{font:700 12px var(--body);border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:var(--ink)}
.cta{font:400 18px/1 var(--display);padding:14px 26px;border-radius:12px;border:0;background:var(--volt);color:var(--void);cursor:pointer}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.big{font:400 clamp(30px,8vw,56px)/1 var(--display);margin:0;color:var(--cyan)}
.stat{font-size:16px;color:var(--dim);margin:0;font-variant-numeric:tabular-nums}
.vols{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.vols label{display:flex;align-items:center;gap:8px}
.vols input{accent-color:var(--volt);width:120px}
@media (prefers-reduced-motion:reduce){.lvl{transition:none}}

  const o = [];

    s: (x, y = 0, n = 1) => { for (let i = 0; i < n; i++) o.push({ t: 's', x: x + i, y, w: 1, h: 1 }); },
    b: (x, y, w = 1, h = 1) => o.push({ t: 'b', x, y, w, h }),

    o: (x, y) => o.push({ t: 'o', x, y, w: 1, h: 1 }),
  };
  const end = fn(A);
  o.sort((a, b) => a.x - b.x);
  o.forEach((q, i) => (q.id = i));
  return { objs: o, end };
}

function newPlayer() { return { x: 0, y: 0, vy: 0, g: true, buf: 0, i: 0, used: new Set(), dead: false, won: false }; }

// One fixed physics step. Returns an event name or null.
function step(p, L, speed, hold, pressed) {
  const dt = PH.DT;
  let ev = null;
  p.buf = pressed ? 0.15 : Math.max(0, p.buf - dt);
  p.x += speed * dt;
  if (p.g && (hold || p.buf > 0)) { p.vy = PH.JUMP; p.g = false; p.buf = 0; ev = 'jump'; }
  const prevY = p.y;
  p.vy = Math.max(PH.MAXFALL, p.vy - PH.G * dt);
  p.y += p.vy * dt;
  const wasG = p.g;
  p.g = false;
  if (p.y <= 0) { p.y = 0; p.vy = 0; p.g = true; }

  const O = L.objs;
  while (p.i < O.length && O[p.i].x + O[p.i].w < p.x - 1) p.i++;
  for (let k = p.i; k < O.length; k++) {
    const o = O[k];
    if (o.x > p.x + 1.5) break;
    if (o.t === 'b') {
      const top = o.y + o.h;
      if (p.x + 1 > o.x + 0.02 && p.x < o.x + o.w - 0.02 && p.y < top && p.y + 1 > o.y) {
        if (prevY >= top - 0.3 && p.vy <= 0) { p.y = top; p.vy = 0; p.g = true; }
        else if (p.x + 0.9 > o.x && p.x + 0.1 < o.x + o.w && p.y + 0.9 > o.y && p.y + 0.1 < top) { p.dead = true; return 'die'; }
      }
    } else if (o.t === 's') {
      if (p.x + 0.9 > o.x + 0.3 && p.x + 0.1 < o.x + 0.7 && p.y + 0.1 < o.y + 0.55 && p.y + 0.9 > o.y) { p.dead = true; return 'die'; }
    } else if (o.t === 'p') {
      if (p.x + 1 > o.x + 0.1 && p.x < o.x + 0.9 && p.y < o.y + 0.4 && p.y + 1 > o.y && !p.used.has(o.id)) {
        p.used.add(o.id); p.vy = PH.PAD; p.g = false; ev = 'pad';
      }
    } else if (o.t === 'o') {
      if (!p.used.has(o.id) && (hold || p.buf > 0) && Math.abs(p.x - o.x) < 1.15 && Math.abs(p.y - o.y) < 1.2) {
        p.used.add(o.id); p.vy = PH.ORB; p.g = false; p.buf = 0; ev = 'orb';
      }
    }
  }
  if (!ev && p.g && !wasG) ev = 'land';
  if (p.x >= L.end) { p.won = true; return 'win'; }
  return ev;
}
//#PHYS-END

  }

  // trail
  for (const t of trail) { const a = t.life / 0.35; ctx.fillStyle = `rgba(255,225,77,${a * 0.5})`; const s = S * 0.22 * a; ctx.fillRect(sx(t.x) - s / 2, sy(t.y) - s / 2, s, s); }

  // player
  if (mode === 'play' || mode === 'won' || (mode === 'paused' && prevMode === 'play')) {
    const cx = sx(P.x + 0.5), cy = sy(P.y + 0.5), s = S * 0.96;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot);
    ctx.shadowColor = '#ffe14d'; ctx.shadowBlur = 14 + pulse * 10;
    ctx.fillStyle = '#ffe14d'; ctx.fillRect(-s / 2, -s / 2, s, s);
    ctx.shadowBlur = 0;
    ctx.lineWidth = Math.max(2, S * 0.07); ctx.strokeStyle = '#05030f'; ctx.strokeRect(-s / 2, -s / 2, s, s);
    ctx.fillStyle = L.color; ctx.fillRect(-s * 0.26, -s * 0.26, s * 0.52, s * 0.52);
    ctx.strokeRect(-s * 0.26, -s * 0.26, s * 0.52, s * 0.52);
    ctx.fillStyle = '#05030f'; ctx.fillRect(-s * 0.1, -s * 0.1, s * 0.2, s * 0.2);
    ctx.restore();
  }
  // particles
  for (const q of parts) { ctx.globalAlpha = Math.max(0, Math.min(1, q.life * 1.6)); ctx.fillStyle = q.c; const s = q.s * S; ctx.fillRect(sx(q.x) - s / 2, sy(q.y) - s / 2, s, s); }
  ctx.globalAlpha = 1;
  if (mode === 'dead' && deadT < 0.3 && !reduce) {
    ctx.strokeStyle = `rgba(255,255,255,${1 - deadT / 0.3})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(sx(P.x + 0.5), sy(P.y + 0.5), S * (0.5 + deadT * 8), 0, Math.PI * 2); ctx.stroke();
  }
  if (flash > 0 && !reduce) { ctx.fillStyle = `rgba(255,225,77,${flash * 0.25})`; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
}

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw(); requestAnimationFrame(frame);
}
renderLevels();
requestAnimationFrame(frame);
</script>

</body></html>
